<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Дурак во дворе</title>
<style>
:root{--ink:#2d3436;--muted:#57606f;--card:#fffdf7;--tr:.28s}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;background:#24452f;overscroll-behavior:none;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--ink);overflow:hidden;touch-action:manipulation}
#app{position:relative;max-width:560px;height:100%;margin:0 auto;background:linear-gradient(#9ed8f0,#cdeec0 32%,#8cc071);overflow:hidden}
.screen{position:absolute;top:0;right:0;bottom:0;left:0;display:none;flex-direction:column}
.screen.on{display:flex}
button{font:inherit;color:inherit;border:0;cursor:pointer}
.btn{background:#fff;border-radius:16px;padding:12px 16px;font-weight:700;font-size:17px;box-shadow:0 4px 0 #c7c1b0,0 6px 14px rgba(0,0,0,.12);transition:transform .08s;min-height:48px}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #c7c1b0}
.btn.accent{background:linear-gradient(#d9480f,#b8390a);color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.25);box-shadow:0 4px 0 #8a2a06,0 6px 14px rgba(0,0,0,.15)}
.btn.accent:active{box-shadow:0 1px 0 #8a2a06}
.btn.green{background:linear-gradient(#2b8a3e,#237032);color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.25);box-shadow:0 4px 0 #17501f,0 6px 14px rgba(0,0,0,.15)}
.btn.blue{background:linear-gradient(#1c6fb8,#155a96);color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.25);box-shadow:0 4px 0 #0d3e69,0 6px 14px rgba(0,0,0,.15)}
.btn[disabled]{opacity:.6}
.btn small{opacity:.9;font-size:.8em}
.icon{width:46px;height:46px;border-radius:14px;background:rgba(255,255,255,.88);font-size:22px;font-weight:800;box-shadow:0 3px 0 rgba(0,0,0,.12);flex:none}
.pill{background:rgba(255,255,255,.92);border-radius:999px;padding:7px 12px;font-weight:800;font-size:16px;box-shadow:0 3px 0 rgba(0,0,0,.1);white-space:nowrap}
button.pill{cursor:pointer;position:relative;min-height:40px}
button.pill::before{content:"";position:absolute;top:-6px;bottom:-6px;left:-4px;right:-4px}
.pill.sm{padding:5px 10px;font-size:15px}
/* карта турнира */
.mh{display:flex;align-items:center;justify-content:space-between;padding:12px 14px 6px;padding-top:max(12px,env(safe-area-inset-top))}
.logo{font-size:21px;font-weight:900;color:#1f3b57;text-shadow:0 1px 0 rgba(255,255,255,.8);white-space:nowrap}
.hdr-r{display:flex;gap:7px;align-items:center}
.map-scroll{flex:1;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:6px 14px 20px}
.route{position:relative;max-width:520px;margin:0 auto}
.place{margin:14px 0 6px;border-radius:20px;padding:10px 10px 8px;box-shadow:0 4px 0 rgba(0,0,0,.12);position:relative;overflow:hidden}
.place.lock{filter:saturate(.35) brightness(.95)}
.place h3{margin:0 0 6px;font-size:19px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.6);display:flex;align-items:center;justify-content:space-between}
.place h3 small{font-size:14px;font-weight:700;background:rgba(0,0,0,.35);border-radius:999px;padding:3px 10px}
.mrow{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.93);border-radius:16px;padding:8px 10px;margin-top:8px;text-align:left;width:100%;min-height:64px;box-shadow:0 3px 0 rgba(0,0,0,.1)}
.mrow.cur{outline:3px solid #ffd23f;animation:pulse 1.4s infinite}
.mrow.lock{opacity:.75}
.mrow .num{width:40px;height:40px;border-radius:50%;background:linear-gradient(#ffd36e,#ff9f43);color:#3a2206;font-weight:900;font-size:19px;display:flex;align-items:center;justify-content:center;flex:none;box-shadow:0 3px 0 #c8741d}
.mrow.done .num{background:linear-gradient(#8be28f,#3fae5a);color:#0f3d1f;box-shadow:0 3px 0 #2b7a3f}
.mrow.lock .num{background:linear-gradient(#d5dbdf,#aab4ba);box-shadow:0 3px 0 #7f8c8d;font-size:16px}
.mrow .who{flex:1;min-width:0;line-height:1.2}
.mrow .who b{display:block;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mrow .who small{color:#57606f;font-weight:700;font-size:14px}
.mrow .avs{display:flex;flex:none}
.mrow .avs span{width:40px;height:40px;border-radius:50%;background:#f1ede2;overflow:hidden;display:block;margin-left:-8px;box-shadow:0 0 0 2px #fff}
.mrow .avs span:first-child{margin-left:0}
.mrow .avs svg{width:100%;height:100%;display:block}
.st{color:#f0a500;font-size:17px;letter-spacing:1px;white-space:nowrap}
.st .e{color:#b8b2a4}
.chest{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px;background:rgba(0,0,0,.35);color:#fff;border-radius:14px;padding:6px 10px;font-weight:800;font-size:15px}
.chest .btn{padding:6px 12px;font-size:15px;min-height:40px}
.mnav{padding:8px 12px;padding-bottom:max(12px,env(safe-area-inset-bottom));background:rgba(255,255,255,.4);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.nrow{display:flex;gap:8px;max-width:520px;margin:0 auto}
.nrow+.nrow{margin-top:8px}
.nrow .btn{flex:1;padding:10px 6px;font-size:16px;white-space:nowrap}
.rankb{max-width:520px;margin:2px auto 0;text-align:center}.rankb button{background:rgba(255,255,255,.85);border-radius:999px;padding:6px 14px;font-weight:800;font-size:15px;box-shadow:0 3px 0 rgba(0,0,0,.1);min-height:40px}
.nrow .btn.sq{flex:0 0 64px;padding:4px 0;font-size:20px;position:relative;line-height:1.1}
.btn.sq small{display:block;font-size:12px;font-weight:700;opacity:1}
.btn.sq .dot{position:absolute;top:4px;right:6px;width:10px;height:10px;border-radius:50%;background:#ff4757;box-shadow:0 0 0 2px #fff}
.btn.locked{opacity:.75;filter:saturate(.4)}
@keyframes pulse{50%{transform:scale(1.02)}}
/* партия */
#scr-game{background:#1d3b2a}
.gh{display:flex;align-items:center;gap:8px;padding:8px 10px 6px;padding-top:max(8px,env(safe-area-inset-top));background:rgba(0,0,0,.28);color:#fff;z-index:3}
.gt{flex:1;min-width:0;line-height:1.15}
.gt>div:first-child{font-weight:900;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:14px;font-weight:700;opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gh .pill{color:var(--ink)}
.tbl{flex:1;position:relative;min-height:0;overflow:hidden;touch-action:none}
.tbl::after{content:"";position:absolute;top:0;right:0;bottom:0;left:0;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 55%,rgba(0,0,0,.35));pointer-events:none;z-index:0}
#cards{position:absolute;top:0;left:0;width:0;height:0;z-index:2}
.cd{position:absolute;left:0;top:0;border-radius:9%;transform-origin:0 0;transition:transform var(--tr) ease,opacity .2s;will-change:transform;contain:layout style}
.cd.nt{transition:none}
.cd .f,.cd .b{position:absolute;top:0;right:0;bottom:0;left:0;border-radius:inherit;overflow:hidden}
.cd .f{background:#fff;border:1px solid #b9b4a8;box-shadow:0 1px 4px rgba(0,0,0,.35)}
.cd .b{box-shadow:0 1px 3px rgba(0,0,0,.4),inset 0 0 0 .06em #fff;border:1px solid rgba(0,0,0,.35)}
.cd.pl .f{box-shadow:0 0 0 .05em #ffd23f,0 0 .16em .05em rgba(255,210,63,.9),0 2px 6px rgba(0,0,0,.4)}
.cd.dim .f::after{content:"";position:absolute;top:0;right:0;bottom:0;left:0;background:rgba(40,40,40,.28)}
.cd.sel .f{box-shadow:0 0 0 .06em #2b8a3e,0 0 .2em .06em rgba(43,138,62,.9),0 4px 10px rgba(0,0,0,.4)}
.cd.tg .f{box-shadow:0 0 0 .06em #1c6fb8,0 0 .2em .08em rgba(28,111,184,.95)}
/* лицо карты: крупный индекс в углу (виден и в веере), масть по центру */
.ix{position:absolute;left:5%;top:3%;width:32%;text-align:center;line-height:1;font-weight:800;font-family:Georgia,"Times New Roman",serif}
.ix b{display:block;font-size:.33em;letter-spacing:-.04em}
.ix i{display:block;width:.24em;height:.24em;margin:.02em auto 0}
.ix2{position:absolute;right:5%;bottom:3%;width:32%;text-align:center;line-height:1;font-weight:800;transform:rotate(180deg);font-family:Georgia,"Times New Roman",serif}
.ix2 b{display:block;font-size:.2em}.ix2 i{display:block;width:.16em;height:.16em;margin:0 auto}
.pip{position:absolute;left:30%;top:36%;width:.5em;height:.5em}
.fc{position:absolute;left:24%;top:24%;width:62%;height:56%;border-radius:.06em;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:Georgia,"Times New Roman",serif;font-weight:900}
.fc b{font-size:.36em;line-height:1}.fc i{width:.26em;height:.26em;display:block}
.cd svg{display:block;width:100%;height:100%}
.s0,.s1{color:#15171a}.s2,.s3{color:#c8102e}
.four .s2{color:#0b5cc4}.four .s1{color:#157a34}
.bigix .ix b{font-size:.42em}.bigix .ix i{width:.3em;height:.3em}.bigix .ix{width:40%}.bigix .pip{left:34%;top:44%;width:.44em;height:.44em}
.bigix .fc{left:30%;top:36%;width:60%;height:52%}
/* колоды */
.dk-soviet .f{background:#f8f0dc}.dk-soviet .fc{background:#efe0bd}.dk-soviet .s2,.dk-soviet .s3{color:#b0231b}
.dk-bogatyr .f{background:linear-gradient(#fff7e6,#f4e2bd);border:.03em double #9b6b2c}.dk-bogatyr .fc{background:#e9d3a4;box-shadow:inset 0 0 0 .02em #9b6b2c}
.dk-classic .fc{background:#f3eee2;box-shadow:inset 0 0 0 .015em #c9bfa8}
/* рубашки (фон .b) */
.bk-red{background:#b3261e;background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.2) 0 .03em,transparent .03em .09em),repeating-linear-gradient(-45deg,rgba(255,255,255,.2) 0 .03em,transparent .03em .09em)}
.bk-blue{background:#1f4f9a;background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.22) 0 .03em,transparent .03em .09em),repeating-linear-gradient(-45deg,rgba(255,255,255,.22) 0 .03em,transparent .03em .09em)}
.bk-green{background:#2f7a3d;background-image:radial-gradient(rgba(255,255,255,.3) 18%,transparent 20%);background-size:.14em .14em}
.bk-check{background:#5b6570;background-image:linear-gradient(90deg,rgba(255,255,255,.18) 50%,transparent 50%),linear-gradient(rgba(255,255,255,.18) 50%,transparent 50%);background-size:.16em .16em}
.bk-dacha{background:#e8f1f8;background-image:radial-gradient(#e0555f 22%,transparent 24%),radial-gradient(#6aa84f 16%,transparent 18%);background-size:.2em .2em,.2em .2em;background-position:0 0,.1em .1em}
.bk-sanat{background:#5a2a6e;background-image:repeating-linear-gradient(0deg,rgba(255,215,120,.25) 0 .02em,transparent .02em .1em),repeating-linear-gradient(90deg,rgba(255,215,120,.25) 0 .02em,transparent .02em .1em)}
.bk-cat{background:#f0a24c;background-image:radial-gradient(#fff3e3 20%,transparent 22%);background-size:.18em .18em}
.bk-sea{background:#0f6e8c;background-image:repeating-radial-gradient(circle at 0 100%,rgba(255,255,255,.25) 0 .02em,transparent .02em .08em)}
.bk-choco{background:#6b3e26;background-image:linear-gradient(90deg,rgba(0,0,0,.2) .02em,transparent .02em),linear-gradient(rgba(0,0,0,.2) .02em,transparent .02em);background-size:.2em .2em}
.bk-gzhel{background:#fbfdff;background-image:radial-gradient(circle,#1b4fa8 14%,transparent 16%),radial-gradient(circle,rgba(27,79,168,.45) 26%,transparent 28%);background-size:.22em .22em,.22em .22em;background-position:0 0,.11em .11em}
.bk-palekh{background:#141414;background-image:radial-gradient(circle,#e4b43a 12%,transparent 14%),radial-gradient(circle,#c0392b 12%,transparent 14%);background-size:.24em .24em,.24em .24em;background-position:0 0,.12em .12em}
.bk-star{background:#b0231b;background-image:repeating-linear-gradient(90deg,rgba(255,215,0,.25) 0 .02em,transparent .02em .12em)}
.bk-week{background:linear-gradient(135deg,#f6d365,#d4a52a);background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.3) 0 .03em,transparent .03em .1em)}
.b::after{content:"";position:absolute;left:18%;top:14%;right:18%;bottom:14%;border:.025em solid rgba(255,255,255,.55);border-radius:.05em}
.bk-star::before{content:"★";position:absolute;left:0;right:0;top:34%;text-align:center;font-size:.36em;color:#ffd23f;line-height:1}
.bk-week::before{content:"7";position:absolute;left:0;right:0;top:32%;text-align:center;font-size:.34em;color:#7a4e00;font-weight:900;line-height:1}
.bk-gzhel::after,.bk-dacha::after{border-color:rgba(27,79,168,.5)}
/* столы (фон .tbl) */
.tb-cloth{background:radial-gradient(ellipse at 50% 45%,#2f8a52,#1d5c36 70%,#123d24)}
.tb-oil{background-color:#c0392b;background-image:linear-gradient(90deg,rgba(255,255,255,.35) 50%,transparent 50%),linear-gradient(rgba(255,255,255,.35) 50%,transparent 50%);background-size:44px 44px}
.tb-plank{background-color:#8a5d2e;background-image:repeating-linear-gradient(90deg,rgba(0,0,0,0) 0 70px,rgba(0,0,0,.35) 70px 73px),repeating-linear-gradient(90deg,rgba(255,255,255,.06) 0 9px,rgba(0,0,0,.05) 9px 19px)}
.tb-news{background-color:#d8d3c4;background-image:repeating-linear-gradient(rgba(60,60,60,.16) 0 2px,transparent 2px 8px),repeating-linear-gradient(90deg,transparent 0 118px,#c9c3b0 118px 126px)}
.tb-metal{background-color:#56606b;background-image:radial-gradient(rgba(255,255,255,.14) 22%,transparent 24%),radial-gradient(rgba(0,0,0,.18) 22%,transparent 24%);background-size:22px 22px;background-position:0 0,11px 11px}
.tb-dacha{background-color:#7fb3d5;background-image:radial-gradient(rgba(255,255,255,.75) 16%,transparent 18%);background-size:36px 36px}
.tb-velvet{background:radial-gradient(ellipse at 50% 40%,#8e2a3e,#5e1426 72%,#3d0b18)}
.tb-lace{background-color:#e9dcc0;background-image:radial-gradient(circle,rgba(255,255,255,.8) 20%,transparent 22%),radial-gradient(circle,transparent 38%,rgba(160,130,90,.25) 40%,transparent 44%);background-size:30px 30px,30px 30px}
.tb-chess{background-color:#6d4c33;background-image:linear-gradient(45deg,#8b6647 25%,transparent 25%,transparent 75%,#8b6647 75%),linear-gradient(45deg,#8b6647 25%,transparent 25%,transparent 75%,#8b6647 75%);background-size:60px 60px;background-position:0 0,30px 30px}
.tb-night{background-color:#16243f;background-image:radial-gradient(rgba(255,255,255,.7) 1px,transparent 1.5px),radial-gradient(rgba(255,255,255,.4) 1px,transparent 1.5px);background-size:70px 70px,43px 43px;background-position:0 0,20px 30px}
.tb-birch{background-color:#eeeae0;background-image:repeating-linear-gradient(0deg,transparent 0 26px,rgba(40,40,40,.55) 26px 29px,transparent 29px 61px),repeating-linear-gradient(90deg,transparent 0 40px,rgba(40,40,40,.25) 40px 42px)}
.tb-khokh{background-color:#161010;background-image:radial-gradient(circle at 50% 50%,rgba(200,40,30,.55) 12%,transparent 14%),radial-gradient(circle at 50% 50%,rgba(230,180,60,.5) 6%,transparent 8%);background-size:48px 48px,24px 24px}
.tb-gold{background:radial-gradient(ellipse at 50% 40%,#c9a13f,#8a6a1f 70%,#5a430f)}
.tb-ny{background-color:#0f3057;background-image:radial-gradient(#fff 1.5px,transparent 2px),radial-gradient(rgba(255,255,255,.6) 1px,transparent 1.5px),radial-gradient(ellipse at 50% 110%,rgba(0,168,120,.5),transparent 60%);background-size:50px 50px,31px 31px,100% 100%}
/* места за столом */
.seat{position:absolute;top:0;left:0;text-align:center;z-index:3;pointer-events:none}
.av{border-radius:50%;background:#f1ede2;overflow:hidden;margin:0 auto;box-shadow:0 0 0 3px rgba(255,255,255,.85),0 3px 8px rgba(0,0,0,.35)}
.av svg{display:block;width:100%;height:100%}
.seat.turn .av{box-shadow:0 0 0 4px #ffd23f,0 0 14px 3px rgba(255,210,63,.8)}
.seat.out .av{filter:grayscale(.2) brightness(1.05);box-shadow:0 0 0 4px #3fae5a}
.nm{display:inline-block;margin-top:4px;background:rgba(0,0,0,.55);color:#fff;font-weight:800;font-size:14px;border-radius:999px;padding:2px 10px;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.nm i{font-style:normal;color:#ffd23f}
.stt{display:block;margin:3px auto 0;font-size:13px;font-weight:800;color:#fff;background:#b8390a;border-radius:8px;padding:1px 8px;width:max-content;max-width:100%}
.stt.g{background:#2b8a3e}.stt.b{background:#1c6fb8}.stt:empty{display:none}
.bub{position:absolute;left:50%;transform:translateX(-50%);background:#fff;color:#2d3436;border-radius:14px;padding:7px 11px;font-weight:700;font-size:15px;line-height:1.25;box-shadow:0 4px 14px rgba(0,0,0,.3);width:max-content;max-width:210px;opacity:0;transition:opacity .25s;z-index:6;pointer-events:none;text-align:center}
.bub.on{opacity:1}
.bub::before{content:"";position:absolute;left:50%;top:-7px;margin-left:-7px;border:7px solid transparent;border-top:0;border-bottom-color:#fff}
.lbl{position:absolute;z-index:3;background:rgba(0,0,0,.55);color:#fff;font-weight:800;font-size:14px;border-radius:10px;padding:2px 8px;pointer-events:none;white-space:nowrap}
.lbl:empty{display:none}
.lbl svg{width:15px;height:15px;display:inline-block;vertical-align:-2px;background:#fff;border-radius:3px;padding:1px}
.trz{position:absolute;display:none;border:3px dashed #ffd23f;border-radius:10px;color:#ffd23f;font-weight:900;font-size:15px;align-items:center;justify-content:center;text-align:center;z-index:1;background:rgba(0,0,0,.25);text-shadow:0 1px 2px #000;padding:4px}
.trz.on{display:flex}
#bar{position:absolute;left:0;right:0;display:flex;align-items:center;justify-content:center;gap:10px;z-index:4;padding:0 10px;pointer-events:none}
#say{flex:0 1 auto;min-width:0;background:rgba(0,0,0,.6);color:#fff;font-weight:800;font-size:16px;border-radius:12px;padding:8px 12px;line-height:1.2;text-align:center}
#say:empty{display:none}
#bar .btn{pointer-events:auto;flex:none;padding:10px 18px;font-size:18px}
#act.hide,#act2.hide{display:none}
.tip{position:absolute;left:10px;right:10px;background:rgba(255,255,255,.96);border-radius:14px;padding:9px 12px;font-weight:700;font-size:15px;text-align:center;box-shadow:0 4px 14px rgba(0,0,0,.25);display:none;z-index:7;line-height:1.3;pointer-events:none}
.tip.on{display:block}
/* магазин украшений */
.tabs{display:flex;gap:6px;padding:8px 12px 4px;max-width:560px;width:100%;margin:0 auto}
.tabs button{flex:1;background:rgba(255,255,255,.7);border-radius:12px;padding:10px 4px;font-weight:800;font-size:15px;min-height:44px}
.tabs button.on{background:#fff;box-shadow:0 3px 0 rgba(0,0,0,.15)}
.shop-grid{flex:1;overflow-y:auto;overscroll-behavior:contain;display:flex;flex-wrap:wrap;justify-content:space-between;padding:8px 12px 24px;align-content:flex-start;max-width:560px;width:100%;margin:0 auto}
.it{width:48.5%;background:var(--card);border-radius:18px;padding:8px;text-align:center;box-shadow:0 4px 0 #d9d2bf;margin-bottom:10px;position:relative}
.it .pv{height:96px;border-radius:12px;position:relative;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.it .pv .cd{transition:none}
.it b{display:block;margin-top:6px;font-size:16px}
.it small{display:block;color:#57606f;font-weight:600;font-size:14px;min-height:18px}
.it .btn{width:100%;margin-top:6px;padding:8px 6px;font-size:15px;min-height:44px}
.it.on{box-shadow:0 0 0 3px #2b8a3e,0 4px 0 #d9d2bf}
/* окна */
.modal,.ad{position:absolute;top:0;right:0;bottom:0;left:0;display:none;align-items:center;justify-content:center;background:rgba(20,30,40,.55);z-index:10;padding:16px}
.modal{overflow-y:auto;overscroll-behavior:contain}
.modal.on,.ad.on{display:flex}
.card{background:var(--card);border-radius:24px;padding:20px 16px 16px;width:100%;max-width:380px;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.3);animation:pop .25s ease-out;margin:auto}
@keyframes pop{from{transform:scale(.88);opacity:0}}
.card h2{margin:0 0 6px;font-size:24px}
.card p{margin:6px 0;color:#57606f;font-weight:600;font-size:16px;line-height:1.35}

<script>
'use strict';
/* ================= ДВИЖОК: правила, ИИ, решатель (ENGINE-BEGIN) =================
   Чистые функции без DOM — их же гоняет автопрогон tools/test.sh (jsc).
   Карта — число 0…35: масть = c/9 (0 ♠, 1 ♣, 2 ♦, 3 ♥), достоинство = c%9+6 (6…14, валет 11, дама 12, король 13, туз 14).
   ЧЕСТНОСТЬ: ИИ получает только viewFor(s,p) — свою руку, стол, бито, число карт у всех, козырь и карты, которые все видели
   у соперников (забранные со стола, последний козырь из колоды). Руки соперников и порядок колоды в view не попадают. */
const SU=c=>(c/9)|0,RK=c=>c%9+6;
function rng(seed){let a=(seed>>>0)||1;return function(){a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

function beats(a,d,T){return SU(d)===SU(a)?RK(d)>RK(a):SU(d)===T;}
const cval=(c,T)=>RK(c)+(SU(c)===T?9:0); // 6…14 обычные, 15…23 козыри
// правила: mode — 'podkid' (подкидной) или 'perevod' (переводной); lim — сколько карт можно подкинуть за отбой
// (6 — не больше шести и не больше, чем карт у отбивающегося; 0 — сколько карт у отбивающегося); first5 — в первом отбое не больше пяти
const RULES0={mode:'podkid',lim:6,first5:false};
function newGame(o){
  const n=o.n,R=rng(o.seed||1),deck=o.deck?o.deck.slice():shuffle(Array.from({length:36},(_,i)=>i),R);
  const hands=[];for(let p=0;p<n;p++)hands.push([]);
  if(o.hands){for(let p=0;p<n;p++)hands[p]=o.hands[p].slice();}
  else for(let k=0;k<6;k++)for(let p=0;p<n;p++)hands[p].push(deck.pop());
  const trumpCard=o.trumpCard!=null?o.trumpCard:deck[0],T=o.T!=null?o.T:SU(trumpCard);
  // первым ходит тот, у кого младший козырь; ни у кого нет козырей — по жребию (тем же зерном)
  let first=-1,best=99;for(let p=0;p<n;p++)for(const c of hands[p])if(SU(c)===T&&RK(c)<best){best=RK(c);first=p;}
  const why=first>=0?'trump':'lot';if(first<0)first=o.first!=null?o.first:Math.floor(R()*n);
  const s={n,hands,deck,T,trumpCard,table:[],disc:o.disc?o.disc.slice():[],out:Array(n).fill(false),place:[],att:first,def:-1,opener:first,
    phase:'lead',cur:first,taking:false,passed:[],defStart:0,bout:1,known:hands.map(()=>[]),took:Array(n).fill(0),trN:Array(n).fill(0),
    rules:Object.assign({},RULES0,o.rules||{}),over:false,loser:-1,firstWhy:why,firstCard:why==='trump'?hands[first].filter(c=>SU(c)===T).sort((a,b)=>a-b)[0]:-1,moves:0};

function alive(s,p){return !s.out[p]&&(s.hands[p].length>0||s.deck.length>0);}
function nextAlive(s,p){for(let k=1;k<s.n;k++){const q=(p+k)%s.n;if(alive(s,q))return q;}return -1;}

function ranksOn(s){const r={};for(const x of s.table){r[RK(x.a)]=1;if(x.d>=0)r[RK(x.d)]=1;}return r;}
// кому можно перевести: переводной, ничего не побито, все карты одного достоинства, у следующего хватает карт
function transferTarget(s){
  if(s.rules.mode!=='perevod'||s.phase!=='def'||!s.table.length||s.taking)return -1;
  const r=RK(s.table[0].a);for(const x of s.table)if(x.d>=0||RK(x.a)!==r)return -1;
  const q=nextAlive(s,s.def);if(q<0||q===s.def)return -1;

// порядок подкидывающих: главный атакующий, дальше по кругу от отбивающегося (все, кроме него)
function throwers(s){const o=[s.att];for(let k=1;k<s.n;k++){const q=(s.def+k)%s.n;if(q!==s.att&&q!==s.def&&!s.out[q])o.push(q);}return o;}

  const A=[];if(s.over)return A;const h=s.hands[s.cur];

  else if(s.phase==='def'){
    for(const c of h)s.table.forEach((x,i)=>{if(x.d<0&&beats(x.a,c,s.T))A.push({t:'def',c,i});});
    if(transferTarget(s)>=0){const r=RK(s.table[0].a);for(const c of h)if(RK(c)===r)A.push({t:'tr',c});}
    A.push({t:'take'});}

    if(s.table.length<limitOf(s)){const rs=ranksOn(s);for(const c of h)if(rs[RK(c)])A.push({t:'thr',c});}

  return A;}

// ход: меняет s, возвращает список событий (для анимаций и реплик). Незаконный ход — исключение (UI его не допускает)
function apply(s,a){
  if(!isLegal(s,a))throw new Error('ход не по правилам: '+JSON.stringify(a)+' фаза '+s.phase);
  const p=s.cur,ev=[];s.moves++;
  const rm=c=>{const h=s.hands[p],k=h.indexOf(c);h.splice(k,1);const kn=s.known[p],j=kn.indexOf(c);if(j>=0)kn.splice(j,1);};

    if(!s.table.some(x=>x.d<0)){s.phase='throw';s.passed=[];s.cur=s.att;}}

    s.att=p;s.def=q;s.defStart=s.hands[q].length;s.cur=q;}
  else if(a.t==='take'){s.taking=true;ev.push({t:'take',p});s.phase='throw';s.passed=[];s.cur=s.att;}
  else if(a.t==='thr'){rm(a.c);s.table.push({a:a.c,d:-1});ev.push({t:'thr',p,c:a.c});if(!s.taking){s.phase='def';s.cur=s.def;}}

// подкидывание: очередь по throwers; кому нечего подкинуть — пропускает сам; все сказали «пас» — отбой кончился
function settle(s,ev){
  while(s.phase==='throw'){
    if(s.table.length>=limitOf(s)){endBout(s,ev);return;}
    const o=throwers(s).filter(q=>s.passed.indexOf(q)<0);
    if(!o.length){endBout(s,ev);return;}
    const q=o[0];s.cur=q;
    const rs=ranksOn(s);if(s.hands[q].some(c=>rs[RK(c)]))return;
    s.passed.push(q);}}

  const d=s.def,took=s.taking;

  else{for(const c of cards)s.disc.push(c);ev.push({t:'bito',cards});}
  s.table=[];s.taking=false;s.passed=[];

  const order=[];for(let k=0;k<s.n;k++){const q=(s.opener+k)%s.n;if(q!==d)order.push(q);}order.push(d);

  const fin=[];for(let q=0;q<s.n;q++)if(!s.out[q]&&!s.hands[q].length&&!s.deck.length){s.out[q]=true;fin.push(q);}
  if(fin.length){s.place.push(fin);ev.push({t:'out',ps:fin});}
  const left=[];for(let q=0;q<s.n;q++)if(!s.out[q])left.push(q);
  if(left.length<=1){s.over=true;s.loser=left.length?left[0]:-1;s.phase='over';s.cur=-1;ev.push({t:'over',loser:s.loser});return;}
  const a=took||s.out[d]?nextAlive(s,d):d;
  s.att=a;s.opener=a;s.def=nextAlive(s,a);s.bout++;s.phase='lead';s.cur=a;ev.push({t:'turn',att:a,def:s.def});}
function cloneS(s){return {n:s.n,hands:s.hands.map(h=>h.slice()),deck:s.deck.slice(),T:s.T,trumpCard:s.trumpCard,table:s.table.map(x=>({a:x.a,d:x.d})),
  disc:[],out:s.out.slice(),place:[],att:s.att,def:s.def,opener:s.opener,phase:s.phase,cur:s.cur,taking:s.taking,passed:s.passed.slice(),defStart:s.defStart,
  bout:s.bout,known:s.known.map(()=>[]),took:s.took.slice(),trN:s.trN.slice(),rules:s.rules,over:s.over,loser:s.loser,moves:s.moves};}
// что видит игрок p — ТОЛЬКО это получает ИИ. Копии, без ссылок на состояние партии
function viewFor(s,p){
  return {me:p,n:s.n,hand:s.hands[p].slice(),counts:s.hands.map(h=>h.length),deck:s.deck.length,T:s.T,trumpCard:s.trumpCard,
    table:s.table.map(x=>({a:x.a,d:x.d})),disc:s.disc.slice(),known:s.known.map((k,q)=>q===p?[]:k.slice()),out:s.out.slice(),
    att:s.att,def:s.def,phase:s.phase,cur:s.cur,taking:s.taking,passed:s.passed.slice(),defStart:s.defStart,bout:s.bout,
    took:s.took.slice(),rules:Object.assign({},s.rules),lim:s.phase==='lead'?0:limitOf(s),trTo:transferTarget(s),legal:s.cur===p?legal(s):[]};}

/* ---------------- ИИ персонажей ----------------
   noise — доля «случайных» ходов; thrift — бережёт козыри (0…1); throwMax — до какой карты подкидывает (по cval);
   trP — как охотно переводит; trTrump — переводит и козырем; count — помнит вышедшие карты (бито);
   solve — решатель в конце партии (колода пуста, двое с картами): бюджет узлов; mc/mcDeck — «прикидка» (mc раскладов невидимых карт),
   когда в колоде ≤ mcDeck карт; bash — в конце ходит козырями напролом;
   greedyDef — бьёт первой попавшейся картой, а не самой дешёвой; lam — «цена» лишней карты в руке при решении «бить или брать» */
const AI_P={
  mityai:{noise:.3,thrift:0,throwMax:23,throwTrump:1,trP:.35,count:0,solve:0,greedyDef:1,lam:10},
  // самая первая партия новичка: тот же Митяй, но ещё рассеяннее (карт он по-прежнему не видит — просто чаще ошибается)
  mityai0:{noise:.6,thrift:0,throwMax:23,throwTrump:1,trP:.2,count:0,solve:0,greedyDef:1,lam:10},
  mihalych:{noise:.22,thrift:.35,throwMax:10,trP:.5,count:0,solve:0,lam:11},
  valya:{noise:.06,thrift:.9,throwMax:11,trP:.5,count:1,solve:0,lam:12,hoard:1},
  kolya:{noise:.07,thrift:.45,throwMax:11,trP:1,trTrump:1,count:1,solve:3000,lam:12},
  bogatyr:{noise:.03,thrift:.1,throwMax:12,trP:.7,count:1,solve:12000,bash:1,lam:12,mc:16,mcDeck:4},
  zina:{noise:0,thrift:.1,throwMax:11,trP:.8,count:1,solve:40000,lam:12,mc:40,mcDeck:6},
  base:{noise:0,thrift:.4,throwMax:11,trP:.8,count:1,solve:0,lam:12}, // для «прикидки» — ровная игра без случайностей
  // «особые соперники» (покупка) — только вид и характер: играют как уже знакомые персонажи
  barsik:{like:'mihalych'},petrovich:{like:'kolya'}
};
function persona(id){const P=AI_P[id]||AI_P.mihalych;return P.like?AI_P[P.like]:P;}
function aiMove(v,id,R){
  const P=persona(id),L=v.legal;if(!L.length)return null;if(L.length===1)return L[0];
  if(P.noise&&R()<P.noise){const m=L.filter(a=>a.t!=='take'&&a.t!=='pass');if(m.length&&(v.phase!=='throw'||R()<.5))return m[Math.floor(R()*m.length)];}
  if(P.solve&&v.deck===0){const a=solveView(v,P.solve);if(a)return a;}
  if(P.mc&&v.deck<=P.mcDeck){const a=aiSample(v,P,R);if(a)return a;}
  if(v.phase==='lead')return aiLead(v,P,R);
  if(v.phase==='def')return aiDef(v,P,R);
  return aiThrow(v,P,R);}
// какие карты могут быть у игрока q (по памяти): известные у него + нигде не замеченные (если он мог их получить)
function maybeIn(v,P,q){
  const seen=new Array(36).fill(false);for(const c of v.hand)seen[c]=true;for(const x of v.table){seen[x.a]=true;if(x.d>=0)seen[x.d]=true;}
  if(P.count)for(const c of v.disc)seen[c]=true;
  for(let r=0;r<v.n;r++)if(r!==q)for(const c of v.known[r])seen[c]=true;
  const out=[];for(let c=0;c<36;c++)if(!seen[c])out.push(c);return out;}
function aiLead(v,P,R){
  const T=v.T,h=v.hand,cnt={},end=v.deck===0;for(const c of h)cnt[RK(c)]=(cnt[RK(c)]||0)+1;
  const opp=P.count&&v.deck<=6?maybeIn(v,P,v.def):null;
  let best=h[0],bs=1e9;
  for(const c of h){let sc=cval(c,T);
    if(SU(c)===T&&!end)sc+=6+8*P.thrift;
    sc-=(cnt[RK(c)]-1)*3;
    if(opp){const b=opp.filter(d=>beats(c,d,T)).length;if(!b)sc-=15;else sc+=b*.3;}
    if(P.bash&&end&&SU(c)===T)sc-=10;
    if(P.greedyDef)sc+=R()*8;
    if(sc<bs){bs=sc;best=c;}}
  return {t:'att',c:best};}
// самая дешёвая раскладка «чем побить каждую непобитую» (перебор с отсечением, с потолком по узлам)
function bestCover(atts,hand,T,cost){
  const order=atts.slice().sort((a,b)=>cval(b,T)-cval(a,T)),hs=hand.slice().sort((a,b)=>cost(a)-cost(b));
  let best=null,bc=1e9,nodes=0;const used=new Array(hs.length).fill(false),pick=[];
  (function rec(k,sum){if(sum>=bc||++nodes>20000)return;if(k===order.length){bc=sum;best=pick.slice();return;}
    const a=order[k];for(let j=0;j<hs.length;j++){if(used[j]||!beats(a,hs[j],T))continue;used[j]=true;pick.push([a,hs[j]]);rec(k+1,sum+cost(hs[j]));pick.pop();used[j]=false;}})(0,0);
  return best?{pairs:best,cost:bc}:null;}
function aiDef(v,P,R){
  const T=v.T,L=v.legal,end=v.deck===0;
  const un=[];v.table.forEach((x,i)=>{if(x.d<0)un.push(i);});
  const tcost=c=>cval(c,T)+(SU(c)===T?(3+12*P.thrift)*(end?.25:1):0);
  let cover=bestCover(un.map(i=>v.table[i].a),v.hand,T,tcost);
  if(cover&&P.greedyDef){const m=L.filter(a=>a.t==='def');if(m.length)cover.first=m[Math.floor(R()*m.length)];}
  const trs=L.filter(a=>a.t==='tr');
  if(trs.length&&R()<P.trP){const tb=trs.reduce((m,a)=>tcost(a.c)<tcost(m.c)?a:m);
    if(SU(tb.c)!==T||P.trTrump||!cover)return tb;}
  if(!cover)return {t:'take'};
  // бить или брать: козыри рано на мелочь тратить жалко (особенно тёте Вале); в конце партии брать — почти всегда проигрыш
  const trumps=cover.pairs.filter(([,d])=>SU(d)===T),atts=cover.pairs.map(([a])=>a);
  if(!end&&trumps.length){
    const lowAtt=atts.every(a=>cval(a,T)<=11),hiTrump=trumps.some(([,d])=>RK(d)>=12);
    let takeW=P.thrift*(lowAtt?1:.4)*(v.deck>=10?1:v.deck>=4?.6:.2)*(hiTrump?1.3:1)*(atts.length<=2?1:.5);
    if(P.hoard&&v.deck>=6)takeW+=.25;
    if(v.hand.length+v.table.length*2>12)takeW*=.4; // и так карт много
    if(R()<takeW)return {t:'take'};}
  if(cover.first)return cover.first;
  const [a,d]=cover.pairs[0];const i=v.table.findIndex(x=>x.a===a&&x.d<0);return {t:'def',c:d,i};}
function aiThrow(v,P,R){
  const T=v.T,L=v.legal.filter(a=>a.t==='thr');if(!L.length)return {t:'pass'};
  L.sort((a,b)=>cval(a.c,T)-cval(b.c,T));
  if(P.greedyDef)return L[Math.floor(R()*L.length)];
  const end=v.deck===0,c=L[0].c;
  if(end)return L[0]; // колода кончилась — избавляемся от карт
  if(SU(c)===T&&!P.throwTrump)return {t:'pass'};
  let mx=P.throwMax+(v.deck<=4?3:0)+(v.taking?2:0);
  return cval(c,T)<=mx?L[0]:{t:'pass'};}

/* ---------------- «прикидка»: раздать невидимые карты наугад (только из тех, что игрок не видел) и доиграть каждый свой вариант ----------------
   Как человек думает «а если у неё туз?..». Настоящих рук соперников и колоды функция не знает — только view */
function sampleState(v,R){
  const seen=new Array(36).fill(false);for(const c of v.hand)seen[c]=true;for(const x of v.table){seen[x.a]=true;if(x.d>=0)seen[x.d]=true;}for(const c of v.disc)seen[c]=true;
  for(const k of v.known)for(const c of k)seen[c]=true;if(v.deck>0)seen[v.trumpCard]=true;
  const pool=[];for(let c=0;c<36;c++)if(!seen[c])pool.push(c);shuffle(pool,R);
  const hands=[];for(let q=0;q<v.n;q++){if(q===v.me){hands.push(v.hand.slice());continue;}const h=v.known[q].slice();while(h.length<v.counts[q])h.push(pool.pop());hands.push(h);}
  const deck=v.deck>0?[v.trumpCard].concat(pool.splice(0,v.deck-1)):[];if(pool.length||deck.length!==v.deck)return null;
  return {n:v.n,hands,deck,T:v.T,trumpCard:v.trumpCard,table:v.table.map(x=>({a:x.a,d:x.d})),disc:[],out:v.out.slice(),place:[],att:v.att,def:v.def,opener:v.att,
    phase:v.phase,cur:v.cur,taking:v.taking,passed:v.passed.slice(),defStart:v.defStart,bout:v.bout,known:hands.map(()=>[]),took:v.took.slice(),trN:Array(v.n).fill(0),
    rules:Object.assign({},v.rules),over:false,loser:-1,moves:0};}
function aiSample(v,P,R){
  const acts=v.legal;if(acts.length<2)return null;const sc=acts.map(()=>0),K=P.mc;
  for(let k=0;k<K;k++){const base=sampleState(v,R);if(!base)return null;const seed=Math.floor(R()*1e9);
    acts.forEach((a,j)=>{const s=cloneS(base);apply(s,a);const R2=rng(seed);let g=0;
      while(!s.over&&++g<400){const q=s.cur;apply(s,aiMove(viewFor(s,q),'base',R2));}
      sc[j]+=s.over?(s.loser===v.me?0:s.loser<0?.5:1):.5;});}
  let b=0;for(let j=1;j<acts.length;j++)if(sc[j]>sc[b])b=j;return acts[b];}

/* ---------------- решатель конца партии (колода пуста, карты с руками у двоих) ----------------
   Полный перебор с памятью: 1 — ходящий (me) не дурак, 0 — ничья, −1 — дурак. Перебор дольше бюджета — null (ИИ играет по правилам выше) */
const BUDGET={};
function sKey(s){return s.cur+'|'+s.att+'|'+s.def+'|'+s.phase+'|'+(s.taking?1:0)+'|'+s.passed.join(',')+'|'+s.defStart+'|'+s.table.map(x=>x.a+'/'+x.d).join(',')+'|'+s.hands.map(h=>h.slice().sort((a,b)=>a-b).join(',')).join(';');}
function actOrder(s,A){const T=s.T,w=a=>a.t==='take'?100:a.t==='pass'?50:cval(a.c,T);return A.slice().sort((a,b)=>w(a)-w(b));}
function solve(s0,me,budget){
  let nodes=0;const memo=new Map();
  function val(s,depth){
    if(s.over)return s.loser===me?-1:s.loser<0?0:1;
    if(++nodes>budget)throw BUDGET;
    if(depth>90)return 0;
    const k=sKey(s);if(memo.has(k))return memo.get(k);memo.set(k,0);
    const maxi=s.cur===me;let best=maxi?-2:2;
    for(const a of actOrder(s,legal(s))){const t=cloneS(s);apply(t,a);const r=val(t,depth+1);
      if(maxi?r>best:r<best)best=r;if(best===(maxi?1:-1))break;}
    memo.set(k,best);return best;}
  try{const res=[];for(const a of actOrder(s0,legal(s0))){const t=cloneS(s0);apply(t,a);res.push({a,v:val(t,1)});}return {res,nodes};}
  catch(e){if(e===BUDGET)return null;throw e;}}
function bestOf(res,me,cur){if(!res||!res.length)return null;const mx=cur===me;let b=res[0];for(const r of res)if(mx?r.v>b.v:r.v<b.v)b=r;return b;}
// из того, что видно игроку: колода пуста → рука единственного соперника с картами = все карты, которых нет ни у меня, ни на столе, ни в бито
function stateFromView(v){
  if(v.deck!==0)return null;const others=[];for(let q=0;q<v.n;q++)if(q!==v.me&&v.counts[q]>0)others.push(q);
  if(others.length!==1)return null;const o=others[0],seen=new Array(36).fill(false);
  for(const c of v.hand)seen[c]=true;for(const x of v.table){seen[x.a]=true;if(x.d>=0)seen[x.d]=true;}for(const c of v.disc)seen[c]=true;
  const oh=[];for(let c=0;c<36;c++)if(!seen[c])oh.push(c);if(oh.length!==v.counts[o])return null;
  const hands=[];for(let q=0;q<v.n;q++)hands.push(q===v.me?v.hand.slice():q===o?oh:[]);
  return {n:v.n,hands,deck:[],T:v.T,trumpCard:v.trumpCard,table:v.table.map(x=>({a:x.a,d:x.d})),disc:[],out:v.out.slice(),place:[],att:v.att,def:v.def,opener:v.att,
    phase:v.phase,cur:v.cur,taking:v.taking,passed:v.passed.slice(),defStart:v.defStart,bout:v.bout,known:hands.map(()=>[]),took:v.took.slice(),trN:Array(v.n).fill(0),
    rules:Object.assign({},v.rules),over:false,loser:-1,moves:0};}
function solveView(v,budget){const s=stateFromView(v);if(!s)return null;const r=solve(s,v.me,budget);if(!r)return null;
  const b=bestOf(r.res,v.me,v.me);if(!b)return null;return v.legal.find(x=>sameAct(x,b.a))||null;}

/* ---------------- задачка дня: позиция в конце партии, у игрока есть выигрыш, но не любой ход выигрывает ----------------
   Карты соперника открыты (как в шахматной задаче), колода пуста, соперник отвечает лучшим образом (решатель). */
function makePuzzle(seed){
  const R=rng(seed);
  for(let tr=0;tr<400;tr++){
    const deck=shuffle(Array.from({length:36},(_,i)=>i),R),T=Math.floor(R()*4);
    const nm=3+Math.floor(R()*3),no=3+Math.floor(R()*3),defend=R()<.5;
    const me=deck.slice(0,nm),op=deck.slice(nm,nm+no);let table=[];
    if(defend){const a=op.pop();table=[{a,d:-1}];}
    if(!me.some(c=>SU(c)===T)&&!op.some(c=>SU(c)===T))continue;
    const s=newGame({n:2,hands:[me,op],deck:[],T,trumpCard:deck[35],rules:{mode:'podkid',lim:6}});
    s.trumpCard=-1;s.T=T;
    if(defend){s.att=1;s.def=0;s.opener=1;s.phase='def';s.cur=0;s.table=table;s.defStart=me.length;}
    else{s.att=0;s.def=1;s.opener=0;s.phase='lead';s.cur=0;}
    s.bout=5;s.firstWhy='';
    const r=solve(s,0,60000);if(!r)continue;
    const win=r.res.filter(x=>x.v===1).length,all=r.res.length;
    if(!win||all<3||win>all/3)continue;
    // не слишком простая: выигрыш не «первой же картой по возрастанию»
    if(r.res[0].v===1&&R()<.7)continue;
    return {me,op,T,defend,table,win,all};}
  return null;}
function puzzleState(z){
  const s=newGame({n:2,hands:[z.me,z.op],deck:[],T:z.T,trumpCard:-1,rules:{mode:'podkid',lim:6}});
  s.T=z.T;s.trumpCard=-1;s.bout=5;
  if(z.defend){s.att=1;s.def=0;s.opener=1;s.phase='def';s.cur=0;s.table=z.table.map(x=>({a:x.a,d:x.d}));s.defStart=z.me.length;}
  else{s.att=0;s.def=1;s.opener=0;s.phase='lead';s.cur=0;s.table=[];}
  return s;}

function adClose(){setPause('ad',false);if(G&&!G.s.over&&!modalOn&&$('scr-game').classList.contains('on'))YG.start();}
const AD_FAIL='Реклама сейчас недоступна — загляни чуть позже',VK_REAL=/[?&]vk_app_id=/.test(location.search);
// межэкранная: не раньше AD_GAP после ЛЮБОЙ рекламы и после запуска, с 3-й партии (S.games ≥ 2), «долг» S.adW — партий с прошлого показа
let lastAdT=Date.now(),AD_GAP=180000,AD_EVERY=2,AD_COINS=30,X2_ON=true;
let adBusy=false;
function showRewarded(cb0,onFail0){
  if(adBusy)return;adBusy=true;clearTimeout(showRewarded._t);showRewarded._t=setTimeout(()=>{adBusy=false;},90000);
  const cb=()=>{adBusy=false;lastAdT=Date.now();cb0();},onFail=()=>{adBusy=false;lastAdT=Date.now();onFail0&&onFail0();};
  if(PLAT==='vk'&&!VK){if(VK_REAL){toast(AD_FAIL);onFail();}else stubAd(cb);return;}
  if(VK){adOpen();vkSend('VKWebAppShowNativeAds',{ad_format:'reward'},60000)
      .then(r=>{adClose();if(r&&r.result)cb();else{toast(AD_FAIL);onFail();}})
      .catch(()=>{adClose();toast(AD_FAIL);onFail();})
      .finally(()=>vkSend('VKWebAppCheckNativeAds',{ad_format:'reward'}).catch(()=>{}));return;}
  if(!ysdk){stubAd(cb);return;}
  let got=false;
  ysdk.adv.showRewardedVideo({callbacks:{onOpen:adOpen,onRewarded:()=>{got=true;},
    onClose:()=>{adClose();if(got)cb();else{toast('Досмотри видео до конца, чтобы получить награду');onFail();}},
    onError:()=>{adClose();toast(AD_FAIL);onFail();}}});

function adReady(){return Date.now()-lastAdT>=AD_GAP&&!(PLAT==='vk'&&!VK&&VK_REAL);}
function adOk(){return !(PLAT==='vk'&&!VK&&VK_REAL);}
// не после двух поражений подряд (раздражает сильнее всего) — долг ждёт следующей партии
function adDue(){return !PAY.own('no_ads')&&(S.adW||0)>=AD_EVERY&&(S.games||0)>=2&&(S.lossRow||0)<2;}
function showInterstitial(cb0){
  const cb=shown=>{lastAdT=Date.now();if(shown!==false){S.adW=0;save();}cb0();};
  if(PLAT==='vk'&&!VK){if(VK_REAL)cb0();else stubAd(cb);return;}
  if(VK){adOpen();vkSend('VKWebAppShowNativeAds',{ad_format:'interstitial'},60000).then(r=>!!(r&&r.result),()=>false).then(ok=>{adClose();cb(ok);});return;}

// удалённая настройка Яндекса (флаги консоли). Границы жёсткие: межэкранная — не чаще раза в 2 партии и раза в 180 с
function applyFlags(f){if(!isObj(f))return;const num=(k,a,b)=>{const n=parseInt(f[k],10);return isFinite(n)&&n>=a&&n<=b?n:null;};let n;
  if((n=num('ad_coins',10,100))!==null)AD_COINS=n;if((n=num('ad_every',2,6))!==null)AD_EVERY=n;if((n=num('ad_gap',180,600))!==null)AD_GAP=n*1000;
  if(f.x2==='0'||f.x2==='off')X2_ON=false;updCoins();}

/* ---- товары «Дурака» (каталог — hobby-analytics/13-purchases-catalog.md). Не продаём силу ИИ, подсказки в рейтинге, «удачу» раздачи ----

const PAY_ROW='set';
const PAY_ITEMS={
  no_ads:{perm:1,bonus:200,vk:14,ic:'🚫',name:'Без рекламы между партиями',desc:'Навсегда, и сразу +200 💰. Ролики за награду остаются — по желанию'},

  coins_l:{n:1200,vk:14,ic:'💰',name:'Сундук: 1200 💰',desc:'Выгоднее кошелька',done:'+1200 💰 — спасибо!'},
  tables:{perm:1,vk:7,ic:'🎨',name:'Столы «Праздник»',desc:'Хохлома, золотая парча и новогодний — три стола'},
  backs:{perm:1,vk:7,ic:'🃏',name:'Рубашки «Узоры»',desc:'Гжель, палех и звезда — три рубашки'},

};
const PAY_TEST={no_ads:99,coins_s:39,coins_l:99,tables:59,backs:59,rivals:79}; // цены только для ?paytest=1; настоящие — в консоли
function payAdd(n){S.coins+=n;}

/* ================= покупки за деньги: Яндекс Игры (ysdk.payments) и VK Игры (VKWebAppShowOrderBox) — общий модуль (одинаковый в 5 играх) =================
   Товары игры — PAY_ITEMS (выше), id совпадают с id в консоли Яндекса («Инап-покупки») и в hobby-pay/catalog.json (VK).
   Кнопок покупок НЕТ совсем, если платежи недоступны: нет SDK/моста (мак), каталог Яндекса пуст, VK не поддерживает оплату (iOS).
   Постоянные (perm) — флаг S.buy[id], разовый бонус монет — один раз на игрока (S.buyB). Выдача — только после подтверждения площадки.
   Яндекс: цена и значок валюты — только из getCatalog; расходуемые: выдать → сохранить (облако сразу) → consumePurchase;
     незавершённые при запуске довыдаём (getPurchases). Токены выданных — S.payT (и в облаке), сбой consume не даст выдать второй раз.
   VK: на кнопке число голосов (PAY_ITEMS.vk). success:true + order_id → выдать → сохранить → стереть ключ pay_<order_id>.
     Страховка: сервер vk-pay при оплате пишет в хранилище VK игрока pay_<order_id>=id (расходуемые) и own_<id>=1 (постоянные);
     при запуске читаем их и довыдаём. Выданные order_id — S.payV (последние 30); покупка без order_id оставляет метку «x:<id>»,
     которая «съест» первый чужой pay_ этого товара — второй раз не выдастся.
   Мак: ?paytest=1 — имитация Яндекса (localStorage «paytest»), ?vk=1&paytest=1 — имитация VK с сервером (localStorage «paytestvk»),
   ?paytest=fail — отказ. В настоящем VK (vk_app_id) и в Яндексе заглушек нет */
const payObj=x=>!!x&&typeof x==='object'&&!Array.isArray(x);
const PAY={on:false,p:null,v:null,list:[],busy:false,
  test:/[?&]paytest=/.test(location.search),
  // запуск: после SDK/моста и облака. Незавершённые покупки обрабатываем, даже если каталог не пришёл
  async init(){if(PAY.p||PAY.v)return;
    if(PLAT==='vk')return PAY.initVK();
    try{if(ysdk)PAY.p=ysdk.getPayments?await payT(ysdk.getPayments({signed:false})):ysdk.payments;
      else if(PAY.test&&!window.YaGames)PAY.p=payStub();}catch(e){PAY.p=null;}
    if(!PAY.p)return;
    try{await PAY.restore();}catch(e){}
    try{const c=await payT(PAY.p.getCatalog());PAY.list=(Array.isArray(c)?c:[]).filter(x=>x&&PAY_ITEMS[x.id]);}catch(e){PAY.list=[];}
    PAY.on=PAY.list.length>0;if(PAY.on)payAfter();},
  async initVK(){
    if(VK){let ok=false;try{ok=!!(VK.supportsAsync&&await payT(VK.supportsAsync('VKWebAppShowOrderBox'),8000));}catch(e){}if(ok)PAY.v=payVK();}
    else if(PAY.test&&!VK_REAL)PAY.v=payStubVK();
    if(!PAY.v)return;
    try{await PAY.restore();}catch(e){}
    PAY.list=Object.keys(PAY_ITEMS).filter(id=>PAY_ITEMS[id].vk>0).map(id=>({id}));
    PAY.on=PAY.list.length>0;if(PAY.on)payAfter();},
  own(id){return !!(payObj(S.buy)&&S.buy[id]);},
  item(id){return PAY.list.find(x=>x.id===id)||null;},
  give(id){const it=PAY_ITEMS[id];
    if(it.perm){if(!payObj(S.buy))S.buy={};S.buy[id]=1;
      if(it.bonus){if(!payObj(S.buyB))S.buyB={};if(!S.buyB[id]){S.buyB[id]=1;payAdd(it.bonus);}}}
    else payAdd(it.n||0);
    if(it.give)it.give();},
  // при запуске и «Восстановить покупки»: постоянные — выдать, если флага нет; расходуемые — довыдать и отметить
  async restore(){let got=0;
    if(PAY.v)got=await PAY.restoreVK();
    else{const ps=await payT(PAY.p.getPurchases());
      for(const x of (Array.isArray(ps)?ps:[])){const it=x&&PAY_ITEMS[x.productID];if(!it)continue;
        if(it.perm){if(!PAY.own(x.productID)){PAY.give(x.productID);got=1;}}else if(await PAY.credit(x))got=1;}}
    if(got){save();payFlush();payAfter();toast('Покупка зачислена',2600);}
    return got;},
  // VK: ключи own_<id> (постоянные, не стираем) и pay_<order_id> (расходуемые: выдать, сохранить, стереть)
  async restoreVK(){const ks=await PAY.v.keys();let got=0;const done=[];if(!Array.isArray(S.payV))S.payV=[];
    for(const k of ks){const m=/^(own|pay)_(.+)$/.exec(k.key||'');if(!m||!k.value)continue;
      if(m[1]==='own'){const it=PAY_ITEMS[m[2]];if(it&&it.perm&&!PAY.own(m[2])){PAY.give(m[2]);got=1;}continue;}
      const id=String(k.value),it=PAY_ITEMS[id];if(!it)continue;
      if(S.payV.indexOf(m[2])<0){const x=S.payV.indexOf('x:'+id); // покупка без order_id уже выдана — это её заказ
        if(x>=0)S.payV[x]=m[2];else{PAY.give(id);payMark(m[2]);got=1;}}
      done.push(k.key);}
    if(done.length){save();payFlush();for(const k of done)try{await PAY.v.clear(k);}catch(e){}}
    return got;},
  // расходуемая: выдать (если этот токен ещё не выдавали), сохранить в облако и только потом consumePurchase
  async credit(x){const t=String(x.purchaseToken||'');if(!Array.isArray(S.payT))S.payT=[];let fresh=false;
    if(!t||S.payT.indexOf(t)<0){PAY.give(x.productID);if(t)S.payT.push(t);if(S.payT.length>30)S.payT=S.payT.slice(-30);save();payFlush();fresh=true;}
    try{if(t)await payT(PAY.p.consumePurchase(t));}catch(e){}
    return fresh;},
  async buy(id){const it=PAY_ITEMS[id];if(!it||PAY.busy||!PAY.on||!PAY.item(id)||(it.perm&&PAY.own(id)))return;PAY.busy=true;payPause(true);
    try{if(PAY.v){const r=await PAY.v.order(id);if(!r||!r.success)throw new Error('cancel');
        const oid=r.order_id!=null?String(r.order_id):'';if(!Array.isArray(S.payV))S.payV=[];
        if(!oid||S.payV.indexOf(oid)<0){PAY.give(id);payMark(oid||'x:'+id);}
        save();payFlush();if(oid)PAY.v.clear('pay_'+oid).catch(()=>{});}
      else{const x=await PAY.p.purchase({id});
        if(it.perm){PAY.give(id);save();payFlush();}
        else await PAY.credit(x&&x.productID===id?x:{productID:id,purchaseToken:x&&x.purchaseToken});}
      SND.coin();toast(it.done||'Готово! Спасибо за покупку',2800);payAfter(id);}
    catch(e){toast('Покупка не состоялась',2200);}
    finally{PAY.busy=false;payPause(false);}},
  // «Восстановить покупки» (Об игре): заново читаем getPurchases / ключи VK
  async again(){if(!(PAY.p||PAY.v)||PAY.busy)return;PAY.busy=true;let got=0;try{got=await PAY.restore();}catch(e){}PAY.busy=false;if(!got)toast('Покупки проверены — всё на месте',2400);},
  // цена: VK — число голосов (требование VK); Яндекс — из каталога: число + значок валюты (getPriceCurrencyImage), иначе готовая строка price
  price(pr){if(PAY.v){const n=PAY_ITEMS[pr.id].vk,a=n%10,b=n%100;return n+' '+(a===1&&b!==11?'голос':a>=2&&a<=4&&(b<12||b>14)?'голоса':'голосов');}
    let img='';try{img=pr.getPriceCurrencyImage?pr.getPriceCurrencyImage('svg'):'';}catch(e){}
    return img&&pr.priceValue?payEsc(pr.priceValue)+'<img class="pcur" src="'+payEsc(img)+'" alt="">':payEsc(pr.price||pr.priceValue||'');},
  row(pr){const it=PAY_ITEMS[pr.id],own=it.perm&&PAY.own(pr.id),txt='<span>'+it.ic+' '+payEsc(it.name)+'<br><small>'+payEsc(it.desc)+'</small></span>';
    return own?'<div class="'+PAY_ROW+' pown">'+txt+'<i>куплено</i></div>':'<button class="'+PAY_ROW+' pbuy" data-pid="'+payEsc(pr.id)+'">'+txt+'<b>'+PAY.price(pr)+'</b></button>';},
  // список товаров (ids — только эти, по порядку каталога); owned=false — без уже купленных
  html(ids,owned){const L=PAY.list.filter(pr=>(!ids||ids.indexOf(pr.id)>=0)&&(owned!==false||!(PAY_ITEMS[pr.id].perm&&PAY.own(pr.id))));
    return L.length?'<div class="pay"><h3>Покупки</h3>'+L.map(PAY.row).join('')+'</div>':'';},
  bind(root){(root||document).querySelectorAll('.pbuy').forEach(b=>b.onclick=()=>{try{(SND.tap||SND.click)();}catch(e){}PAY.buy(b.dataset.pid);});}
};
function payMark(v){if(!Array.isArray(S.payV))S.payV=[];if(S.payV.indexOf(v)<0)S.payV.push(v);if(S.payV.length>30)S.payV=S.payV.slice(-30);}
// слияние облака (d) в сохранение T (по умолчанию S): купленное, выданные бонусы, токены и заказы — объединение (покупка не теряется ни с какой стороны)
function payMerge(d,T){T=T||S;if(!payObj(d)||!payObj(T))return;
  for(const f of ['buy','buyB'])if(payObj(d[f])){if(!payObj(T[f]))T[f]={};for(const k in d[f])if(d[f][k])T[f][k]=1;}
  for(const f of ['payT','payV'])if(Array.isArray(d[f])){if(!Array.isArray(T[f]))T[f]=[];for(const t of d[f])if(typeof t==='string'&&T[f].indexOf(t)<0)T[f].push(t);if(T[f].length>30)T[f]=T[f].slice(-30);}}
function payT(p,ms){return Promise.race([p,new Promise((_,no)=>setTimeout(()=>no(new Error('timeout')),ms||15000))]);}
function payEsc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]);}
// VK: окно оплаты (игрок может думать долго — ждём до 10 мин) и ключи хранилища, которые пишет сервер vk-pay
function payVK(){return {order:id=>vkSend('VKWebAppShowOrderBox',{type:'item',item:id},600000),
  keys:async()=>{const r=await vkSend('VKWebAppStorageGetKeys',{count:1000,offset:0},8000),ks=((r&&r.keys)||[]).filter(k=>/^(own|pay)_/.test(k));
    if(!ks.length)return [];const g=await vkSend('VKWebAppStorageGet',{keys:ks},8000);return (g&&g.keys)||[];},
  clear:k=>vkSend('VKWebAppStorageSet',{key:k,value:''},8000)};}
// имитация платежей для проверки на маке (?paytest=1): цены — PAY_TEST, покупки лежат в localStorage «paytest», consume их убирает
function payStub(){const K='paytest',rd=()=>{try{return JSON.parse(localStorage.getItem(K))||[];}catch(e){return [];}},wr=a=>{try{localStorage.setItem(K,JSON.stringify(a));}catch(e){}};
  const cur='data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20"><circle cx="10" cy="10" r="9" fill="#f5b400"/><text x="10" y="14.5" font-size="12" text-anchor="middle" font-family="Arial" font-weight="700" fill="#fff">T</text></svg>');
  const wait=v=>new Promise(ok=>setTimeout(()=>ok(v),250)),fail=()=>window.__payCancel||/[?&]paytest=fail/.test(location.search);
  return {getCatalog:()=>wait(Object.keys(PAY_TEST).map(id=>({id,title:id,description:'',imageURI:'',price:PAY_TEST[id]+' тест',priceValue:String(PAY_TEST[id]),priceCurrencyCode:'TST',getPriceCurrencyImage:()=>cur}))),
    getPurchases:()=>wait(rd()),
    purchase:({id})=>fail()?Promise.reject(new Error('cancel')):wait(null).then(()=>{const x={productID:id,purchaseToken:'t'+Date.now()+Math.random().toString(36).slice(2,6),developerPayload:''};const a=rd();a.push(x);wr(a);return x;}),
    consumePurchase:t=>{if(window.__payNoConsume)return Promise.reject(new Error('fail'));wr(rd().filter(x=>x.purchaseToken!==t));return wait();}};}
// имитация VK (?vk=1&paytest=1): «сервер» пишет pay_/own_ в localStorage «paytestvk», как vk-pay в хранилище VK.
// __payNoOid — ответ без order_id, __payNoClear — стирание ключа не прошло, ?paytest=fail / __payCancel — отказ
function payStubVK(){const K='paytestvk',rd=()=>{try{return JSON.parse(localStorage.getItem(K))||{};}catch(e){return {};}},wr=o=>{try{localStorage.setItem(K,JSON.stringify(o));}catch(e){}};
  const wait=v=>new Promise(ok=>setTimeout(()=>ok(v),250)),fail=()=>window.__payCancel||/[?&]paytest=fail/.test(location.search);
  return {order:id=>fail()?Promise.reject({error_type:'client_error'}):wait().then(()=>{const oid=String(Date.now()),o=rd();
      if(PAY_ITEMS[id].perm)o['own_'+id]='1';else o['pay_'+oid]=id;wr(o);return window.__payNoOid?{success:true}:{success:true,order_id:+oid};}),
    keys:()=>wait(Object.entries(rd()).filter(([k,v])=>v).map(([key,value])=>({key,value}))),
    clear:k=>{if(window.__payNoClear)return Promise.reject(new Error('fail'));const o=rd();delete o[k];wr(o);return wait();}};}


/* ================= рейтинг раскладов дня =================
   Очки — сколько дней выигран расклад дня (одна раздача на всех в этот день). Яндекс: лидерборд daily (создать в консоли).
   VK: таблица друзей VKWebAppShowLeaderBoardBox. Нет SDK/моста — кнопки нет. */
const LB={
  days(){return Object.keys(S.daily||{}).filter(k=>S.daily[k]>=2).length;},

function layout(){const tb=$('tbl'),W=tb.clientWidth,H=tb.clientHeight;if(!G||!W||!H)return null;
  const s=G.s,n=s.n,k=n-1,land=W>H*1.1;
  let cw=land?clamp(H*.17,58,112):clamp(Math.min(W*.2,H*.125),56,100);if(S.big)cw=Math.min(cw*1.08,land?118:106);

  const handY=H-ch-pad,barY=handY-56-(land?0:4);

  const cols=land?6:3,rows=land?1:2;

  if(el._t!==t){el.style.transform=t;el._t=t;}if(el._z!==z){el.style.zIndex=z;el._z=z;}}
function render(){if(!G)return;const L=layout();if(!L)return;const s=G.s,T=s.T,my=s.cur===0&&!G.busy&&!s.over,leg=my?legal(s):[];

    const ow=open?Math.min(L.tw*.8,st.w/Math.max(3,h.length)*1.6):L.ow,oh=ow*1.42,cnt=h.length;
    const sp=cnt>1?Math.min(ow*(open?.62:.4),(st.w*.86-ow)/(cnt-1)):0,x0=st.x-(ow+sp*(cnt-1))/2,y0=st.y+st.A+22;

  const xl=$('discLbl');xl.textContent=s.disc.length?'Бито':'';xl.style.left=(L.discX)+'px';xl.style.top=(L.discY+L.th+6)+'px';
  renderSeats(L);renderBar(L,leg);}
function renderSeats(L){const s=G.s,box=$('seats');

const STREAK=[10,10,15,15,20,25,40];
function dayKey(off){const d=new Date(nowMs());d.setDate(d.getDate()+(off||0));return d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate();}
function streakState(){const s=S.streak||{day:0,last:0,cyc:0},t=dayKey(0);
