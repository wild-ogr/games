<script>
'use strict';
/*LOGIC*/
/* ================= правила витрины, генератор, решатель, очередь =================
   Этот блок не трогает страницу (нет DOM) — tools/check.sh вырезает его из index.html и гоняет в jsc.
   Ячейка витрины — целое число: тип товара (биты 0–7), «оттает после N троек» (биты 8–15), коробка «Дефицит» (бит 16). */
const BOXF=1<<16,RARE0=200,NRARE=10;
const tOf=c=>c&255,iceOf=c=>(c>>8)&255;
function rng(seed){let a=seed>>>0;return()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
// порядок появления товаров: сначала самые узнаваемые
const GOOD_ORDER=[1,5,8,4,9,7,2,10,11,3,6,13,14,16,12,15,17,18,19,20,21,22];
const movable=(st,c)=>c!==0&&!(c&BOXF)&&iceOf(c)<=st.cl;
function mkState(lv){const st={p:[],F:[],cl:0,n:0,x:0};
  for(let i=0;i<lv.S;i++){st.p.push(0);st.F.push(lv.sh[i][0].slice());for(const r of lv.sh[i])for(const c of r)if(c)st.n++;}
  return st;}
function cloneSt(st){return{p:st.p.slice(),F:st.F.map(r=>r.slice()),cl:st.cl,n:st.n,x:st.x};}
// три одинаковых (коробка не в счёт, товар во льду — в счёт)
function tripleT(r){const a=r[0],b=r[1],c=r[2];if(!a||!b||!c||(a&BOXF)||(b&BOXF)||(c&BOXF))return 0;const t=tOf(a);return tOf(b)===t&&tOf(c)===t?t:0;}
// после хода: тройки исчезают, коробки рядом (эта полка и соседние по номеру) открываются, пустой ряд — подъезжает следующий.
// Живая игра (lv.live — ставит startLevel и автопрогон «человеком»): если тройку больше не собрать никак (товар заперт в коробках/во льду) —
// тётя Валя открывает все коробки и «размораживает» лёд (st.x), иначе уровень стал бы непроходимым навсегда (аудит 14).
// Генератор и решатель уровней флаг не видят — раскладки уровней от этого не меняются
function settle(lv,st,todo,ev){
  for(;;){
  while(todo.length){const i=todo.pop(),row=st.F[i],t=tripleT(row);
    if(t){ev&&ev.push({k:'clear',i,t,cells:row.slice()});row[0]=row[1]=row[2]=0;st.cl++;st.n-=3;
      for(let j=i-1;j<=i+1;j++){if(j<0||j>=lv.S)continue;const r=st.F[j];
        for(let s=0;s<3;s++)if(r[s]&BOXF){r[s]&=~BOXF;ev&&ev.push({k:'open',i:j,s,t:tOf(r[s])});if(j!==i)todo.push(j);}}}
    if(!row[0]&&!row[1]&&!row[2]&&st.p[i]<lv.sh[i].length-1){st.p[i]++;const nr=lv.sh[i][st.p[i]];row[0]=nr[0];row[1]=nr[1];row[2]=nr[2];
      if(st.x)for(let s=0;s<3;s++)row[s]&=255;ev&&ev.push({k:'adv',i});todo.push(i);}}
  if(!lv.live||st.x||!st.n||!doomed(lv,st))return;
  st.x=1;let ice=0;for(let i=0;i<lv.S;i++){const r=st.F[i];for(let s=0;s<3;s++){const c=r[s];if(!c)continue;
      if(c&BOXF)ev&&ev.push({k:'open',i,s,t:tOf(c)});else if(iceOf(c)>st.cl)ice=1;r[s]=c&255;}todo.push(i);}
  ev&&ev.push({k:'rescue',ice});}}
// «вечный тупик»: ни один товар больше не собрать тройкой. Доступны штуки не в коробке и не во льду, кроме рядов за рядом с коробкой/льдом;
// товар во льду годится как «якорь» (к нему можно подставить две такие же). Если тройки не собрать — лёд не оттает и коробки не откроются никогда
function doomed(lv,st){if(st.x)return false;const fr={};
  for(let i=0;i<lv.S;i++){const L=lv.sh[i];
    for(let k=st.p[i];k<L.length;k++){const r=k===st.p[i]?st.F[i]:L[k];let blk=false;
      for(const c of r){if(!c)continue;if(c&BOXF){blk=true;continue;}const t=tOf(c);if(iceOf(c)>st.cl)blk=true;else fr[t]=(fr[t]||0)+1;}
      if(blk)break;}}
  for(const t in fr)if(fr[t]>=3)return false;
  // якорь — полка, где в переднем ряду лежат замороженные товара t и больше ничего неподвижного (иначе не хватит места под тройку);
  // считаем все замороженные t на ней (раньше — только один, и спасали решаемые положения; аудит 18)
  for(let i=0;i<lv.S;i++){const r=st.F[i],ic={};let oth=0,k=0;
    for(const c of r){if(!c)continue;if(c&BOXF){oth++;continue;}if(iceOf(c)>st.cl){ic[tOf(c)]=(ic[tOf(c)]||0)+1;k++;}}
    for(const t in ic)if(k-ic[t]+oth===0&&ic[t]+(fr[t]||0)>=3)return false;}
  return true;}
function doMove(lv,st,a,sa,b,sb,ev){const c=st.F[a][sa];st.F[a][sa]=0;st.F[b][sb]=c;ev&&ev.push({k:'move',a,sa,b,sb,c});settle(lv,st,[a,b],ev);}
const freeSlot=r=>r[0]===0?0:r[1]===0?1:r[2]===0?2:-1;
// есть ли вообще ход: двигаемый товар и пустое место на другой полке
function hasMove(lv,st){const mv=[],em=[];for(let i=0;i<lv.S;i++){const r=st.F[i];if(r.some(c=>movable(st,c)))mv.push(i);if(r.some(c=>!c))em.push(i);}
  return mv.some(a=>em.some(b=>b!==a));}
// ходы с оценкой (для решателя и подсказки): тройка > открыть ряд > пара на чистой полке; разбивать пару и мешать — плохо
function listMoves(lv,st,want){const out=[],S=lv.S,F=st.F,tg=[];let empt=false;
  for(let b=0;b<S;b++){const r=F[b];if(freeSlot(r)<0)continue;if(!r[0]&&!r[1]&&!r[2]){if(empt)continue;empt=true;}tg.push(b);}
  for(let a=0;a<S;a++){const r=F[a],items=(r[0]?1:0)+(r[1]?1:0)+(r[2]?1:0);
    for(let sa=0;sa<3;sa++){const c=r[sa];if(!movable(st,c))continue;if((sa>0&&r[0]===c)||(sa>1&&r[1]===c))continue;
      const t=tOf(c);let cntA=0;for(const x of r)if(x&&!(x&BOXF)&&tOf(x)===t)cntA++;
      const reveal=items===1&&st.p[a]<lv.sh[a].length-1;
      for(const b of tg){if(b===a)continue;const q=F[b];let cntB=0,emB=0,oth=0;
        for(const x of q){if(!x)emB++;else if(!(x&BOXF)&&tOf(x)===t)cntB++;else oth++;}
        if(items===1&&!reveal&&cntB===0&&oth===0)continue; // одинокий товар на пустую полку — ничего не меняет
        let sc=0;const tri=cntB===2&&emB===1;
        if(tri)sc+=1000;if(reveal)sc+=300;
        if(oth===0&&cntB===1)sc+=200;else if(oth===0&&cntB===0)sc+=30;
        sc-=120*oth;if(cntA>=2)sc-=150;
        if(want){const w=want.indexOf(t);if(w>=0)sc+=tri?400-50*w:cntB>=1&&oth===0?100:30;}
        out.push([sc,a,sa,b,freeSlot(q)]);}}}
  out.sort((x,y)=>y[0]-x[0]);return out;}
function keyOf(st){let k='';for(let i=0;i<st.F.length;i++){const r=st.F[i];let a=r[0],b=r[1],c=r[2],t;
    if(a>b){t=a;a=b;b=t;}if(b>c){t=b;b=c;c=t;}if(a>b){t=a;a=b;b=t;}k+=st.p[i]+':'+a+','+b+','+c+';';}return k+st.cl+(st.x?'x':'');}
// поиск в глубину с лучшими ходами первыми; путь — список [a,sa,b,sb] или null (не нашли за limit узлов)
function solve(lv,st0,limit,want,seen0){const seen=new Set(seen0||[]);seen.add(keyOf(st0));const stack=[{st:cloneSt(st0),mv:listMoves(lv,st0,want),i:0,m:null}];let nodes=0;
  while(stack.length){const f=stack[stack.length-1];
    if(f.st.n===0){const p=stack.slice(1).map(x=>x.m);p.nodes=nodes;return p;}
    if(nodes>limit)return null;
    if(f.i>=f.mv.length){stack.pop();continue;}
    const m=f.mv[f.i++],s=cloneSt(f.st);doMove(lv,s,m[1],m[2],m[3],m[4]);const k=keyOf(s);if(seen.has(k))continue;seen.add(k);nodes++;
    stack.push({st:s,mv:listMoves(lv,s,want),i:0,m:[m[1],m[2],m[3],m[4]]});}
  return null;}

/* ---- уровни: 10 на город; внутри города «пила» (1–2-й передышка, 9-й подъём), 10-й — «Ревизия» (босс) ---- */
const isBoss=i=>i%10===9;
function levelParams(i){
  const c=Math.floor(i/10),k=i%10,boss=k===9,saw=[0,1,2,1,3,4,2,5,6,7][k],cc=Math.min(c,7),d=cc*2+saw,S=Math.min(10,4+Math.floor(d/3)+(boss?1:0));
  if(i===0)return{tut:1,K:1};
  if(i===1)return{S:4,D:2,T:3,E:4,ice:0,box:0,K:2,pt:30};
  if(i===2)return{S:4,D:2,T:4,E:4,ice:0,box:0,K:3,pt:6};
  return{boss,c,S,D:Math.min(4,2+Math.floor(d/7))+(boss?1:0),T:Math.min(15,3+Math.floor(d/2)+(boss?1:0)),
    E:Math.max(3,Math.ceil(S/2)+1-Math.floor(saw/3)),
    ice:i>=5?Math.min(4,Math.floor((saw+cc)/3)+(boss?1:0)):0,
    box:i>=11?Math.min(3,(saw>=3?1:0)+(cc>=3?1:0)+(boss?1:0)):i===6?1:0, // 7-й уровень — первая коробка «Дефицит» (одна, без льда)
    rare:i===6||(i>=11&&(i%3===1||boss)),
    K:Math.min(12,3+Math.floor(d/3)+(boss?2:0)),pt:(boss?2:0)-Math.min(2,Math.floor(c/3))+(i>=100?4:0)};} // после 100-го — терпения +4 (аудит 14)
function shuffle(a,R){for(let i=a.length-1;i>0;i--){const j=Math.floor(R()*(i+1)),t=a[i];a[i]=a[j];a[j]=t;}return a;}
function buildLevel(P,R,i,rareId){
  const S=P.S,nb=[],sz=[];
  for(let s=0;s<S;s++){let n=P.D-1-(R()<.35?1:0);n=Math.max(0,n);nb.push(n);const a=[];for(let k=0;k<n;k++){const x=R();a.push(x<.65?3:x<.95?2:1);}sz.push(a);}
  // пустые места переднего ряда: не больше 2 на полке с рядами сзади
  const fr=new Array(S).fill(3);let E=P.E,g=0;
  while(E>0&&g++<500){const s=Math.floor(R()*S);if(fr[s]>(nb[s]?1:0)){fr[s]--;E--;}}
  let N=fr.reduce((x,y)=>x+y,0);for(const a of sz)for(const x of a)N+=x;
  g=0;while(N%3&&g++<200){const s=Math.floor(R()*S);const a=sz[s];if(a.length){const k=Math.floor(R()*a.length);if(a[k]>1){a[k]--;N--;}}else if(fr[s]>1){fr[s]--;N--;}}
  if(N%3)return null;
  const M=N/3,poolN=Math.min(GOOD_ORDER.length,Math.max(P.T,6+Math.floor(i/2))),pool=shuffle(GOOD_ORDER.slice(0,poolN),R),T=Math.min(P.T,M),types=pool.slice(0,T);
  const tri=types.slice();while(tri.length<M)tri.push(types[Math.floor(R()*T)]);
  if(P.rare&&rareId>=0&&M>=4){const k=tri.findIndex((t,j)=>tri.indexOf(t)!==j);tri[k>=0?k:0]=RARE0+rareId;}
  const items=[];for(const t of tri)items.push(t,t,t);shuffle(items,R);
  const sh=[];let q=0;
  for(let s=0;s<S;s++){const L=[],f=[0,0,0],pos=shuffle([0,1,2],R);for(let k=0;k<fr[s];k++)f[pos[k]]=items[q++];L.push(f);
    for(const n of sz[s]){const r=[0,0,0],ps=shuffle([0,1,2],R);for(let k=0;k<n;k++)r[ps[k]]=items[q++];L.push(r);}sh.push(L);}
  // без готовых троек в рядах (кроме редкой удачи в глубине)
  const all=[];sh.forEach((L,s)=>L.forEach((r,k)=>r.forEach((c,j)=>{if(c)all.push([s,k,j]);})));
  for(let it=0;it<400;it++){let bad=null;sh.forEach(L=>L.forEach((r,k)=>{if(!bad&&tripleT(r)&&(k===0||R()<.8))bad=r;}));if(!bad)break;
    const j=Math.floor(R()*3),o=all[Math.floor(R()*all.length)],r2=sh[o[0]][o[1]],t=bad[j];bad[j]=r2[o[2]];r2[o[2]]=t;}
  // лёд: оттает после 2–4 троек; коробки «Дефицит»: сначала редкий товар, открываются тройкой рядом
  const cand=all.filter(([s,k])=>k<=1);shuffle(cand,R);const used={};
  let nb2=P.box||0;if(P.rare&&nb2<1&&tri.some(t=>t>=RARE0))nb2=1;
  for(const [s,k,j] of cand.slice().sort((x,y)=>(sh[y[0]][y[1]][y[2]]>=RARE0)-(sh[x[0]][x[1]][x[2]]>=RARE0))){if(nb2<=0)break;const key=s+':'+k;if(used[key])continue;
    if(k===0&&sh[s][0].filter(Boolean).length<2)continue;used[key]=1;sh[s][k][j]|=BOXF;nb2--;}
  let ni=P.ice||0;for(const [s,k,j] of cand){if(ni<=0)break;const key=s+':'+k;if(used[key])continue;const c=sh[s][k][j];if(c&BOXF)continue;used[key]=1;sh[s][k][j]=c|((2+Math.floor(R()*3)+k)<<8);ni--;}
  return{S,sh,items:N,types:types.slice(),rare:tri.some(t=>t>=RARE0)?RARE0+rareId:0,K:P.K,boss:!!P.boss,idx:i};}
function tutLevel(){const A=1,B=5;return{S:3,sh:[[[A,A,0]],[[B,A,B]],[[B,0,0]]],items:6,types:[A,B],rare:0,K:1,P:99,pd:0,boss:false,idx:0,tut:1};}
// «человеческая» игра: чаще лучший по оценке ход, иногда второй или случайный из первых четырёх, без возвратов в прежние положения.
// Доля удачных попыток — насколько уровень дружелюбен (для 45+ важно, чтобы разумная игра доводила до конца)
function playout(lv,R,st0,want,path){const st=st0?cloneSt(st0):mkState(lv);if(!st0)settle(lv,st,lv.sh.map((_,j)=>j));const seen=new Set([keyOf(st)]);let steps=0;
  while(st.n>0&&steps++<400){const mv=listMoves(lv,st,want),ok=[];
    for(const m of mv){if(ok.length>=4)break;const s=cloneSt(st);doMove(lv,s,m[1],m[2],m[3],m[4]);const k=keyOf(s);if(!seen.has(k))ok.push([s,k,m]);}
    if(!ok.length)return 0;const x=R(),pk=ok[x<.62||ok.length<2?0:x<.87||ok.length<3?1:Math.floor(R()*ok.length)];
    st.p=pk[0].p;st.F=pk[0].F;st.cl=pk[0].cl;st.n=pk[0].n;seen.add(pk[1]);if(path)path.push([pk[2][1],pk[2][2],pk[2][3],pk[2][4]]);}
  return st.n===0?steps:0;}
// быстрый поиск короткого решения: несколько «человеческих» попыток, лучшая; не вышло — поиск в глубину
function solveFast(lv,st,R,want,tries,limit){let best=null;
  for(let k=0;k<(tries||12);k++){const p=[];if(playout(lv,R,st,want,p)&&(!best||p.length<best.length))best=p;if(best&&k>=3)break;}
  return best||solve(lv,st,limit||30000,want);}
function friendly(lv,n,R){let w=0,m=0;for(let k=0;k<n;k++){const x=playout(lv,R);if(x){w++;m+=x;}}lv.mpt=w?m/w/(lv.items/3):3;return w/n;}
// нижняя граница дружелюбия: 1–3-й почти всегда проходятся «на глаз», дальше по «пиле»; босс — самый строгий
// после 100-го (города по второму кругу) — чуть дружелюбнее: партий длиннее, игроку уже не нужен «вызов» (аудит 14: бот упирался в Ревизиях 110, 170)
function needFr(i){if(i<3)return .9;const k=i%10;return [.85,.8,.7,.75,.6,.55,.7,.5,.45,.35][k]-(i>=100?0.03:Math.min(.1,Math.floor(i/10)*.015));}
function genLevel(i,seed,rareId){const P=levelParams(i);if(P.tut)return tutLevel();const need=needFr(i);let best=null;
  for(let k=0;k<120;k++){const R=rng(seed+k*1013),lv=buildLevel(P,R,i,rareId==null?-1:rareId);if(!lv)continue;
    const st=mkState(lv);settle(lv,st,lv.sh.map((_,j)=>j));const sol=solve(lv,st,30000);if(!sol)continue;
    lv.sol=sol.length;lv.try=k;lv.fr=friendly(lv,16,rng(seed+k));
    // терпение: ~4,5 хода на тройку этого уровня + запас; покупателю, чей товар в глубине, — ещё
    const mp=Math.max(2.2,Math.min(4.5,lv.mpt));lv.P=Math.round(10+4.5*mp)+(P.pt||0);lv.pd=1+Math.round(mp/2);if(P.pt>=30){lv.P=40;lv.pd=0;}
    if(lv.fr>=need)return lv;if(!best||lv.fr>best.fr)best=lv;
    if(k%30===29&&P.E<6)P.E++;}
  return best;}
/* ---- очередь покупателей: просят только то, что ещё есть тройкой (с учётом уже ждущих), терпение — в ходах ---- */
function remCounts(lv,st){const m={};for(let i=0;i<lv.S;i++){for(const c of st.F[i])if(c)m[tOf(c)]=(m[tOf(c)]||0)+1;
    const L=lv.sh[i];for(let k=st.p[i]+1;k<L.length;k++)for(const c of L[k])if(c)m[tOf(c)]=(m[tOf(c)]||0)+1;}return m;}
function qInit(lv,R){return{left:lv.K,vis:[],served:0,angry:0,R,nx:0};}
function qFill(lv,st,q,max){max=max||3;if(q.vis.length>=max||q.left<=0)return;const rem=remCounts(lv,st);
  while(q.vis.length<max&&q.left>0){const res={};for(const v of q.vis)res[v.t]=(res[v.t]||0)+1;let best=0,bs=-1e9,bf=0;
    for(const k in rem){const t=+k;if(t>=RARE0||Math.floor(rem[t]/3)-(res[t]||0)<=0)continue;let sc=0,f=0;
      for(let i=0;i<lv.S;i++){for(const c of st.F[i])if(c&&tOf(c)===t&&!(c&BOXF)){if(movable(st,c)){sc+=3;f++;}else sc+=1;}
        const L=lv.sh[i],p=st.p[i];if(p+1<L.length)for(const c of L[p+1])if(c&&tOf(c)===t)sc+=1;}
      sc+=q.R()*3;if(res[t])sc-=100;if(sc>bs){bs=sc;best=t;bf=f;}}
    if(!best){q.left=0;break;}
    // терпение: основа уровня + «глубина» трёх самых доступных штук (ряд сзади, лёд, коробка) + ожидание за теми, кто уже стоит
    const ds=[];for(let i=0;i<lv.S;i++){const L=lv.sh[i];for(let k=st.p[i];k<L.length;k++){const r=k===st.p[i]?st.F[i]:L[k];for(const c of r)if(c&&tOf(c)===best)ds.push(k-st.p[i]+(movable(st,c)?0:1));}}
    ds.sort((a,b)=>a-b);const cost=(ds[0]||0)+(ds[1]||0)+(ds[2]||0);
    const pat=lv.P+cost*lv.pd+q.vis.length*2;q.vis.push({t:best,pat,max:pat,id:q.nx++});q.left--;}}
function qClear(q,t){const k=q.vis.findIndex(v=>v.t===t);if(k<0)return null;const v=q.vis.splice(k,1)[0];q.served++;return v;}
// терпение тает только от ходов без тройки: пока товар уходит, очередь видит, что дело идёт
function qTick(q){const gone=[];for(let k=q.vis.length-1;k>=0;k--){const v=q.vis[k];v.pat--;if(v.pat<=0){q.vis.splice(k,1);q.angry++;gone.push(v);}}return gone;}
// бот для автопрогона: каждый ход — первый шаг решения с учётом того, кто что ждёт
// бот ведёт себя как внимательный человек: лучший по оценке ход (с учётом, кто что ждёт), без возвратов в прежние положения;
// долго без тройки — берёт решение решателя (как «подсказку»); тупик — «отменить ход» назад, пока решатель не найдёт путь (как игрок с кнопкой отмены), и дальше по решению
function botPlay(lv,seed,limit){let st=mkState(lv);settle(lv,st,lv.sh.map((_,j)=>j));let q=qInit(lv,rng(seed));qFill(lv,st,q);
  const cq=q=>({left:q.left,vis:q.vis.map(v=>Object.assign({},v)),served:q.served,angry:q.angry,R:q.R,nx:q.nx});
  let steps=0,slack=99,plan=null,undos=0,idle=0,restart=0;const R2=rng(seed+5),hist=new Set([keyOf(st)]),back=[];
  while(st.n>0&&steps<800){let m=null;
    if(steps>lv.items*3&&!restart){restart=1;st=mkState(lv);settle(lv,st,lv.sh.map((_,j)=>j));q=qInit(lv,rng(seed));qFill(lv,st,q);hist.clear();back.length=0;plan=solveFast(lv,st,R2,null,24,60000);}
    if((!plan||!plan.length)&&idle<6){plan=null;for(const x of listMoves(lv,st,q.vis.map(v=>v.t))){const s=cloneSt(st);doMove(lv,s,x[1],x[2],x[3],x[4]);if(!hist.has(keyOf(s))){m=[x[1],x[2],x[3],x[4]];break;}}}
    if(!m&&!(plan&&plan.length)){plan=solveFast(lv,st,R2,null,24);
      while((!plan||!plan.length)&&back.length){const b=back.pop();st=b[0];q=b[1];undos++;plan=solveFast(lv,st,R2,null);}
      if(!plan||!plan.length){if(restart)return{ok:false,steps,angry:q.angry,served:q.served,slack,undos};
        restart=1;st=mkState(lv);settle(lv,st,lv.sh.map((_,j)=>j));q=qInit(lv,rng(seed));qFill(lv,st,q);hist.clear();back.length=0;plan=solveFast(lv,st,R2,null,24,60000);if(!plan)return{ok:false,steps,undos};continue;}}
    if(!m)m=plan.shift();
    back.push([cloneSt(st),cq(q)]);if(back.length>30)back.shift();
    const ev=[];doMove(lv,st,m[0],m[1],m[2],m[3],ev);steps++;hist.add(keyOf(st));
    idle++;let cl=0;for(const e of ev)if(e.k==='clear'){idle=0;cl++;plan=null;const v=qClear(q,e.t);if(v)slack=Math.min(slack,v.pat);}
    if(!cl)qTick(q);qFill(lv,st,q);}
  return{ok:st.n===0,steps,angry:q.angry,served:q.served,slack,undos,restart};}

/* ================= язык: русский и английский (27.09) =================
   Русский — исходный: тексты данных (GOODS, RARE, CITIES, PH, DECOR, BOOST, BNAME, PAY_ITEMS) по-русски, английский накладывается
   из EN_DATA (PAY_ITEMS — из поля en) в setLang; строки интерфейса — прямо в коде: L('по-русски','in English'), числа — pl().
   Статичная вёрстка: атрибуты data-en / data-en-aria (русский берётся из самой вёрстки). ПРАВИЛО: новый текст — сразу в оба языка.
   Язык: VK — всегда русский; Яндекс — ysdk.environment.i18n.lang (до SDK — ?lang из адреса, иначе navigator.language);
   ru/be/kk/uk/uz → русский, остальное → английский. Выбор в настройках (RU/EN) запоминается на устройстве (LANG_KEY) и главнее площадки.
   На маке (localhost) ?lang=en / ?lang=ru главнее сохранённого выбора. */
const LANG_KEY='gastronom-lang',RU_LANGS=['ru','be','kk','uk','uz'];
const IS_VK=/[?&](vk_app_id|vk)=/.test(location.search),IS_LOCAL=/^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname);
function normLang(l){l=String(l||'').slice(0,2).toLowerCase();return !l||RU_LANGS.indexOf(l)>=0?'ru':'en';}
function langSaved(){try{const m=localStorage.getItem(LANG_KEY);return m==='ru'||m==='en'?m:null;}catch(e){return null;}}
function langQuery(){try{return new URLSearchParams(location.search).get('lang');}catch(e){return null;}}
function langStart(){if(IS_VK)return 'ru';const q=langQuery(),m=langSaved();
  if(q&&(IS_LOCAL||!m))return normLang(q);if(m)return m;return normLang(navigator.language||'ru');}
let LANG=langStart();
const L=(ru,en)=>LANG==='en'?en:ru;
// число с существительным: pl(5,'монета','монеты','монет','coin','coins') → «монет» / «coins»
function pl(n,r1,r2,r5,e1,eN){return LANG==='en'?(n===1?e1:eN):plural(n,r1,r2,r5);}
// наложение английского на данные по ключам/индексам; русский оригинал — в копии (для переключения обратно)
const DATA={},DATA_RU={};
function regData(name,obj){DATA[name]=obj;DATA_RU[name]=JSON.parse(JSON.stringify(obj));}
function overlay(dst,src){for(const k in src){const s=src[k],d=dst[k];
  if(s&&typeof s==='object'&&!Array.isArray(s)&&d&&typeof d==='object')overlay(d,s);
  else if(Array.isArray(s)&&Array.isArray(d)&&s.length&&s[0]&&typeof s[0]==='object')s.forEach((o,i)=>{if(d[i]&&typeof d[i]==='object')overlay(d[i],o);});
  else dst[k]=Array.isArray(s)?s.slice():s;}}
function applyStatic(){document.querySelectorAll('[data-en]').forEach(e=>{if(e.dataset.ru==null)e.dataset.ru=e.innerHTML;e.innerHTML=LANG==='en'?e.dataset.en:e.dataset.ru;});
  document.querySelectorAll('[data-en-aria]').forEach(e=>{if(e.dataset.ruAria==null)e.dataset.ruAria=e.getAttribute('aria-label')||'';e.setAttribute('aria-label',LANG==='en'?e.dataset.enAria:e.dataset.ruAria);});}

const isObj=x=>!!x&&typeof x==='object'&&!Array.isArray(x);
// защита от сохранений неожиданной формы (ручная правка, старая версия): не даём им сломать игру и слияние
function fixSave(){for(const f of ['stars','daily','decor','tips','ask','chest'])if(!isObj(S[f]))S[f]={};if(!Array.isArray(S.album))S.album=[];
  for(const f of ['streak','adc'])if(S[f]!=null&&!isObj(S[f]))delete S[f];if(typeof S.adW!=='number'||!isFinite(S.adW))S.adW=0;
  if(typeof S.unlocked!=='number'||!(S.unlocked>=1))S.unlocked=1;if(typeof S.levelsDone!=='number')S.levelsDone=0;
  if(typeof S.coins!=='number'||!isFinite(S.coins))S.coins=60;if(S.payT!=null&&!Array.isArray(S.payT))S.payT=[];if(S.payV!=null&&!Array.isArray(S.payV))S.payV=[];if(S.buy!=null&&!isObj(S.buy))S.buy={};if(S.buyB!=null&&!isObj(S.buyB))S.buyB={};}

  function init(S,opt){O=opt||{};if(!S.soc||typeof S.soc!=='object')S.soc={};st=S.soc;

  /* ===== v2.3. Разрешение на уведомления (VKWebAppAllowNotifications) =====

  var ntfNow=false; // разрешил в этом сеансе (параметр запуска VK до перезапуска остаётся прежним)
  function ntfOn(){var v=qp('vk_are_notifications_enabled');return ntfNow||v==='1'||(v!=='0'&&!!(st.ntf&&st.ntf.d));}
  function ntfDay(){return st.d0?Math.max(0,dayNo(nowFn())-dayNo(st.d0)+1):0;}
  function ntfSes(){if(!O.ntf||OKP)return;var v=qp('vk_are_notifications_enabled'),d=!!(st.ntf&&st.ntf.d);
    if(v==='1')sx('ntf','on',0,{s:'vk'});else if(d)sx('ntf',v==='0'?'off':'on',0,v==='0'?null:{s:'me'});}
  var NTF_MAX=3,NTF_DAYS=[1,3,7]; // показов всего; в какой день игрока (от первого запуска) не раньше — показ №1, №2, №3
  function dayNo(t){var d=new Date(t);return Math.floor((t-d.getTimezoneOffset()*60000)/DAY);} // номер календарного дня (местное время)
  function nowFn(){var t=0;try{t=+(O.now&&O.now())||0;}catch(e){}return t>0?t:Date.now();}
  function ntfN(){return st.ntf&&+st.ntf.n||0;}
  function ntfDue(){if(!O.ntf||!can('ntf')||(st.ntf&&st.ntf.d))return false;var n=ntfN();
    if(n>=NTF_MAX)return false;if(!n)return true;
    var now=dayNo(nowFn()),last=dayNo(+st.ntf.t||0);if(now<=last)return false; // в один день — никогда

    return t==null?tx('Напомнить, когда появится что-то новое?','Remind you when there is something new?'):String(t||'');}
  // n — номер попытки из offer (1–3) или 0/пусто — кнопка в ⚙. Отказ счётчик показов не меняет (показ уже посчитан в offer)
  function ntf(n){n=+n||0;return send('VKWebAppAllowNotifications').then(function(r){var y=!!(r&&r.result);if(y){done('ntf');ntfNow=true;}sx('ntf',y?'ok':'no',n,{d:ntfDay()});return y;},
    function(e){var d=e&&e.error_data||{},c=+d.error_code||0,why=String(d.error_reason||d.error_msg||'');
      sx('ntf',c===4||/denied|cancel/i.test(why)?'no':'err',n,{d:ntfDay(),e:c||String(why||(e&&(e.error_type||e.message))||'?').slice(0,24)});return false;});}

  /* ===== v2.3. События VK: лента активности друзей, таблица результатов, миссии =====
     VK принимает их только с сервера (secure.addAppEvent), поэтому игра шлёт в свою функцию (hobby-pay, ?op=vkev) подписанные параметры
     запуска и список событий; сервер проверяет подпись. Включается настройками SOC.init: evUrl — адрес функции,
     evId(код) — номер миссии из кабинета VK (0/пусто — миссия ещё не заведена, не шлём), evGap — пауза между отправками уровня/очков (мс).
     Игра зовёт (в любой момент, хоть на каждую победу): SOC.level(n) — пройдено уровней, SOC.score(n) — очки, SOC.mission('код') — миссия выполнена.
     Модуль помнит в S.soc.ev: l/p — что надо отправить, ls/ps — что уже отправлено, m — миссии {код: 0 ждёт | 1 отправлена},
     f — {код: когда VK в последний раз отказал}. Отказ VK по миссии (ещё на проверке у модератора, отклонена, сбой) — НЕ навсегда:
     миссия остаётся ждать и повторяется при следующих запусках, но не чаще раза в сутки (EV_RETRY_DAYS) на миссию. Шлёт пачкой (до 4 событий, миссий — до 2 за запрос и до 4 за сеанс), уровень/очки — не чаще раза в evGap (3 мин),
     плюс при сворачивании игры; не отправилось (нет сети, сервер молчит) — уйдёт в следующий раз/при следующем запуске.
     Только ВКонтакте с мостом и подписью в адресе: в ОК, в Яндексе и на маке без vk_app_id — ни одного запроса. Всё молча: игрок ничего не видит.
     Статистика: STAT.ev('vkev',{a:'lvl'|'pts'|'mis'|'req', r:итог, k:код миссии}). Наград за это нет. */
  var evT=0,evBusy=false,evLast=0,evSes=0,evDead=false,evWait=0,evFails=0,evSkip={},EV_RETRY_DAYS=1;
  function evHold(k){var e=evSt(),t=e.f&&+e.f[k]||0;return evSkip[k]||(t>0&&nowFn()-t<EV_RETRY_DAYS*DAY&&nowFn()>=t);} // недавно отказали — пока не шлём
  function evSt(){if(!st.ev||typeof st.ev!=='object')st.ev={};if(!st.ev.m||typeof st.ev.m!=='object')st.ev.m={};return st.ev;}
  function evKeep(){return typeof PLAT!=='undefined'&&PLAT==='vk'&&!OKP;} // запоминать достижения (даже без сети/моста)

  function evNum(code){var n=0;try{n=+(typeof O.evId==='function'?O.evId(code):O.evId&&O.evId[code])||0;}catch(e){}return n>=3?n:0;}
  function evStat(a,r,k){try{if(typeof STAT!=='undefined'&&STAT.ev){var p={a:a,r:String(r).slice(0,8)};if(k)p.k=k;STAT.ev('vkev',p);}}catch(e){}}

    if(b.m&&typeof b.m==='object')for(k in b.m)if(e.m[k]==null||+b.m[k]>+e.m[k])e.m[k]=+b.m[k]===1?1:0;
    if(b.f&&typeof b.f==='object'){if(!e.f)e.f={};for(k in b.f)if(+b.f[k]>(+e.f[k]||0))e.f[k]=+b.f[k];}}

  function score(n){evSet('p',n);}

  function mission(code){if(!evKeep()||!code)return false;var e=evSt();if(e.m[code]!=null)return false;e.m[code]=0;saveFn();evPlan(5000);return true;}
  function evPick(force){var e=evSt(),out=[],k,n=0,gap=+O.evGap||180000,now=Date.now();
    for(k in e.m){if(e.m[k]!==0||evHold(k)||!evNum(k))continue;if(n>=2||evSes+n>=4)break;out.push({m:k,id:evNum(k)});n++;}
    if(out.length||!evLast||now-evLast>=(force?30000:gap)){

  function evPlan(ms){if(evT||!evOn())return;var e=evSt(),gap=+O.evGap||180000,left=evLast?evLast+gap-Date.now():0,k,mis=false;
    for(k in e.m)if(e.m[k]===0&&!evHold(k)&&evNum(k)&&evSes<4){mis=true;break;}
    if(!mis&&!((+e.l||0)>(+e.ls||0)||(+e.p||0)>(+e.ps||0)))return;
    evT=setTimeout(function(){evT=0;evFlush();},Math.max(ms||5000,mis?0:left,evWait-Date.now()));}

    var fin=false,guard=setTimeout(function(){end(null);},15000);
    function end(d){if(fin)return;fin=true;clearTimeout(guard);evBusy=false;evDone(list,d);}
    try{fetch(O.evUrl,{method:'POST',mode:'cors',keepalive:true,headers:{'Content-Type':'text/plain'},body:JSON.stringify({app:String(APP),q:location.search,ev:list})})
      .then(function(r){return r.json();}).then(function(d){end(d&&typeof d==='object'?d:null);},function(){end(null);});}catch(e){end(null);}}

    evFails=0;
    for(i=0;i<list.length;i++){x=list[i];r=String(d.r[i]||'net');
      if(x.m){evStat('mis',r,x.m);
        if(r==='ok'||r==='dup'){e.m[x.m]=1;evSes++;if(e.f)delete e.f[x.m];}
        else if(r==='off')evSkip[x.m]=1; // на сервере миссии ещё нет — до следующего запуска не спрашиваем
        else if(r==='busy'||r==='net')again=true;

      else{evStat(x.a===1?'lvl':'pts',r);

        else if(x.a===1)e.ls=x.v;else e.ps=x.v;}} // ok — принято; off/bad/e… — это значение больше не шлём, следующее (больше) попробуем
    saveFn();if(again)evWait=Date.now()+120000;evPlan(20000);}

  return {v:VER,ok:ok,isOk:OKP,can:can,init:init,ready:ready,merge:merge,fav:fav,home:home,invite:invite,share:share,group:group,open:open,list:list,
    settingsHtml:settingsHtml,bind:bind,showMore:showMore,offer:offer,games:GAMES,
    ntf:ntf,ntfOn:ntfOn,ntfDue:ntfDue,ntfDay:ntfDay,level:level,score:score,mission:mission,missionKnown:missionKnown,evOn:evOn,evFlush:evFlush};
})();

/* ===== QUEST v1 (29.09.2026): «Задания дня» (цепочка) и «Ролики дня» (лесенка) — общий модуль всех игр =====
   Источник — ~/Projects/hobby-analytics/quest/quest.js (правки только там, в игры — quest-sync.sh). Отчёт — 33-ad-quests.md.
   Правила площадок (см. отчёт): ролик — только по кнопке игрока и за заранее названную награду (VK 5.1.5.1 б, Яндекс 4.5–4.5.1);
   ролик — дополнительный бонус, прогресс от него не зависит (Яндекс 4.5.2) → шаги с роликом в цепочке НЕОБЯЗАТЕЛЬНЫ и цепочку не держат;
   задания засчитываются только за игровые действия (VK 4.2.12); реклама — не основной источник ценностей (VK 5.1.5.2 е) →
   сумма «за ролики» за день меньше заработка игрой. Один ролик — одна награда (VK 5.1.5.2 в). Неудачный ролик шаг не сжигает.
   Старый синтаксис: без optional chaining и nullish-оператора, без CSS-свойства inset; флекс без gap (отступы margin).
   Нужны из игры (через QUEST.init): save, ad(ok,fail) — показ ролика за награду игры (её showRewarded), adOk(), grant(награда),
   now() — время сервера (nowMs), modal(html)→контейнер, close(), toast(t). Всё остальное модуль делает сам. */
var QUEST=(function(){
  var DAY=864e5,VER=1,O={},st={},lastErr='';
  function tx(ru,en){return typeof LANG!=='undefined'&&LANG==='en'?en:ru;}
  function nop(){}
  function now(){var t=0;try{t=O.now?O.now():0;}catch(e){}return typeof t==='number'&&t>1.6e12?t:Date.now();}
  function dayKey(t){var d=new Date(t||now());return d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate();}
  function saveFn(){(O.save||nop)();}
  function adOk(){try{return O.adOk?!!O.adOk():true;}catch(e){return false;}}
  function ok(){try{return O.ok?!!O.ok():true;}catch(e){return false;}}

  /* --- настройки по умолчанию; игра переопределяет в QUEST.init(S,{chain:…, ladder:…}) ---
     Цепочка: t — play (сыграна партия/уровень, чем бы ни кончилась), win, stars (3 звезды), daily (задание дня), ad (бонус-ролик);
     n — сколько за ДЕНЬ всего (счётчики дня не теряются, пока шаг ждёт «Забрать»); r — награда (число = монеты игры
     или объект, который игра поймёт в grant). Шаг ad — необязательный: цепочка идёт дальше и без него. Последний шаг — chest. */
  var CHAIN=[{t:'play',n:1,r:10},{t:'ad',r:10},{t:'win',n:2,r:15},{t:'play',n:4,r:20},{t:'ad',r:15},{t:'win',n:5,r:25},{t:'chest',r:60}];
  var LADDER={r:[10,15,25,40,{chest:1,c:60}],gap:120}; // 5 роликов в день, пауза между ними, с; сброс в полночь (now())

  function chain(){return O.chain||CHAIN;}
  function ladder(){return O.ladder||LADDER;}
  function chainOn(){return ok()&&O.chainOn!==false;}
  function ladderOn(){return ok()&&O.ladderOn!==false&&adOk();}

  // состояние дня: d — день, c — счётчики событий, k — забранные шаги цепочки {индекс:1}, n/t — ролики лесенки (сколько, когда последний)
  function fresh(){return {d:dayKey(),c:{},k:{},n:0,t:0,v:VER};}
  function day(){if(!st.q||st.q.d!==dayKey())st.q=fresh();return st.q;}

  /* QUEST.init(S, opt) — один раз при запуске, после загрузки сохранения. opt:
     save, toast, modal(html)→контейнер, close, now, ad(ok,fail), adOk, grant(r, откуда), cur(n)→«25 💰», ok()→модуль вообще включён
     (в настоящем VK без моста — false), cls — классы кнопок, которые Enter не жмёт, chain/ladder — свои шаги/награды,
     chainOn/ladderOn — false выключает механику, onChange() — перерисовать значок на карте,
     note() — HTML-строка под цепочкой (например, «талоны → вещи»), rTxt(r) — подпись награды-объекта,
     log(k) — счётчик для замеров: open, chain, chain-ad, chain-chest, ladder, fail-chain, fail-ladder. */
  function init(S,opt){O=opt||{};if(!S.quest||typeof S.quest!=='object')S.quest={};st=S.quest;day();}
  // облако: из слияния сохранений игры — QUEST.merge(d.quest). Более поздний день — целиком; тот же день — максимумы и объединение
  function merge(d){if(!d||typeof d!=='object'||!d.q||typeof d.q!=='object')return;var a=day(),b=d.q,k;
    if(typeof b.d!=='number'||b.d<a.d)return;if(b.d>a.d){st.q=b;return;}
    if(b.c&&typeof b.c==='object')for(k in b.c)if(typeof b.c[k]==='number'&&b.c[k]>(a.c[k]||0))a.c[k]=b.c[k];
    if(b.k&&typeof b.k==='object')for(k in b.k)if(b.k[k])a.k[k]=1;
    if(typeof b.n==='number'&&b.n>a.n)a.n=b.n;if(typeof b.t==='number'&&b.t>a.t)a.t=b.t;}

  // --- события игры: QUEST.event('play'|'win'|'stars'|'daily', сколько=1). Вернёт true, если появилось что забрать ---
  function event(type,n){if(!chainOn())return false;var q=day(),before=ready();q.c[type]=(q.c[type]||0)+(n||1);saveFn();
    var after=ready();if(after>before){(O.toast||nop)(tx('🎯 Задание выполнено — заберите награду!','🎯 Task complete — collect your reward!'));ch();return true;}
    ch();return false;}
  function ch(){(O.onChange||nop)();}

  // --- цепочка ---
  function isAd(s){return s.t==='ad';}
  function need(s){return s.n||1;}
  function done(i){var s=chain()[i],q=day();if(s.t==='chest'){for(var j=0;j<i;j++)if(!isAd(chain()[j])&&!q.k[j])return false;return true;}
    if(isAd(s))return true;return (q.c[s.t]||0)>=need(s);}
  // можно забрать: выполнен, ещё не забран, все прежние игровые шаги забраны (бонус-ролики не держат цепочку)

let AC=null,muted=false,acUnlocked=false;
// контекст будим при любом состоянии, кроме running: suspended (автозапуск) и interrupted (iOS после звонка/Siri)
function acWake(){if(AC&&AC.state!=='running'){try{const p=AC.resume();p&&p.catch&&p.catch(()=>{});}catch(e){}}}
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&!muted)acWake();return AC;}
// разблокировка на iOS: resume() и пустой буфер прямо в жесте (touchend/click/keydown, не pointerdown); обработчик не снимаем —
// после звонка или сворачивания первое же касание снова оживит звук
function unlockAudio(){if((S.sound===false&&!S.music)||muted)return;const a=ac();if(!a)return;
  if(!acUnlocked){try{const b=a.createBuffer(1,1,22050),src=a.createBufferSource();src.buffer=b;src.connect(a.destination);src.start(0);acUnlocked=true;}catch(e){}}
  musPrime();}
['touchend','click','keydown'].forEach(t=>document.addEventListener(t,unlockAudio,{capture:true,passive:true}));
// атака 6 мс — без щелчка в начале звука
function tone(type,f1,f2,dur,vol,delay){if(muted||S.sound===false)return;const a=ac();if(!a)return;const t=a.currentTime+(delay||0),o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(f2,t+dur);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.006);g.gain.exponentialRampToValueAtTime(.0008,t+dur);o.connect(g).connect(a.destination);o.start(t);o.stop(t+dur+.02);}
const NZ={};function noiseBuf(a,dur){const k=Math.round(dur*100);if(NZ[k]&&NZ[k].sampleRate===a.sampleRate)return NZ[k];const n=a.createBuffer(1,Math.max(1,Math.floor(a.sampleRate*dur)),a.sampleRate),d=n.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length);return NZ[k]=n;}
function noise(dur,vol,freq,type){if(muted||S.sound===false)return;const a=ac();if(!a)return;const t=a.currentTime,s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();f.type=type||'lowpass';f.frequency.value=freq;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.004);s.buffer=noiseBuf(a,dur);s.connect(f).connect(g).connect(a.destination);s.start(t);}
// короткие эффекты синтезом (музыку синтезом не делаем — под трек место в блоке «музыка»)
const SND={
  pick(){tone('sine',520,700,.07,.045);},

  back(){tone('sine',400,300,.08,.035);},
  // «дзынь» кассы: колокольчик из двух обертонов + щелчок ящика
  till(k){const b=880*Math.pow(1.12,Math.min(k||0,4));noise(.04,.08,3000,'highpass');tone('sine',b,b,.5,.07,.02);tone('sine',b*2.76,b*2.76,.35,.025,.02);tone('triangle',b*1.5,b*1.5,.4,.03,.12);},
  coin(){tone('triangle',990,1320,.1,.05);tone('triangle',1320,1760,.12,.045,.08);},

/* ================= музыка: записанные треки =================
   Музыку синтезом не делаем (владелец забраковал). Треки выбрал владелец 27.09: audio/main.m4a (обычные уровни и меню),
   audio/revision.m4a (Ревизия), смена с плавным переходом 1,2 с. В VK аудио на хостинге VK нельзя — нужен свой хостинг или архив без audio/.
   Играем через <audio loop> → createMediaElementSource → GainNode: файл декодируется потоком, а не целиком в память
   (раньше decodeAudioData держал ~150 МБ на двух треках — аудит 14, риск перезагрузки вкладки на слабых телефонах).
   iOS: элемент нужно один раз запустить в жесте — это делает musPrime() из unlockAudio. Пауза при рекламе/сворачивании; S.music — выключатель. */
const MUSF={main:'audio/main.m4a',rev:'audio/revision.m4a'},MUS_VOL=.22,MUS_TV={main:1,rev:.9};
/* main — Green Salon (Yubatake, CC-BY 4.0), rev — Investigations (Kevin MacLeod, CC-BY 4.0): подписи в «Об игре» не удалять */
const MUS={el:{},g:{},ok:{},bad:{},tm:{},cur:null};
function musWant(){const gs=document.getElementById('scr-game');return G&&G.boss&&gs&&gs.classList.contains('on')?'rev':'main';}
function musEl(n){if(MUS.el[n]||MUS.bad[n]||!AC)return MUS.el[n]||null;
  try{const a=new Audio();a.loop=true;a.preload='auto';a.setAttribute('playsinline','');a.addEventListener('error',()=>{MUS.bad[n]=1;});a.src=MUSF[n];
    const src=AC.createMediaElementSource(a),g=AC.createGain();g.gain.value=0;src.connect(g).connect(AC.destination);MUS.el[n]=a;MUS.g[n]=g;}catch(e){MUS.bad[n]=1;}
  return MUS.el[n]||null;}
function musFade(n,to,dur){const g=MUS.g[n];if(!g||!AC)return;try{const t=AC.currentTime;g.gain.cancelScheduledValues(t);g.gain.setValueAtTime(g.gain.value,t);g.gain.linearRampToValueAtTime(to,t+dur);}catch(e){}}
function musPlay(n){const a=musEl(n);if(!a)return;try{const p=a.play();if(p&&p.then)p.then(()=>{MUS.ok[n]=1;},()=>{});else MUS.ok[n]=1;}catch(e){}}
// в жесте (касание/клик): «разрешить» оба элемента на iOS — запустить беззвучно и сразу остановить ненужный
function musPrime(){if(!S.music||!AC)return;for(const n of ['main','rev']){const a=musEl(n);if(!a||MUS.ok[n])continue;
  try{const p=a.play();if(p&&p.then)p.then(()=>{MUS.ok[n]=1;if(MUS.cur!==n)a.pause();},()=>{});}catch(e){}}}
function musTick(){if(!AC)return;const on=!!S.music&&!muted&&!paused&&!document.hidden,n=musWant();
  if(!on){for(const k in MUS.el){if(!MUS.el[k].paused){musFade(k,0,.05);MUS.el[k].pause();}}MUS.cur=null;return;}
  if(AC.state!=='running')return;
  if(MUS.cur===n){const a=MUS.el[n];if(a&&a.paused)musPlay(n);return;}
  const old=MUS.cur;if(old&&MUS.el[old]){musFade(old,0,1.2);const a=MUS.el[old];clearTimeout(MUS.tm[old]);MUS.tm[old]=setTimeout(()=>{if(MUS.cur!==old)a.pause();},1300);}
  if(!musEl(n)){MUS.cur=null;return;}
  MUS.cur=n;clearTimeout(MUS.tm[n]);musPlay(n);musFade(n,MUS_VOL*MUS_TV[n],1.2);}
if(S.music==null)S.music=1;setInterval(musTick,300);

    else if(!G.tutor){const low=G.q.vis.filter(v=>v.pat<=3&&v.max<90),n=low.length;

          toast(L('Терпение на исходе: '+m+' '+pl(m,'ход','хода','ходов','move','moves')+'. Тройка терпение не тратит!','Patience running out: '+m+' '+pl(m,'ход','хода','ходов','move','moves')+'. A triple costs no patience!'),3500);

  showRewarded(()=>{give();},null,()=>give(1));} /* adt: поздний досмотр — монеты всегда (в счёт дневного предела) */
function openCoins(){STAT.screen('coins');const left=adCoinsLeft(),ok=adOk(),buy=PAY.on&&!inLevel(); // покупки — только вне уровня
  modal(`<h2>${L('Монеты','Coins')} 💰</h2><p>${L('У вас '+coinsTxt(S.coins)+'. Монеты дают за каждый уровень — больше за три звезды, за Ревизию и задание дня.','You have '+coinsTxt(S.coins)+'. You earn coins for every level — more for three stars, for an Inspection and for the daily task.')}</p>

/* ================= покупки за деньги: Яндекс Игры (ysdk.payments) и VK Игры (VKWebAppShowOrderBox) — общий модуль (одинаковый в 5 играх) =================
   Товары игры — PAY_ITEMS (выше), id совпадают с id в консоли Яндекса («Инап-покупки») и в hobby-pay/catalog.json (VK).
   Кнопок покупок НЕТ совсем, если платежи недоступны: нет SDK/моста (мак), каталог Яндекса пуст, VK не поддерживает оплату (iOS).
   Постоянные (perm) — флаг S.buy[id], разовый бонус монет — один раз на игрока (S.buyB). Выдача — только после подтверждения площадки.
   Яндекс: цена и значок валюты — только из getCatalog; расходуемые: выдать → сохранить (облако сразу) → consumePurchase;
     незавершённые при запуске довыдаём (getPurchases). Токены выданных — S.payT (и в облаке), сбой consume не даст выдать второй раз.
   VK: на кнопке число голосов (PAY_ITEMS.vk). success:true + order_id → выдать → сохранить → стереть ключ pay_<order_id>.
     Страховка: сервер vk-pay при оплате пишет в хранилище VK игрока pay_<order_id>=id (расходуемые) и own_<id>=1 (постоянные);
     при запуске читаем их и довыдаём. Выданные order_id — S.payV (последние 30); покупка без order_id оставляет метку «x:<id>»,
     которая «съест» первый чужой pay_ этого товара — второй раз не выдастся.
   Мак: ?paytest=1 — имитация Яндекса (localStorage «paytest»), ?vk=1&paytest=1 — имитация VK с сервером (localStorage «paytestvk»),
   ?paytest=fail — отказ. В настоящем VK (vk_app_id) и в Яндексе заглушек нет */
const payObj=x=>!!x&&typeof x==='object'&&!Array.isArray(x);
// статистика покупок: обёртка вокруг PAY.buy снаружи (модуль PAY не меняем); успех — payAfter(id)
let payOk=null;
const PAY={on:false,p:null,v:null,list:[],busy:false,
  test:/[?&]paytest=/.test(location.search),
  // запуск: после SDK/моста и облака. Незавершённые покупки обрабатываем, даже если каталог не пришёл
  async init(){if(PAY.p||PAY.v)return;
    if(PLAT==='vk')return PAY.initVK();
    try{if(ysdk)PAY.p=ysdk.getPayments?await payT(ysdk.getPayments({signed:false})):ysdk.payments;
      else if(PAY.test&&!window.YaGames)PAY.p=payStub();}catch(e){PAY.p=null;}
    if(!PAY.p)return;
    try{await PAY.restore();}catch(e){}
    try{const c=await payT(PAY.p.getCatalog());PAY.list=(Array.isArray(c)?c:[]).filter(x=>x&&PAY_ITEMS[x.id]);}catch(e){PAY.list=[];}
    PAY.on=PAY.list.length>0;if(PAY.on)payAfter();},
  async initVK(){
    if(VK){let ok=false;try{ok=!!(VK.supportsAsync&&await payT(VK.supportsAsync('VKWebAppShowOrderBox'),8000));}catch(e){}if(ok)PAY.v=payVK();}
    else if(PAY.test&&!VK_REAL)PAY.v=payStubVK();
    if(!PAY.v)return;
    try{await PAY.restore();}catch(e){}
    PAY.list=Object.keys(PAY_ITEMS).filter(id=>PAY_ITEMS[id].vk>0).map(id=>({id}));
    PAY.on=PAY.list.length>0;if(PAY.on)payAfter();},
  own(id){return !!(payObj(S.buy)&&S.buy[id]);},
  item(id){return PAY.list.find(x=>x.id===id)||null;},
  give(id){const it=PAY_ITEMS[id];
    if(it.perm){if(!payObj(S.buy))S.buy={};S.buy[id]=1;
      if(it.bonus){if(!payObj(S.buyB))S.buyB={};if(!S.buyB[id]){S.buyB[id]=1;payAdd(it.bonus);}}}
    else payAdd(it.n||0);
    if(it.give)it.give();},
  // при запуске и «Восстановить покупки»: постоянные — выдать, если флага нет; расходуемые — довыдать и отметить
  async restore(){let got=0;
    if(PAY.v)got=await PAY.restoreVK();
    else{const ps=await payT(PAY.p.getPurchases());
      for(const x of (Array.isArray(ps)?ps:[])){const it=x&&PAY_ITEMS[x.productID];if(!it)continue;
        if(it.perm){if(!PAY.own(x.productID)){PAY.give(x.productID);got=1;}}else if(await PAY.credit(x))got=1;}}
    if(got){save();payFlush();payAfter();toast('Покупка зачислена',2600);}
    return got;},
  // VK: ключи own_<id> (постоянные, не стираем) и pay_<order_id> (расходуемые: выдать, сохранить, стереть)
  async restoreVK(){const ks=await PAY.v.keys();let got=0;const done=[];if(!Array.isArray(S.payV))S.payV=[];
    for(const k of ks){const m=/^(own|pay)_(.+)$/.exec(k.key||'');if(!m||!k.value)continue;
      if(m[1]==='own'){const it=PAY_ITEMS[m[2]];if(it&&it.perm&&!PAY.own(m[2])){PAY.give(m[2]);got=1;}continue;}
      const id=String(k.value),it=PAY_ITEMS[id];if(!it)continue;
      if(S.payV.indexOf(m[2])<0){const x=S.payV.indexOf('x:'+id); // покупка без order_id уже выдана — это её заказ
        if(x>=0)S.payV[x]=m[2];else{PAY.give(id);payMark(m[2]);got=1;}}
      done.push(k.key);}
    if(done.length){save();payFlush();for(const k of done)try{await PAY.v.clear(k);}catch(e){}}
    return got;},
  // расходуемая: выдать (если этот токен ещё не выдавали), сохранить в облако и только потом consumePurchase
  async credit(x){const t=String(x.purchaseToken||'');if(!Array.isArray(S.payT))S.payT=[];let fresh=false;
    if(!t||S.payT.indexOf(t)<0){PAY.give(x.productID);if(t)S.payT.push(t);if(S.payT.length>30)S.payT=S.payT.slice(-30);save();payFlush();fresh=true;}
    try{if(t)await payT(PAY.p.consumePurchase(t));}catch(e){}
    return fresh;},
  async buy(id){const it=PAY_ITEMS[id];if(!it||PAY.busy||!PAY.on||!PAY.item(id)||(it.perm&&PAY.own(id)))return;PAY.busy=true;payPause(true);
    try{if(PAY.v){const r=await PAY.v.order(id);if(!r||!r.success)throw new Error('cancel');
        const oid=r.order_id!=null?String(r.order_id):'';if(!Array.isArray(S.payV))S.payV=[];
        if(!oid||S.payV.indexOf(oid)<0){PAY.give(id);payMark(oid||'x:'+id);}
        save();payFlush();if(oid)PAY.v.clear('pay_'+oid).catch(()=>{});}
      else{const x=await PAY.p.purchase({id});
        if(it.perm){PAY.give(id);save();payFlush();}
        else await PAY.credit(x&&x.productID===id?x:{productID:id,purchaseToken:x&&x.purchaseToken});}
      SND.coin();toast(it.done||'Готово! Спасибо за покупку',2800);payAfter(id);}
    catch(e){toast('Покупка не состоялась',2200);}
    finally{PAY.busy=false;payPause(false);}},
  // «Восстановить покупки» (Об игре): заново читаем getPurchases / ключи VK
  async again(){if(!(PAY.p||PAY.v)||PAY.busy)return;PAY.busy=true;let got=0;try{got=await PAY.restore();}catch(e){}PAY.busy=false;if(!got)toast('Покупки проверены — всё на месте',2400);},
  // цена: VK — число голосов (требование VK); Яндекс — из каталога: число + значок валюты (getPriceCurrencyImage), иначе готовая строка price
  price(pr){if(PAY.v){const n=PAY_ITEMS[pr.id].vk,a=n%10,b=n%100;return n+' '+(a===1&&b!==11?'голос':a>=2&&a<=4&&(b<12||b>14)?'голоса':'голосов');}
    let img='';try{img=pr.getPriceCurrencyImage?pr.getPriceCurrencyImage('svg'):'';}catch(e){}
    return img&&pr.priceValue?payEsc(pr.priceValue)+'<img class="pcur" src="'+payEsc(img)+'" alt="">':payEsc(pr.price||pr.priceValue||'');},
  row(pr){const it=PAY_ITEMS[pr.id],own=it.perm&&PAY.own(pr.id),txt='<span>'+it.ic+' '+payEsc(it.name)+'<br><small>'+payEsc(it.desc)+'</small></span>';
    return own?'<div class="'+PAY_ROW+' pown">'+txt+'<i>куплено</i></div>':'<button class="'+PAY_ROW+' pbuy" data-pid="'+payEsc(pr.id)+'">'+txt+'<b>'+PAY.price(pr)+'</b></button>';},
  // список товаров (ids — только эти, по порядку каталога); owned=false — без уже купленных
  html(ids,owned){const L=PAY.list.filter(pr=>(!ids||ids.indexOf(pr.id)>=0)&&(owned!==false||!(PAY_ITEMS[pr.id].perm&&PAY.own(pr.id))));
    return L.length?'<div class="pay"><h3>Покупки</h3>'+L.map(PAY.row).join('')+'</div>':'';},
  bind(root){(root||document).querySelectorAll('.pbuy').forEach(b=>b.onclick=()=>{try{(SND.tap||SND.click)();}catch(e){}PAY.buy(b.dataset.pid);});}
};
// STAT v1.2: buy {i, r:try|ok|cancel|fail, v: голоса из PAY_ITEMS (= hobby-pay/catalog.json)}; отказ игрока (VK код 4, cancel/closed/denied) — cancel, остальные ошибки — fail
function payWhy(e){const d=e&&e.error_data||{},s=String(d.error_reason||d.error_msg||(e&&(e.message||e.code||e.error_type))||e||'');return +d.error_code===4||/cancel|close|denied|reject|user/i.test(s)?'cancel':'fail';}
{const b0=PAY.buy;PAY.buy=function(id){if(PAY.busy||!PAY.on)return b0.call(PAY,id);payOk=null;let why='';const v=(PAY_ITEMS[id]||{}).vk|0,o=PAY.v,p=PAY.p,ov=o&&o.order,pp=p&&p.purchase;
  if(ov)o.order=function(){return Promise.resolve(ov.apply(o,arguments)).then(r=>{if(!r||!r.success)why='cancel';return r;},e=>{why=payWhy(e);throw e;});};
  if(pp)try{p.purchase=function(){return Promise.resolve(pp.apply(p,arguments)).catch(e=>{why=payWhy(e);throw e;});};}catch(e){}
  STAT.ev('buy',{i:id,r:'try',v:v});
  const back=()=>{if(ov)o.order=ov;if(pp)try{p.purchase=pp;}catch(e){}};
  return Promise.resolve(b0.call(PAY,id)).then(()=>{back();STAT.ev('buy',{i:id,r:payOk===id?'ok':why||'fail',v:v});},e=>{back();STAT.ev('buy',{i:id,r:'fail',v:v});throw e;});};}
function payMark(v){if(!Array.isArray(S.payV))S.payV=[];if(S.payV.indexOf(v)<0)S.payV.push(v);if(S.payV.length>30)S.payV=S.payV.slice(-30);}
// слияние облака (d) в сохранение T (по умолчанию S): купленное, выданные бонусы, токены и заказы — объединение (покупка не теряется ни с какой стороны)
function payMerge(d,T){T=T||S;if(!payObj(d)||!payObj(T))return;
  for(const f of ['buy','buyB'])if(payObj(d[f])){if(!payObj(T[f]))T[f]={};for(const k in d[f])if(d[f][k])T[f][k]=1;}
  for(const f of ['payT','payV'])if(Array.isArray(d[f])){if(!Array.isArray(T[f]))T[f]=[];for(const t of d[f])if(typeof t==='string'&&T[f].indexOf(t)<0)T[f].push(t);if(T[f].length>30)T[f]=T[f].slice(-30);}}

(()=>{const d=new URLSearchParams(location.search).get('demo');
  if(!d){if(!(S.levelsDone>0)&&S.unlocked===1&&!Object.keys(S.stars).length)startLevel(0);else openMap();return;}
  window.__demo=true;save=()=>{};
  if(d==='map'){S.unlocked=14;S.stars={0:3,1:3,2:2,3:3,4:1,5:3,6:2,7:3,8:3,9:2,10:3,11:2,12:3};S.album=[0,1,2];openMap();}
  else if(d==='shop'){S.coins=500;S.decor={ficus:1,clock:1,poster:1};openShop();}
  else if(d==='album'){S.album=[0,1,2,3,5,7];openAlbum();}
  else if(d==='full'){S.decor={};DECOR.forEach(x=>S.decor[x.id]=1);S.unlocked=40;startLevel(Math.max(0,Math.min(199,(+new URLSearchParams(location.search).get('n')||12)-1)));}
  else{S.unlocked=Math.max(S.unlocked,+d||1);startLevel(Math.max(0,Math.min(199,(+d||1)-1)));}})();
