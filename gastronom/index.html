<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Гастроном №1</title>
<style>
:root{--ink:#3b2a1a;--card:#fffaf0;--wood:#a0673a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;background:#e9d3b0;overscroll-behavior:none;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--ink);overflow:hidden;touch-action:manipulation}
#app{position:relative;max-width:1100px;height:100%;margin:0 auto;background:linear-gradient(#f6e7cc,#e9cfa6);overflow:hidden}
.screen{position:absolute;top:0;right:0;bottom:0;left:0;display:none;flex-direction:column}
.screen.on{display:flex}
button{font:inherit;color:inherit;border:0;cursor:pointer}
.btn{background:#fff;border-radius:16px;padding:12px 16px;font-weight:700;font-size:17px;box-shadow:0 4px 0 #cdb892,0 6px 14px rgba(0,0,0,.12);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #cdb892}
.btn.accent{background:linear-gradient(#c8401c,#a93312);color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.25);box-shadow:0 4px 0 #74220b,0 6px 14px rgba(0,0,0,.15)}
.btn.accent:active{box-shadow:0 1px 0 #74220b}
.btn.green{background:linear-gradient(#2b8a3e,#237032);color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.25);box-shadow:0 4px 0 #17501f,0 6px 14px rgba(0,0,0,.15)}
.btn[disabled]{opacity:.55;filter:saturate(.3)}
.btn small{opacity:.9;font-size:.8em}
.icon{width:44px;height:44px;border-radius:14px;background:rgba(255,255,255,.88);font-size:21px;font-weight:800;box-shadow:0 3px 0 rgba(0,0,0,.12);flex:none}
/* карта */
.mh{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 14px 6px;padding-top:max(12px,env(safe-area-inset-top))}
.logo{font-size:24px;font-weight:900;color:#7a1f0e;white-space:nowrap;text-shadow:0 1px 0 rgba(255,255,255,.8)}
.pill{background:rgba(255,255,255,.92);border-radius:999px;padding:7px 12px;font-weight:800;font-size:16px;box-shadow:0 3px 0 rgba(0,0,0,.1);white-space:nowrap}
button.pill{position:relative}
button.pill::before{content:"";position:absolute;top:-8px;bottom:-8px;left:-4px;right:-4px}
.hdr-r{display:flex;gap:8px;align-items:center}
.map-scroll{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:8px 14px 24px;-webkit-overflow-scrolling:touch}
.city{margin:18px auto 8px;max-width:420px;text-align:center;border-radius:14px;padding:10px 12px 9px;color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.2),0 8px 18px rgba(0,0,0,.12);position:relative}
.city b{display:block;font-size:13px;letter-spacing:4px;opacity:.95}
.city span{display:block;font-size:24px;font-weight:900;letter-spacing:1px;text-shadow:0 2px 0 rgba(0,0,0,.25)}
.city.locked{filter:grayscale(.8);opacity:.75}
.city small{display:block;font-size:14px;font-weight:700;opacity:.95}
.route{max-width:420px;margin:0 auto}
.node-row{display:flex;align-items:center;gap:12px;height:78px}
.node-row.r{flex-direction:row-reverse;text-align:right}
.node-row.l{padding-left:16%}.node-row.r{padding-right:16%}
.node{position:relative;width:60px;height:60px;border-radius:50%;background:linear-gradient(#ffd36e,#f29a38);color:#3a2206;font-size:23px;font-weight:900;box-shadow:0 5px 0 #b86a17,0 8px 16px rgba(0,0,0,.2);flex:none}
.node.done{background:linear-gradient(#9be29a,#43a857);color:#0f3d1f;box-shadow:0 5px 0 #2b7a3f,0 8px 16px rgba(0,0,0,.2)}
.node.locked{background:linear-gradient(#ddd6cc,#b6ab9c);box-shadow:0 5px 0 #857a6c;cursor:default;font-size:19px}
.node.cur{animation:pulse 1.2s infinite}
.node.boss{background:linear-gradient(#e0473a,#b82b1f);color:#fff;box-shadow:0 5px 0 #7d1d15,0 8px 16px rgba(0,0,0,.2)}
.node.boss.done{background:linear-gradient(#9be29a,#43a857);color:#0f3d1f;box-shadow:0 5px 0 #2b7a3f}
.node .fire{position:absolute;top:-10px;right:-8px;font-size:20px}
.nlabel{background:rgba(60,35,15,.72);border-radius:12px;padding:4px 10px 5px;min-width:0}
.nlabel b{display:block;font-size:16px;color:#fff}
.st{color:#ffd23f;font-size:16px;letter-spacing:1px}
@keyframes pulse{50%{transform:scale(1.08)}}
.mnav{display:flex;gap:10px;padding:10px 14px;padding-bottom:max(14px,env(safe-area-inset-bottom));background:rgba(255,255,255,.4);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.mnav .btn{flex:1;padding:10px 6px;font-size:16px;line-height:1.15}
.mnav .btn small{display:block;font-size:13px}
.btn.locked{opacity:.8;filter:saturate(.4)}
/* уровень */
.gh{display:flex;align-items:center;gap:8px;padding:8px 10px 4px;padding-top:max(8px,env(safe-area-inset-top))}
.gt{flex:1;line-height:1.15;min-width:0}
.gt>div:first-child{font-weight:900;font-size:18px;color:#5a1a0b;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:14px;font-weight:700;color:#7a4a25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gh-r{display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.hearts{font-size:17px;letter-spacing:1px}
.hearts .off{filter:grayscale(1);opacity:.35}
.hearts.warn{animation:pulse .5s 4}
.pill.sm{padding:3px 10px;font-size:15px;box-shadow:0 2px 0 rgba(0,0,0,.1)}
.stage{flex:1;position:relative;min-height:0}
canvas{display:block;touch-action:none}
.tip{position:absolute;left:10px;right:10px;bottom:8px;background:rgba(255,250,236,.96);border-radius:14px;padding:10px 12px;font-weight:700;font-size:16px;line-height:1.3;text-align:center;box-shadow:0 4px 14px rgba(0,0,0,.2);display:none;pointer-events:none;color:#3b2a1a}
.gf{display:flex;gap:8px;padding:6px 10px;padding-bottom:max(10px,env(safe-area-inset-bottom))}
.gf .btn{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;padding:6px 2px;border-radius:14px}
.gf .btn b{font-size:21px}
.gf .btn span{font-size:14px;font-weight:800;white-space:nowrap}
.gf .btn small{font-size:12.5px;font-weight:700;opacity:1;white-space:nowrap}
.gf .btn.off{opacity:.5;filter:saturate(.2)}
/* магазин, альбом */
.grid{flex:1;overflow-y:auto;overscroll-behavior:contain;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;padding:10px 14px 24px;align-content:start}
.gcard{background:var(--card);border-radius:18px;padding:10px;text-align:center;box-shadow:0 4px 0 #d9c7a6}
.gcard canvas{width:100%;height:96px;display:block}
.gcard b{display:block;margin-top:4px;font-size:16px}
.gcard p{margin:4px 0 6px;font-size:14px;color:#5d4a36;font-weight:600;line-height:1.3}
.gcard .btn{width:100%;padding:9px 6px;font-size:16px}
.gcard.lock canvas{filter:brightness(0) opacity(.22)}
.gcard .have{display:block;padding:9px 0;font-weight:800;color:#2b7a3f}
.ghint{padding:4px 16px 0;font-weight:700;color:#6b4a2b;font-size:15px}
/* окна */
.modal,.ad{position:absolute;top:0;right:0;bottom:0;left:0;display:none;align-items:center;justify-content:center;background:rgba(30,20,10,.5);z-index:10;padding:18px}
.modal{overflow-y:auto;overscroll-behavior:contain}
.modal.on,.ad.on{display:flex}
.card{background:var(--card);border-radius:24px;padding:20px 18px 18px;width:100%;max-width:380px;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.3);animation:pop .25s ease-out;margin:auto}
@keyframes pop{from{transform:scale(.85);opacity:0}}
.card h2{margin:0 0 6px;font-size:24px}
.card p{margin:6px 0;color:#5d4a36;font-weight:600;font-size:16px;line-height:1.35}
.big-stars{font-size:44px;color:#ffc312;letter-spacing:4px;margin:6px 0;text-shadow:0 3px 0 #c98a0a}
.big-stars .e{color:#8a8176;text-shadow:none}
.coins-won{font-size:22px;font-weight:900;color:#b77900!important}
.newcard{background:#fff1cf;border-radius:16px;padding:8px;margin:10px 0}
.newcard canvas{width:100%;height:90px;display:block}
.row{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.ad{background:#111;color:#fff;text-align:center;font-size:22px;font-weight:800}
.ad small{font-weight:500;opacity:.7;font-size:14px}
.adt{font-size:54px;margin-top:16px}
.toast{position:absolute;left:50%;bottom:110px;transform:translateX(-50%);background:rgba(20,12,4,.86);color:#fff;padding:10px 14px;border-radius:12px;font-weight:700;font-size:16px;line-height:1.3;opacity:0;transition:opacity .25s;pointer-events:none;z-index:20;text-align:center;width:max-content;max-width:90%}
.toast.on{opacity:1}
.set{display:flex;align-items:center;justify-content:space-between;background:#f3e7d2;border-radius:14px;padding:10px 12px;margin-top:8px;font-weight:700;font-size:16px;text-align:left;color:#3b2a1a;width:100%;min-height:50px}
.set i{font-style:normal;font-weight:800;color:#a93312}.set i.off{color:#6b5e50}
.pay{margin-top:12px;text-align:left}.pay h3{font-size:16px;margin:0 0 2px;color:#3b2a1a}.pay .set span{padding-right:10px}.pay .set small{font-weight:600}
.pbuy b{white-space:nowrap;color:#1f5e2c;font-size:17px}.pcur{width:18px;height:18px;vertical-align:-3px;margin-left:3px}.pown i{color:#237032}
.about{font-size:15px;text-align:left;color:#5d4a36}
.lb{max-height:46vh;overflow:auto;overscroll-behavior:contain;margin-top:8px;text-align:left}.lbr{display:flex;gap:10px;align-items:center;padding:6px 8px;border-radius:10px}.lbr:nth-child(odd){background:rgba(0,0,0,.05)}.lbr.me{background:#ffe7a3}.lbr b{width:28px;text-align:right}.lbr span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.lbr i{font-style:normal;font-weight:800}
.bst-ex{display:flex;align-items:center;gap:12px;text-align:left;background:#f3e7d2;border-radius:14px;padding:10px 12px;margin-top:8px}
.bst-ex b{font-size:28px}
.row2{display:flex;gap:10px}.row2>.btn{flex:1;min-width:0;padding-left:8px;padding-right:8px}
.nw{white-space:nowrap}
/* серия дней (задание дня): 7 клеток в ряд, 7-я — подарок */
.streak{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:10px 0 4px}
.sd{background:#f1e6d0;border-radius:10px;padding:5px 0 4px;font-weight:800;font-size:14px;line-height:1.15;position:relative;color:#6b5e50}
.sd small{display:block;font-size:11px;font-weight:700}
.sd.done{background:#c8efcf;color:#2b7a3f}
.sd.today{background:linear-gradient(#ffd36e,#ff9f43);color:#3a2206;box-shadow:0 3px 0 #c8741d}
.sd.d7{background:#ffe9b8}.sd.d7.today{background:linear-gradient(#ffd36e,#ff7a45)}
.streak-t{font-weight:800!important;color:#8a4b0f!important}
.shopad{display:none;align-items:center;gap:10px;margin:4px 14px 0;padding:8px 10px;background:#fff1cf;border-radius:14px;font-weight:700;font-size:14px;color:#6b4a2b;line-height:1.25}
.shopad.on{display:flex}.shopad .btn{flex:none;padding:9px 12px;font-size:15px}.shopad span{flex:1;min-width:0}
/* окно победы: тётя Валя, цель (ближайший предмет обстановки), грамота; праздник покупки */
.vsay{display:flex;align-items:center;gap:10px;margin:6px 0 2px;text-align:left}.vsay canvas{width:56px;height:56px;border-radius:50%;flex:none;box-shadow:0 2px 0 rgba(0,0,0,.12)}
.vsay span{background:#fff3d6;border-radius:14px;padding:8px 12px;font-weight:700;font-size:15px;line-height:1.3;color:#3b2a1a}
.goal{display:flex;align-items:center;gap:10px;background:#fff1cf;border-radius:14px;padding:8px 10px;margin:10px 0 0;text-align:left}.goal canvas{width:64px;height:48px;flex:none;border-radius:8px}
.goal>div{flex:1;min-width:0}.goal b{display:block;font-size:15px;line-height:1.25}.bar{height:10px;background:#e6d2ab;border-radius:6px;margin-top:6px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#f4b53f,#2b8a3e);border-radius:6px}
.chest{background:#fff1cf;border-radius:14px;padding:8px 10px;margin:8px 0;font-weight:800;color:#8a4b0f;font-size:15px;line-height:1.3}
.cel{position:relative;margin:8px 0 4px;border-radius:16px;overflow:hidden;box-shadow:inset 0 0 0 2px rgba(0,0,0,.06)}.cel canvas{display:block;width:100%;height:210px}
.btn.glow{animation:glow 1.6s infinite}@keyframes glow{50%{box-shadow:0 4px 0 #cdb892,0 0 0 4px rgba(43,138,62,.45),0 6px 14px rgba(0,0,0,.12)}}
.city.new{animation:cityOn 1.4s ease-out}@keyframes cityOn{0%{transform:scale(.7);filter:brightness(2.2);opacity:0}60%{transform:scale(1.06);filter:brightness(1.3)}}
/* узкие, низкие экраны, ПК */
@media (max-height:700px){.big-stars{font-size:36px;margin:2px 0}.vsay canvas{width:44px;height:44px}.card h2{font-size:22px}.goal{margin-top:6px}.chest{margin:6px 0}}
@media (max-width:340px){.gt>div:first-child{font-size:16.5px}.sub{font-size:13.5px}}
@media (max-width:380px){.mh{padding-left:10px;padding-right:10px}.logo{font-size:19px}.hdr-r{gap:5px}.pill{padding:6px 9px;font-size:15px}.gf{gap:6px;padding-left:6px;padding-right:6px}.gf .btn span{font-size:13px}.gf .btn small{font-size:11.5px}}
@media (max-height:520px){.gh{padding-top:4px;padding-bottom:0}.gt>div:first-child{font-size:16px}.gf{padding-top:3px;padding-bottom:5px}.gf .btn{flex-direction:row;gap:6px;padding:4px 6px}.gf .btn b{font-size:18px}.gf .btn span{display:none}.mnav{padding-top:6px;padding-bottom:6px}.node-row{height:70px}.tip{font-size:15px;padding:7px 10px}}
@media (min-width:900px) and (min-height:600px){#app{box-shadow:0 0 50px rgba(0,0,0,.18)}}
/* меньше движения: системная настройка или «спокойный режим» */
@media (prefers-reduced-motion:reduce){.node.cur,.card,.hearts.warn,.btn.glow,.city.new{animation:none}}
body.calm .node.cur,body.calm .card,body.calm .hearts.warn,body.calm .btn.glow,body.calm .city.new{animation:none}
/* вырез экрана слева/справа (iPhone в альбомной ориентации) */
.mh,.mnav,.gh,.gf{padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px))}
/* запасные отступы для старых браузеров без gap во flex (≈ те же, где нет inset) */
@supports not (inset:0){.vsay>*+*,.goal>*+*{margin-left:10px}.mnav>*+*,.gf>*+*,.gh>*+*,.hdr-r>*+*,.mh>*+*,.bst-ex>*+*,.lbr>*+*,.row2>*+*,.shopad>*+*{margin-left:8px}.streak>*{margin:2px}.row>*+*{margin-top:10px}.node-row>*+*{margin-left:12px}.node-row.r>*+*{margin-left:0;margin-right:12px}.gh-r>*+*{margin-top:3px}.grid>*{margin:6px}}
</style>
<script>/* iPhone: звук в бесшумном режиме. Просим сеанс «воспроизведение» (Safari 17+) и держим тихий <audio> — иначе переключатель «без звука» глушит Web Audio целиком. */

</head>
<body>
<div id="app">
  <section id="scr-map" class="screen on">
    <header class="mh"><div class="logo">🛒 Гастроном №1</div><div class="hdr-r"><button class="icon" id="btnSet" aria-label="Настройки">⚙️</button><div class="pill">⭐ <span id="totStars">0</span></div><button class="pill" id="mCoins">💰 <span id="coinCnt">0</span></button></div></header>
    <div class="map-scroll" id="mapScroll"><div id="mapList"></div></div>
    <nav class="mnav"><button id="btnDaily" class="btn accent">📅 Задание дня</button><button id="btnShop" class="btn">🏪 Магазин</button><button id="btnAlbum" class="btn">⭐ Дефицит</button></nav>
  </section>

  <section id="scr-game" class="screen">
    <header class="gh"><button class="icon" id="gBack" aria-label="На карту">←</button><div class="gt"><div id="gLevel">Уровень 1</div><div id="gCity" class="sub">Москва</div></div><div class="gh-r"><div id="gHearts" class="hearts"></div><button class="pill sm" id="gCoins">💰 0</button></div><button class="icon" id="gSet" aria-label="Настройки">⚙️</button></header>
    <div class="stage" id="stage"><canvas id="cv"></canvas><div id="tip" class="tip"></div></div>
    <footer class="gf"><button class="btn" id="bUndo"><b>↶</b><span>Отменить</span><small id="pUndo"></small></button><button class="btn" id="bHint"><b>💡</b><span>Подсказка</span><small id="pHint"></small></button><button class="btn" id="bMix"><b>🔀</b><span>Смешать</span><small id="pMix"></small></button><button class="btn" id="bTable"><b>➕</b><span>Столик</span><small id="pTable"></small></button></footer>
  </section>

  <section id="scr-shop" class="screen">
    <header class="gh"><button class="icon" id="shopBack" aria-label="Назад">←</button><div class="gt"><div>Обстановка магазина</div><div class="sub">Всё купленное видно в зале</div></div><button class="pill sm" id="shopCoins" aria-label="Монеты">💰 0</button></header>
    <div class="shopad" id="shopAd"></div>
    <div class="grid" id="shopGrid"></div>
  </section>

  <section id="scr-album" class="screen">
    <header class="gh"><button class="icon" id="albBack" aria-label="Назад">←</button><div class="gt"><div>Коллекция «Дефицит»</div><div class="sub" id="albSub">0 из 10</div></div></header>
    <div class="ghint">Редкие товары прячутся в коробках «Дефицит». Соберите три одинаковых — и карточка ваша.</div>
    <div class="grid" id="albGrid"></div>
  </section>

  <div id="modal" class="modal"><div class="card" id="mcard"></div></div>
  <div id="ad" class="ad"><div>📺 Реклама<br><small>скоро продолжим</small><div id="adT" class="adt">3</div></div></div>
  <div id="toast" class="toast"></div>
</div>

<script>
'use strict';
/*LOGIC*/
/* ================= правила витрины, генератор, решатель, очередь =================

      while((!plan||!plan.length)&&back.length){const b=back.pop();st=b[0];q=b[1];undos++;plan=solveFast(lv,st,R2,null);}

let cloudT=0,cloudReady=false,cloudBusy=false,cloudTry=0,cloudBroken=0;
function save(){S.ts=Date.now();try{localStorage.setItem(SKEY,JSON.stringify(S));}catch(e){}

// JSON с упорядоченными ключами — чтобы сравнивать сохранения без учёта порядка и ts
function canon(o){return JSON.stringify(o,(k,v)=>v&&typeof v==='object'&&!Array.isArray(v)?Object.keys(v).sort().reduce((r,x)=>(r[x]=v[x],r),{}):v);}
const noTs=o=>Object.assign({},o,{ts:0});
// прочитать облако (при запуске, после входа в аккаунт или повтор после сбоя), слить с локальным и дописать в облако, чего там не хватает.
// Битое облако VK (куски не сошлись) не считаем пустым: не пишем поверх, читаем ещё раз; после 3 неудач — берём локальное
async function cloudLoad(force){if(cloudBusy||cloudReady||!(YP||VK)||(!force&&Date.now()-cloudTry<10000))return;cloudBusy=true;cloudTry=Date.now();
  try{const d=YP?await YP.getData():await vkLoadCloud();
    const before=canon(noTs(S));mergeSave(d);fixSave();cloudReady=true;cloudBroken=0;
    if(d&&typeof d.ts==='number')BOOT_TS=Math.max(BOOT_TS,d.ts);BOOT_COINS=S.coins;
    const ch=canon(noTs(S))!==before;
    if(ch){try{localStorage.setItem(SKEY,JSON.stringify(S));}catch(e){}}
    if(!d||canon(noTs(d))!==canon(noTs(S))){save();cloudFlush();}
    if(ch&&typeof onCloud==='function')onCloud();
  }catch(e){if(e&&e.broken&&++cloudBroken>=3){cloudReady=true;BOOT_COINS=S.coins;save();}}finally{cloudBusy=false;}}

   Музыку синтезом не делаем (владелец забраковал). Треки выбрал владелец 27.09: audio/main.m4a (обычные уровни и меню),

  try{const p=a.play();if(p&&p.then)p.then(()=>{MUS.ok[n]=1;if(MUS.cur!==n)a.pause();},()=>{});}catch(e){}}}

function layout(){if(!G)return;const r=stage.getBoundingClientRect();if(r.width<60||r.height<60)return;W=r.width;H=r.height;dpr=Math.min(2,window.devicePixelRatio||1);

function dropAt(x,y,except){let i=hitUnit(x,y,U*.3);if(i<0||i===except){let bd=1e9;G.units.forEach((u,j)=>{if(j===except)return;const dx=Math.max(u.x-x,0,x-u.x-u.w),dy=Math.max(u.y-y,0,y-u.y-u.h),d=Math.hypot(dx,dy);if(d<bd){bd=d;i=j;}});if(bd>U*.6)return null;}

    if(c&&!G.hide[h.i+':'+h.k]){if(movable(G.st,c)){G.drag={i:h.i,k:h.k,c,x:p.x,y:p.y,sx:p.x,sy:p.y,moved:false,id:e.pointerId};try{cv.setPointerCapture(e.pointerId);}catch(er){}SND.pick();kick();return;}

      const n=iceOf(c)-G.st.cl;toast('❄️ Во льду: оттает после '+n+' '+plural(n,'тройки','троек','троек'));SND.ice();return;}}});

  if(d&&d.id===e.pointerId){G.drag=null;
    if(d.moved){delete G.hide[d.i+':'+d.k];const t=cancel?null:dropAt(p.x,p.y,d.i);
      if(!(t&&tryMove(d.i,d.k,t.i,t.k,{x:p.x,y:p.y}))){G.hide[d.i+':'+d.k]=1;G.fly.push({c:d.c,x0:p.x,y0:p.y,i:d.i,s:d.k,t:0,dur:.15});SND.back();}}
    else if(!cancel){if(G.sel&&G.sel.i===d.i&&G.sel.k===d.k)G.sel=null;else{G.sel={i:d.i,k:d.k};if(!S.tips.tap){S.tips.tap=1;toast('Теперь нажмите на свободное место на другой полке');}}}
    kick();return;}
  if(cancel||G.over||modalOn||!G.sel)return;const t=dropAt(p.x,p.y,G.sel.i);
  if(t&&tryMove(G.sel.i,G.sel.k,t.i,t.k,null))return;

function update(dt){G.t+=dt;tk+=dt;
  for(const f of G.fly)f.t+=dt;G.fly=G.fly.filter(f=>{if(f.t>=f.dur){delete G.hide[f.i+':'+f.s];return false;}return true;});
  for(const p of G.pops){p.t+=dt;if(p.t>=0&&!p.fx){p.fx=1;const u=G.units[p.i];for(let k=0;k<(calm()?6:16);k++)G.fx.push({x:u.x+u.w/2+(Math.random()-.5)*u.w*.8,y:u.pt-U*.5,vx:(Math.random()-.5)*U*4,vy:-Math.random()*U*4,t:0,life:.7,col:['#ffd23f','#fff','#ff9f43','#7bed9f'][k%4],s:U*.06});}}
  G.pops=G.pops.filter(p=>p.t<.75);
  for(const k in G.adv){G.adv[k].t+=dt;if(G.adv[k].t>.35)delete G.adv[k];}
  for(const o of G.opens)o.t+=dt;G.opens=G.opens.filter(o=>o.t<.6);
  for(const f of G.fx){f.t+=dt;f.x+=f.vx*dt;f.y+=f.vy*dt;f.vy+=U*9*dt;}G.fx=G.fx.filter(f=>f.t<f.life);
  if(G.speech){G.speech.t+=dt;if(G.speech.t>G.speech.life)G.speech=null;}
  if(G.valyaTalk>0)G.valyaTalk-=dt;if(G.hint)G.hint.t+=dt;
  for(const c of G.queue){if(c.talk>0)c.talk-=dt;if(c.shake>0)c.shake-=dt;
    if(c.st==='in'||c.st==='wait'){const tx=custX(c.slot);c.x+=(tx-c.x)*Math.min(1,dt*6);if(Math.abs(tx-c.x)<1){c.x=tx;c.st='wait';}}
    else{c.tt+=dt;c.x+=HALL.cw*1.6*dt*(c.tt>.35?1:0);}}
  G.queue=G.queue.filter(c=>!(c.st==='happy'||c.st==='angry')||c.tt<1.1);}
function busy(){return G&&(G.fly.length||G.pops.length||G.fx.length||G.opens.length||G.drag||Object.keys(G.adv).length||G.queue.some(c=>c.st!=='wait'))}
function drawCell(c,x,by,sc,dim){const sp=(c&BOXF)?BOXS:(dim?SPRD:SPR)[tOf(c)];if(!sp)return;const w=sp.w*sc,h=sp.h*sc;ctx.drawImage(sp.c,x-w/2,by-h+U*.03*sc,w,h);

    ctx.fillStyle='rgba(0,0,0,.18)';ell(ctx,d.x,d.y+U*.12,U*.36,U*.09);ctx.fill();drawCell(d.c,d.x,d.y+U*.1,1.12,false);}
  if(G.tutor)drawTutor();

function drawTutor(){const k=(G.t%2.2)/1.6;if(k>1)return;const x0=slotX(1,1),y0=G.units[1].pt-U*.45,x1=slotX(0,2),y1=G.units[0].pt-U*.45,e=ease(k),x=x0+(x1-x0)*e,y=y0+(y1-y0)*e;
  ctx.globalAlpha=Math.min(1,k*5,(1-k)*5);ctx.font=`${Math.round(U*.7)}px sans-serif`;ctx.textAlign='center';ctx.textBaseline='top';ctx.fillText('👆',x+U*.1,y);ctx.globalAlpha=1;}
function drawSpeech(){const s=G.speech;if(!s)return;const a=Math.min(1,s.t*6,(s.life-s.t)*3);if(a<=0)return;
  const fs=Math.round(Math.max(15,Math.min(18,W*.045))),font=`800 ${fs}px -apple-system,Segoe UI,Roboto,sans-serif`;ctx.font=font;
  const T=HALL.tall,vr=HALL.vX+HALL.vS*.3; // высокий зал: реплика Вали — справа от её головы, на прилавке; покупателя — над облачками
  const maxW=T?(s.who==='valya'?Math.max(120,HALL.w-vr-30):Math.min(HALL.w-24,300)):Math.min(W*.8,340),words=s.text.split(' '),lines=[];let ln='';for(const w of words){const t=ln?ln+' '+w:w;if(ctx.measureText(t).width>maxW&&ln){lines.push(ln);ln=w;}else ln=t;}lines.push(ln);

/* ================= реклама (SDK площадки; без него — заглушка только на маке) ================= */
function stubAd(cb){const ad=$('ad'),tEl=$('adT');ad.classList.add('on');adOpen();let n=3;tEl.textContent=n;const it=setInterval(()=>{n--;tEl.textContent=n;if(n<=0){clearInterval(it);ad.classList.remove('on');adClose();cb();}},600);}

function adClose(){setPause('ad',false);if(G&&!G.over&&!modalOn&&$('scr-game').classList.contains('on'))YG.start();}
const AD_FAIL='Реклама сейчас недоступна — загляните чуть позже',VK_REAL=/[?&]vk_app_id=/.test(location.search);
let lastAdT=Date.now(); // межэкранная — не чаще раза в 60 с (и не в первую минуту после запуска)
// за награду — по желанию игрока; награда только после успешного просмотра; пока ролик идёт, повторные нажатия не запускают второй
let adBusy=false;

  if(adBusy)return;adBusy=true;clearTimeout(showRewarded._t);showRewarded._t=setTimeout(()=>{adBusy=false;},90000);
  const cb=()=>{adBusy=false;lastAdT=Date.now();cb0();},onFail=()=>{adBusy=false;onFail0&&onFail0();};

  if(VK){adOpen();vkSend('VKWebAppShowNativeAds',{ad_format:'reward'},60000)
      .then(r=>{adClose();if(r&&r.result)cb();else{toast(AD_FAIL);onFail();}})
      .catch(()=>{adClose();toast(AD_FAIL);onFail();})
      .finally(()=>vkSend('VKWebAppCheckNativeAds',{ad_format:'reward'}).catch(()=>{}));return;}

    onError:()=>{adClose();toast(AD_FAIL);onFail();}}});

// межэкранная — не чаще раза в AD_GAP после ЛЮБОЙ рекламы (и за награду тоже) и после запуска

/* ================= монеты ================= */
function plural(n,a,b,c){const m=n%10,h=n%100;return m===1&&h!==11?a:m>=2&&m<=4&&(h<12||h>14)?b:c;}
const coinsTxt=n=>n+' '+plural(n,'монета','монеты','монет');
function updCoins(){for(const id of['coinCnt','gCoins','shopCoins']){const e=$(id);if(e)e.textContent=id==='coinCnt'?S.coins:'💰 '+S.coins;}
  // монет не хватает — на кнопке сразу видно, что можно за рекламу
  for(const [id,k] of [['pUndo','undo'],['pHint','hint'],['pMix','mix'],['pTable','table']]){const e=$(id);if(e)e.textContent=freeUndo(k)?'бесплатно':S.coins>=PRICE[k]||!adOk()?PRICE[k]+' 💰':'📺 за рекламу';}
  if(G)$('bTable').classList.toggle('off',G.table);updUndo();}
function setCoins(n){S.coins=Math.max(0,n);save();updCoins();}
function spend(kind,then){const pr=PRICE[kind];
  if(S.coins>=pr){setCoins(S.coins-pr);SND.coin();then();return;}
  modal(`<h2>Не хватает монет</h2><p>Нужно ${coinsTxt(pr)}, а у вас ${coinsTxt(S.coins)}.</p><div class="row">${adOk()?`<button class="btn accent rw" id="mAdFree">📺 ${BNAME[kind]} за рекламу</button>`:''}${adOk()&&adCoinsLeft()?'<button class="btn" id="mShopC">💰 Получить монеты</button>':''}<button class="btn" id="mCancel">Отмена</button></div>`);
  const a=$('mAdFree'),c=$('mShopC');if(a)a.onclick=()=>{hideModal();showRewarded(then);};if(c)c.onclick=()=>{hideModal();openCoins();};$('mCancel').onclick=hideModal;}
// +AD_COINS за рекламу — не больше AD_DAY раз в день (счётчик S.adc по дате площадки)
function adCoinsLeft(){const t=dayKey(0);return Math.max(0,AD_DAY-(isObj(S.adc)&&S.adc.d===t?S.adc.n||0:0));}
function watchCoins(done){if(!adCoinsLeft())return;
  showRewarded(()=>{const t=dayKey(0);if(!isObj(S.adc)||S.adc.d!==t)S.adc={d:t,n:0};S.adc.n=(S.adc.n||0)+1;setCoins(S.coins+AD_COINS);SND.coin();toast('+'+AD_COINS+' 💰');if(done)done();});}
function openCoins(){const left=adCoinsLeft(),ok=adOk(),buy=PAY.on&&!inLevel(); // покупки — только вне уровня
  modal(`<h2>Монеты 💰</h2><p>У вас ${coinsTxt(S.coins)}. Монеты дают за каждый уровень — больше за три звезды, за Ревизию и задание дня.</p>
    ${ok&&!left?'<p><small>Монеты за рекламу на сегодня закончились — завтра можно снова.</small></p>':''}
    ${buy?PAY.html():''}
    <div class="row">${ok&&left?`<button class="btn accent rw" id="mAdCoins">📺 +${AD_COINS} 💰 за рекламу</button>`:''}<button class="btn" id="mCancel">Закрыть</button></div>`);
  if(buy){PAY.bind($('mcard'));PAY.re=openCoins;}
  const a=$('mAdCoins');if(a)a.onclick=()=>{hideModal();watchCoins();};$('mCancel').onclick=hideModal;}
function inLevel(){return !!(G&&!G.over&&$('scr-game').classList.contains('on'));}

/* ---- товары «Гастронома» (каталог — hobby-analytics/13-purchases-catalog.md, п. 4.5). Бустеры не дорожают, «пропуск уровня» не продаём ----
   vk — цена в голосах, обязана совпадать с ~/Projects/hobby-pay/catalog.json (сервер vk-pay отдаёт её VK) */
const PAY_ROW='set';
const PAY_ITEMS={
  no_ads:{perm:1,bonus:150,vk:20,ic:'🚫',name:'Без рекламы между уровнями',desc:'Навсегда, и сразу +150 💰. Ролики за награду остаются — по желанию'},
  coins_s:{n:250,vk:5,ic:'💰',name:'Выручка: 250 💰',desc:'На обстановку магазина и помощь на полках',done:'+250 💰 — спасибо!'},
  coins_l:{n:800,vk:14,ic:'💰',name:'Касса: 800 💰',desc:'Выгоднее выручки',done:'+800 💰 — спасибо!'}
};
const PAY_TEST={no_ads:149,coins_s:39,coins_l:99}; // цены только для ?paytest=1; настоящие — в консоли
function payAdd(n){S.coins+=n;}
function payFlush(){cloudFlush();}
function payPause(on){setPause('pay',on);}
// после покупки/восстановления: монеты на экране и перерисовать окно, где были кнопки (PAY.re — его функция)
function payAfter(){updCoins();if(modalOn&&PAY.re)PAY.re();else if($('scr-shop').classList.contains('on'))openShop();}
/* ================= покупки за деньги: Яндекс Игры (ysdk.payments) и VK Игры (VKWebAppShowOrderBox) — общий модуль (одинаковый в 5 играх) =================
   Товары игры — PAY_ITEMS (выше), id совпадают с id в консоли Яндекса («Инап-покупки») и в hobby-pay/catalog.json (VK).
   Кнопок покупок НЕТ совсем, если платежи недоступны: нет SDK/моста (мак), каталог Яндекса пуст, VK не поддерживает оплату (iOS).
   Постоянные (perm) — флаг S.buy[id], разовый бонус монет — один раз на игрока (S.buyB). Выдача — только после подтверждения площадки.
   Яндекс: цена и значок валюты — только из getCatalog; расходуемые: выдать → сохранить (облако сразу) → consumePurchase;
     незавершённые при запуске довыдаём (getPurchases). Токены выданных — S.payT (и в облаке), сбой consume не даст выдать второй раз.
   VK: на кнопке число голосов (PAY_ITEMS.vk). success:true + order_id → выдать → сохранить → стереть ключ pay_<order_id>.
     Страховка: сервер vk-pay при оплате пишет в хранилище VK игрока pay_<order_id>=id (расходуемые) и own_<id>=1 (постоянные);
     при запуске читаем их и довыдаём. Выданные order_id — S.payV (последние 30); покупка без order_id оставляет метку «x:<id>»,
     которая «съест» первый чужой pay_ этого товара — второй раз не выдастся.
   Мак: ?paytest=1 — имитация Яндекса (localStorage «paytest»), ?vk=1&paytest=1 — имитация VK с сервером (localStorage «paytestvk»),
   ?paytest=fail — отказ. В настоящем VK (vk_app_id) и в Яндексе заглушек нет */
const payObj=x=>!!x&&typeof x==='object'&&!Array.isArray(x);
const PAY={on:false,p:null,v:null,list:[],busy:false,
  test:/[?&]paytest=/.test(location.search),
  // запуск: после SDK/моста и облака. Незавершённые покупки обрабатываем, даже если каталог не пришёл
  async init(){if(PAY.p||PAY.v)return;
    if(PLAT==='vk')return PAY.initVK();
    try{if(ysdk)PAY.p=ysdk.getPayments?await payT(ysdk.getPayments({signed:false})):ysdk.payments;
      else if(PAY.test&&!window.YaGames)PAY.p=payStub();}catch(e){PAY.p=null;}
    if(!PAY.p)return;
    try{await PAY.restore();}catch(e){}
    try{const c=await payT(PAY.p.getCatalog());PAY.list=(Array.isArray(c)?c:[]).filter(x=>x&&PAY_ITEMS[x.id]);}catch(e){PAY.list=[];}
    PAY.on=PAY.list.length>0;if(PAY.on)payAfter();},
  async initVK(){
    if(VK){let ok=false;try{ok=!!(VK.supportsAsync&&await payT(VK.supportsAsync('VKWebAppShowOrderBox'),8000));}catch(e){}if(ok)PAY.v=payVK();}
    else if(PAY.test&&!VK_REAL)PAY.v=payStubVK();
    if(!PAY.v)return;
    try{await PAY.restore();}catch(e){}
    PAY.list=Object.keys(PAY_ITEMS).filter(id=>PAY_ITEMS[id].vk>0).map(id=>({id}));
    PAY.on=PAY.list.length>0;if(PAY.on)payAfter();},
  own(id){return !!(payObj(S.buy)&&S.buy[id]);},
  item(id){return PAY.list.find(x=>x.id===id)||null;},
  give(id){const it=PAY_ITEMS[id];
    if(it.perm){if(!payObj(S.buy))S.buy={};S.buy[id]=1;
      if(it.bonus){if(!payObj(S.buyB))S.buyB={};if(!S.buyB[id]){S.buyB[id]=1;payAdd(it.bonus);}}}
    else payAdd(it.n||0);
    if(it.give)it.give();},
  // при запуске и «Восстановить покупки»: постоянные — выдать, если флага нет; расходуемые — довыдать и отметить
  async restore(){let got=0;
    if(PAY.v)got=await PAY.restoreVK();
    else{const ps=await payT(PAY.p.getPurchases());
      for(const x of (Array.isArray(ps)?ps:[])){const it=x&&PAY_ITEMS[x.productID];if(!it)continue;
        if(it.perm){if(!PAY.own(x.productID)){PAY.give(x.productID);got=1;}}else if(await PAY.credit(x))got=1;}}
    if(got){save();payFlush();payAfter();toast('Покупка зачислена',2600);}
    return got;},
  // VK: ключи own_<id> (постоянные, не стираем) и pay_<order_id> (расходуемые: выдать, сохранить, стереть)
  async restoreVK(){const ks=await PAY.v.keys();let got=0;const done=[];if(!Array.isArray(S.payV))S.payV=[];
    for(const k of ks){const m=/^(own|pay)_(.+)$/.exec(k.key||'');if(!m||!k.value)continue;
      if(m[1]==='own'){const it=PAY_ITEMS[m[2]];if(it&&it.perm&&!PAY.own(m[2])){PAY.give(m[2]);got=1;}continue;}
      const id=String(k.value),it=PAY_ITEMS[id];if(!it)continue;
      if(S.payV.indexOf(m[2])<0){const x=S.payV.indexOf('x:'+id); // покупка без order_id уже выдана — это её заказ
        if(x>=0)S.payV[x]=m[2];else{PAY.give(id);payMark(m[2]);got=1;}}
      done.push(k.key);}
    if(done.length){save();payFlush();for(const k of done)try{await PAY.v.clear(k);}catch(e){}}
    return got;},
  // расходуемая: выдать (если этот токен ещё не выдавали), сохранить в облако и только потом consumePurchase
  async credit(x){const t=String(x.purchaseToken||'');if(!Array.isArray(S.payT))S.payT=[];let fresh=false;
    if(!t||S.payT.indexOf(t)<0){PAY.give(x.productID);if(t)S.payT.push(t);if(S.payT.length>30)S.payT=S.payT.slice(-30);save();payFlush();fresh=true;}
    try{if(t)await payT(PAY.p.consumePurchase(t));}catch(e){}
    return fresh;},
  async buy(id){const it=PAY_ITEMS[id];if(!it||PAY.busy||!PAY.on||!PAY.item(id)||(it.perm&&PAY.own(id)))return;PAY.busy=true;payPause(true);
    try{if(PAY.v){const r=await PAY.v.order(id);if(!r||!r.success)throw new Error('cancel');
        const oid=r.order_id!=null?String(r.order_id):'';if(!Array.isArray(S.payV))S.payV=[];
        if(!oid||S.payV.indexOf(oid)<0){PAY.give(id);payMark(oid||'x:'+id);}
        save();payFlush();if(oid)PAY.v.clear('pay_'+oid).catch(()=>{});}
      else{const x=await PAY.p.purchase({id});
        if(it.perm){PAY.give(id);save();payFlush();}
        else await PAY.credit(x&&x.productID===id?x:{productID:id,purchaseToken:x&&x.purchaseToken});}
      SND.coin();toast(it.done||'Готово! Спасибо за покупку',2800);payAfter(id);}
    catch(e){toast('Покупка не состоялась',2200);}
    finally{PAY.busy=false;payPause(false);}},
  // «Восстановить покупки» (Об игре): заново читаем getPurchases / ключи VK
  async again(){if(!(PAY.p||PAY.v)||PAY.busy)return;PAY.busy=true;let got=0;try{got=await PAY.restore();}catch(e){}PAY.busy=false;if(!got)toast('Покупки проверены — всё на месте',2400);},
  // цена: VK — число голосов (требование VK); Яндекс — из каталога: число + значок валюты (getPriceCurrencyImage), иначе готовая строка price
  price(pr){if(PAY.v){const n=PAY_ITEMS[pr.id].vk,a=n%10,b=n%100;return n+' '+(a===1&&b!==11?'голос':a>=2&&a<=4&&(b<12||b>14)?'голоса':'голосов');}
    let img='';try{img=pr.getPriceCurrencyImage?pr.getPriceCurrencyImage('svg'):'';}catch(e){}
    return img&&pr.priceValue?payEsc(pr.priceValue)+'<img class="pcur" src="'+payEsc(img)+'" alt="">':payEsc(pr.price||pr.priceValue||'');},
  row(pr){const it=PAY_ITEMS[pr.id],own=it.perm&&PAY.own(pr.id),txt='<span>'+it.ic+' '+payEsc(it.name)+'<br><small>'+payEsc(it.desc)+'</small></span>';
    return own?'<div class="'+PAY_ROW+' pown">'+txt+'<i>куплено</i></div>':'<button class="'+PAY_ROW+' pbuy" data-pid="'+payEsc(pr.id)+'">'+txt+'<b>'+PAY.price(pr)+'</b></button>';},
  // список товаров (ids — только эти, по порядку каталога); owned=false — без уже купленных
  html(ids,owned){const L=PAY.list.filter(pr=>(!ids||ids.indexOf(pr.id)>=0)&&(owned!==false||!(PAY_ITEMS[pr.id].perm&&PAY.own(pr.id))));
    return L.length?'<div class="pay"><h3>Покупки</h3>'+L.map(PAY.row).join('')+'</div>':'';},
  bind(root){(root||document).querySelectorAll('.pbuy').forEach(b=>b.onclick=()=>{try{(SND.tap||SND.click)();}catch(e){}PAY.buy(b.dataset.pid);});}
};
function payMark(v){if(!Array.isArray(S.payV))S.payV=[];if(S.payV.indexOf(v)<0)S.payV.push(v);if(S.payV.length>30)S.payV=S.payV.slice(-30);}
// слияние облака (d) в сохранение T (по умолчанию S): купленное, выданные бонусы, токены и заказы — объединение (покупка не теряется ни с какой стороны)
function payMerge(d,T){T=T||S;if(!payObj(d)||!payObj(T))return;
  for(const f of ['buy','buyB'])if(payObj(d[f])){if(!payObj(T[f]))T[f]={};for(const k in d[f])if(d[f][k])T[f][k]=1;}
  for(const f of ['payT','payV'])if(Array.isArray(d[f])){if(!Array.isArray(T[f]))T[f]=[];for(const t of d[f])if(typeof t==='string'&&T[f].indexOf(t)<0)T[f].push(t);if(T[f].length>30)T[f]=T[f].slice(-30);}}
function payT(p,ms){return Promise.race([p,new Promise((_,no)=>setTimeout(()=>no(new Error('timeout')),ms||15000))]);}
function payEsc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]);}
// VK: окно оплаты (игрок может думать долго — ждём до 10 мин) и ключи хранилища, которые пишет сервер vk-pay
function payVK(){return {order:id=>vkSend('VKWebAppShowOrderBox',{type:'item',item:id},600000),
  keys:async()=>{const r=await vkSend('VKWebAppStorageGetKeys',{count:1000,offset:0},8000),ks=((r&&r.keys)||[]).filter(k=>/^(own|pay)_/.test(k));
    if(!ks.length)return [];const g=await vkSend('VKWebAppStorageGet',{keys:ks},8000);return (g&&g.keys)||[];},
  clear:k=>vkSend('VKWebAppStorageSet',{key:k,value:''},8000)};}
// имитация платежей для проверки на маке (?paytest=1): цены — PAY_TEST, покупки лежат в localStorage «paytest», consume их убирает
function payStub(){const K='paytest',rd=()=>{try{return JSON.parse(localStorage.getItem(K))||[];}catch(e){return [];}},wr=a=>{try{localStorage.setItem(K,JSON.stringify(a));}catch(e){}};
  const cur='data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20"><circle cx="10" cy="10" r="9" fill="#f5b400"/><text x="10" y="14.5" font-size="12" text-anchor="middle" font-family="Arial" font-weight="700" fill="#fff">T</text></svg>');
  const wait=v=>new Promise(ok=>setTimeout(()=>ok(v),250)),fail=()=>window.__payCancel||/[?&]paytest=fail/.test(location.search);
  return {getCatalog:()=>wait(Object.keys(PAY_TEST).map(id=>({id,title:id,description:'',imageURI:'',price:PAY_TEST[id]+' тест',priceValue:String(PAY_TEST[id]),priceCurrencyCode:'TST',getPriceCurrencyImage:()=>cur}))),
    getPurchases:()=>wait(rd()),
    purchase:({id})=>fail()?Promise.reject(new Error('cancel')):wait(null).then(()=>{const x={productID:id,purchaseToken:'t'+Date.now()+Math.random().toString(36).slice(2,6),developerPayload:''};const a=rd();a.push(x);wr(a);return x;}),
    consumePurchase:t=>{if(window.__payNoConsume)return Promise.reject(new Error('fail'));wr(rd().filter(x=>x.purchaseToken!==t));return wait();}};}
// имитация VK (?vk=1&paytest=1): «сервер» пишет pay_/own_ в localStorage «paytestvk», как vk-pay в хранилище VK.
// __payNoOid — ответ без order_id, __payNoClear — стирание ключа не прошло, ?paytest=fail / __payCancel — отказ
function payStubVK(){const K='paytestvk',rd=()=>{try{return JSON.parse(localStorage.getItem(K))||{};}catch(e){return {};}},wr=o=>{try{localStorage.setItem(K,JSON.stringify(o));}catch(e){}};
  const wait=v=>new Promise(ok=>setTimeout(()=>ok(v),250)),fail=()=>window.__payCancel||/[?&]paytest=fail/.test(location.search);
  return {order:id=>fail()?Promise.reject({error_type:'client_error'}):wait().then(()=>{const oid=String(Date.now()),o=rd();
      if(PAY_ITEMS[id].perm)o['own_'+id]='1';else o['pay_'+oid]=id;wr(o);return window.__payNoOid?{success:true}:{success:true,order_id:+oid};}),
    keys:()=>wait(Object.entries(rd()).filter(([k,v])=>v).map(([key,value])=>({key,value}))),
    clear:k=>{if(window.__payNoClear)return Promise.reject(new Error('fail'));const o=rd();delete o[k];wr(o);return wait();}};}


/* ================= рейтинг заданий дня =================
   Очки — сколько дней выполнено задание дня (у всех игроков одинаковое задание).
   Яндекс: лидерборд с техническим именем daily (создать в консоли). VK: таблица друзей VKWebAppShowLeaderBoardBox.
   Нет SDK/моста — кнопки нет (никаких заглушек). */
const LB={
  days(){return Object.keys(S.daily||{}).length;},
  ok(){return PLAT==='vk'?!!VK:!!(ysdk&&(ysdk.leaderboards||ysdk.getLeaderboards));},
  async submit(){const n=LB.days();if(!n)return;
    if(PLAT==='vk')return; // VK сам запоминает результат из ShowLeaderBoardBox
    try{if(!ysdk)return;if(ysdk.leaderboards&&ysdk.leaderboards.setScore)await ysdk.leaderboards.setScore('daily',n);
      else{const lb=await ysdk.getLeaderboards();await lb.setLeaderboardScore('daily',n);}}catch(e){}},
  async entries(){const o={includeUser:true,quantityAround:2,quantityTop:10};
    try{if(ysdk.leaderboards&&ysdk.leaderboards.getEntries)return await ysdk.leaderboards.getEntries('daily',o);
      const lb=await ysdk.getLeaderboards();return await lb.getLeaderboardEntries('daily',o);}catch(e){return null;}},
  async show(){
    if(PLAT==='vk'){if(!VK)return;vkSend('VKWebAppShowLeaderBoardBox',{user_result:LB.days()},60000).catch(()=>toast('Таблица друзей сейчас недоступна'));return;}
    const back=()=>{hideModal();if(G&&G.over&&G.daily)openMap();};
    modal(`<h2>🏆 Рейтинг</h2><p>Загружаем…</p>`);
    const r=await LB.entries();const list=(r&&r.entries)||[];
    const me=r&&typeof r.userRank==='number'?r.userRank:0,authed=!!(YP&&YP.getMode&&YP.getMode()!=='lite');
    const esc=t=>String(t||'').replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));
    const rows=list.map(e=>`<div class="lbr${e.rank===me?' me':''}"><b>${e.rank}</b><span>${esc(e.player&&e.player.publicName)||'Игрок'}</span><i>${e.score} 📅</i></div>`).join('');
    modal(`<h2>🏆 Рейтинг</h2><p>Сколько дней выполнено задание дня. У вас: <b>${LB.days()}</b></p>
      <div class="lb">${rows||'<p>Пока пусто — будьте первым!</p>'}</div>
      ${authed?'':'<p><small>Чтобы попасть в рейтинг, войдите в аккаунт Яндекса.</small></p>'}
      <div class="row">${authed||!(ysdk&&ysdk.auth)?'':'<button class="btn accent" id="lbAuth">Войти</button>'}<button class="btn" id="lbClose">Закрыть</button></div>`);
    $('lbClose').onclick=back;
    // после входа — другой аккаунт и другое облако: перечитываем и сливаем, а не пишем туда сохранение этого устройства
    const a=$('lbAuth');if(a)a.onclick=async()=>{try{await ysdk.auth.openAuthDialog();YP=await ysdk.getPlayer({scopes:false});
      clearTimeout(cloudT);cloudT=0;cloudReady=false;cloudTry=0;await cloudLoad(true);updCoins();await LB.submit();}catch(e){}LB.show();};}
};

/* ================= окна: победа, проигрыш, тупик ================= */
function hideModal(){const was=modalOn;$('modal').classList.remove('on');modalOn=false;
  // окно закрыто поверх идущего уровня — для GameplayAPI игра снова «идёт»
  if(was&&G&&!G.over&&$('scr-game').classList.contains('on')&&!pauseWhy.has('ad'))YG.start();
  // тупик случился, пока было открыто окно, — покажем его теперь
  if(was&&G&&!G.over&&$('scr-game').classList.contains('on')&&!hasMove(G.lv,G.st))later(()=>{if(G&&!G.over&&!modalOn&&!hasMove(G.lv,G.st))stuck();},400);}
function modal(html){PAY.re=null;$('mcard').innerHTML=html;$('modal').classList.add('on');modalOn=true;$('mcard').scrollTop=0;if(G)YG.stop();}
// пустая звезда — контуром ☆ (отличается не только цветом)
function starsHtml(n){let s='';for(let i=0;i<3;i++)s+=i<n?'★':'<span class="e">☆</span>';return s;}
function cardCanvas(id,t){requestAnimationFrame(()=>{const c=$(id);if(!c)return;const r=c.getBoundingClientRect(),d=Math.min(2,window.devicePixelRatio||1),w=r.width||200,h=r.height||90;
  c.width=w*d;c.height=h*d;const g=c.getContext('2d');g.setTransform(d,0,0,d,0,0);const s=Math.min(h*1.2,w*.62);
