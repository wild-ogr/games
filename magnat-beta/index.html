<script>/* «Ролики дня» — общий модуль QUEST (hobby-analytics/quest, вставляет quest-sync.sh; правки только там). Подключение — js/game.js (ladder) */
/*QUEST*/
/* ===== QUEST v1 (29.09.2026): «Задания дня» (цепочка) и «Ролики дня» (лесенка) — общий модуль всех игр =====
   Источник — ~/Projects/hobby-analytics/quest/quest.js (правки только там, в игры — quest-sync.sh). Отчёт — 33-ad-quests.md.
   Правила площадок (см. отчёт): ролик — только по кнопке игрока и за заранее названную награду (VK 5.1.5.1 б, Яндекс 4.5–4.5.1);
   ролик — дополнительный бонус, прогресс от него не зависит (Яндекс 4.5.2) → шаги с роликом в цепочке НЕОБЯЗАТЕЛЬНЫ и цепочку не держат;
   задания засчитываются только за игровые действия (VK 4.2.12); реклама — не основной источник ценностей (VK 5.1.5.2 е) →
   сумма «за ролики» за день меньше заработка игрой. Один ролик — одна награда (VK 5.1.5.2 в). Неудачный ролик шаг не сжигает.
   Старый синтаксис: без optional chaining и nullish-оператора, без CSS-свойства inset; флекс без gap (отступы margin).
   Нужны из игры (через QUEST.init): save, ad(ok,fail) — показ ролика за награду игры (её showRewarded), adOk(), grant(награда),
   now() — время сервера (nowMs), modal(html)→контейнер, close(), toast(t). Всё остальное модуль делает сам. */
var QUEST=(function(){
  var DAY=864e5,VER=1,O={},st={},lastErr='';
  function tx(ru,en){return typeof LANG!=='undefined'&&LANG==='en'?en:ru;}
  function nop(){}
  function now(){var t=0;try{t=O.now?O.now():0;}catch(e){}return typeof t==='number'&&t>1.6e12?t:Date.now();}
  function dayKey(t){var d=new Date(t||now());return d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate();}
  function saveFn(){(O.save||nop)();}
  function adOk(){try{return O.adOk?!!O.adOk():true;}catch(e){return false;}}
  function ok(){try{return O.ok?!!O.ok():true;}catch(e){return false;}}

  /* --- настройки по умолчанию; игра переопределяет в QUEST.init(S,{chain:…, ladder:…}) ---
     Цепочка: t — play (сыграна партия/уровень, чем бы ни кончилась), win, stars (3 звезды), daily (задание дня), ad (бонус-ролик);
     n — сколько за ДЕНЬ всего (счётчики дня не теряются, пока шаг ждёт «Забрать»); r — награда (число = монеты игры
     или объект, который игра поймёт в grant). Шаг ad — необязательный: цепочка идёт дальше и без него. Последний шаг — chest. */
  var CHAIN=[{t:'play',n:1,r:10},{t:'ad',r:10},{t:'win',n:2,r:15},{t:'play',n:4,r:20},{t:'ad',r:15},{t:'win',n:5,r:25},{t:'chest',r:60}];
  var LADDER={r:[10,15,25,40,{chest:1,c:60}],gap:120}; // 5 роликов в день, пауза между ними, с; сброс в полночь (now())

  function chain(){return O.chain||CHAIN;}
  function ladder(){return O.ladder||LADDER;}
  function chainOn(){return ok()&&O.chainOn!==false;}
  function ladderOn(){return ok()&&O.ladderOn!==false&&adOk();}

  // состояние дня: d — день, c — счётчики событий, k — забранные шаги цепочки {индекс:1}, n/t — ролики лесенки (сколько, когда последний)
  function fresh(){return {d:dayKey(),c:{},k:{},n:0,t:0,v:VER};}
  function day(){if(!st.q||st.q.d!==dayKey())st.q=fresh();return st.q;}

  /* QUEST.init(S, opt) — один раз при запуске, после загрузки сохранения. opt:
     save, toast, modal(html)→контейнер, close, now, ad(ok,fail), adOk, grant(r, откуда), cur(n)→«25 💰», ok()→модуль вообще включён
     (в настоящем VK без моста — false), cls — классы кнопок, которые Enter не жмёт, chain/ladder — свои шаги/награды,
     chainOn/ladderOn — false выключает механику, onChange() — перерисовать значок на карте,
     note() — HTML-строка под цепочкой (например, «талоны → вещи»), rTxt(r) — подпись награды-объекта,
     log(k) — счётчик для замеров: open, chain, chain-ad, chain-chest, ladder, fail-chain, fail-ladder. */
  function init(S,opt){O=opt||{};if(!S.quest||typeof S.quest!=='object')S.quest={};st=S.quest;day();}
  // облако: из слияния сохранений игры — QUEST.merge(d.quest). Более поздний день — целиком; тот же день — максимумы и объединение
  function merge(d){if(!d||typeof d!=='object'||!d.q||typeof d.q!=='object')return;var a=day(),b=d.q,k;
    if(typeof b.d!=='number'||b.d<a.d)return;if(b.d>a.d){st.q=b;return;}
    if(b.c&&typeof b.c==='object')for(k in b.c)if(typeof b.c[k]==='number'&&b.c[k]>(a.c[k]||0))a.c[k]=b.c[k];
    if(b.k&&typeof b.k==='object')for(k in b.k)if(b.k[k])a.k[k]=1;
    if(typeof b.n==='number'&&b.n>a.n)a.n=b.n;if(typeof b.t==='number'&&b.t>a.t)a.t=b.t;}

  // --- события игры: QUEST.event('play'|'win'|'stars'|'daily', сколько=1). Вернёт true, если появилось что забрать ---
  function event(type,n){if(!chainOn())return false;var q=day(),before=ready();q.c[type]=(q.c[type]||0)+(n||1);saveFn();
    var after=ready();if(after>before){(O.toast||nop)(tx('🎯 Задание выполнено — заберите награду!','🎯 Task complete — collect your reward!'));ch();return true;}
    ch();return false;}
  function ch(){(O.onChange||nop)();}

  // --- цепочка ---
  function isAd(s){return s.t==='ad';}
  function need(s){return s.n||1;}
  function done(i){var s=chain()[i],q=day();if(s.t==='chest'){for(var j=0;j<i;j++)if(!isAd(chain()[j])&&!q.k[j])return false;return true;}
    if(isAd(s))return true;return (q.c[s.t]||0)>=need(s);}
  // можно забрать: выполнен, ещё не забран, все прежние игровые шаги забраны (бонус-ролики не держат цепочку)
  function can(i){var q=day();if(q.k[i]||!done(i))return false;for(var j=0;j<i;j++)if(!isAd(chain()[j])&&!q.k[j])return false;
    if(isAd(chain()[i])&&!adOk())return false;return true;}
  function ready(){var n=0,L=chain(),i;for(i=0;i<L.length;i++)if(!isAd(L[i])&&can(i))n++;return n;}
  function progress(){var L=chain(),q=day(),a=0,b=0;for(var i=0;i<L.length;i++){if(isAd(L[i]))continue;b++;if(q.k[i])a++;}return {a:a,b:b};}
  function lg(k){try{(O.log||nop)(k);}catch(e){}}
  function give(r,from){lg(from);if(O.grant)O.grant(r,from);saveFn();ch();}
  function claim(i){if(!can(i))return;var s=chain()[i],q=day();
    if(isAd(s)){lastErr='';(O.ad||nop)(function(){if(day().k[i])return;day().k[i]=1;give(s.r,'chain-ad');re();},function(){lastErr='chain';lg('fail-chain');re();});return;}
    q.k[i]=1;give(s.r,s.t==='chest'?'chain-chest':'chain');re();}

  // --- лесенка роликов ---
  function lwait(){var q=day(),g=(ladder().gap||0)*1000;return q.n&&q.t?Math.max(0,q.t+g-now()):0;}
  function lnext(){var q=day(),R=ladder().r;return q.n<R.length?R[q.n]:null;}
  function watch(){if(!ladderOn()||lnext()===null||lwait()>0)return;var n0=day().n;lastErr='';
    (O.ad||nop)(function(){var q=day();if(q.n!==n0)return;var r=lnext();q.n++;q.t=now();give(r,'ladder');re();},function(){lastErr='ladder';lg('fail-ladder');re();});}

  // --- значок для кнопки на карте: {txt:'3/5', hot:true, n:сколько забрать} ---
  function badge(){if(!ok())return null;var p=progress(),h=ready(),q=day(),R=ladder().r;
    var lad=ladderOn()&&lnext()!==null&&lwait()===0;
    return {txt:chainOn()?p.a+'/'+p.b:q.n+'/'+R.length,hot:h>0||lad,n:h+(lad?1:0)};}

  // --- тексты ---
  function rTxt(r){if(r&&typeof r==='object'){if(O.rTxt)return O.rTxt(r);return r.chest?'🎁'+(r.c?' +'+cur(r.c):tx(' сундук',' chest')):'';}return '+'+cur(r);}
  function cur(n){return O.cur?O.cur(n):n+' 💰';}
  function sTxt(s){var n=need(s);switch(s.t){
    case 'play':return n>1?tx('Сыграйте '+n+' '+rp(n),'Play '+n+' times'):tx('Сыграйте один раз','Play once');
    case 'win':return n>1?tx('Победите '+n+' '+rp(n),'Win '+n+' times'):tx('Победите один раз','Win once');
    case 'stars':return n>1?tx('На 3 звезды — '+n+' '+rp(n),'3 stars '+n+' times'):tx('Пройдите на 3 звезды','Get 3 stars');
    case 'daily':return tx('Пройдите задание дня','Complete the daily challenge');
    case 'ad':return tx('Бонус за ролик (по желанию)','Video bonus (optional)');
    case 'chest':return tx('Главный приз дня','Big prize of the day');}
    return s.txt?s.txt:(O.sTxt?O.sTxt(s):s.t);}
  function btn(id,label,extra){return '<button class="'+(O.cls||'btn noenter')+(extra?' '+extra:'')+'" data-q="'+id+'">'+label+'</button>';}
  function rp(n){var m=n%10,h=n%100;return m>=2&&m<=4&&(h<12||h>14)?'раза':'раз';}
  function mmss(ms){var s=Math.ceil(ms/1000),m=Math.floor(s/60);s%=60;return m+':'+(s<10?'0':'')+s;}

  function css(){if(document.getElementById('questCss'))return;var s=document.createElement('style');s.id='questCss';
    s.textContent='.qst{text-align:left;margin:4px 0}.qst h3{margin:12px 0 4px;font-size:18px}'+
      '.qs{display:flex;align-items:center;padding:4px 6px;border-radius:12px;margin-top:2px;font-size:16px;line-height:1.2;min-height:34px}.qs small{opacity:.7;font-weight:700;white-space:nowrap}'+
      '.qs.cur{background:rgba(255,200,60,.28)}.qs.ok{opacity:.55}.qs.ad{font-size:15px}'+
      '.qs i{font-style:normal;width:30px;flex:none;text-align:center;font-size:20px}.qs span{flex:1;min-width:0}.qs b{white-space:nowrap;margin-left:8px}'+
      '.qs button{margin-left:8px;padding:6px 10px;font-size:15px;flex:none}'+
      '.qbig{text-align:center;font-size:17px;margin:2px 0 6px}.qbig b{font-size:22px;white-space:nowrap}'+
      '.qlad{display:flex;justify-content:space-between;margin:6px 0}.qlad div{flex:1;text-align:center;font-size:14px;padding:6px 0;border-radius:10px;margin:0 2px;background:rgba(0,0,0,.05)}'+
      '.qlad div.ok{background:rgba(60,170,80,.22)}.qlad div.cur{background:rgba(255,200,60,.35);font-weight:800}.qlad div b{display:block;font-size:17px}'+
      '@media (max-height:700px){.qst h3{margin-top:6px}.qs{min-height:30px;font-size:15px}.qlad div{padding:3px 0}.qhint{margin:2px 0}}'+
      '@media (max-height:640px){.qs{min-height:0;padding:2px 6px}.qs i{font-size:17px}.qs button{padding:4px 9px}.qst h3{font-size:16px;margin:4px 0 2px}.qlad div b{font-size:15px}.qhint.opt{display:none}.qbig{margin:0 0 3px}}'+
      '.qerr{color:#a33;font-size:15px;text-align:center;margin:4px 0}.qhint{font-size:14px;opacity:.75;text-align:center;margin:4px 0}'+
      '.qbox{position:fixed;left:0;top:0;right:0;bottom:0;background:rgba(0,0,0,.55);z-index:9999;overflow:auto;padding:12px 16px}'+
      '.qcard{background:#fff;color:#222;border-radius:16px;max-width:440px;margin:0 auto;padding:14px 16px;font:17px/1.3 sans-serif}';
    document.head.appendChild(s);}

  // --- окно «Задания дня» ---
  var box=null,tick=0,backFn=null,lastRoot=null;
  function html(){var L=chain(),q=day(),h='<h2>'+tx('🎯 Задания дня','🎯 Daily tasks')+'</h2>',i,s;
    if(chainOn()){var nb=null;for(i=0;i<L.length;i++)if(!isAd(L[i])&&!q.k[i]){nb=L[i];break;}
      h+=nb?'<div class="qbig">'+tx('Следующий приз: ','Next prize: ')+'<b>'+rTxt(nb.r)+'</b></div>':'<div class="qbig">'+tx('Все задания на сегодня выполнены! Завтра — новые.','All done for today! New tasks tomorrow.')+'</div>';
      h+='<div class="qst">';
      for(i=0;i<L.length;i++){s=L[i];if(isAd(s)&&!adOk())continue;
        var got=!!q.k[i],c=can(i),cnt=s.t==='chest'||isAd(s)||need(s)<2||got?'':' <small>'+Math.min(q.c[s.t]||0,need(s))+'/'+need(s)+'</small>';
        h+='<div class="qs'+(got?' ok':c?' cur':'')+(isAd(s)?' ad':'')+'"><i>'+(got?'✅':s.t==='chest'?'🎁':isAd(s)?'📺':'⬜')+'</i><span>'+sTxt(s)+cnt+'</span>'+
          (got?'':c?btn('c'+i,isAd(s)?tx('📺 Смотреть','📺 Watch')+' '+rTxt(s.r):tx('Забрать','Collect')+' '+rTxt(s.r),isAd(s)?'':'qget'):'<b>'+rTxt(s.r)+'</b>')+'</div>';}
      h+='</div>';
      if(O.note)h+='<div class="qhint">'+O.note()+'</div>';
      if(lastErr==='chain')h+='<div class="qerr">'+tx('Ролик сейчас не загрузился — попробуйте чуть позже. Шаг никуда не денется.','The video didn\'t load — try again a bit later. The step will wait.')+'</div>';}
    if(ladderOn()){var R=ladder().r,w=lwait(),nx=lnext();
      h+='<div class="qst"><h3>'+tx('📺 Ролики дня','📺 Daily videos')+'</h3><div class="qlad">';
      for(i=0;i<R.length;i++)h+='<div class="'+(i<q.n?'ok':i===q.n?'cur':'')+'"><b>'+(i<q.n?'✅':(i+1))+'</b>'+rTxt(R[i]).replace(/^\+/,'')+'</div>';
      h+='</div>';
      if(nx===null)h+='<div class="qhint">'+tx('На сегодня всё. Завтра лесенка начнётся заново.','That\'s all for today. The ladder starts again tomorrow.')+'</div>';
      else if(w>0)h+='<div class="qhint" id="qWait">'+tx('Следующий ролик через ','Next video in ')+mmss(w)+'</div>';
      else h+='<div class="row">'+btn('lad',tx('📺 Смотреть ролик','📺 Watch a video')+' '+rTxt(nx))+'</div>';
      if(lastErr==='ladder')h+='<div class="qerr">'+tx('Ролик сейчас не загрузился — попробуйте чуть позже. Ступенька не сгорела.','The video didn\'t load — try again a bit later. You keep your step.')+'</div>';
      h+='<div class="qhint opt">'+tx('По желанию: чем дальше, тем щедрее.','Optional: each one gives a bit more.')+'</div></div>';}
    h+='<div class="row"><button class="'+(O.cls||'btn noenter')+'" id="qClose">'+(backFn?tx('← Назад','← Back'):tx('Закрыть','Close'))+'</button></div>';
    return h;}
  function bind(root){var bs=root.querySelectorAll('[data-q]');
    for(var j=0;j<bs.length;j++)bs[j].onclick=function(){this.disabled=true;var k=this.getAttribute('data-q');if(k==='lad')watch();else claim(+k.slice(1));};
    var c=root.querySelector('#qClose');if(c)c.onclick=function(){if(backFn)backFn();else close();};}
  function close(){clearInterval(tick);tick=0;lastErr='';lastRoot=null;if(box){if(box.parentNode)box.parentNode.removeChild(box);box=null;}else if(O.close)O.close();}
  function shown(){if(box)return !!box.parentNode;return !!(lastRoot&&lastRoot.querySelector&&lastRoot.querySelector('#qClose')&&lastRoot.offsetParent!==null);}
  function re(){if(!shown())return;draw();}
  function draw(){css();var h=html(),root;
    if(O.modal)root=O.modal(h);else{if(!box){box=document.createElement('div');box.className='qbox';document.body.appendChild(box);
        box.onclick=function(e){if(e.target===box)close();};}box.innerHTML='<div class="qcard">'+h+'</div>';root=box;}
    lastRoot=root;bind(root);clearInterval(tick);tick=setInterval(function(){if(!shown()){clearInterval(tick);tick=0;return;}
      var w=lwait(),e=document.getElementById('qWait');if(e&&w>0)e.textContent=tx('Следующий ролик через ','Next video in ')+mmss(w);else if(e)draw();},1000);}
  // QUEST.open(back) — открыть окно; back() — куда вернуться по «Назад» (без него — «Закрыть»)
  function open(back){if(!ok())return;backFn=back||null;lastErr='';lg('open');draw();}

  // для проверок: состояние и «перемотка» (не для игры)
  function _dbg(){return {q:day(),ready:ready(),badge:badge(),wait:lwait()};}
  return {v:VER,ok:ok,init:init,merge:merge,event:event,open:open,close:close,badge:badge,claim:claim,watch:watch,
    ready:ready,dayKey:dayKey,_dbg:_dbg,CHAIN:CHAIN,LADDER:LADDER};
})();
