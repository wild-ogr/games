<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Баба Зина: слова из букв</title>
<meta name="description" content="Баба Зина: слова из букв — составляй слова из букв, разгадывай кроссворды и собирай смешной «Толковый словарь бабы Зины».">
<style>
:root{
  --paper:#fbf7ec;--line:#dfe8f2;--margin:#f0b3ad;--ink:#27324a;--ink2:#5d6781;
  --blue:#1d4fa3;--blue2:#2f6fd6;--blue3:#dbe7fb;--gold:#f5b72d;--orange:#ff8a3d;--orange2:#e8661b;
  --green:#34a853;--green2:#237a3b;--red:#e2463b;--red2:#d0342c;--btnor:#c2410c;--card:#ffffff;--shadow:0 3px 0 rgba(39,50,74,.14),0 6px 18px rgba(39,50,74,.10);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
html,body{margin:0;height:100%;overflow:hidden;background:var(--paper);color:var(--ink);
  font-family:"Trebuchet MS","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;overscroll-behavior:none}
body{background-color:var(--paper);
  background-image:linear-gradient(90deg,transparent 30px,var(--margin) 30px,var(--margin) 32px,transparent 32px),
  linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:100% 100%,22px 22px,22px 22px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
#app{position:fixed;top:0;right:0;bottom:0;left:0;max-width:560px;margin:0 auto;display:flex;flex-direction:column}
.screen{position:absolute;top:0;right:0;bottom:0;left:0;display:none;flex-direction:column;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
.screen.on{display:flex}

/* кнопки */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:16px;padding:14px 22px;font-weight:800;font-size:19px;min-height:44px;
  color:#fff;background:linear-gradient(#cf4a12,var(--btnor));box-shadow:0 5px 0 #8f3008,0 8px 16px rgba(194,65,12,.25);transition:transform .08s;text-shadow:0 1px 1px rgba(0,0,0,.18)}
/* цвета кнопок — контраст белого текста не меньше 4,5 (аудитория 45+) */
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #8f3008}
.btn.blue{background:linear-gradient(var(--blue2),#2563c9);box-shadow:0 5px 0 var(--blue),0 8px 16px rgba(29,79,163,.25)}
.btn.blue:active{box-shadow:0 1px 0 var(--blue)}
.btn.green{background:linear-gradient(#23803c,var(--green2));box-shadow:0 5px 0 #185a2a,0 8px 16px rgba(35,128,60,.25)}
.btn.green:active{box-shadow:0 1px 0 #185a2a}
.btn.ghost{background:#fff;color:var(--ink);text-shadow:none;box-shadow:0 4px 0 #d5d9e3,0 6px 14px rgba(39,50,74,.08)}
.btn.ghost:active{box-shadow:0 1px 0 #d5d9e3}
.btn.small{padding:10px 16px;font-size:16px;border-radius:14px}
.btn[disabled]{filter:grayscale(1);opacity:.55;pointer-events:none}
.ibtn{width:46px;height:46px;flex:none;border-radius:14px;background:#fff;box-shadow:0 3px 0 #d5d9e3,0 4px 10px rgba(39,50,74,.08);
  display:flex;align-items:center;justify-content:center;font-size:22px}
.ibtn:active{transform:translateY(2px);box-shadow:0 1px 0 #d5d9e3}
.coins{display:flex;align-items:center;gap:6px;flex:none;background:#fff;border-radius:999px;padding:6px 12px 6px 8px;font-weight:800;font-size:17px;box-shadow:0 3px 0 #d5d9e3}
.coin{width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffe58a,#f5b72d 55%,#d98f0f);box-shadow:inset 0 -2px 0 rgba(0,0,0,.15);
  display:inline-flex;align-items:center;justify-content:center;font-size:12px;color:#8a5a00;font-weight:900}
.coin::after{content:"";width:9px;height:9px;border-radius:50%;border:2px solid rgba(138,90,0,.45)}

/* меню */
#menu{align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 14px) 18px calc(env(safe-area-inset-bottom) + 18px)}
.mtop{width:100%;display:flex;justify-content:space-between;align-items:center}
.logo{text-align:center;margin-top:4px}
.logo h1{margin:0;font-size:44px;line-height:1;color:var(--blue);letter-spacing:.5px;font-weight:900;
  text-shadow:0 3px 0 #fff,0 5px 0 rgba(29,79,163,.18)}
.logo h1 span{color:var(--orange)}
.logo p{margin:8px 0 0;color:var(--ink2);font-size:15px}
.logo p.sub{margin:6px 0 0;color:var(--btnor);font-size:23px;font-weight:900;letter-spacing:1.5px;text-shadow:0 2px 0 #fff}
.logo .rank{display:inline-block;margin-top:6px;background:#fff;border-radius:999px;padding:3px 12px;font-size:14px;font-weight:800;color:var(--blue);box-shadow:0 2px 0 #d5d9e3}
.logo .rank:empty{display:none}
@media (max-height:700px){.logo p{margin-top:4px;font-size:14px}.logo p.sub{margin-top:3px;font-size:19px}.logo .rank{margin-top:4px;font-size:14px}}
.hero{position:relative;width:min(380px,84vw);flex:1 1 auto;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
#heroArt{width:100%;aspect-ratio:1.35;max-height:min(40vh,300px);flex:0 1 auto;min-height:0}
.hero svg{width:100%;height:100%}
.mbubble{position:relative;background:#fff;border-radius:18px;padding:12px 16px;box-shadow:var(--shadow);font-size:16px;line-height:1.35;max-width:330px;text-align:center;margin-bottom:6px;min-height:48px}
.mbubble::after{content:"";position:absolute;left:50%;bottom:-9px;margin-left:-9px;border:9px solid transparent;border-bottom:0;border-top-color:#fff}
.mbtns{display:flex;flex-direction:column;gap:14px;width:100%;max-width:340px}
.mbtns .row{display:flex;gap:12px}
.mbtns .row .btn{flex:1;font-size:16px;padding:12px 8px;flex-direction:column;gap:2px}
.mbtns .row .btn b{font-size:24px;line-height:1}
.dot{position:absolute;top:-4px;right:-4px;width:14px;height:14px;border-radius:50%;background:var(--red);border:2px solid #fff;display:none}
.dot.on{display:block}

/* главы */
.hdr{display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 10px) 12px 8px}
.hdr .t{flex:1;min-width:0}
.hdr .t b{display:block;font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr .t small{display:block;color:var(--ink2);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:6px 14px 24px;touch-action:pan-y}
.chap{display:flex;gap:12px;align-items:center;background:#fff;border-radius:18px;padding:12px;margin-bottom:12px;box-shadow:var(--shadow);position:relative;width:100%;text-align:left}
.chap .em{width:58px;height:58px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:32px;flex:none}
.chap .ct{flex:1;min-width:0}
.chap .ct b{display:block;font-size:17px}
.chap .ct small{display:block;color:var(--ink2);font-size:14px;margin-top:2px;line-height:1.25}
.bar{height:8px;border-radius:5px;background:#eef1f6;margin-top:7px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--green),#7bd88f);border-radius:5px}
.chap.locked{opacity:.8}
.chap.locked .em{filter:grayscale(1)}
.lvls{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;padding:4px 2px 10px}
.lv{aspect-ratio:1;min-height:52px;border-radius:14px;background:#fff;box-shadow:0 3px 0 #d5d9e3;font-weight:800;font-size:18px;display:flex;align-items:center;justify-content:center;position:relative}
.lv.done{background:linear-gradient(#e6f6ea,#d2efda);color:#1a6b32;box-shadow:0 3px 0 #a8dab5}
.lv.cur{background:linear-gradient(#cf4a12,var(--btnor));color:#fff;box-shadow:0 3px 0 #8f3008;animation:pulse 1.4s infinite}
.lv.lock{color:#5d6781;background:#f3f4f8;box-shadow:none}
.lv .bk{position:absolute;bottom:2px;right:4px;font-size:14px}
.lv .ex{position:absolute;top:1px;left:3px;font-size:14px}
.lv .lk{position:absolute;bottom:2px;right:4px;font-size:12px;opacity:.7}
.lv.test:not(.lock){outline:2px dashed var(--btnor);outline-offset:-4px}
@keyframes pulse{50%{transform:scale(1.06)}}

/* игра */
#game{touch-action:none}
.ghdr{display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 8px) 12px 4px}
.ghdr .t{flex:1;text-align:center;min-width:0}
.ghdr .t b{display:block;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ghdr .t small{color:var(--ink2);font-size:14px;white-space:nowrap;display:flex;justify-content:center;gap:4px;min-width:0}
.ghdr .t small #gSub{overflow:hidden;text-overflow:ellipsis;min-width:0}
.ghdr .t small #gCnt{flex:none;font-weight:800;color:var(--blue);font-size:15px}
.ghdr .t small #gCnt::before{content:"· ";color:var(--ink2);font-weight:400}
.zina{display:flex;align-items:flex-start;gap:8px;padding:2px 12px 0;min-height:64px}
.zina .av{width:58px;height:58px;flex:none;border-radius:50%;background:#fff;box-shadow:var(--shadow);overflow:hidden;cursor:pointer}
.zina .av svg{width:100%;height:100%}
.zina .av .face{display:none;width:100%;height:100%}.zina .av .face.on{display:block}
.zina .say.pin{box-shadow:0 0 0 3px var(--gold),var(--shadow)}
.zina .say{position:relative;flex:1;background:#fff;border-radius:16px;padding:9px 12px;font-size:15px;line-height:1.3;box-shadow:var(--shadow);
  margin-top:4px;opacity:0;transform:translateY(-4px) scale(.98);transition:opacity .2s,transform .2s;min-height:40px}
.zina .say.on{opacity:1;transform:none}
.zina .say::before{content:"";position:absolute;left:-8px;top:14px;border:8px solid transparent;border-left:0;border-right-color:#fff}
#board{flex:1 1 auto;position:relative;min-height:120px;display:flex;align-items:center;justify-content:center;padding:6px 10px}
#grid{position:relative}
.cell{position:absolute;border-radius:22%;background:rgba(255,255,255,.85);border:2px solid #c9d6ea;display:flex;align-items:center;justify-content:center;
  font-weight:900;color:var(--blue);text-transform:uppercase;transition:background .2s}
.cell.open{background:#fff;border-color:#9fb9e3;box-shadow:0 3px 0 #bcd0ee}
.cell.pop{animation:pop .35s ease-out}
.cell.hint,.cell.gift{color:var(--btnor)}
.cell.flash{animation:flash .6s}
@keyframes pop{0%{transform:scale(.4)}60%{transform:scale(1.18)}100%{transform:scale(1)}}
@keyframes flash{30%{background:#fff4c9;transform:scale(1.1)}}
.cell.pick{outline:3px dashed var(--orange);outline-offset:1px}
#preview{height:46px;display:flex;align-items:center;justify-content:center}
#preview .w{display:flex;gap:3px;padding:6px 12px;border-radius:14px;background:var(--blue);color:#fff;font-weight:900;font-size:24px;text-transform:uppercase;letter-spacing:1px;
  box-shadow:0 3px 0 #163c7c;transition:background .15s}
#preview .w.ok{background:var(--green2);box-shadow:0 3px 0 #185a2a}
#preview .w.bad{background:var(--red2);box-shadow:0 3px 0 #a52a21;animation:shake .35s}
#preview .w.bonus{background:var(--gold);box-shadow:0 3px 0 #b9860f;color:#5a3a00}
#preview .w.old{background:#6b7280;box-shadow:0 3px 0 #4b5160}
#preview .w:empty{display:none}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.wheelwrap{position:relative;display:flex;align-items:center;justify-content:center;padding:4px 0 calc(env(safe-area-inset-bottom) + 12px)}
#wheel{position:relative;touch-action:none}
#wheel svg{position:absolute;top:0;right:0;bottom:0;left:0;overflow:visible;pointer-events:none}
.plate{position:absolute;top:0;right:0;bottom:0;left:0;border-radius:50%;background:radial-gradient(circle,#fff 58%,#f3f6fc 59%,#fff 64%);box-shadow:0 6px 0 #c5d2ea,0 12px 26px rgba(29,79,163,.18)}
.plate::before{content:"";position:absolute;top:4px;right:4px;bottom:4px;left:4px;border-radius:50%;border:6px solid var(--blue);box-shadow:inset 0 0 0 3px #fff,inset 0 0 0 5px rgba(29,79,163,.55)}
.plate::after{content:"";position:absolute;top:22px;right:22px;bottom:22px;left:22px;border-radius:50%;border:2px dashed rgba(29,79,163,.3)}
.plate.sv{background:none}.plate.sv::before,.plate.sv::after{display:none}
.let{position:absolute;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;color:var(--lc,var(--blue));text-transform:uppercase;
  transition:transform .12s,background .12s,color .12s;z-index:2}
.let::before{content:"";position:absolute;top:6%;right:6%;bottom:6%;left:6%;border-radius:50%;background:var(--lb,rgba(29,79,163,.06));z-index:-1}
.let.on{background:var(--lon,var(--blue));color:var(--lonc,#fff);transform:scale(1.08)}
.side{position:absolute;display:flex;flex-direction:column;gap:26px;z-index:3}
.side.l{left:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 34px)}
.side.r{right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 34px)}
.hb .lbl{position:absolute;top:calc(100% + 9px);left:50%;transform:translateX(-50%);font-size:13px;font-weight:800;color:var(--ink2);white-space:nowrap;pointer-events:none}
.hb .pr~.lbl{top:calc(100% + 13px)}
.hb.glow{animation:glow 1s ease-in-out 5}
@keyframes glow{50%{box-shadow:0 0 0 6px rgba(255,138,61,.55),0 4px 0 #d5d9e3}}
.chk{display:flex;align-items:center;justify-content:center;gap:8px;font-size:15px;color:var(--ink2);margin-top:8px;cursor:pointer}
.chk input{width:20px;height:20px;accent-color:var(--blue2)}
.money{font-size:14px;color:var(--ink2);margin:0 0 4px}
.goal{background:#fff;border-radius:12px;padding:8px 10px;margin:8px 0 0;font-size:14px;color:var(--ink2);box-shadow:0 2px 0 #e3e7ee}
.goal b{color:var(--ink)}
.hb{position:relative;width:58px;height:58px;border-radius:50%;background:#fff;box-shadow:0 4px 0 #d5d9e3,0 6px 14px rgba(39,50,74,.1);display:flex;align-items:center;justify-content:center;font-size:26px}
.hb:active{transform:translateY(3px);box-shadow:0 1px 0 #d5d9e3}
.hb .pr{position:absolute;bottom:-8px;left:50%;transform:translateX(-50%);background:var(--gold);color:#5a3a00;border-radius:10px;font-size:14px;font-weight:900;padding:0 7px;white-space:nowrap;box-shadow:0 2px 0 #b9860f}
.jar{position:relative}
.jar .fill{position:absolute;left:14px;right:14px;bottom:12px;border-radius:0 0 8px 8px;background:linear-gradient(#ff7a5a,#d8342a);opacity:.85;transition:height .4s}
.jar .cnt{position:absolute;top:-6px;right:-6px;min-width:22px;height:22px;border-radius:11px;background:#c9302c;color:#fff;font-size:13px;font-weight:900;display:flex;align-items:center;justify-content:center;padding:0 5px;border:2px solid #fff}
.fly{position:fixed;z-index:50;pointer-events:none;font-weight:900;color:var(--blue);transition:all .5s cubic-bezier(.5,0,.5,1)}
/* найденное слово: буквы летят в клетки, за длинное — печать «Молодец!» */
.flyl{position:fixed;z-index:50;width:40px;height:40px;display:flex;align-items:center;justify-content:center;pointer-events:none;font-weight:900;color:#fff;text-transform:uppercase;
  border-radius:50%;background:var(--green2);box-shadow:0 2px 0 #185a2a}
.bstamp{position:absolute;top:50%;left:50%;z-index:6;pointer-events:none;padding:6px 16px;border:4px solid #d0342c;border-radius:14px;color:#d0342c;background:rgba(255,255,255,.82);
  font-size:30px;font-weight:900;font-style:italic;white-space:nowrap;transform:translate(-50%,-50%) rotate(-9deg);animation:bstamp 1.6s cubic-bezier(.2,1.5,.5,1) both}
.bstamp.still{animation:none}
@keyframes bstamp{0%{transform:translate(-50%,-50%) rotate(-9deg) scale(2.3);opacity:0}16%{transform:translate(-50%,-50%) rotate(-9deg) scale(1);opacity:1}80%{opacity:1}100%{transform:translate(-50%,-50%) rotate(-9deg) scale(1);opacity:0}}
/* «Крупные буквы» (⚙️): клетки и круг считаются в game.js, тут — текст вокруг */
body.big .zina .say{font-size:17px}
body.big #preview .w{font-size:28px}

/* окна */
#modal{position:fixed;top:0;right:0;bottom:0;left:0;background:rgba(20,28,48,.55);display:none;align-items:center;justify-content:center;z-index:30;padding:16px}
#modal.on{display:flex;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.mcard{background:var(--paper);border-radius:24px;padding:22px 18px 18px;width:100%;max-width:380px;max-height:92vh;overflow-y:auto;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.3);animation:up .3s cubic-bezier(.2,1.4,.5,1)}
@keyframes up{from{transform:translateY(40px) scale(.9);opacity:0}}
.mcard h2{margin:0 0 6px;font-size:26px;color:var(--blue)}
.mcard p{margin:6px 0;color:var(--ink2);font-size:16px;line-height:1.4}
.cred{background:#fff;border-radius:16px;padding:12px 14px;margin:12px 0 4px;text-align:left;font-size:15px;line-height:1.45;color:var(--ink2)}
.cred b{color:var(--ink);font-size:17px}.cred a{color:var(--blue2);word-break:break-all}
.mcard .btns{display:flex;flex-direction:column;gap:12px;margin-top:16px}
.defcard{position:relative;background:#fff;border-radius:16px;padding:16px 16px 14px;margin:14px 0 4px;text-align:left;box-shadow:var(--shadow);border-left:6px solid var(--margin)}
.defcard .tag{font-size:13.5px;color:var(--ink2);text-transform:uppercase;letter-spacing:1px;font-weight:700}
.defcard .word{font-size:26px;font-weight:900;color:var(--blue);text-transform:uppercase;margin:4px 0 6px;letter-spacing:1px}
.defcard .def{font-size:17px;line-height:1.4;color:var(--ink)}
.defcard .sig{text-align:right;font-style:italic;color:var(--ink2);font-size:14px;margin-top:8px}
.defcard.new::after{content:"НОВОЕ!";position:absolute;top:-10px;right:12px;background:#c9302c;color:#fff;font-size:13px;font-weight:900;padding:3px 8px;border-radius:8px;transform:rotate(4deg)}
.stars{font-size:40px;color:var(--gold);letter-spacing:4px;text-shadow:0 3px 0 #c98e12}
.reward{display:flex;align-items:center;justify-content:center;gap:8px;font-size:22px;font-weight:900;margin:6px 0}
.words{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:10px 0}
.words span{background:#fff;border-radius:10px;padding:5px 10px;font-weight:800;text-transform:uppercase;font-size:14px;box-shadow:0 2px 0 #d5d9e3}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 70px);transform:translate(-50%,-20px);background:var(--ink);color:#fff;border-radius:14px;padding:10px 16px;font-size:15px;
  opacity:0;transition:all .25s;z-index:40;pointer-events:none;max-width:90vw;text-align:center;line-height:1.35}
#toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto;cursor:pointer}
#ad{position:fixed;top:0;right:0;bottom:0;left:0;background:#111;color:#fff;display:none;align-items:center;justify-content:center;flex-direction:column;z-index:60;font-size:20px;gap:10px}
#ad.on{display:flex}

/* словарь */
.dict{background:#fff;border-radius:16px;padding:12px 14px;margin-bottom:10px;box-shadow:var(--shadow);border-left:5px solid var(--margin)}
.dict b{color:var(--blue);text-transform:uppercase;font-size:16px;letter-spacing:.5px}
.dict p{margin:4px 0 0;font-size:15px;line-height:1.35}
.dict.lock{border-left-color:#dfe3ea;color:#6b7280}
.dict.lock b{color:#6b7280}
.dhead{background:#fff;border-radius:18px;padding:14px;margin-bottom:14px;box-shadow:var(--shadow);display:flex;gap:12px;align-items:center}
.dhead .av{width:64px;height:64px;flex:none}
.dhead .av svg{width:100%;height:100%}
.dhead p{margin:0;font-size:14.5px;line-height:1.35;color:var(--ink2)}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tabs button{flex:1;padding:9px;min-height:44px;border-radius:12px;background:#fff;font-weight:800;box-shadow:0 2px 0 #d5d9e3;font-size:15px}
.tabs button.on{background:var(--blue);color:#fff;box-shadow:0 2px 0 #163c7c}
.wheelwrap{padding-bottom:calc(env(safe-area-inset-bottom) + 18px)}
@media (max-height:700px){.zina .say{font-size:14px;padding:7px 10px;min-height:34px}
  .ghdr{padding-top:calc(env(safe-area-inset-top) + 6px)}.hb{width:50px;height:50px;font-size:22px}.side{gap:24px}.logo h1{font-size:38px}
