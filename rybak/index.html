<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Рыбалка с Петровичем</title>
<style>
:root{--ink:#26343b;--muted:#5a6770;--card:#fffdf6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;background:#1f3a4a;overscroll-behavior:none;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--ink);overflow:hidden;touch-action:manipulation}
#app{position:relative;max-width:560px;height:100%;margin:0 auto;background:linear-gradient(#a8d8ef,#d9efe6 40%,#8fbf8a);overflow:hidden}
.screen{position:absolute;top:0;right:0;bottom:0;left:0;display:none;flex-direction:column}
.screen.on{display:flex}
button{font:inherit;color:inherit;border:0;cursor:pointer}
.btn{background:#fff;border-radius:16px;padding:12px 16px;font-weight:700;font-size:17px;box-shadow:0 4px 0 #c3c8c0,0 6px 14px rgba(0,0,0,.12);transition:transform .08s;min-height:48px}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #c3c8c0}
.btn.accent{background:linear-gradient(#e8590c,#c44a08);color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.25);box-shadow:0 4px 0 #8f3505,0 6px 14px rgba(0,0,0,.15)}
.btn.accent:active{box-shadow:0 1px 0 #8f3505}
.btn.green{background:linear-gradient(#2b8a3e,#237032);color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.25);box-shadow:0 4px 0 #17501f,0 6px 14px rgba(0,0,0,.15)}
.btn.blue{background:linear-gradient(#1c7ab8,#155f96);color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.25);box-shadow:0 4px 0 #0d4169,0 6px 14px rgba(0,0,0,.15)}
.btn[disabled]{opacity:.55}
.btn small{opacity:.9;font-size:.88em}
.icon{width:48px;height:48px;border-radius:14px;background:rgba(255,255,255,.9);font-size:22px;font-weight:800;box-shadow:0 3px 0 rgba(0,0,0,.12);flex:none}
.pill{background:rgba(255,255,255,.92);border-radius:999px;padding:7px 12px;font-weight:800;font-size:17px;box-shadow:0 3px 0 rgba(0,0,0,.1);white-space:nowrap}
button.pill{cursor:pointer;position:relative;min-height:48px}
button.pill::before{content:"";position:absolute;top:-6px;bottom:-6px;left:-4px;right:-4px}
.pill.sm{padding:5px 10px;font-size:17px}
.dot{position:absolute;top:4px;right:6px;width:11px;height:11px;border-radius:50%;background:#e03131;box-shadow:0 0 0 2px #fff}
/* карта мест */
.mh,.gh{display:flex;align-items:center;gap:8px;padding:10px 12px;padding-top:max(10px,env(safe-area-inset-top,0px));flex:none}
.logo{font-weight:900;font-size:21px;line-height:1.08;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.25);flex:1;min-width:0}
.hdr-r{display:flex;gap:6px;align-items:center}
.mapwrap{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:4px 12px 12px;-webkit-overflow-scrolling:touch}
.rankb{display:flex;justify-content:center;margin:2px 0 8px}
.rankb button{background:rgba(255,255,255,.85);border-radius:999px;padding:8px 16px;font-weight:800;font-size:17px;color:#2d4a57;min-height:48px}
/* полоса цели: к чему копим (карта, итоги рыбалки) */
.goalb{display:block;width:100%;text-align:left;background:#fffdf3;border-radius:16px;padding:9px 12px 10px;margin:2px 0 8px;box-shadow:0 3px 0 rgba(0,0,0,.12);font-weight:700;font-size:17px;line-height:1.25;color:#2d3436;min-height:48px}
.goalb .gr{display:block;font-weight:800;color:#6a4b00;margin-top:3px}
.goalb.ok{background:#e6f6e9;box-shadow:0 3px 0 #9ccca6}.goalb.ok .gr{color:#1f5e2c}
.gbar{display:block;height:10px;border-radius:5px;background:#e4e0d2;overflow:hidden;margin-top:6px}.gbar i{display:block;height:100%;border-radius:5px;background:linear-gradient(#f0b429,#e08a0c)}
.goalb.ok .gbar i,.gbar.g i{background:linear-gradient(#40c057,#2b8a3e)}
.card .goalb{background:#fff6dc;box-shadow:none;margin:10px 0 2px;font-size:16.5px}.card .goalb.ok{background:#e6f6e9}
.plc{position:relative;display:flex;width:100%;text-align:left;background:#fff;border-radius:18px;margin-bottom:10px;overflow:hidden;box-shadow:0 4px 0 rgba(0,0,0,.12),0 6px 16px rgba(0,0,0,.1);min-height:96px;padding:0}
.plc canvas{width:104px;height:auto;flex:none;display:block;align-self:stretch;object-fit:cover}
.plc .pi{flex:1;padding:9px 11px;min-width:0}
.plc b{display:block;font-size:18.5px;line-height:1.2}
.plc small{display:block;color:var(--muted);font-weight:600;font-size:17px;line-height:1.25;margin-top:3px}
.plc small.wr{color:#a8480a;font-weight:800}.plc .gbar{margin-top:5px}
.plc .fc{color:#1f6f8b;font-weight:800}
.plc.lock{background:#eef0ec}.plc.lock canvas{filter:grayscale(.7) brightness(.85)}
.plc .pr{display:inline-block;margin-top:5px;background:#ffe9a8;color:#6a4b00;border-radius:999px;padding:4px 11px;font-weight:900;font-size:17px}
.plc .pr.no{background:#e6e3da;color:#6b6b62}
.plc.new::after{content:"";position:absolute;top:8px;right:8px;width:11px;height:11px;border-radius:50%;background:#e03131}
.mnav{flex:none;padding:8px 12px;padding-bottom:max(10px,env(safe-area-inset-bottom,0px));background:rgba(255,255,255,.55);display:flex;flex-direction:column;gap:8px}
.nrow{display:flex;gap:8px}.nrow .btn{flex:1;padding:10px 6px;font-size:17px;position:relative;min-width:0;line-height:1.15}
.nrow .btn.sq{flex:1 1 0;line-height:1.05;font-size:22px;padding:6px 2px 7px}.nrow .btn.sq small{display:block;font-size:17px;font-weight:800;opacity:1;margin-top:2px}
.nrow.m4{gap:6px}.nrow.m4 .btn.sq{flex:1 1 auto;padding-left:3px;padding-right:3px}.nrow.m4 #btnMore{flex:0 1 auto;padding-left:8px;padding-right:8px}
.soc-set .btn{width:100%}.soc-o{display:flex;flex-direction:column;align-items:center;margin-top:12px;text-align:center}.soc-o span{font-size:15px;margin-bottom:6px}.soc-o .btn{padding:8px 14px;font-size:16px}
/* рыбалка */
#scr-fish{background:#6fa9c4}
#cv{position:absolute;top:0;left:0;width:100%;height:100%;display:block;touch-action:none}
#scr-fish .gh{position:relative;z-index:2;background:linear-gradient(rgba(0,0,0,.28),rgba(0,0,0,0))}
.gt{flex:1;min-width:0;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.5);font-weight:900;font-size:18px;line-height:1.15}
.gt .sub{font-size:17px;font-weight:700;opacity:.95;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gt div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fbar{position:absolute;left:0;right:0;bottom:0;z-index:2;display:flex;gap:8px;align-items:flex-end;padding:8px 12px;padding-bottom:max(10px,env(safe-area-inset-bottom,0px));pointer-events:none}
.fbar>*{pointer-events:auto}
#baitBtn{background:rgba(255,255,255,.93);border-radius:14px;padding:6px 10px;font-weight:800;font-size:17px;box-shadow:0 3px 0 rgba(0,0,0,.15);text-align:left;line-height:1.15;min-height:48px;max-width:46%}
#baitBtn small{display:block;font-size:14.5px;font-weight:700;color:var(--muted)}
#hint{flex:1;text-align:center;color:#fff;font-weight:800;font-size:17px;line-height:1.25;text-shadow:0 1px 3px rgba(0,0,0,.7),0 0 12px rgba(0,0,0,.35);pointer-events:none;min-height:24px;align-self:center}
#fCasts{flex:none;align-self:center;font-size:17px;padding:6px 10px}
#hint.big{color:#ffe066;font-size:24px;font-weight:900}
#say{position:absolute;z-index:3;max-width:66%;background:#fffdf3;border-radius:14px;padding:8px 11px;font-weight:700;font-size:16.5px;line-height:1.3;box-shadow:0 4px 14px rgba(0,0,0,.25);opacity:0;transition:opacity .3s;pointer-events:none;color:#2a3338}
#say.on{opacity:1}
#say b{display:block;font-size:15px;color:#9c5a12;margin-bottom:1px}
#say::after{content:"";position:absolute;bottom:-8px;left:22px;border:8px solid transparent;border-top-color:#fffdf3;border-bottom:0}
#say.r::after{left:auto;right:22px}
#catch{position:absolute;left:50%;top:44%;z-index:4;transform:translate(-50%,-50%);width:88%;max-width:360px;background:var(--card);border-radius:22px;padding:12px 14px 14px;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.35);display:none}
#catch.on{display:block;animation:pop .28s ease-out}
#catch canvas{width:100%;height:auto;display:block}
#catch h3{margin:2px 0 0;font-size:22px}
#catch .w{font-size:19px;font-weight:900;color:#1f6f8b;margin:2px 0}
#catch .tags{display:flex;flex-wrap:wrap;justify-content:center;gap:5px;margin:4px 0 8px}
#catch .tags span{background:#fff0c2;color:#6a4b00;border-radius:999px;padding:3px 10px;font-weight:800;font-size:15.5px}
#catch .tags span.g{background:#d3f2d8;color:#1f5e2c}
#catch p{margin:2px 0 8px;color:var(--muted);font-weight:600;font-size:16px;line-height:1.3}
/* снасти, альбом */
.scr2{background:linear-gradient(#cfe8f3,#eef6ec)}
.scr2 .gh{background:#2f6b86}
.scr2 .gt{text-shadow:none}
.tabs{display:flex;gap:6px;padding:8px 12px 0;flex:none}
.tabs button{flex:1;background:rgba(255,255,255,.7);border-radius:12px 12px 0 0;padding:10px 4px;font-weight:800;font-size:17px;color:#3d5561;min-height:48px;position:relative;min-width:0}
.tabs button.on{background:#fff;color:#1f4c61}
.list{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:10px 12px 16px;background:#fff;margin:0 12px 12px;border-radius:0 0 16px 16px}
.ti{display:flex;flex-wrap:wrap;align-items:center;padding:11px 2px;border-bottom:1px solid #eceae2}
.ti:last-child{border-bottom:0}
.ti .ic{font-size:30px;width:40px;text-align:center;flex:none;margin-right:8px}.ti .ic canvas{width:40px;height:44px;display:block}
.ti .tx{flex:1;min-width:0;margin-right:8px}
.ti .tx b{display:block;font-size:17px;line-height:1.2}
.ti .ds{display:block;flex-basis:100%;color:var(--muted);font-weight:600;font-size:17px;line-height:1.3;margin-top:5px}
.lvl{display:flex;gap:3px;margin-top:5px}.lvl i{width:18px;height:7px;border-radius:3px;background:#dde2e4}.lvl i.on{background:#2b8a3e}
.ti .btn{flex:none;padding:8px 12px;font-size:17px;min-height:48px;white-space:nowrap}
.ti .have{flex:none;font-weight:800;color:#237032;font-size:17px;min-width:44px;text-align:center}
.ti.hl{background:#fff6d6;border-radius:12px;animation:hl 1.1s ease-in-out 3}
@keyframes hl{50%{background:#ffe08a}}
.sect{font-weight:900;color:#2f6b86;font-size:17px;line-height:1.25;margin:14px 2px 6px}
.sect:first-child{margin-top:0}
.alb{display:flex;flex-wrap:wrap;justify-content:space-between}
.fc2{width:49%;background:#f4f1e8;border-radius:14px;margin-bottom:8px;padding:6px 4px 8px;text-align:center;position:relative;min-height:48px}
.fc2 canvas{width:100%;max-width:150px;height:auto;display:block;margin:0 auto}
.fc2 b{display:block;font-size:17px;line-height:1.15;min-height:39px}
.fc2 small{display:block;font-size:17px;color:var(--muted);font-weight:700;line-height:1.2}
.fc2 .st{display:block;font-size:17px;line-height:1.1;color:#e8a90c;letter-spacing:1px}.fc2 .st em{font-style:normal;color:#cfcabb}
.fc2.no b{color:#8a8f92}
.fc2 .tr{position:absolute;top:4px;right:6px;font-size:17px}
.fc2.leg{background:#fff1c9}
.fc2.gd{background:linear-gradient(#fff6d0,#ffe08a);box-shadow:0 0 0 3px #e0a400 inset}
@media (min-width:500px){.fc2{width:32%}}
/* награда за набор в альбоме, строка «уют берега» */
.setr{display:flex;align-items:center;background:#eef0e8;border-radius:12px;padding:8px 10px;margin:0 0 6px;font-weight:700;font-size:17px;line-height:1.25;color:#2d3436;min-height:48px}
.setr span{flex:1;min-width:0;margin-right:8px}.setr .btn{flex:none;padding:8px 12px;min-height:48px;font-size:17px;white-space:nowrap}
.setr.rdy{background:#fff0c2}.setr.done{background:#d9f2dd;color:#1f5e2c}.setr i{font-style:normal;font-weight:900;flex:none}
/* окна */
.modal,.ad{position:absolute;top:0;right:0;bottom:0;left:0;display:none;align-items:center;justify-content:center;background:rgba(15,30,40,.55);z-index:10;padding:16px}
.modal{overflow-y:auto;overscroll-behavior:contain}
.modal.on,.ad.on{display:flex}
.card{background:var(--card);border-radius:24px;padding:20px 16px 16px;width:100%;max-width:390px;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.3);animation:pop .25s ease-out;margin:auto}
@keyframes pop{from{transform:scale(.88);opacity:0}}
#catch.on{animation-name:popc}
@keyframes popc{from{transform:translate(-50%,-50%) scale(.88);opacity:0}}
.card h2{margin:0 0 6px;font-size:23px}
.card p{margin:6px 0;color:var(--muted);font-weight:600;font-size:17px;line-height:1.35}
.card canvas.fish{width:100%;max-width:300px;height:auto}
.row{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.row2{display:flex;gap:8px}.row2>*{flex:1}
.coins-won{font-size:22px;font-weight:900;color:#b07c00!important}
.quote{background:#fff3d6;border-radius:14px;padding:8px 12px;color:#5a4a2a!important;text-align:left}
.quote b{display:block;font-size:15px;color:#9c5a12}
.goal{font-size:16.5px!important;margin:8px 0 2px!important;color:#2d3436!important;font-weight:700}
.goal.tipl{background:#e6f6e9;border-radius:12px;padding:8px 10px;color:#1f5e2c!important}
.ctab{width:100%;border-collapse:collapse;margin:6px 0;font-size:17px;text-align:left}
.ctab td{padding:5px 4px;border-bottom:1px solid #eee8da;font-weight:700}
.ctab td:last-child{text-align:right;white-space:nowrap;color:#1f6f8b}
.ctab tr.lost td{color:#8a8f92;font-weight:600}
.ad{background:#111;color:#fff;text-align:center;font-size:22px;font-weight:800}
.ad small{font-weight:500;opacity:.7;font-size:14px}
.adt{font-size:54px;margin-top:16px}
.toast{position:absolute;left:50%;top:84px;transform:translateX(-50%);background:rgba(0,0,0,.84);color:#fff;padding:10px 14px;border-radius:12px;font-weight:700;font-size:16px;line-height:1.3;opacity:0;transition:opacity .25s;pointer-events:none;z-index:20;text-align:center;width:max-content;max-width:90%}
.toast.on{opacity:1}.toast.low{top:auto;bottom:14px}
.set{display:flex;align-items:center;justify-content:space-between;background:#eef0e8;border-radius:14px;padding:10px 12px;margin-top:8px;font-weight:700;font-size:16px;text-align:left;color:#2d3436;width:100%;min-height:50px}
.set i{font-style:normal;font-weight:800;color:#fff;background:#2b8a3e;border-radius:999px;padding:3px 12px;min-width:56px;text-align:center;flex:none}.set i.off{color:#57606f;background:#dcd8cc}.set i.go,.pay .set i{background:none;color:#237032;padding:0;min-width:0}
.set small{font-weight:600;color:#57606f;font-size:15px}
.pay{margin-top:12px;text-align:left}.pay h3{font-size:16px;margin:0 0 2px;color:#2d3436}.pay .set span{padding-right:10px}.pay .set small{font-weight:600}
.pbuy b{white-space:nowrap;color:#1f5e2c;font-size:17px}.pcur{width:18px;height:18px;vertical-align:-3px;margin-left:3px}.pown i{color:#237032}
.about{font-size:16px!important;text-align:left}
.how{text-align:left}.how p{font-size:17px;margin:7px 0;color:#2d3436}
.streak{display:flex;flex-wrap:wrap;justify-content:space-between;margin:12px 0 4px}
.sd{width:23.5%;margin-bottom:6px;background:#eef0e8;border-radius:12px;padding:6px 2px;font-weight:800;font-size:17px;line-height:1.2;position:relative;color:#57606f}
.sd small{display:block;font-size:14.5px;font-weight:700}
.sd.done{background:#c8efcf;color:#2b7a3f}
.sd.done::after{content:"✓";position:absolute;top:2px;right:6px;font-size:13px}
.sd.today{background:linear-gradient(#ffd36e,#ff9f43);color:#3a2206;box-shadow:0 3px 0 #c8741d}
.sd.d7{width:49%;background:#ffe9b8}
.sd .ic{font-size:20px;display:block}
.lb{max-height:46vh;overflow:auto;overscroll-behavior:contain;margin-top:8px;text-align:left}.lbr{display:flex;gap:10px;align-items:center;padding:6px 8px;border-radius:10px}.lbr:nth-child(odd){background:rgba(0,0,0,.05)}.lbr.me{background:#ffe7a3}.lbr b{width:28px;text-align:right}.lbr span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.lbr i{font-style:normal;font-weight:800}
.ach{display:flex;align-items:center;gap:10px;background:#eef0e8;border-radius:12px;padding:8px 10px;margin-top:6px;text-align:left}
.ach.done{background:#c8efcf}.ach b{display:block;font-size:17px}.ach small{color:#57606f;font-weight:600;font-size:15.5px}.ach .ai{font-size:24px;flex:none;width:32px;text-align:center}
.ach.no .ai{filter:grayscale(1);opacity:.5}
.bait{display:flex;align-items:center;gap:10px;width:100%;background:#eef0e8;border-radius:14px;padding:9px 10px;margin-top:7px;text-align:left;font-weight:700;min-height:54px}
.bait.on{background:#d3f2d8;box-shadow:0 0 0 3px #2b8a3e inset}
.bait .ic{font-size:26px;width:34px;text-align:center;flex:none}
.bait span{flex:1;min-width:0}
.bait small{display:block;color:var(--muted);font-weight:600;font-size:15px}
.bait i{font-style:normal;font-weight:900;color:#1f6f8b;flex:none}
.bait[disabled]{opacity:.5}
.bait .ok{color:#237032;font-size:14.5px;font-weight:800}
.nw{white-space:nowrap}
#fx{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:15;display:none}
/* «сочный» улов: лента-событие, лучи за рыбой */
.rib{display:inline-block;background:linear-gradient(#ffd43b,#f59f00);color:#4a2c00;font-weight:900;font-size:17px;letter-spacing:.5px;border-radius:999px;padding:4px 14px;margin:0 0 4px;box-shadow:0 3px 0 #b86e00;animation:stamp .45s cubic-bezier(.2,1.6,.4,1)}
.rib.leg{background:linear-gradient(#ffe066,#ff922b);font-size:19px}.rib.nw2{background:linear-gradient(#8ce99a,#40c057);color:#0b3d16;box-shadow:0 3px 0 #237032}
@keyframes stamp{from{transform:scale(2.2) rotate(-8deg);opacity:0}}
.rz{position:relative;overflow:hidden;border-radius:16px}.rz canvas.fi{position:relative;z-index:1}
.rz .rays{position:absolute;left:50%;top:50%;width:360px;height:360px;margin:-180px 0 0 -180px;animation:spin 16s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#catch.big{box-shadow:0 0 0 4px #ffd43b,0 12px 40px rgba(0,0,0,.4)}
.newit{font-size:60px;line-height:1.15}.newit canvas{display:block;margin:0 auto;border-radius:16px;max-width:100%}
.wkp{display:flex;justify-content:space-between;margin:10px 0 4px}.wkp i{flex:1;margin:0 2px;height:34px;border-radius:9px;background:#e9e6da;font-style:normal;font-weight:900;font-size:17px;line-height:34px;color:#8a8f92;text-align:center}
.wkp i.on{background:#40c057;color:#fff}.wkp i.gf{box-shadow:0 0 0 2px #f59f00 inset}
.tmr{background:#eaf3fb;border-radius:12px;padding:8px 10px;color:#1c4f73!important}
body.calm .card,body.calm #catch.on,body.calm .rib,body.calm .rz .rays,body.calm .ti.hl{animation:none}
@media (prefers-reduced-motion:reduce){.card,#catch.on,.rib,.rz .rays,.ti.hl{animation:none}}
@media (max-width:400px){.logo{font-size:19px}}
@media (max-height:660px){.card{padding:14px 12px 12px}.card h2{font-size:21px;margin-bottom:2px}.ctab td{padding:3px 4px}.card p{margin:4px 0}.row{margin-top:8px;gap:8px}.goal{margin:5px 0 2px!important}.card .goalb{margin-top:6px;padding:7px 10px}.quote{padding:6px 10px}.newit{font-size:46px}}

function setReward(kind,pi){return SET_R[pi]*(kind==='tr'?2:1);}

const MAST=[[5,5],[20,15],[60,40]];
function mastOf(n){let k=0;for(const m of MAST)if(n>=m[0])k++;return k;}
const WEEK_R=[[3,60],[5,120],[7,250]];
// золотая рамка в альбоме — сток монет после «Берега»: цена по месту (300…1350), легенды — 2000; только для пойманных
function gildPrice(id){if(LEG[id])return 2000;const i=PLACES.findIndex(p=>p.fish.indexOf(id)>=0);return 300+150*Math.max(0,i);}
const FIRST_BONUS=30; // дед Митяй — за первый улов (на первую покупку)
const TODS=['morning','day','evening','night'],TOD_N={morning:['Утро','Morning'],day:['День','Day'],evening:['Вечер','Evening'],night:['Ночь','Night']};
const WXS=['sun','cloud','rain','wind','fog'],WX_N={sun:['Ясно','Sunny'],cloud:['Облачно','Cloudy'],rain:['Дождик','Rain'],wind:['Ветрено','Windy'],fog:['Туман','Fog']},WX_IC={sun:'☀️',cloud:'⛅',rain:'🌧',wind:'🌬',fog:'🌁'};
const TOD_M={morning:1.2,day:.85,evening:1.2,night:.9},WX_M={sun:.9,cloud:1.1,rain:1.15,wind:.95,fog:1.05};
function fishOf(id){return FISH[id]||LEG[id]||null;}
// цена улова: pm — множитель места (дальние водоёмы — дороже, как и путёвка туда)
function price(f,w,pi){return Math.max(1,Math.round((f.pb+f.pk*w)*(f.leg?1:(PLACES[pi]&&PLACES[pi].pm)||1)));}
function trophyW(f){return f.w[0]+.75*(f.w[1]-f.w[0]);}
// время суток по часам игрока, погода — по дате, часу и месту (одинаковая у всех, «прогноз» честный)
function todOf(h){return h>=5&&h<10?'morning':h>=10&&h<17?'day':h>=17&&h<22?'evening':'night';}
function wxOf(dayN,h,pi){const R=rng(dayN*977+Math.floor(h/3)*131+pi*7919+3);const x=R();return x<.34?'sun':x<.6?'cloud':x<.76?'rain':x<.9?'wind':'fog';}
function biteMul(tod,wx){return TOD_M[tod]*WX_M[wx];}
// кто клюнет: df — доля дальности заброса (0 — у берега, 1 — максимум удочки). Вернёт {f,w} или {junk} или null (на эту наживку здесь не берут)
function baitWorks(pi,bait){return PLACES[pi].fish.some(id=>(FISH[id].b[bait]||0)>0);}
function pickFish(pi,bait,tod,wx,df,R){const P=PLACES[pi];
  const L=LEG[P.leg];if(L&&bait===L.bait&&L.tod.indexOf(tod)>=0&&df>.55&&R()<1/30)return {f:L,w:Math.round((L.w[0]+(L.w[1]-L.w[0])*R())*1000)/1000};
  let tot=0;const ws=P.fish.map(id=>{const f=FISH[id],big=f.w[1]>2.5;let x=f.r*(f.b[bait]||0)*(f.t&&f.t[tod]!=null?f.t[tod]:1)*(big?(.45+df*1.1):(1.2-df*.4));if(wx==='rain'&&f.b.live)x*=1.2;tot+=x;return x;});
  if(tot<=0)return null;
  if(R()<JUNK_P&&bait!=='spoon'){const ks=Object.keys(JUNK);return {junk:ks[Math.floor(R()*ks.length)]};}
  let u=R()*tot,k=0;for(;k<ws.length-1;k++){u-=ws[k];if(u<0)break;}
  const f=FISH[P.fish[k]],big=bait==='live'||bait==='corn'||bait==='spoon'?.35:0;
  const e=Math.max(1.1,2.5-.9*df-big),w=f.w[0]+(f.w[1]-f.w[0])*Math.pow(R(),e);
  return {f,w:Math.max(.005,Math.round(w*1000)/1000)};}
// сколько ждать поклёвки (с)
function waitTime(tod,wx,R){return clamp((2.2+R()*4.6)/biteMul(tod,wx),1.6,9);}
// окно подсечки (с)
function hookWin(f,calm){return (f.leg?.75:f.w[1]>2.5?.85:1)+(calm?.5:0);}

/* вываживание. Мелочь (сила рыбы меньше трети прочности снасти) идёт к берегу сама — палец только ускоряет.
   Крупная: палец держит — подматываем (натяжение растёт), отпустил — леска свободнее, но рыба уходит дальше.
   Натяжение > 1 дольше 0,45 с (спокойный режим — 0,9 с) — обрыв. Слабина дольше 4 с — рыба сходит. Дальше maxD — ушла. */
const STRICT_FROM=2; // с какого места (Волга) вываживание строгое; пруд и речка — как в выпущенной v0.1 (решение владельца 02.10)
function fightNew(f,w,dist,tk,calm,R,easy){const B=f.s*Math.pow(w,.55),sy=STY[f.st],need=B*(sy[0]+.22)+.25,cap0=TACKLE.line.kg[tk.line]*TACKLE.rod.k[tk.rod]*(calm?1.25:1),m=need/cap0;
  const o={B,D:dist,D0:dist,maxD:Math.max(dist+14,24),E:1,T:0,rush:0,next:1.2+R()*1.5,warn:false,brk:0,slack:0,t:0,small:w<.6&&!f.leg,res:null,jump:0,calm:!!calm,easy:!!easy};
  // easy (пруд, речка): формула v0.1 — прочность снасти как есть, терпит 0,45 с (спокойный режим 0,9); со снастью по рыбе красной зоны нет вовсе
  if(easy){o.cap=cap0;o.gear=1.2/m;o.bmax=calm?.9:.45;return o;}
  // строгое (с Волги): need — натяжение на рывке, если держать палец; m — во сколько раз оно больше прочности снасти. Пик сжат: у рыбы от ~4 кг рывок всегда
  // заходит в красную зону (lo…), слабая снасть — выше и короче терпит, но шанс есть; совсем не по снасти (m > 3,5) — рвёт и на отпущенной леске (аудит 40)
  const lo=Math.min(1.2,.8+.1*B),pk=m<=lo?lo:Math.min(m,lo+(f.leg?.9:.45)*(1-Math.exp(-(m-lo)/1.5))+Math.max(0,m-3.5)*.6);
  o.cap=need/pk;o.gear=lo/m;o.bmax=(calm?.9:.45)*clamp(lo/m,.9,1.4);return o;}
function fightStep(ft,f,hold,dt,R,tk){if(ft.res)return ft.res;ft.t+=dt;
  const spd=TACKLE.reel.spd[tk.reel];
  if(ft.small){ft.D-=dt*(2+spd)*(hold?1.5:1.1);ft.T=.12+.08*Math.sin(ft.t*9);if(ft.D<=.8)ft.res='ok';return ft.res;}
  const sy=STY[f.st];
  if(ft.rush>0){ft.rush-=dt;if(ft.rush<=0){ft.rush=0;ft.next=sy[1]+R()*(sy[2]-sy[1]);}}
  else{ft.next-=dt;if(ft.next<=0){ft.rush=(sy[3]+R()*(sy[4]-sy[3]))*(.6+.4*ft.E);if(f.st==='jump'&&R()<.55)ft.jump=.9;}}
  if(ft.jump>0)ft.jump=Math.max(0,ft.jump-dt);
  ft.warn=ft.rush<=0&&ft.next<.4;
  const P=ft.B*(.35+.65*ft.E)*(ft.rush>0?sy[0]:.5),raw=hold?P+.22*ft.B+.25:P*.3,tgt=raw/ft.cap;
  ft.T+=(tgt-ft.T)*Math.min(1,dt*(hold?6:4));
  const sw=(1+f.s)*(.3+.7*ft.E);
  ft.D+=hold?dt*(-spd*(ft.rush>0?.25:1)+(ft.rush>0?sw*.9:sw*.12)):dt*(ft.rush>0?sw*1.1:sw*.2);
  ft.D=Math.max(0,ft.D);
  ft.E=Math.max(0,ft.E-dt*(.03+.22*ft.T*ft.T)/(1+.25*Math.sqrt(ft.B)));
  if(ft.T>1)ft.brk+=dt;else ft.brk=Math.max(0,ft.brk-dt*2);
  if(ft.T<.1&&!hold)ft.slack+=dt;else ft.slack=Math.max(0,ft.slack-dt*2);
  if(ft.brk>ft.bmax)ft.res='break';
  else if(ft.slack>4)ft.res='slack';
  else if(ft.D>ft.maxD)ft.res='gone';
  else if(ft.D<=1)ft.res='ok';
  else if(ft.t>120)ft.res='gone';
  return ft.res;}

/* бот: один заброс целиком (поклёвка → подсечка → вываживание). skill 0…1: реакция пальца .5….2 с (как у человека: решил отпустить/зажать — палец
   срабатывает с задержкой), порог натяжения .7….9. botFight — только вываживание (его же гоняет tools/check.js).
   Возвращает {kind:'fish'|'junk'|'miss'|'none'|'break'|'slack'|'gone', f, w, t — секунд} */
function botFight(f,w,d,tk,calm,skill,R,easy){const ft=fightNew(f,w,d,tk,calm,R,easy),thr=.7+.2*skill,react=.5-.3*skill;let hold=true,pend=-1,res=null;const dt=1/30;
  for(let i=0;i<30*130&&!res;i++){if(skill>=0){const want=ft.T<thr&&!(ft.warn&&skill>.6)&&!(ft.rush>0&&ft.T>thr*.8);
      if(want!==hold){if(pend<0)pend=react*(.8+.4*R());else{pend-=dt;if(pend<=0){hold=want;pend=-1;}}}else pend=-1;}
    res=fightStep(ft,f,hold,dt,R,tk);}
  return {res,t:ft.t,small:ft.small};}
function botCast(pi,bait,tod,wx,tk,calm,skill,R,dist){
  const maxd=TACKLE.rod.dist[tk.rod],d=dist!=null?dist:maxd*(.55+.45*R()),df=d/maxd;let t=1+waitTime(tod,wx,R);
  const pk=pickFish(pi,bait,tod,wx,df,R);if(!pk)return {kind:'none',t:t+6};
  if(pk.junk)return {kind:'junk',junk:pk.junk,t:t+3};
  const f=pk.f,react=.55-.25*skill+(R()-.5)*.25;t+=1.5;
  if(react>hookWin(f,calm))return {kind:'miss',f,w:pk.w,t};
  const r=botFight(f,pk.w,d,tk,calm,skill,R,pi<STRICT_FROM);t+=r.t+2;
  return r.res==='ok'?{kind:'fish',f,w:pk.w,t}:{kind:r.res||'gone',f,w:pk.w,t};}

    for(let i=0;i<n;i++){const a=-Math.PI/2+(Math.random()-.5)*Math.PI*1.5,v=u*(38+Math.random()*60)*pow;
      FX.ps.push({x:x*r.width,y:y*r.height,vx:Math.cos(a)*v,vy:Math.sin(a)*v-u*20*pow,g:u*130,life:1+Math.random()*.7,t:0,rot:Math.random()*7,vr:(Math.random()-.5)*12,
        k:kind==='coin'?'coin':kind==='star'||Math.random()<.35?'star':'rect',s:u*(1.1+Math.random()*1.3),c:cols[Math.floor(Math.random()*cols.length)]});}
    if(FX.ps.length>220)FX.ps=FX.ps.slice(-220);
    c.style.display='block';if(!FX.raf){FX.last=performance.now();FX.raf=requestAnimationFrame(FX.loop);}},
  loop(t){FX.raf=0;const c=document.getElementById('fx'),g=c.getContext('2d'),dt=Math.min(.05,(t-FX.last)/1000||.016);FX.last=t;
    g.setTransform(FX.dp,0,0,FX.dp,0,0);g.clearRect(0,0,FX.W,FX.H);
    for(const p of FX.ps){p.t+=dt;p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=1-dt*.9;p.rot+=p.vr*dt;
      const al=Math.min(1,(p.life-p.t)*2.5);if(al<=0)continue;g.save();g.globalAlpha=al;g.translate(p.x,p.y);g.rotate(p.rot);
      if(p.k==='coin'){g.scale(Math.abs(Math.cos(p.rot))*.8+.2,1);g.fillStyle='#f5b301';g.beginPath();g.arc(0,0,p.s*1.2,0,7);g.fill();g.fillStyle='#ffe58a';g.beginPath();g.arc(0,0,p.s*.75,0,7);g.fill();}
      else if(p.k==='star'){g.fillStyle=p.c;g.beginPath();for(let i=0;i<10;i++){const rr2=i%2?p.s*.55:p.s*1.35,a=i*Math.PI/5;g.lineTo(Math.cos(a)*rr2,Math.sin(a)*rr2);}g.closePath();g.fill();}
      else{g.fillStyle=p.c;g.fillRect(-p.s*.6,-p.s*.35,p.s*1.2,p.s*.7);}
      g.restore();}
    FX.ps=FX.ps.filter(p=>p.t<p.life&&p.y<FX.H+40);
    if(FX.ps.length&&!paused)FX.raf=requestAnimationFrame(FX.loop);else{FX.ps=[];g.clearRect(0,0,FX.W,FX.H);c.style.display='none';}}};
// счётчик монет «набегает» (в спокойном режиме — сразу)
function countUp(el,n,pre,suf){if(!el)return;pre=pre||'';suf=suf||'';if(calm()||n<4||window.__noFx){el.textContent=pre+n+suf;return;}
  const t0=performance.now(),dur=Math.min(900,350+n*6);let lastTick=0;
  const step=t=>{if(!el.parentNode)return;const k=Math.min(1,(t-t0)/dur),v=Math.round(n*(1-Math.pow(1-k,2)));el.textContent=pre+v+suf;if(t-lastTick>70&&k<1){lastTick=t;SND.tick();}if(k<1)requestAnimationFrame(step);};
  el.textContent=pre+'0'+suf;requestAnimationFrame(step);}

};

/* ================= покупки за деньги: Яндекс Игры (ysdk.payments) и VK Игры (VKWebAppShowOrderBox) — общий модуль (одинаковый в 5 играх) =================
   Товары игры — PAY_ITEMS (выше), id совпадают с id в консоли Яндекса («Инап-покупки») и в hobby-pay/catalog.json (VK).
   Кнопок покупок НЕТ совсем, если платежи недоступны: нет SDK/моста (мак), каталог Яндекса пуст, VK не поддерживает оплату (iOS).
   Постоянные (perm) — флаг S.buy[id], разовый бонус монет — один раз на игрока (S.buyB). Выдача — только после подтверждения площадки.
   Яндекс: цена и значок валюты — только из getCatalog; расходуемые: выдать → сохранить (облако сразу) → consumePurchase;
     незавершённые при запуске довыдаём (getPurchases). Токены выданных — S.payT (и в облаке), сбой consume не даст выдать второй раз.
   VK: на кнопке число голосов (PAY_ITEMS.vk). success:true + order_id → выдать → сохранить → стереть ключ pay_<order_id>.
     Страховка: сервер vk-pay при оплате пишет в хранилище VK игрока pay_<order_id>=id (расходуемые) и own_<id>=1 (постоянные);
     при запуске читаем их и довыдаём. Выданные order_id — S.payV (последние 30); покупка без order_id оставляет метку «x:<id>»,
     которая «съест» первый чужой pay_ этого товара — второй раз не выдастся.
   Мак: ?paytest=1 — имитация Яндекса (localStorage «paytest»), ?vk=1&paytest=1 — имитация VK с сервером (localStorage «paytestvk»),
   ?paytest=fail — отказ. В настоящем VK (vk_app_id) и в Яндексе заглушек нет */
const payObj=x=>!!x&&typeof x==='object'&&!Array.isArray(x);
const PAY={on:false,p:null,v:null,list:[],busy:false,
  test:/[?&]paytest=/.test(location.search),
  // запуск: после SDK/моста и облака. Незавершённые покупки обрабатываем, даже если каталог не пришёл
  async init(){if(PAY.p||PAY.v)return;
    if(PLAT==='vk')return PAY.initVK();
    try{if(ysdk)PAY.p=ysdk.getPayments?await payT(ysdk.getPayments({signed:false})):ysdk.payments;
      else if(PAY.test&&!window.YaGames)PAY.p=payStub();}catch(e){PAY.p=null;}
    if(!PAY.p)return;
    try{await PAY.restore();}catch(e){}
    try{const c=await payT(PAY.p.getCatalog());PAY.list=(Array.isArray(c)?c:[]).filter(x=>x&&PAY_ITEMS[x.id]);}catch(e){PAY.list=[];}
    PAY.on=PAY.list.length>0;if(PAY.on)payAfter();},
  async initVK(){
    if(VK){let ok=false;try{ok=!!(VK.supportsAsync&&await payT(VK.supportsAsync('VKWebAppShowOrderBox'),8000));}catch(e){}if(ok)PAY.v=payVK();}
    else if(PAY.test&&!VK_REAL)PAY.v=payStubVK();
    if(!PAY.v)return;
    try{await PAY.restore();}catch(e){}
    PAY.list=Object.keys(PAY_ITEMS).filter(id=>PAY_ITEMS[id].vk>0).map(id=>({id}));
    PAY.on=PAY.list.length>0;if(PAY.on)payAfter();},
  own(id){return !!(payObj(S.buy)&&S.buy[id]);},
  item(id){return PAY.list.find(x=>x.id===id)||null;},
  give(id){const it=PAY_ITEMS[id];
    if(it.perm){if(!payObj(S.buy))S.buy={};S.buy[id]=1;
      if(it.bonus){if(!payObj(S.buyB))S.buyB={};if(!S.buyB[id]){S.buyB[id]=1;payAdd(it.bonus);}}}
    else payAdd(it.n||0);
    if(it.give)it.give();},
  // при запуске и «Восстановить покупки»: постоянные — выдать, если флага нет; расходуемые — довыдать и отметить
  async restore(){let got=0;
    if(PAY.v)got=await PAY.restoreVK();
    else{const ps=await payT(PAY.p.getPurchases());
      for(const x of (Array.isArray(ps)?ps:[])){const it=x&&PAY_ITEMS[x.productID];if(!it)continue;
        if(it.perm){if(!PAY.own(x.productID)){PAY.give(x.productID);got=1;}}else if(await PAY.credit(x))got=1;}}
    if(got){save();payFlush();payAfter();toast('Покупка зачислена',2600);}
    return got;},
  // VK: ключи own_<id> (постоянные, не стираем) и pay_<order_id> (расходуемые: выдать, сохранить, стереть)
  async restoreVK(){const ks=await PAY.v.keys();let got=0;const done=[];if(!Array.isArray(S.payV))S.payV=[];
    for(const k of ks){const m=/^(own|pay)_(.+)$/.exec(k.key||'');if(!m||!k.value)continue;
      if(m[1]==='own'){const it=PAY_ITEMS[m[2]];if(it&&it.perm&&!PAY.own(m[2])){PAY.give(m[2]);got=1;}continue;}
      const id=String(k.value),it=PAY_ITEMS[id];if(!it)continue;
      if(S.payV.indexOf(m[2])<0){const x=S.payV.indexOf('x:'+id); // покупка без order_id уже выдана — это её заказ
        if(x>=0)S.payV[x]=m[2];else{PAY.give(id);payMark(m[2]);got=1;}}
      done.push(k.key);}
    if(done.length){save();payFlush();for(const k of done)try{await PAY.v.clear(k);}catch(e){}}
    return got;},
  // расходуемая: выдать (если этот токен ещё не выдавали), сохранить в облако и только потом consumePurchase
  async credit(x){const t=String(x.purchaseToken||'');if(!Array.isArray(S.payT))S.payT=[];let fresh=false;
    if(!t||S.payT.indexOf(t)<0){PAY.give(x.productID);if(t)S.payT.push(t);if(S.payT.length>30)S.payT=S.payT.slice(-30);save();payFlush();fresh=true;}
    try{if(t)await payT(PAY.p.consumePurchase(t));}catch(e){}
    return fresh;},
  async buy(id){const it=PAY_ITEMS[id];if(!it||PAY.busy||!PAY.on||!PAY.item(id)||(it.perm&&PAY.own(id)))return;PAY.busy=true;payPause(true);
    try{if(PAY.v){const r=await PAY.v.order(id);if(!r||!r.success)throw new Error('cancel');
        const oid=r.order_id!=null?String(r.order_id):'';if(!Array.isArray(S.payV))S.payV=[];
        if(!oid||S.payV.indexOf(oid)<0){PAY.give(id);payMark(oid||'x:'+id);}
        save();payFlush();if(oid)PAY.v.clear('pay_'+oid).catch(()=>{});}
      else{const x=await PAY.p.purchase({id});
        if(it.perm){PAY.give(id);save();payFlush();}
        else await PAY.credit(x&&x.productID===id?x:{productID:id,purchaseToken:x&&x.purchaseToken});}
      SND.coin();toast(it.done||'Готово! Спасибо за покупку',2800);payAfter(id);}
    catch(e){toast('Покупка не состоялась',2200);}
    finally{PAY.busy=false;payPause(false);}},
  // «Восстановить покупки» (Об игре): заново читаем getPurchases / ключи VK
  async again(){if(!(PAY.p||PAY.v)||PAY.busy)return;PAY.busy=true;let got=0;try{got=await PAY.restore();}catch(e){}PAY.busy=false;if(!got)toast('Покупки проверены — всё на месте',2400);},
  // цена: VK — число голосов (требование VK); Яндекс — из каталога: число + значок валюты (getPriceCurrencyImage), иначе готовая строка price
  price(pr){if(PAY.v){const n=PAY_ITEMS[pr.id].vk,a=n%10,b=n%100;return n+' '+(a===1&&b!==11?'голос':a>=2&&a<=4&&(b<12||b>14)?'голоса':'голосов');}
    let img='';try{img=pr.getPriceCurrencyImage?pr.getPriceCurrencyImage('svg'):'';}catch(e){}
    return img&&pr.priceValue?payEsc(pr.priceValue)+'<img class="pcur" src="'+payEsc(img)+'" alt="">':payEsc(pr.price||pr.priceValue||'');},
  row(pr){const it=PAY_ITEMS[pr.id],own=it.perm&&PAY.own(pr.id),txt='<span>'+it.ic+' '+payEsc(it.name)+'<br><small>'+payEsc(it.desc)+'</small></span>';
    return own?'<div class="'+PAY_ROW+' pown">'+txt+'<i>куплено</i></div>':'<button class="'+PAY_ROW+' pbuy" data-pid="'+payEsc(pr.id)+'">'+txt+'<b>'+PAY.price(pr)+'</b></button>';},
  // список товаров (ids — только эти, по порядку каталога); owned=false — без уже купленных

function hx(c){c=c.replace('#','');return [parseInt(c.slice(0,2),16),parseInt(c.slice(2,4),16),parseInt(c.slice(4,6),16)];}
function mixH(a,b,t){const A=hx(a),B=hx(b);return '#'+A.map((v,i)=>Math.round(v+(B[i]-v)*t)).map(v=>(v<16?'0':'')+v.toString(16)).join('');}

function pal(look,tod,wx){const sk=SKY[tod],k=WXG[wx],gc=tod==='night'?'#1c2433':WXC[wx];
  const top=mixH(sk[0],gc,k),bot=mixH(sk[1],gc,k*.9),li=LIGHT[tod]*(1-k*.25);
  const tint=c=>{let x=shadeH(c,li);if(tod==='night')x=mixH(x,'#1a2a55',.3);else if(tod==='evening')x=mixH(x,'#ff9a5a',.08);else if(tod==='morning')x=mixH(x,'#ffc89a',.06);return x;};
  const far=c=>mixH(tint(c),bot,.28+(wx==='fog'?.35:0));
  const w0=WATER[look]||'#4f7f8a';

  g.beginPath();g.moveTo(x+L*.13,y+h*.7);g.quadraticCurveTo(x+L*.2,y+h*1.25,x+L*.26,y+h*.5);g.closePath();g.fill();

  body.bezierCurveTo(x+L*.2,y-h*.75,xt-L*.05,y-ped*1.2,xt,y-ped);

      {const rr0=Math.max(u*3.4,L0*.75)*(1+.12*Math.sin(t*6));g.strokeStyle='rgba(255,255,255,.6)';g.lineWidth=Math.max(1.5,u*.35);g.beginPath();g.ellipse(p.x,p.y+u*.3,rr0,rr0*.36,0,0,7);g.stroke();g.strokeStyle='rgba(0,30,45,.35)';g.lineWidth=1;g.beginPath();g.ellipse(p.x,p.y+u*.3,rr0+u*.5,(rr0+u*.5)*.36,0,0,7);g.stroke();}

    h+=`<div class="sect">🏡 ${L('Уют берега','Cosy shore')}: ${n} / ${DECOR.length}</div><span class="gbar g"><i style="width:${Math.round(n/DECOR.length*100)}%"></i></span><p class="about" style="margin:8px 2px 0;color:#5a6770;font-weight:600">${L('Украшения видны на каждой рыбалке. На клёв и турнир не влияют — просто для души.','Decorations show on every trip. They don\'t affect the bite — just for fun.')}</p>`;
    h+=`<div class="sect">${L('Поплавки','Floats')}</div><div class="ti"><span class="ic" data-fi="std"></span><div class="tx"><b>${L('Красный классический','Classic red')}</b></div>${fltSel()==='std'?'<span class="have">✓</span>':`<button class="btn" data-sel="std">${L('Надеть','Use')}</button>`}<small class="ds">${L('Проверенный временем','Time-tested')}</small></div>`+DECOR.filter(d=>d.k==='f').map(row).join('');
    h+=`<div class="sect">${L('На берегу','On the shore')}</div>`+DECOR.filter(d=>d.k==='s').map(row).join('');}
  if(PAY.on&&shopTab!=='d')h+=payHtml();
  const list=$('shList');list.innerHTML=h;
  list.querySelectorAll('[data-fi]').forEach(e=>e.appendChild(floatIcon(e.dataset.fi)));

  list.querySelectorAll('[data-tg]').forEach(b=>b.onclick=()=>{const id=b.dataset.tg;if(!isObj(S.decOff))S.decOff={};if(S.decOff[id])delete S.decOff[id];else S.decOff[id]=1;save();SND.tap();const y=list.scrollTop;openShop('d');list.scrollTop=y;});

const TK_SAY={rod:['Дальше закинешь — крупнее возьмёшь.','С такой удочкой и на Волгу не стыдно.'],line:['Вот теперь не оборвёт! Ну, почти.','Потолще — оно надёжнее.'],reel:['Трещит как надо! Подматывай веселей.','С катушкой дело пойдёт быстрее.']};
function buyTk(k){const T=TACKLE[k],l=S.tk[k];if(l>=4)return;const p=T.p[l+1];if(S.coins<p){notEnough(p);return;}

function buyBait(id){const b=BAIT[id];if(S.coins<b.p){notEnough(b.p);return;}S.coins-=b.p;if(b.perm)S.own.spoon=1;else S.bait[id]=(S.bait[id]||0)+b.pack;save();SND.coin();toast(b.ic+' '+nm(b)+(b.perm?'':' +'+b.pack),1800);const y=$('shList').scrollTop;openShop('b');$('shList').scrollTop=y;}
const DEC_SAY={nest:'Скворцы прилетят — будет концерт.',pier:'С мостков-то и клюёт веселей!',goose:'С таким ещё мой дед ловил!',bee:'Жужжит? Нет? Ну и ладно.',melon:'Аж слюнки текут.',glow:'Теперь поклёвку и ночью не проспишь.',gold:'Богато живёшь, сосед!',bowl:'Васька, это тебе. Цени!',lamp:'Со светом-то веселей.',samovar:'Вот это дело! Чайку с дымком…',ducks:'Утки приплыли. Хлеба взял?',tent:'Теперь можно и с ночёвкой.',boat:'Эх, прокатимся когда-нибудь!',house:'Хоромы! Теперь тут и зимовать можно.'};

const stars=n=>{const k=mastOf(n);return '★'.repeat(k)+'<em>'+'★'.repeat(3-k)+'</em>';};
function openAlb(){show('scr-alb');$('alTabs').style.display='none';const all=Object.keys(FISH),tr=all.filter(id=>S.alb[id]&&S.alb[id].tr).length,sp=spCount();

  const card=(id,leg)=>{const f=fishOf(id),a=S.alb[id],got=!!a,b=document.createElement('button');b.className='fc2'+(got?'':' no')+(leg?' leg':'')+(S.gild[id]?' gd':'');

    b.onclick=()=>fishInfo(id);return b;};
  // награды за наборы: все виды места и все трофеи места
  const setRow=(kind,i)=>{const p=PLACES[i],r=setReward(kind,i),n=p.fish.filter(id=>S.alb[id]&&(kind==='sp'||S.alb[id].tr)).length,key=kind+i,ttl=kind==='sp'?'🐟 '+L('Все виды','All species'):'🏆 '+L('Все трофеи','All trophies');
    if(S.sets[key])return `<div class="setr done"><span>${ttl} — ${L('награда получена','reward claimed')}</span><i>✓</i></div>`;
    if(n>=p.fish.length)return `<div class="setr rdy"><span>${ttl} — ${L('набор собран!','set complete!')}</span><button class="btn green" data-set="${key}">🎁 +${coinsTxt(r)}</button></div>`;
    return `<div class="setr"><span>${ttl}: ${n}/${p.fish.length}</span><i>+${coinsTxt(r)}</i></div>`;};
  PLACES.forEach((p,i)=>{const ids=p.fish.filter(id=>!seen[id]);ids.forEach(id=>seen[id]=1);
    box.insertAdjacentHTML('beforeend',`<div class="sect">${esc(nm(p))}</div>${setRow('sp',i)}${setRow('tr',i)}`);if(!ids.length)return;const gr=document.createElement('div');gr.className='alb';ids.forEach(id=>gr.appendChild(card(id)));box.appendChild(gr);});

const STREAK=[10,10,15,15,20,25,40];
function streakState(){const s=S.streak||{day:0,last:0,cyc:0},t=dayKey(0);
  if(s.last===t)return{claimed:true,day:s.day};
  const cont=s.last===dayKey(-1)&&s.day>0;return{claimed:false,day:cont?s.day%7+1:1,broken:!cont&&s.day>0&&s.day<7};}
function maybeStreak(){if(G||window.__demo||$('modal').classList.contains('on')||$('ad').classList.contains('on'))return;
  const st=streakState();if(st.claimed||(S.caught||0)<1)return;
  const s=S.streak||{};if(st.broken&&s.day>=2&&adOk())return streakRestore();
  if(st.day===1)claimStreak(1,true);else showStreak();}
function streakRestore(){const s=S.streak;
  modal(`<h2>${L('Серия прервалась','Streak broken')} 😿</h2><p>${L('Серия дошла до '+s.day+'-го дня, но денёк пропущен. Петрович на берегу заметил… но может и забыть.','Your streak reached day '+s.day+', but a day was missed.')}</p>

    cells+=`<div class="sd ${done?'done':''} ${today?'today':''} ${d===7?'d7':''}"><small>${L('День','Day')} ${d}</small><span class="ic">${d===7?'🎁':'💰'}</span>+${STREAK[d-1]}${d===7?'<small>+ '+L('10 живцов','10 live bait')+'</small>':''}</div>`;}
