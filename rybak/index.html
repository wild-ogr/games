<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Рыбалка с Петровичем</title>
<style>
:root{--ink:#26343b;--muted:#5a6770;--card:#fffdf6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;background:#1f3a4a;overscroll-behavior:none;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--ink);overflow:hidden;touch-action:manipulation}
#app{position:relative;max-width:560px;height:100%;margin:0 auto;background:linear-gradient(#a8d8ef,#d9efe6 40%,#8fbf8a);overflow:hidden}
.screen{position:absolute;top:0;right:0;bottom:0;left:0;display:none;flex-direction:column}
.screen.on{display:flex}
button{font:inherit;color:inherit;border:0;cursor:pointer}
.btn{background:#fff;border-radius:16px;padding:12px 16px;font-weight:700;font-size:17px;box-shadow:0 4px 0 #c3c8c0,0 6px 14px rgba(0,0,0,.12);transition:transform .08s;min-height:48px}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #c3c8c0}
.btn.accent{background:linear-gradient(#e8590c,#c44a08);color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.25);box-shadow:0 4px 0 #8f3505,0 6px 14px rgba(0,0,0,.15)}
.btn.accent:active{box-shadow:0 1px 0 #8f3505}
.btn.green{background:linear-gradient(#2b8a3e,#237032);color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.25);box-shadow:0 4px 0 #17501f,0 6px 14px rgba(0,0,0,.15)}
.btn.blue{background:linear-gradient(#1c7ab8,#155f96);color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.25);box-shadow:0 4px 0 #0d4169,0 6px 14px rgba(0,0,0,.15)}
.btn[disabled]{opacity:.55}
.btn small{opacity:.9;font-size:.88em}
.icon{width:48px;height:48px;border-radius:14px;background:rgba(255,255,255,.9);font-size:22px;font-weight:800;box-shadow:0 3px 0 rgba(0,0,0,.12);flex:none}
.pill{background:rgba(255,255,255,.92);border-radius:999px;padding:7px 12px;font-weight:800;font-size:17px;box-shadow:0 3px 0 rgba(0,0,0,.1);white-space:nowrap}
button.pill{cursor:pointer;position:relative;min-height:48px}
button.pill::before{content:"";position:absolute;top:-6px;bottom:-6px;left:-4px;right:-4px}
.pill.sm{padding:5px 10px;font-size:17px}
.dot{position:absolute;top:4px;right:6px;width:11px;height:11px;border-radius:50%;background:#e03131;box-shadow:0 0 0 2px #fff}
/* карта мест */
.mh,.gh{display:flex;align-items:center;gap:8px;padding:10px 12px;padding-top:max(10px,env(safe-area-inset-top,0px));flex:none}
.logo{font-weight:900;font-size:21px;line-height:1.08;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.25);flex:1;min-width:0}
.hdr-r{display:flex;gap:6px;align-items:center}
.mapwrap{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:4px 12px 12px;-webkit-overflow-scrolling:touch}
.rankb{display:flex;justify-content:center;margin:2px 0 8px}
.rankb button{background:rgba(255,255,255,.85);border-radius:999px;padding:8px 16px;font-weight:800;font-size:17px;color:#2d4a57;min-height:48px}
/* полоса цели: к чему копим (карта, итоги рыбалки) */
.goalb{display:block;width:100%;text-align:left;background:#fffdf3;border-radius:16px;padding:9px 12px 10px;margin:2px 0 8px;box-shadow:0 3px 0 rgba(0,0,0,.12);font-weight:700;font-size:17px;line-height:1.25;color:#2d3436;min-height:48px}
.goalb .gr{display:block;font-weight:800;color:#6a4b00;margin-top:3px}
.goalb.ok{background:#e6f6e9;box-shadow:0 3px 0 #9ccca6}.goalb.ok .gr{color:#1f5e2c}
.gbar{display:block;height:10px;border-radius:5px;background:#e4e0d2;overflow:hidden;margin-top:6px}.gbar i{display:block;height:100%;border-radius:5px;background:linear-gradient(#f0b429,#e08a0c)}
.goalb.ok .gbar i,.gbar.g i{background:linear-gradient(#40c057,#2b8a3e)}
.card .goalb{background:#fff6dc;box-shadow:none;margin:10px 0 2px;font-size:16.5px}.card .goalb.ok{background:#e6f6e9}
.plc{position:relative;display:flex;width:100%;text-align:left;background:#fff;border-radius:18px;margin-bottom:10px;overflow:hidden;box-shadow:0 4px 0 rgba(0,0,0,.12),0 6px 16px rgba(0,0,0,.1);min-height:96px;padding:0}
.plc canvas{width:104px;height:auto;flex:none;display:block;align-self:stretch;object-fit:cover}
.plc .pi{flex:1;padding:9px 11px;min-width:0}
.plc b{display:block;font-size:18.5px;line-height:1.2}
.plc small{display:block;color:var(--muted);font-weight:600;font-size:17px;line-height:1.25;margin-top:3px}
.plc small.wr{color:#a8480a;font-weight:800}.plc .gbar{margin-top:5px}
.plc .fc{color:#1f6f8b;font-weight:800}
.plc.lock{background:#eef0ec}.plc.lock canvas{filter:grayscale(.7) brightness(.85)}
.plc .pr{display:inline-block;margin-top:5px;background:#ffe9a8;color:#6a4b00;border-radius:999px;padding:4px 11px;font-weight:900;font-size:17px}
.plc .pr.no{background:#e6e3da;color:#6b6b62}
.plc.new::after{content:"";position:absolute;top:8px;right:8px;width:11px;height:11px;border-radius:50%;background:#e03131}
.mnav{flex:none;padding:8px 12px;padding-bottom:max(10px,env(safe-area-inset-bottom,0px));background:rgba(255,255,255,.55);display:flex;flex-direction:column;gap:8px}
.nrow{display:flex;gap:8px}.nrow .btn{flex:1;padding:10px 6px;font-size:17px;position:relative;min-width:0;line-height:1.15}
.nrow .btn small.wl{display:block;font-size:16px;font-weight:700;opacity:.92;margin-top:1px}
.wtxt{margin:2px 14px 8px;color:var(--muted);font-weight:600;font-size:17px;line-height:1.35}
.tcard{background:#f3f1ea;border-radius:16px;padding:10px 12px;margin:10px 0;text-align:left}.tcard h3{margin:0 0 4px;font-size:19px}.tcard .row{margin-top:8px}
.cupbig{font-size:64px;line-height:1.1;margin:4px 0}
.mnts{display:flex;flex-wrap:wrap;justify-content:center;margin:4px -4px 8px}.mnt{width:46%;max-width:170px;margin:4px;background:linear-gradient(#9a6a38,#6e4520);border:3px solid #4d2f14;border-radius:14px;padding:6px 4px 8px;color:#fff3d6;font-weight:800;font-size:16px;line-height:1.2;box-shadow:inset 0 0 0 2px rgba(255,220,160,.25)}
.mnt canvas{width:100%;height:auto;display:block}.mnt small{display:block;font-size:16px;opacity:.9}
.cups{display:flex;flex-wrap:wrap;justify-content:center}.cup{width:30%;min-width:96px;margin:4px;background:#fff8e1;border-radius:12px;padding:6px 2px;font-weight:800;font-size:16px;line-height:1.2;color:#5a4300}.cup b{display:block;font-size:34px}
.nrow .btn.sq{flex:1 1 0;line-height:1.05;font-size:22px;padding:6px 2px 7px}.nrow .btn.sq small{display:block;font-size:17px;font-weight:800;opacity:1;margin-top:2px}
.nrow.m4{gap:6px}.nrow.m4 .btn.sq{flex:1 1 auto;padding-left:3px;padding-right:3px}.nrow.m4 #btnMore{flex:0 1 auto;padding-left:8px;padding-right:8px}
.soc-set .btn{width:100%}.soc-o{display:flex;flex-direction:column;align-items:center;margin-top:12px;text-align:center}.soc-o span{font-size:16px;margin-bottom:6px}.soc-o .btn{padding:8px 14px;font-size:16px}.soc-o.ntf{margin:10px 0 0;text-align:left;align-items:stretch}.soc-o.ntf span{font-size:17px;line-height:1.3}.soc-o.ntf .btn{align-self:center;min-height:48px;font-size:17px}.soc-o.ntf.lite{flex-direction:row;align-items:center;gap:8px;padding:6px 8px 6px 10px}.soc-o.ntf.lite span{flex:1;min-width:0;margin:0}.soc-o.ntf.lite b{display:inline}.soc-o.ntf.lite .btn{flex:none;white-space:nowrap;padding:6px 12px}
/* рыбалка */
#scr-fish{background:#6fa9c4}
#cv{position:absolute;top:0;left:0;width:100%;height:100%;display:block;touch-action:none}
#scr-fish .gh{position:relative;z-index:2;background:linear-gradient(rgba(0,0,0,.28),rgba(0,0,0,0))}
.gt{flex:1;min-width:0;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.5);font-weight:900;font-size:18px;line-height:1.15}
.gt .sub{font-size:17px;font-weight:700;opacity:.95;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gt div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fbar{position:absolute;left:0;right:0;bottom:0;z-index:2;display:flex;gap:8px;align-items:flex-end;padding:8px 12px;padding-bottom:max(10px,env(safe-area-inset-bottom,0px));pointer-events:none}
.fbar>*{pointer-events:auto}
#baitBtn{background:rgba(255,255,255,.93);border-radius:14px;padding:6px 10px;font-weight:800;font-size:17px;box-shadow:0 3px 0 rgba(0,0,0,.15);text-align:left;line-height:1.15;min-height:48px;max-width:46%}
#baitBtn small{display:block;font-size:16px;font-weight:700;color:var(--muted)}
#hint{flex:1;text-align:center;color:#fff;font-weight:800;font-size:17px;line-height:1.25;text-shadow:0 1px 3px rgba(0,0,0,.7),0 0 12px rgba(0,0,0,.35);pointer-events:none;min-height:24px;align-self:center}
#fCasts{flex:none;align-self:center;font-size:17px;padding:6px 10px}
#hint.big{color:#ffe066;font-size:24px;font-weight:900}
#say{position:absolute;z-index:3;max-width:66%;background:#fffdf3;border-radius:14px;padding:8px 11px;font-weight:700;font-size:16.5px;line-height:1.3;box-shadow:0 4px 14px rgba(0,0,0,.25);opacity:0;transition:opacity .3s;pointer-events:none;color:#2a3338}
#say.on{opacity:1}
#say b{display:block;font-size:16px;color:#9c5a12;margin-bottom:1px}
#say::after{content:"";position:absolute;bottom:-8px;left:22px;border:8px solid transparent;border-top-color:#fffdf3;border-bottom:0}
#say.r::after{left:auto;right:22px}
#catch{position:absolute;left:50%;top:44%;z-index:4;transform:translate(-50%,-50%);width:88%;max-width:360px;background:var(--card);border-radius:22px;padding:12px 14px 14px;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.35);display:none}
#catch.on{display:block;animation:pop .28s ease-out}
#catch canvas{width:100%;height:auto;display:block}
#catch h3{margin:2px 0 0;font-size:22px}
#catch .w{font-size:19px;font-weight:900;color:#1f6f8b;margin:2px 0}
#catch .tags{display:flex;flex-wrap:wrap;justify-content:center;gap:5px;margin:4px 0 8px}
#catch .tags span{background:#fff0c2;color:#6a4b00;border-radius:999px;padding:3px 10px;font-weight:800;font-size:15.5px}
#catch .tags span.g{background:#d3f2d8;color:#1f5e2c}
#catch p{margin:2px 0 8px;color:var(--muted);font-weight:600;font-size:16px;line-height:1.3}
/* снасти, альбом */
.scr2{background:linear-gradient(#cfe8f3,#eef6ec)}
.scr2 .gh{background:#2f6b86}
.scr2 .gt{text-shadow:none}
.tabs{display:flex;gap:6px;padding:8px 12px 0;flex:none}
.tabs button{flex:1;background:rgba(255,255,255,.7);border-radius:12px 12px 0 0;padding:10px 4px;font-weight:800;font-size:17px;color:#3d5561;min-height:48px;position:relative;min-width:0}
.tabs button.on{background:#fff;color:#1f4c61}
.list{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:10px 12px 16px;background:#fff;margin:0 12px 12px;border-radius:0 0 16px 16px}
.ti{display:flex;flex-wrap:wrap;align-items:center;padding:11px 2px;border-bottom:1px solid #eceae2}
.ti:last-child{border-bottom:0}
.ti .ic{font-size:30px;width:40px;text-align:center;flex:none;margin-right:8px}.ti .ic canvas{width:40px;height:44px;display:block}
.ti .tx{flex:1;min-width:0;margin-right:8px}
.ti .tx b{display:block;font-size:17px;line-height:1.2}
.ti .ds{display:block;flex-basis:100%;color:var(--muted);font-weight:600;font-size:17px;line-height:1.3;margin-top:5px}
.lvl{display:flex;gap:3px;margin-top:5px}.lvl i{width:18px;height:7px;border-radius:3px;background:#dde2e4}.lvl i.on{background:#2b8a3e}
.ti .btn{flex:none;padding:8px 12px;font-size:17px;min-height:48px;white-space:nowrap}
.ti .have{flex:none;font-weight:800;color:#237032;font-size:17px;min-width:44px;text-align:center}
.ti.hl{background:#fff6d6;border-radius:12px;animation:hl 1.1s ease-in-out 3}
@keyframes hl{50%{background:#ffe08a}}
.sect{font-weight:900;color:#2f6b86;font-size:17px;line-height:1.25;margin:14px 2px 6px}
.sect:first-child{margin-top:0}
.alb{display:flex;flex-wrap:wrap;justify-content:space-between}
.fc2{width:49%;background:#f4f1e8;border-radius:14px;margin-bottom:8px;padding:6px 4px 8px;text-align:center;position:relative;min-height:48px}
.fc2 canvas{width:100%;max-width:150px;height:auto;display:block;margin:0 auto}
.fc2 b{display:block;font-size:17px;line-height:1.15;min-height:39px}
.fc2 small{display:block;font-size:17px;color:var(--muted);font-weight:700;line-height:1.2}
.fc2 .st{display:block;font-size:17px;line-height:1.1;color:#e8a90c;letter-spacing:1px}.fc2 .st em{font-style:normal;color:#cfcabb}
.fc2.no b{color:#8a8f92}
.fc2 .tr{position:absolute;top:4px;right:6px;font-size:17px}
.fc2.leg{background:#fff1c9}
.fc2.gd{background:linear-gradient(#fff6d0,#ffe08a);box-shadow:0 0 0 3px #e0a400 inset}
@media (min-width:500px){.fc2{width:32%}}
/* награда за набор в альбоме, строка «уют берега» */
.setr{display:flex;align-items:center;background:#eef0e8;border-radius:12px;padding:8px 10px;margin:0 0 6px;font-weight:700;font-size:17px;line-height:1.25;color:#2d3436;min-height:48px}
.setr span{flex:1;min-width:0;margin-right:8px}.setr .btn{flex:none;padding:8px 12px;min-height:48px;font-size:17px;white-space:nowrap}
.setr.rdy{background:#fff0c2}.setr.done{background:#d9f2dd;color:#1f5e2c}.setr i{font-style:normal;font-weight:900;flex:none}
/* окна */
.modal,.ad{position:absolute;top:0;right:0;bottom:0;left:0;display:none;align-items:center;justify-content:center;background:rgba(15,30,40,.55);z-index:10;padding:16px}
.modal{overflow-y:auto;overscroll-behavior:contain}
.modal.on,.ad.on{display:flex}
.card{background:var(--card);border-radius:24px;padding:20px 16px 16px;width:100%;max-width:390px;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.3);animation:pop .25s ease-out;margin:auto}
@keyframes pop{from{transform:scale(.88);opacity:0}}
#catch.on{animation-name:popc}
@keyframes popc{from{transform:translate(-50%,-50%) scale(.88);opacity:0}}
.card h2{margin:0 0 6px;font-size:23px}
/* stage1: ✕ в окнах, где есть «Закрыть»/«Назад» — липкий, виден и в длинном окне */
.mx{position:-webkit-sticky;position:sticky;top:0;float:right;width:48px;height:48px;margin:-14px -8px 0 4px;border:0;border-radius:50%;background:rgba(255,255,255,.92);color:#4a4f55;font-size:24px;font-weight:700;line-height:48px;padding:0;cursor:pointer;z-index:2}
.mx:active{background:#e3e6e8}
.brk{font-size:16px!important;margin-top:-2px!important}
.card p{margin:6px 0;color:var(--muted);font-weight:600;font-size:17px;line-height:1.35}
.card canvas.fish{width:100%;max-width:300px;height:auto}
.row{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.row2{display:flex;gap:8px}.row2>*{flex:1}
.coins-won{font-size:22px;font-weight:900;color:#b07c00!important}
.quote{background:#fff3d6;border-radius:14px;padding:8px 12px;color:#5a4a2a!important;text-align:left}
.quote b{display:block;font-size:16px;color:#9c5a12}
.goal{font-size:16.5px!important;margin:8px 0 2px!important;color:#2d3436!important;font-weight:700}
.goal.wrn{color:#a8480a!important}.goal.tipl{background:#e6f6e9;border-radius:12px;padding:8px 10px;color:#1f5e2c!important}
.ctab{width:100%;border-collapse:collapse;margin:6px 0;font-size:17px;text-align:left}
.ctab td{padding:5px 4px;border-bottom:1px solid #eee8da;font-weight:700}
.ctab td:last-child{text-align:right;white-space:nowrap;color:#1f6f8b}
.ctab tr.lost td{color:#8a8f92;font-weight:600}
/*RC (03.10): добавка к цене («новая +10», «трофей +15») — второй строкой, с переносом; иначе при длинных названиях рыб таблица шире окна*/
.ctab small.cx{display:block;white-space:normal;font-size:17px;font-weight:600;line-height:1.25;opacity:.85}.ctab small.cx span{white-space:nowrap}
.ad{background:#111;color:#fff;text-align:center;font-size:22px;font-weight:800}
.ad small{font-weight:500;opacity:.7;font-size:14px}
.adt{font-size:54px;margin-top:16px}
.toast{position:absolute;left:50%;top:84px;transform:translateX(-50%);background:rgba(0,0,0,.84);color:#fff;padding:10px 14px;border-radius:12px;font-weight:700;font-size:16px;line-height:1.3;opacity:0;transition:opacity .25s;pointer-events:none;z-index:20;text-align:center;width:max-content;max-width:90%}
.toast.on{opacity:1}.toast.low{top:auto;bottom:14px}
.toast.fgt{top:136px;max-width:86%} /* stage1: во время вываживания — под шкалой натяжения, над рыбаком (не на шкале и не на нижней панели) */
.set{display:flex;align-items:center;justify-content:space-between;background:#eef0e8;border-radius:14px;padding:10px 12px;margin-top:8px;font-weight:700;font-size:16px;text-align:left;color:#2d3436;width:100%;min-height:50px}
.set i{font-style:normal;font-weight:800;color:#fff;background:#2b8a3e;border-radius:999px;padding:3px 12px;min-width:56px;text-align:center;flex:none}.set i.off{color:#57606f;background:#dcd8cc}.set i.go,.pay .set i{background:none;color:#237032;padding:0;min-width:0}

/*LOGIC*/

function rng(seed){let s=seed>>>0||1;return ()=>{s=(s+0x6D2B79F5)>>>0;let t=s;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296;};}
const clamp=(v,a,b)=>v<a?a:v>b?b:v;

/* наживка. Червь — бесплатно и без счёта; банки — по 10 штук (1 штука на заброс); блесна — покупается один раз */
const BAITS=[

  {id:'maggot',acc:'опарыша',n:'Опарыш',en:'Maggots',ic:'⚪',pack:10,p:15,d:'Плотва, уклейка, язь, хариус',de:'Roach, bleak, ide, grayling'},

  {id:'blood',acc:'мотыля',n:'Мотыль',en:'Bloodworm',ic:'🔴',pack:10,p:20,d:'Лещ, ёрш, сиг, омуль, корюшка',de:'Bream, ruffe, whitefish, omul, smelt'},
  {id:'corn',acc:'кукурузу',n:'Кукуруза',en:'Corn',ic:'🌽',pack:10,p:25,d:'Карп, сазан, белый амур — рыба покрупнее',de:'Carp and grass carp — bigger fish'},
  {id:'live',acc:'живца',n:'Живец',en:'Live bait',ic:'🐟',pack:10,p:40,d:'Щука, судак, сом, налим, калуга',de:'Pike, zander, catfish, burbot'},
  {id:'spoon',acc:'блесну',n:'Блесна',en:'Spoon lure',ic:'🥄',perm:1,p:350,d:'Навсегда. Окунь, щука, жерех, лосось, хариус',de:'Forever. Perch, pike, asp, salmon, grayling'}

/* снасти: 5 ступеней. Удочка — дальность заброса и «мягкость» (гасит рывки), леска — на сколько кг рассчитана, катушка — скорость подмотки */
const TACKLE={
  rod:{n:'Удочка',en:'Rod',ic:'🎣',lv:[['Ореховое удилище','Hazel stick'],['Бамбуковая','Bamboo rod'],['Телескоп','Telescopic rod'],['Карбоновая','Carbon rod'],['Удочка мастера','Master rod']],
    p:[0,150,500,1400,3500],dist:[14,18,23,28,34],k:[1,1.12,1.25,1.4,1.55]},
  line:{n:'Леска',en:'Line',ic:'🧵',lv:[['Леска 0,14 мм','Line 0.14 mm'],['Леска 0,18 мм','Line 0.18 mm'],['Леска 0,22 мм','Line 0.22 mm'],['Леска 0,28 мм','Line 0.28 mm'],['Плетёнка 0,35 мм','Braid 0.35 mm']],
    p:[0,120,400,1200,3000],kg:[2,3.5,6,10,16]},
  reel:{n:'Катушка',en:'Reel',ic:'⚙️',lv:[['Без катушки','No reel'],['Инерционная','Centrepin reel'],['«Нева»','«Neva» reel'],['Безынерционная','Spinning reel'],['Мультипликатор','Baitcaster']],
    p:[0,150,500,1400,3500],spd:[1.6,2.1,2.7,3.3,4]}
};
const TK_KEYS=['rod','line','reel'];
const TOURN_TK={rod:2,line:2,reel:2};
// stage1: нормативы турнира недели (граммы за 5 забросов: 🥉 / 🥈 / 🥇) — по модели CHK=tourn tools/check.sh (квантили 40/75/92 % игроков)
const TOURN_NORM=PLACES.map(p=>p.tn); // RB:NORTH: числа — в записи места js/places.js
// stage1: «Трофейная стена» — цена чучела рекордной рыбы (g — граммы рекорда), re — обновить чучело (полцены). Легенды — 8000
function mntCost(id,g,re){const f=fishOf(id);if(!f)return 0;const pi=f.leg?PLACES.findIndex(p=>p.leg===id):PLACES.findIndex(p=>p.fish.indexOf(id)>=0);
  const b=f.leg?(f.mnt||8000)/*RB:NORTH: Царь-рыба — своя цена*/:Math.max(400,Math.round(30*price(f,g/1000,pi)/50)*50);return re?Math.max(200,Math.round(b/100)*50):b;}
function tourTier(pi,g){const n=TOURN_NORM[pi]||TOURN_NORM[0];return g>=n[2]?2:g>=n[1]?1:g>=n[0]?0:-1;} // −1 — участник, 0 бронза, 1 серебро, 2 золото // турнир недели — у всех одинаковая «казённая» снасть

/* стиль борьбы: [сила рывка, пауза от, до (с), длина рывка от, до] */
const STY={calm:[1.4,3,5,.6,1],dart:[2,1.2,2.6,.4,.8],deep:[1.65,2,4,1,2],jump:[2.2,1.5,3,.5,1]};
/* рыбы, легенды и места — реестр js/places.js (FISH_DB → FISH, LEG, PLACES). RB:NORTH */
for(const k in LEG){LEG[k].leg=1;LEG[k].id=k;}
for(const k in FISH)FISH[k].id=k;
/* находки: иногда вместо рыбы (юмор, в альбом — раздел «Находки») */
const JUNK={
  boot:{n:'Старый сапог',en:'Old boot',ic:'👢',f:'Сорок третий размер. Второй, наверное, ещё там.'},
  kettle:{n:'Чайник без носика',en:'Spoutless kettle',ic:'☕',f:'Баба Зина говорит — её. В 1979-м упустила.'},
  cap:{n:'Кепка Петровича',en:'Petrovich\'s cap',ic:'🧢',f:'Петрович обрадовался: «Моя! В позапрошлом году ветром унесло!»'},
  snag:{n:'Коряга',en:'Snag',ic:'🌿',f:'Зацеп! Коряга похожа на лося. Или на тёщу — кому как.'},

};
const JUNK_P=.03;
/* ---- долгие цели (boost, 02.10): всё за игровые монеты, на клёв и турнир не влияет ----

   Наборы альбома: все виды места — SET_R[место], все трофеи места — вдвое (S.sets: sp0…, tr0…), забирает игрок в альбоме.
   Мастерство: поймал вид MAST[k][0] раз — звезда и MAST[k][1] монет (сразу в улове). Неделя заданий: WEEK_R — сколько заданий дня за неделю → монеты */
const DECOR=[
  {id:'goose',k:'f',n:'Гусиное перо',en:'Goose quill',p:250,d:'Дедовский поплавок: лёгкий и чуткий',de:'Grandpa\'s float: light and sensitive'},
  {id:'bee',k:'f',n:'Шмель',en:'Bumblebee',p:500,d:'Полосатый — видно издалека',de:'Striped — easy to spot'},
  {id:'melon',k:'f',n:'Арбузик',en:'Watermelon',p:800,d:'Сладкий на вид. Рыба не в курсе',de:'Looks sweet. The fish don\'t know'},
  {id:'glow',k:'f',n:'Светлячок',en:'Firefly',p:1200,d:'Светится и днём, и ночью',de:'Glows day and night'},
  {id:'gold',k:'f',n:'Золотой',en:'Golden',p:4000,d:'Для тех, у кого всё остальное уже есть',de:'For those who have everything else'},
  {id:'bowl',k:'s',ic:'🥣',n:'Миска для Васьки',en:'Bowl for Vaska',p:300,d:'Кот оценил. Виду не подал',de:'The cat approves. Quietly'},
  {id:'lamp',k:'s',ic:'🏮',n:'Фонарь «Летучая мышь»',en:'Storm lantern',p:600,d:'Горит вечером и ночью',de:'Shines in the evening and at night'},
  {id:'samovar',k:'s',ic:'☕',n:'Самовар',en:'Samovar',p:1000,d:'Чай с дымком. Петрович одобряет',de:'Smoky tea. Petrovich approves'},
  {id:'nest',k:'s',ic:'🐦',n:'Скворечник',en:'Birdhouse',p:900,d:'На шесте у камышей. Жильцы уже нашлись',de:'On a pole by the reeds. Tenants found'},
  {id:'ducks',k:'s',ic:'🦆',n:'Кормушка для уток',en:'Duck feeder',p:1800,d:'На воде поселится утиная семья',de:'A duck family moves in'},
  {id:'tent',k:'s',ic:'⛺',n:'Палатка',en:'Tent',p:2500,d:'Теперь можно и с ночёвкой',de:'Now you can stay overnight'},
  {id:'pier',k:'s',ic:'🌉',n:'Мостки',en:'Wooden pier',p:4000,d:'Дощатые мостки над водой — как в детстве',de:'A plank pier over the water'},
  {id:'boat',k:'s',ic:'🚣',n:'Лодка',en:'Rowing boat',p:5500,d:'Деревянная, с вёслами. Ждёт у берега',de:'Wooden, with oars. Waits by the shore'},
  {id:'house',k:'s',ic:'🏠',n:'Домик рыбака',en:'Fishing cabin',p:10000,d:'С печкой и окошком. Мечта!',de:'With a stove and a window. A dream!'}
];
const DEC={};DECOR.forEach(d=>DEC[d.id]=d);
const SET_R=PLACES.map(p=>p.set); // RB:NORTH
function setReward(kind,pi){return SET_R[pi]*(kind==='tr'?2:1);}
// набор собран? alb — S.alb
function setDone(alb,kind,pi){return PLACES[pi].fish.every(id=>alb[id]&&(kind==='sp'||alb[id].tr));}
const MAST=[[5,5],[20,15],[60,40]];
function mastOf(n){let k=0;for(const m of MAST)if(n>=m[0])k++;return k;}
const WEEK_R=[[3,60],[5,120],[7,250]];
// золотая рамка в альбоме — сток монет после «Берега»: цена по месту (300…1350), легенды — 2000; только для пойманных
function gildPrice(id){if(LEG[id])return 2000;const i=PLACES.findIndex(p=>p.fish.indexOf(id)>=0);return 300+150*Math.max(0,i);}
const FIRST_BONUS=30; // дед Митяй — за первый улов (на первую покупку)
const TODS=['morning','day','evening','night'],TOD_N={morning:['Утро','Morning'],day:['День','Day'],evening:['Вечер','Evening'],night:['Ночь','Night']};
const WXS=['sun','cloud','rain','wind','fog'],WX_N={sun:['Ясно','Sunny'],cloud:['Облачно','Cloudy'],rain:['Дождик','Rain'],wind:['Ветрено','Windy'],fog:['Туман','Fog']},WX_IC={sun:'☀️',cloud:'⛅',rain:'🌧',wind:'🌬',fog:'🌁'};
const TOD_M={morning:1.2,day:.85,evening:1.2,night:.9},WX_M={sun:.9,cloud:1.1,rain:1.15,wind:.95,fog:1.05};
function fishOf(id){return FISH[id]||LEG[id]||null;}
// цена улова: pm — множитель места (дальние водоёмы — дороже, как и путёвка туда)
function price(f,w,pi){return Math.max(1,Math.round((f.pb+f.pk*w)*(f.leg?1:(PLACES[pi]&&PLACES[pi].pm)||1)));}
function trophyW(f){return f.w[0]+.75*(f.w[1]-f.w[0]);}
// время суток по часам игрока, погода — по дате, часу и месту (одинаковая у всех, «прогноз» честный)
function todOf(h){return h>=5&&h<10?'morning':h>=10&&h<17?'day':h>=17&&h<22?'evening':'night';}
function wxOf(dayN,h,pi){const R=rng(dayN*977+Math.floor(h/3)*131+pi*7919+3);const x=R();return x<.34?'sun':x<.6?'cloud':x<.76?'rain':x<.9?'wind':'fog';}
function biteMul(tod,wx){return TOD_M[tod]*WX_M[wx];}
// кто клюнет: df — доля дальности заброса (0 — у берега, 1 — максимум удочки). Вернёт {f,w} или {junk} или null (на эту наживку здесь не берут)
function baitWorks(pi,bait){return PLACES[pi].fish.some(id=>(FISH[id].b[bait]||0)>0);}
// A2: o — необязательные условия {z точка, dp глубина, way способ, mo месяц, px давление, lv ступень навыка, easy}; без o (турнир, старые проверки) — всё как в stage1
function fishW(pi,bait,tod,wx,df,o){return PLACES[pi].fish.map(id=>{const f=FISH[id],big=f.w[1]>2.5;let x=f.r*(f.b[bait]||0)*(f.t&&f.t[tod]!=null?f.t[tod]:1)*(big?(.45+df*1.1):(1.2-df*.4));if(wx==='rain'&&f.b.live)x*=1.2;if(o)x*=a2Mul(f,o,tod,wx)*(PFX[pi][id]||1);if(typeof MG_BAIT_MULT==='function')x*=MG_BAIT_MULT(pi,id); /*RB:NORTH: крючок «Прикормки» MGB (без модуля — 1, в турнире — 1)*/return x;});}
function pickFish(pi,bait,tod,wx,df,R,o){const P=PLACES[pi];
  if(o&&o.tsar&&P.tsar){const T=LEG[P.tsar];if(bait===T.bait&&T.tod.indexOf(tod)>=0&&df>.55&&R()<(T.p||1/8))return {f:T,w:Math.round((T.w[0]+(T.w[1]-T.w[0])*R())*1000)/1000};} // RB:NORTH: Царь-рыба главы (o.tsar — открыта и сегодня ещё не выходила)
  const L=LEG[P.leg];if(L&&bait===L.bait&&L.tod.indexOf(tod)>=0&&df>.55&&R()<1/30)return {f:L,w:Math.round((L.w[0]+(L.w[1]-L.w[0])*R())*1000)/1000};
  if(o&&P.evf.length){const e=evPick(pi,bait,tod,R);if(e)return e;} // RB:NORTH: праздничная рыба (только в праздник, не в турнире)
  let tot=0;const ws=fishW(pi,bait,tod,wx,df,o);for(const x of ws)tot+=x;
  if(tot<=0)return null;
  if(R()<(o&&o.z==='snag'?JUNK_P*3:JUNK_P)&&bait!=='spoon'){const ks=Object.keys(JUNK);return {junk:ks[Math.floor(R()*ks.length)]};}
  let u=R()*tot,k=0;for(;k<ws.length-1;k++){u-=ws[k];if(u<0)break;}
  const f=FISH[P.fish[k]],big=bait==='live'||bait==='corn'||bait==='spoon'?.35:0;
  const e=o?Math.max(.8,2.5-.9*df-big+szK(o)):Math.max(1.1,2.5-.9*df-big),w=f.w[0]+(f.w[1]-f.w[0])*Math.pow(R(),e);
  return {f,w:Math.max(.005,Math.round(w*1000)/1000)};}
// сколько ждать поклёвки (с)
function waitTime(tod,wx,R){return clamp((2.2+R()*4.6)/biteMul(tod,wx),1.6,9);}
// окно подсечки (с)
function hookWin(f,calm,o){const b0=f.leg?.75:f.w[1]>2.5?.85:1;if(!o)return b0+(calm?.5:0);
  const bt=o.way==='led'?(o.otv?1:1.2)/*RB:NORTH: отвес*/:(BITE_T[f.bite]||BITE_T.dip).w*(f.leg?.9:1);return (o.easy?Math.max(b0,bt):bt)+(calm?.5:0)+.03*((o.lv||1)-1);} // A2: окно по виду поклёвки и навыку

/* вываживание. Мелочь (сила рыбы меньше трети прочности снасти) идёт к берегу сама — палец только ускоряет.
   Крупная: палец держит — подматываем (натяжение растёт), отпустил — леска свободнее, но рыба уходит дальше.
   Натяжение > 1 дольше 0,45 с (спокойный режим — 0,9 с) — обрыв. Слабина дольше 4 с — рыба сходит. Дальше maxD — ушла. */
const STRICT_FROM=2; // с какого места (Волга) вываживание строгое; пруд и речка — как в выпущенной v0.1 (решение владельца 02.10)
function fightNew(f,w,dist,tk,calm,R,easy){const B=f.s*Math.pow(w,.55),sy=STY[f.st],need=B*(sy[0]+.22)+.25,cap0=TACKLE.line.kg[tk.line]*TACKLE.rod.k[tk.rod]*(calm?1.25:1),m=need/cap0;
  const o={B,D:dist,D0:dist,maxD:Math.max(dist+14,24),E:1,T:0,rush:0,next:1.2+R()*1.5,warn:false,brk:0,slack:0,t:0,small:w<.6&&!f.leg,res:null,jump:0,calm:!!calm,easy:!!easy};
  // easy (пруд, речка): формула v0.1 — прочность снасти как есть, терпит 0,45 с (спокойный режим 0,9); со снастью по рыбе красной зоны нет вовсе
  if(easy){o.cap=cap0;o.gear=1.2/m;o.bmax=calm?.9:.45;return o;}
  // строгое (с Волги): need — натяжение на рывке, если держать палец; m — во сколько раз оно больше прочности снасти. Пик сжат: у рыбы от ~4 кг рывок всегда
  // заходит в красную зону (lo…), слабая снасть — выше и короче терпит, но шанс есть; совсем не по снасти (m > 3,5) — рвёт и на отпущенной леске (аудит 40)
  const lo=Math.min(1.2,.8+.1*B),pk=m<=lo?lo:Math.min(m,lo+(f.leg?.9:.45)*(1-Math.exp(-(m-lo)/1.5))+Math.max(0,m-3.5)*.6);
  o.cap=need/pk;o.gear=lo/m;o.bmax=(calm?.9:.45)*clamp(lo/m,.9,1.4);return o;}
function fightStep(ft,f,hold,dt,R,tk){if(ft.res)return ft.res;ft.t+=dt;
  const spd=TACKLE.reel.spd[tk.reel];
  if(ft.small){ft.D-=dt*(2+spd)*(hold?1.5:1.1);ft.T=.12+.08*Math.sin(ft.t*9);if(ft.D<=.8)ft.res='ok';return ft.res;}
  const sy=STY[f.st];
  if(ft.rush>0){ft.rush-=dt;if(ft.rush<=0){ft.rush=0;ft.next=sy[1]+R()*(sy[2]-sy[1]);}}
  else{ft.next-=dt;if(ft.next<=0){ft.rush=(sy[3]+R()*(sy[4]-sy[3]))*(.6+.4*ft.E);if(f.st==='jump'&&R()<.55)ft.jump=.9;}}
  if(ft.jump>0)ft.jump=Math.max(0,ft.jump-dt);
  ft.warn=ft.rush<=0&&ft.next<.4;
  const P=ft.B*(.35+.65*ft.E)*(ft.rush>0?sy[0]:.5),raw=hold?P+.22*ft.B+.25:P*.3,tgt=raw/ft.cap;
  ft.T+=(tgt-ft.T)*Math.min(1,dt*(hold?6:4));
  const sw=(1+f.s)*(.3+.7*ft.E);
  ft.D+=hold?dt*(-spd*(ft.rush>0?.25:1)+(ft.rush>0?sw*.9:sw*.12)):dt*(ft.rush>0?sw*1.1:sw*.2);
  ft.D=Math.max(0,ft.D);

function a2HudTxt(){if(!G||!G.o)return '';return (G.o.way==='led'?'🔔 '+L('донка','ledger'):DEP_N[G.o.dp][2]+' '+L(DEP_N[G.o.dp][0],DEP_N[G.o.dp][1]).toLowerCase())+' ▾';}
// активность клёва на месте (для значков 🐟): лучшая наживка, чистая вода, текущий месяц и давление; 1 — как раньше
function a2BiteM(pi,tod,wx){const m0=biteMul(tod,wx),o={mo:moNow(),px:pxOf(dayNum(),pi)};let a=0,b=0;
  for(const bt of BAITS){if(!baitWorks(pi,bt.id))continue;let x=0,y=0;for(const v of fishW(pi,bt.id,tod,wx,.8,o))x+=v;for(const v of fishW(pi,bt.id,tod,wx,.8,null))y+=v;if(y>0&&x/y>a/(b||1e-9)){a=x;b=y;}}

// кто сейчас клюёт на месте (по активности, без учёта наживки): [{id,k}] по убыванию

    'Best now: '+nm(f).toLowerCase()+' — '+nm(BAIT[bait]).toLowerCase()+', '+ZONES[b.z[0]].en.toLowerCase()+', '+DEP_N[b.d[0]][1].toLowerCase()+'.')};}
// прогноз (для A3 и карты): давление и кто в сезоне на месте pi в день dn
function a2Forecast(pi,dn){const px=pxOf(dn,pi),mo=new Date(dn*864e5).getUTCMonth(),w=a2Who(pi,'morning','cloud',mo,px).slice(0,3).map(x=>x.id);return {px,txt:L(PX_N[px][0],PX_N[px][1]),fish:w};}
/* ---- точки на воде: рисунок (в фон BG), подписи при прицеле, попадание ---- */
function a2Zones(){return G&&G.o&&PZ[G.pi]?PZ[G.pi]:[];}
function a2ZPos(z){return {x:GEO.W*z.x,y:GEO.yOf(z.d),ps:GEO.ps(z.d)};}
function a2PaintZones(g){if(!G||!G.o)return;const u=GEO.u,R=rng(G.pi*71+5),P=G.P,tn=P.tint||(c=>c);
  for(const z of a2Zones()){const p=a2ZPos(z),s=p.ps*2.2,rx=Math.max(GEO.W*.09,u*10*s);
    if(z.k==='pit'){const gr=g.createRadialGradient(p.x,p.y,1,p.x,p.y,rx);gr.addColorStop(0,'rgba(0,18,35,.42)');gr.addColorStop(.7,'rgba(0,18,35,.22)');gr.addColorStop(1,'rgba(0,18,35,0)');g.fillStyle=gr;g.beginPath();g.ellipse(p.x,p.y,rx,rx*.3,0,0,7);g.fill();}
    else if(z.k==='weed'){for(let i=0;i<9;i++){const x=p.x+(R()-.5)*rx*1.6,y=p.y+(R()-.5)*rx*.32,r=u*(1.4+R()*1.1)*s;g.fillStyle=tn(R()<.5?'#3f7a2e':'#5a9a3a');g.beginPath();g.ellipse(x,y,r,r*.36,0,.25,6.1);g.lineTo(x,y);g.fill();
        if(i%4===1){g.fillStyle=tn('#f4f1e6');g.beginPath();g.arc(x+r*.3,y-r*.15,r*.32,0,7);g.fill();g.fillStyle=tn('#f2c53d');g.beginPath();g.arc(x+r*.3,y-r*.15,r*.12,0,7);g.fill();}}
      g.strokeStyle=tn('#5d7a2a');g.lineWidth=Math.max(1,u*.35*s);for(let i=0;i<5;i++){const x=p.x+(R()-.5)*rx*1.4,h=u*(4+R()*4)*s;g.beginPath();g.moveTo(x,p.y+u*.4*s);g.quadraticCurveTo(x+u*.6*s,p.y-h*.5,x+u*(R()-.3)*1.5*s,p.y-h);g.stroke();}}
    else if(z.k==='snag'){g.strokeStyle=tn('#4a3a26');g.lineCap='round';for(let i=0;i<3;i++){const x=p.x+(i-1)*rx*.35,h=u*(5+i*2.5)*s,a=(i-1)*.5+(R()-.5)*.3;g.lineWidth=Math.max(1.5,u*(.9-i*.15)*s);g.beginPath();g.moveTo(x,p.y);g.lineTo(x+Math.sin(a)*h,p.y-Math.cos(a)*h);g.stroke();
        g.lineWidth=Math.max(1,u*.4*s);g.beginPath();g.moveTo(x+Math.sin(a)*h*.6,p.y-Math.cos(a)*h*.6);g.lineTo(x+Math.sin(a)*h*.6+u*1.6*s*(i-1||1),p.y-Math.cos(a)*h*.6-u*1.2*s);g.stroke();}
      g.strokeStyle='rgba(255,255,255,.35)';g.lineWidth=1;g.beginPath();g.ellipse(p.x,p.y,rx*.6,rx*.12,0,0,7);g.stroke();}
    else if(z.k==='edge'){for(let k=0;k<2;k++){g.strokeStyle=k?'rgba(255,255,255,.4)':'rgba(0,25,40,.25)';g.lineWidth=Math.max(1,u*.45*s);g.beginPath();
        for(let i=0;i<=24;i++){const x=p.x-rx*1.3+rx*2.6*i/24,y=p.y+(k?-u*.5*s:u*.4*s)+Math.sin(i*1.1)*u*.5*s;i?g.lineTo(x,y):g.moveTo(x,y);}g.stroke();}}}}
// подписи точек: при прицеле (и коротко после заброса — в выбранной), крупно, со значком; далёкая — «далеко»
function a2DrawZones(g,t){if(!G||!G.o||!GEO)return;const ph=G.phase;if(ph!=='aim')return;const u=GEO.u,maxd=TACKLE.rod.dist[curTk().rod]*a2DK(),fs=clamp(Math.round(u*3.6),16,19);
  g.font='800 '+fs+'px -apple-system,Segoe UI,Roboto,sans-serif';g.textAlign='center';g.textBaseline='bottom';
  for(const z of a2Zones()){const p=a2ZPos(z),far=z.d>maxd+.5,txt=ZONES[z.k].ic+' '+L(ZONES[z.k].n,ZONES[z.k].en)+(far?' · '+L('далеко','too far'):'');
    const y=p.y-u*2.2,w=g.measureText(txt).width+14;p.x=clamp(p.x,w/2+6,GEO.W-w/2-6);g.fillStyle=far?'rgba(40,40,40,.45)':'rgba(10,40,55,.58)';rr(g,p.x-w/2,y-fs-6,w,fs+8,8);g.fill();
    g.fillStyle=far?'rgba(255,255,255,.75)':'#fff';g.fillText(txt,p.x,y);}
  g.textBaseline='alphabetic';}
// куда попал заброс: в точку (касание рядом с ней — щедро, «прилипает») или чистая вода. Вернёт {k, x, d} — d уже в пределах удочки
function a2ZoneAt(x,y,d,maxd){let best=null,bd=1e9;for(const z of a2Zones()){if(z.d>maxd+.5)continue;const p=a2ZPos(z),rx=Math.max(GEO.W*.12,46),ry=clamp(Math.abs(GEO.yOf(Math.max(1,z.d-3))-GEO.yOf(z.d+3))/2+10,22,60);
    const q=Math.pow((x-p.x)/rx,2)+Math.pow((y-p.y)/ry,2);if(q<1.6&&q<bd){bd=q;best={k:z.k,x:p.x+(x-p.x)*.85,d:z.d+(d-z.d)*.3}; /* FB1: x — почти где коснулся (было .35 — «прилипало», как мишень) */}}
  return best||{k:'open',x,d};}
/* ---- донка: леса натянута к точке, поплавка нет, колокольчик на кончике ---- */
function a2LedEnd(g,f,t){const u=GEO.u,ps=GEO.ps(f.d);g.strokeStyle='rgba(255,255,255,.45)';g.lineWidth=1;g.beginPath();g.ellipse(f.x,f.y,u*1.6*ps*2,u*.45*ps*2,0,0,7);g.stroke();return {x:f.x,y:f.y};}
function a2Bell(g,tip,t){if(!a2Led()||!G.fl)return;const ph=G.phase,u=GEO.u,sh=ph==='bite'?Math.sin(t*40)*.5:(G.fl.dip||0)*Math.sin(t*35)*.6;
  g.save();g.translate(tip.x,tip.y);g.rotate(sh);g.fillStyle='#d9a520';g.strokeStyle='#7a5a10';g.lineWidth=1;g.beginPath();g.moveTo(-u*1.1,u*2.2);g.quadraticCurveTo(-u*1.1,0,0,0);g.quadraticCurveTo(u*1.1,0,u*1.1,u*2.2);g.closePath();g.fill();g.stroke();
  g.fillStyle='#7a5a10';g.beginPath();g.arc(0,u*2.4,u*.35,0,7);g.fill();g.restore();}
/* ---- поклёвка по видам: пробы и сама поклёвка (поля f.lift / f.shake / f.dive — 0…1; рисует поплавок drawFloat, лупу — A1) ---- */
function a2Nib(f){const b=G.pk&&G.pk.f&&G.pk.f.bite;if(!G.o||a2Led()){f.dip=.5;if(a2Led())SND.nib();return;}
  if(b==='lift')f.lift=.6;else if(b==='shake'){f.shake=1;f.dip=.25;}else if(b==='dance'){f.dip=.45;f.shake=.6;}else f.dip=.5;}
function a2BiteAnim(f,b,k,dt){if(b==='lift'){f.lift=Math.min(1,k*1.5);f.lay=k>.6?(k-.6)*2.5:0;return true;}if(b==='dive'){f.sink=Math.min(1.2,k*2.4);return true;}

/* ---- улов: заказ, Книга места, навык. Возвращает монеты сверху (они уже в c — карточка и G.earned их видят) ---- */
function a2OnCatch(f,w,tags,bx){if(!G||G.tourn||!G.o||f.leg&&!FISH[f.id])return a2Xp(f,w,tags);let add=0;const pi=G.pi;

  /* SOC.init(S, {save, toast, cls, modal, close}) — один раз при запуске, после загрузки сохранения (считает сессии).
     cls — классы кнопок (по умолчанию 'btn noenter': Enter их не жмёт); modal(html) — показать окно игры и вернуть его
     контейнер; close() — закрыть окно игры. Без modal — своё лёгкое окно. */
  function init(S,opt){O=opt||{};if(!S.soc||typeof S.soc!=='object')S.soc={};st=S.soc;
    if(!st.ses&&!st.d0)st.d0=nowFn(); // день первого запуска (для расписания уведомлений); у давних игроков его нет
    st.ses=(st.ses||0)+1;if(!OKP&&qp('vk_is_favorite')==='1')st.fav={d:1};evInit();saveFn();ready();}
  // после VKWebAppInit (мост готов): узнать, можно ли значок на экран (только Android)
  function ready(){if(readyOn||!ok())return;readyOn=true;evPlan(8000);ntfSes();
    if(!OKP&&PF.indexOf('android')>=0)vkSend('VKWebAppAddToHomeScreenInfo',{},4000).then(function(r){
      homeOk=!!(r&&r.is_feature_supported&&!r.is_added_to_home_screen);},function(){homeOk=false;});
    else homeOk=false;}
  // облако: вызвать из слияния сохранений игры — SOC.merge(d.soc); сессии — максимум, «сделано» — навсегда, попытки — больше/позже
  function merge(d){if(!d||typeof d!=='object')return;
    for(var k in d){var a=st[k],b=d[k];
      if(k==='ses'){if(typeof b==='number'&&b>(st.ses||0))st.ses=b;continue;}
      if(k==='ev'){evMerge(b);continue;}
      if(k==='d0'){if(+b>0&&(!st.d0||+b<st.d0))st.d0=+b;continue;} // первый запуск — более ранний
      if(!b||typeof b!=='object')continue;
      if(!a||typeof a!=='object'){st[k]=b;continue;}
      if(a.d||b.d){st[k]={d:1};continue;}
      a.n=Math.max(a.n||0,b.n||0);a.t=Math.max(a.t||0,b.t||0);}}

  // --- действия (кнопки в ⚙ жмёт сам игрок; ограничений частоты нет, наград нет) ---
  function fav(){return send('VKWebAppAddToFavorites').then(function(r){if(r&&r.result)done('fav');sx('fav',r&&r.result?'ok':'no');return !!(r&&r.result);},function(e){sr('fav')(e);tried('fav');return false;});}
  function home(){return send('VKWebAppAddToHomeScreen').then(function(r){if(r&&r.result){done('home');homeOk=false;}sx('home',r&&r.result?'ok':'no');return !!(r&&r.result);},function(e){sr('home')(e);tried('home');return false;});}
  // «Приведи друга» (модуль REF, если он есть в игре и включён): вместо окна приглашения — ссылка с меткой #ref=<id>,
  // иначе друг, открывший игру с телефона, не засчитается (окно приглашения передаёт автора только на сайте ВК)
  function refOn(){return typeof REF!=='undefined'&&!!REF&&typeof REF.on==='function'&&REF.on();}
  // ОК: ссылка REF ведёт на vk.com — не годится; окно приглашения, message обязателен на сайте и в мобильном браузере ОК
  function invite(){if(OKP)return send('VKWebAppShowInviteBox',{message:O.okMsg||tx('Заходи в игру — посоревнуемся!','Come and play — let us compete!')}).then(function(r){if(r&&r.success!==false)done('inv');sx('inv',r&&r.success!==false?'ok':'no');return true;},function(e){sr('inv')(e);tried('inv');return false;});
    if(refOn())return send('VKWebAppShare',{link:REF.link()}).then(function(){done('inv');sx('inv','ok');return true;},function(e){sr('inv')(e);tried('inv');return false;});
    return send('VKWebAppShowInviteBox').then(function(r){if(r&&r.success!==false)done('inv');sx('inv',r&&r.success!==false?'ok':'no');return true;},function(e){sr('inv')(e);tried('inv');return false;});}
  function share(){if(OKP&&!O.okLink)return Promise.resolve(false);
    return send('VKWebAppShare',{link:OKP?O.okLink:refOn()?REF.link():'https://vk.com/app'+APP}).then(function(){sx('shr','ok');return true;},function(e){sr('shr')(e);return false;});}
  function group(){if(OKP&&!O.okGroup)return Promise.resolve(false);
    return send('VKWebAppJoinGroup',{group_id:OKP?O.okGroup:GROUP}).then(function(r){if(r&&r.result)done('grp');sx('grp',r&&r.result?'ok':'no');return !!(r&&r.result);},function(e){sr('grp')(e);tried('grp');return false;});}
  function open(g){if(OKP&&!(g.ok&&OKWEB))return Promise.resolve(false); // ОК: OpenApp есть только на сайте и в мобильном браузере
    return send('VKWebAppOpenApp',OKP?{app_id:g.ok,app_is_local:true}:{app_id:g.id,location:'from='+APP}).then(function(){return true;},function(){
    toastFn(tx('Найдите «'+g.t+'» в разделе «Игры»','Find "'+g.t+'" in the Games section'));return false;});}

  // --- список «Ещё игры»: без себя, без 18+, без неопубликованных на этой площадке; сначала родственные, дальше — сдвиг по дню ---
  function list(n){var m=me(),mg=m?m.g:'',out=[],i,g,day=Math.floor(Date.now()/DAY);
    for(i=0;i<N;i++){g=GAMES[i];if(g.id===APP||g.a>=18)continue;
      if(g.off==='all'||(OKP?!(g.ok&&OKWEB):(g.off==='web'&&WEB)))continue;out.push(g);} // ОК: только игры с ID в ОК и только там, где работает OpenApp
    out.sort(function(a,b){var x=(b.g===mg)-(a.g===mg);if(x)return x;return ((a.i+day)%N)-((b.i+day)%N);});
    return out.slice(0,n||6);}

  function btn(k,label){return '<button class="'+(O.cls||'btn noenter')+'" data-soc="'+k+'">'+label+'</button>';}

  function settingsHtml(){if(!ok())return '';
    var b=btn('inv',tx('👥 Позвать друзей','👥 Invite friends'));
    if(can('share'))b+=btn('share',tx('📤 Поделиться игрой','📤 Share the game'));
    if(can('fav'))b+=btn('fav',tx('⭐ В избранное','⭐ Add to favourites'));
    if(can('home'))b+=btn('home',tx('📲 На экран телефона','📲 Add to home screen'));
    if(can('grp'))b+=btn('grp',tx('📣 Наше сообщество','📣 Our community'));
    if(O.ntf&&can('ntf'))b+=btn('ntf',O.ntf.s||tx('🔔 Напоминания от игры','🔔 Game reminders'));

    return '<div class="soc-set">'+b+'</div>';}
  // навесить обработчики после вставки HTML: SOC.bind(контейнер, back) — back() вызывается при «Назад» из «Ещё игры»
  function bind(root,back){if(!root)return;var bs=root.querySelectorAll('[data-soc]');
    for(var i=0;i<bs.length;i++)bs[i].onclick=function(){var k=this.getAttribute('data-soc');
      if(k==='inv')invite();else if(k==='share')share();else if(k==='fav')fav().then(function(){if(back)back();});
      else if(k==='home')home().then(function(){if(back)back();});else if(k==='ntf')ntf(0).then(function(){if(back)back();});else if(k==='grp')group();else if(k==='more')showMore(back);};}

  // --- окно «Ещё игры во дворе»: через modal() игры (O.modal) или своё лёгкое. back — куда вернуться по «Назад» ---
  function showMore(back){if(!can('more'))return;css();var G=list(6),spr=O.sprite||'js/dvor.jpg',h='';
    for(var i=0;i<G.length;i++)h+='<button class="soc-g" data-g="'+i+'"><span class="soc-ic" style="background-image:url('+spr+');background-position:'+(-48*G[i].i)+'px 0;background-size:'+(48*N)+'px 48px"></span>'+
      '<span class="soc-t">'+G[i].t+(G[i].a>=12?'<small>'+G[i].a+'+</small>':'')+'</span><span class="soc-a">›</span></button>';
    var head='<h2>'+tx('Ещё игры во дворе','More yard games')+'</h2>',
      foot='<div class="row"><button class="'+(O.cls||'btn noenter')+'" id="socClose">'+(back?tx('← Назад','← Back'):tx('Закрыть','Close'))+'</button></div>',
      root,box=null;
    if(O.modal)root=O.modal(head+'<div class="soc-list">'+h+'</div>'+foot);
    else{box=document.createElement('div');box.className='soc-box';box.id='socBox';
      box.innerHTML='<div class="soc-card">'+head+'<div class="soc-list">'+h+'</div>'+foot+'</div>';document.body.appendChild(box);root=box;
      box.onclick=function(e){if(e.target===box)close();};}
    function close(){if(box){if(box.parentNode)box.parentNode.removeChild(box);}else if(O.close)O.close();}
    var c=root.querySelector('#socClose');if(c)c.onclick=function(){if(back&&O.modal)back();else close();};
    var rows=root.querySelectorAll('[data-g]');
    for(var j=0;j<rows.length;j++)rows[j].onclick=function(){open(G[+this.getAttribute('data-g')]);};}

  /* --- одно само-предложение за сессию (звать из окна победы). wins — число побед всего; busy — игра занята
     (реклама < 60 с назад, пауза, следом межэкранная). Вернёт {k, t, b, run} или null — строку и кнопку рисует игра.
     Показ сразу считается «отказом» (≤3 раз, не чаще раза в 30 дней); успех fav/home/inv/grp — больше никогда. --- */
  function offer(wins,busy){if(!ok()||asked||busy||Date.now()-T0<120000)return null;
    var o=null;
    // уведомления: до 3 показов за всё время — в 1-й, 3-й и 7-й день игрока (NTF_DAYS), после 3 побед; из ⚙ игрок может включить сам
    var nn=ntfDue()&&(wins||0)>=3?ntfN()+1:0,nt=nn?ntfText(nn):'';
    if(nn&&nt)o={k:'ntf',n:nn,t:nt,b:O.ntf.b||tx('🔔 Напоминать','🔔 Remind me'),ok:O.ntf.ok||'',run:function(){return ntf(nn);}};
    else if((st.ses||0)<2)return null; // остальные предложения — не в первую сессию (п. 2.6.3)
    else if(can('fav')&&due('fav'))o={k:'fav',t:tx('Добавьте игру в избранное — будет всегда под рукой.','Add the game to favourites — always at hand.'),b:tx('⭐ В избранное','⭐ Add to favourites'),run:fav};
    else if(can('home')&&st.ses>=3&&due('home'))o={k:'home',t:tx('Значок игры на экране — заходить в одно касание.','A game icon on your screen — one tap to play.'),b:tx('📲 На экран телефона','📲 Add to home screen'),run:home};
    else if(st.ses>=3&&(wins||0)>=5&&due('inv'))o={k:'inv',t:tx('Позовите друзей — будет с кем посоревноваться.','Invite friends — someone to compete with.'),b:tx('👥 Позвать друзей','👥 Invite friends'),run:invite};
    else if(can('grp')&&st.ses>=4&&due('grp'))o={k:'grp',t:tx('Новости и новые игры — в сообществе «Игры во дворе».','News and new games — in the "Yard Games" community.'),b:tx('📣 Наше сообщество','📣 Our community'),run:group};
    else{var x=st.more||{};if(!x.t||Date.now()-x.t>7*DAY){var g=list(1)[0];
      if(g)o={k:'more',t:tx('Попробуйте ещё: «'+g.t+'»'+(g.a>=12?' ('+g.a+'+)':'')+'.','Try another one: "'+g.t+'".'),b:tx('🎲 Открыть','🎲 Open'),run:function(){return open(g);}};}}
    if(!o)return null;asked=true;sx(o.k,'show',o.n,o.k==='ntf'?{d:ntfDay()}:null);
    if(o.k==='more'){st.more={t:Date.now()};saveFn();}
    else if(o.k==='ntf'){st.ntf={n:o.n,t:nowFn()};saveFn();}
    else tried(o.k);return o;}

  /* ===== v2.3. Разрешение на уведомления (VKWebAppAllowNotifications) =====
     Сам модуль ничего не показывает: игра включает настройкой SOC.init(…,{ntf:{t:'вопрос' или function(n){…},b:'кнопка',ok:'ответ',s:'кнопка в ⚙'},now:часы игры}).
     Тогда: в ⚙ — кнопка (жмёт сам игрок, всегда, пока не разрешено), в SOC.offer — предложение 'ntf' до NTF_MAX=3 раз за всё время,
     по дням игрока NTF_DAYS=[1,3,7] (день 1 — день первого запуска, S.soc.d0; дни календарные, по часам игры O.now):
     показ №1 — в первый же день (условие «вторая сессия» на него НЕ действует; остаётся: не в первые 2 минуты сеанса и при ≥3 победах),
     №2 — не раньше 3-го дня, №3 — не раньше 7-го; не заходил в нужный день — при первом заходе позже; два показа в один день — никогда.
     Игрок, который начал играть до этой версии (нет S.soc.d0): №1 — сразу по обычному условию, №2 — через 2 дня после №1, №3 — через 4 дня после №2.
     t — строка или функция от номера попытки (1–3): каждый раз свой повод; вернула пусто — в этот раз не предлагаем (показ не тратится).
     S.soc.ntf: {n: сколько раз показали, t: когда в последний раз (часы игры O.now, иначе Date.now)} или {d:1} — разрешено, больше никогда.
     Облако (merge): счётчик — больший, дата — более поздняя, «разрешено» — навсегда. Окно VK вызывается только нажатием кнопки игроком.
     Статистика: soc {a:'ntf', r: show|ok|no|err, n: номер попытки 1–3; из ⚙ — без n}. Если VK уже сообщил vk_are_notifications_enabled=1 — не спрашиваем. В ОК пока выключено. Наград нет.
     v2.4 — статистика подробнее (событие то же, soc с a:'ntf'; сервер статистики править не надо):
       show {n, d}        — предложение показано: n — какое по счёту (1–3), d — день игрока (1 — день первого запуска; 0 — неизвестен, давний игрок);
       ok | no | err {n, d, e} — ответ на окно VK: разрешил | отказал (закрыл окно, код 4) | ошибка; e — код ошибки VK (число) или короткая причина; из ⚙ — без n;
       on {s}             — раз за сеанс, если уведомления включены: s:'vk' — так сообщил VK (vk_are_notifications_enabled=1), s:'me' — игрок разрешил нашей кнопкой, а VK параметра не дал;
       off                — раз за сеанс: игрок разрешал нашей кнопкой, а VK сообщает vk_are_notifications_enabled=0 (выключил в настройках VK).
     «Пришёл по уведомлению» модуль не пишет: метка захода vk_ref и так есть в шапке каждой пачки статистики (поле src).
     Если игрок выключил уведомления в VK (параметр = 0), кнопка в ⚙ появляется снова (включить может только он сам); само-предложение — никогда. */
  var ntfNow=false; // разрешил в этом сеансе (параметр запуска VK до перезапуска остаётся прежним)
  function ntfOn(){var v=qp('vk_are_notifications_enabled');return ntfNow||v==='1'||(v!=='0'&&!!(st.ntf&&st.ntf.d));}
  function ntfDay(){return st.d0?Math.max(0,dayNo(nowFn())-dayNo(st.d0)+1):0;}
  function ntfSes(){if(!O.ntf||OKP)return;var v=qp('vk_are_notifications_enabled'),d=!!(st.ntf&&st.ntf.d);
    if(v==='1')sx('ntf','on',0,{s:'vk'});else if(d)sx('ntf',v==='0'?'off':'on',0,v==='0'?null:{s:'me'});}
  var NTF_MAX=3,NTF_DAYS=[1,3,7]; // показов всего; в какой день игрока (от первого запуска) не раньше — показ №1, №2, №3
  function dayNo(t){var d=new Date(t);return Math.floor((t-d.getTimezoneOffset()*60000)/DAY);} // номер календарного дня (местное время)
  function nowFn(){var t=0;try{t=+(O.now&&O.now())||0;}catch(e){}return t>0?t:Date.now();}
  function ntfN(){return st.ntf&&+st.ntf.n||0;}
  function ntfDue(){if(!O.ntf||!can('ntf')||(st.ntf&&st.ntf.d))return false;var n=ntfN();
    if(n>=NTF_MAX)return false;if(!n)return true;
    var now=dayNo(nowFn()),last=dayNo(+st.ntf.t||0);if(now<=last)return false; // в один день — никогда
    return st.d0?now-dayNo(st.d0)+1>=NTF_DAYS[n]:now-last>=NTF_DAYS[n]-NTF_DAYS[n-1];}
  function ntfText(n){var t=O.ntf.t;if(typeof t==='function'){try{t=t(n);}catch(e){t='';}}
    return t==null?tx('Напомнить, когда появится что-то новое?','Remind you when there is something new?'):String(t||'');}
  // n — номер попытки из offer (1–3) или 0/пусто — кнопка в ⚙. Отказ счётчик показов не меняет (показ уже посчитан в offer)
  function ntf(n){n=+n||0;return send('VKWebAppAllowNotifications').then(function(r){var y=!!(r&&r.result);if(y){done('ntf');ntfNow=true;}sx('ntf',y?'ok':'no',n,{d:ntfDay()});return y;},
    function(e){var d=e&&e.error_data||{},c=+d.error_code||0,why=String(d.error_reason||d.error_msg||'');
      sx('ntf',c===4||/denied|cancel/i.test(why)?'no':'err',n,{d:ntfDay(),e:c||String(why||(e&&(e.error_type||e.message))||'?').slice(0,24)});return false;});}

  /* ===== v2.3. События VK: лента активности друзей, таблица результатов, миссии =====
     VK принимает их только с сервера (secure.addAppEvent), поэтому игра шлёт в свою функцию (hobby-pay, ?op=vkev) подписанные параметры
     запуска и список событий; сервер проверяет подпись. Включается настройками SOC.init: evUrl — адрес функции,
     evId(код) — номер миссии из кабинета VK (0/пусто — миссия ещё не заведена, не шлём), evGap — пауза между отправками уровня/очков (мс).
     Игра зовёт (в любой момент, хоть на каждую победу): SOC.level(n) — пройдено уровней, SOC.score(n) — очки, SOC.mission('код') — миссия выполнена.
     Модуль помнит в S.soc.ev: l/p — что надо отправить, ls/ps — что уже отправлено, m — миссии {код: 0 ждёт | 1 отправлена},
     f — {код: когда VK в последний раз отказал}. Отказ VK по миссии (ещё на проверке у модератора, отклонена, сбой) — НЕ навсегда:
     миссия остаётся ждать и повторяется при следующих запусках, но не чаще раза в сутки (EV_RETRY_DAYS) на миссию. Шлёт пачкой (до 4 событий, миссий — до 2 за запрос и до 4 за сеанс), уровень/очки — не чаще раза в evGap (3 мин),
     плюс при сворачивании игры; не отправилось (нет сети, сервер молчит) — уйдёт в следующий раз/при следующем запуске.

{const b0=PAY.buy;PAY.buy=function(id){if(PAY.busy||!PAY.on)return b0.call(PAY,id);payOk=null;

/* ===== perf1 (05.10): РЕЖИМ СЛАБОГО ТЕЛЕФОНА — `LOW`. Образец: hobby-analytics/release-h/perf/perf-sample.md =====
   Включается сам: мало памяти (≤ 2 ГБ), Android с ≤ 4 ядрами, старый движок (нет roundRect), либо по факту — два окна по 90 кадров подряд медленнее ~48 к/с

  const cxp=W*.27,cy=yb,cs=u*7,turn=G.phase==='land'||G.phase==='card';a1Cat(g,t,cxp,cy,cs,tn,night,turn);}
function drawTension(g,ft){const W=GEO.W,u=GEO.u,bw=Math.min(W*.8,400),bh=clamp(u*2.8,13,20),x0=(W-bw)/2,y0=96,T=Math.min(1.3,ft.T),sc=v=>x0+bw*v/1.3,fs=Math.round(clamp(u*3.3,13,16));

/*A1:красота (волна А, поток A1, 03.10) — только вид и звук: клёв, окно подсечки и вываживание НЕ меняются (это A2).
   1) характер поклёвки у каждой рыбы (BITE_K) и «лупа поплавка» (a1Loupe); 2) рыба видна под водой (a1FishUnder) и подсак (a1Net);
   3) живой берег: Петрович (a1PetrPose), кот (a1Cat), птицы, стрекоза, светлячки, звёзды, рябь от ветра (a1Sky/a1Life);
   4) фото трофея (a1Photo*, S.ph, альбом «📷 Фото», «В историю» VK); 5) звуки природы — записи audio/*.m4a (AMB, авторы — A1_CRED).
   Состояние кадра — G.a1 (не сохраняется). Поля сохранения: S.loupe (0 авто, 1 всегда, 2 выкл), S.amb (false — выкл), S.ph (фото). */
// shake — дрожит мелко (мелочь), dance — пляшет, dip — притопил, lift — поднял и положил набок, drag — повёл в сторону, dive — резко в глубину
const BITE_K={shake:'peskar ukleyka snetok ryapushka koryushka',dance:'ersh rotan skripun',
  dip:'plotva okun golavl yaz chehon vobla omul sig harius golets kundzha',
  lift:'karas karasz lin gustera lesh karp sazan amur tolstolob boris general',
  drag:'shuka sudak som nalim zmeegolov paliya lenok kaluga marfa kuzmich tsaritsa',
  dive:'zhereh losos taimen verhoglyad kizhuch nerka chavycha mikizha varyag batyushka korol'};
const BITE_OF={};for(const k in BITE_K)BITE_K[k].split(' ').forEach(id=>{BITE_OF[id]=k;});

function biteK(f){if(!f)return 'dip';if(G&&tutCast())return 'dip';const b=f.bite==='lay'?'lift':f.bite;return BITE_TIP[b]?b:(BITE_OF[f.id]||'dip');}
// дед Митяй — один раз на каждый характер поклёвки (S.tips.b_<вид>)
const BITE_TIP={shake:['Мелочь балует: поплавок дрожит мелко-мелко. Как утонул — подсекай!','Small fry: the float trembles. When it sinks — strike!'],
  dance:['Ёрш да ротан пляшут: поплавок прыгает вверх-вниз, потом ныряет. Тут и жми!','Ruffe dance: the float bobs up and down, then dives. Strike!'],
  dip:['Плотва да окунь топят: тук-тук — и поплавок под воду. Подсекай!','Roach and perch pull it under: tap-tap — and down. Strike!'],
  lift:['Лещ да карась поднимают поплавок и кладут набок. Лёг — подсекай!','Bream and carp lift the float and lay it flat. Strike then!'],
  drag:['Хищник! Поплавок уходит в сторону и в глубину — подсекай смело.','A predator! The float slides away and down — strike!'],
  dive:['Резкая рыба: поплавок разом нырнул в глубину. Не зевай!','A fast fish: the float dives at once. Be quick!']};
function a1S(){return G.a1||(G.a1={lp:0,side:1,lr:[],dip0:0,ph:'',pp:null,cat:{k:'sit',t:0},birds:[],nb:6+Math.random()*10,df:null,ff:[],st:null,ns:90+Math.random()*90,
  wp:[],fx:null,fv:0,face:1,net:0,dt:[],low:0,fs:15+Math.random()*20,bf:null,stole:0});}
// кадр: состояние лупы, характер поклёвки на большом поплавке, живность, реакции. Зовётся в конце update()
function a1Update(dt){const A=a1S(),ph=G.phase,f=G.fl,u=GEO.u,W=GEO.W;
  // кадр медленнее ~22 в секунду три секунды подряд — без живности (птицы, стрекоза, светлячки, рябь)
  A.nf=(A.nf||0)+1;if(A.nf>120){A.dt.push(dt);if(A.dt.length>90)A.dt.shift();if(A.dt.length>=90&&!A.low&&A.dt.reduce((s,x)=>s+x,0)/A.dt.length>1/22)A.low=1;}
  if(ph!==A.ph){const old=A.ph;A.ph=ph;
    // смена фазы: старый тост («удочка короткая» и т. п.) не висит над поплавком/шкалой; реплика Петровича о прошлом забросе не тянется в вываживание
    if(ph==='nibble'||ph==='bite'||ph==='fight'||ph==='reel'){const te=$('toast');if(te&&te.classList.contains('on')&&!te.classList.contains('fgt')){clearTimeout(toast._t);te.classList.remove('on');}}
    if((ph==='fight'||ph==='reel'||ph==='bite')&&sayWho==='petr'){clearTimeout(sayT);$('say').classList.remove('on');}
    if(ph==='wait'&&old==='fly'&&f){A.side=f.x>W*.5?-1:1;A.lr.push({r:0,l:1,s:1.2});A.dir=Math.random()<.5?-1:1;}
    if(ph==='nibble'&&G.pk&&G.pk.f&&!G.pk.junk&&(S.sessions||0)>=1&&!tutCast()){const k=biteK(G.pk.f);if(!S.tips['b_'+k]){S.tips['b_'+k]=1;save();say('mit',L(BITE_TIP[k][0],BITE_TIP[k][1]),6500);}}
    if(ph==='bite'){A.lr.push({r:0,l:1,s:1.6});if(G.pk&&G.pk.f&&biteK(G.pk.f)==='dive')A.lr.push({r:0,l:1,s:2.4});}
    if(ph==='fight'||ph==='reel'){A.fx=null;A.fv=0;}
    try{fbBitePhase(ph);}catch(e){}} // FB1: вибрация и подпись по характеру поклёвки
  const on=f&&(ph==='wait'||ph==='nibble'||ph==='bite'||ph==='miss')&&S.loupe!==2&&(f.d>=10||S.loupe===1||G.fbCap&&(ph==='nibble'||ph==='bite'))&&!a2Led(); // FB1: первые 3 раза у вида — лупа и на близком забросе // boost1: на донке поплавка нет — и лупы нет
  A.lp=clamp(A.lp+(on?dt*4:-dt*5),0,1);
  if(f){if((f.dip||0)>A.dip0+.2)A.lr.push({r:0,l:1,s:.8});A.dip0=f.dip||0;}
  for(const r of A.lr){r.r+=dt*(.55+.3*r.s);r.l-=dt*.8;}A.lr=A.lr.filter(r=>r.l>0);
  // большой поплавок — по характеру рыбы (только картинка; окно подсечки — G.win — то же)
  if(ph==='bite'&&f&&G.pk&&G.pk.f){const k=biteK(G.pk.f),tt=G.t,e=Math.min(1,tt/.35);f.lay=0;f.lift=0;f.shake=0; // boost1: поза целиком здесь, без добавки A2 (a2FloatDy)
    // FB1: характеры заметнее — поднял высоко и положил; повёл в сторону с наклоном; разом в глубину; дрожит сильно и тонет; 3 прыжка и нырок; тук-тук и под воду
    if(k==='lift'){if(tt<.45)f.sink=-(tt/.45)*.5;else{f.sink=-.25+Math.min(.15,(tt-.45)*.3);f.lay=Math.min(1,(tt-.45)/.25);}}
    else if(k==='drag'){f.sink=e*.55;f.drag=Math.min(tt*u*10,u*16)*(A.dir||1);f.lay=-.2*(A.dir||1)*e;}
    else if(k==='dive')f.sink=Math.min(1.6,tt/.08);
    else if(k==='shake'){f.sink=Math.min(1,tt/.8);f.drag=Math.sin(G.ptime*55)*u*.8;}
    else if(k==='dance')f.sink=tt<.45?-Math.abs(Math.sin(tt*21))*.5:Math.min(1.2,(tt-.45)/.12);
    else f.sink=tt<.4?Math.abs(Math.sin(tt*15.7))*.45:Math.min(1.1,(tt-.4)/.18);}
  // Петрович: поза дольше не держится
  if(A.pp){A.pp.t-=dt;if(A.pp.t<=0)A.pp=null;}
  if(!A.pp&&(ph==='wait'||ph==='aim')&&Math.random()<dt/45)A.pp={k:'tea',t:4,d:4};
  a1CatStep(A,dt);a1Sound(A);
  if(!A.low)a1LifeStep(A,dt);}

/* ---------- 1) лупа поплавка ---------- */
// boost1: поплавок справа (точки A2 — коряжник/яма справа) — лупа слева закрывала Петровича; теперь — в небе над поплавком (справа),
// если небо вмещает круг под шапкой; иначе — слева, но в небе (выше Петровича)
function a1LoupeGeo(){const A=a1S(),W=GEO.W,H=GEO.H,r=Math.round(clamp(Math.min(W,H)*.19,58,96)),top=74+r,sky=GEO.hz-r-GEO.u;
  if(A.side<0)return sky>=top?{r,cx:W-r-14,cy:sky}:{r,cx:r+14,cy:top};

// смещение и наклон поплавка в лупе (в долях высоты поплавка): по фазе и характеру
function a1FloatPose(A,t){const ph=G.phase,f=G.fl,k=G.pk&&G.pk.f?biteK(G.pk.f):'dip',d=A.dir||1;let dx=0,dy=Math.sin(t*2.2)*.02,rot=Math.sin(t*1.3)*.03;
  if(ph==='nibble'){const p=Math.min(1,Math.max((f.dip||0)*2,f.lift||0,f.shake||0)); // boost1: пробы A2 (lift/shake) тоже видны в лупе
    if(k==='shake'){dx=Math.sin(t*55)*.09*p;dy+=p*.08;}else if(k==='dance')dy-=Math.abs(Math.sin(t*14))*.22*p; // FB1: пробы крупнее
    else if(k==='lift')dy-=p*.26;else if(k==='drag'){dx=p*.22*d;rot+=p*.3*d;}else if(k==='dive')dy+=p*.38;else dy+=p*.24;}
  else if(ph==='bite'&&G.pk&&!G.pk.junk){const tt=G.t,e=Math.min(1,tt/.35);
    // FB1: в лупе — те же характеры, крупнее (как у большого поплавка)
    if(k==='lift'){if(tt<.45)dy=-(tt/.45)*.5;else{dy=-.15;rot=Math.min(1,(tt-.45)/.25)*Math.PI/2*d;}}
    else if(k==='drag'){dx=Math.min(.6,tt*1.2)*d;dy=e*.3;rot=.5*d*e;}
    else if(k==='dive')dy=Math.min(1,tt/.08)*1.6;
    else if(k==='shake'){dx=Math.sin(t*60)*.14;rot=Math.sin(t*47)*.18;dy=Math.min(1,tt/.8)*1.05;}
    else if(k==='dance')dy=tt<.45?-Math.abs(Math.sin(tt*21))*.4:Math.min(1,(tt-.45)/.12)*1.3;
    else dy=tt<.4?Math.abs(Math.sin(tt*15.7))*.35:Math.min(1,(tt-.4)/.18)*1.1;}
  else if(ph==='bite')dy=Math.min(1,G.t/.35)*1.05;
  return {dx,dy,rot};}
function a1Loupe(g,t){const A=a1S(),f=G.fl;if(A.lp<=.01||!f)return;const P=G.P,{r,cx,cy}=a1LoupeGeo(),wl=cy+r*.22,h=r*.95,w=h*.34,ps=a1FloatPose(A,t),night=P.tod==='night';

  for(const q of A.lr){const rr0=w*(1.2+q.r*3.2*q.s);g.strokeStyle='rgba(255,255,255,'+(.55*q.l).toFixed(3)+')';g.lineWidth=Math.max(1.2,r*.02);g.beginPath();g.ellipse(fx,wl,rr0,rr0*.28,0,0,7);g.stroke();}
  // под водой: киль и грузило (бледно), над водой — сам поплавок, внизу — отражение

  if(ty==='sp'){const c=PLACES[pi].fish.filter(id=>FISH[id].r>=1&&(FISH[id].b.worm||0)>=.5);d.fid=c[Math.floor(R()*c.length)];const r=FISH[d.fid].r;d.n=r>=4?3:r>=2?2:1;}

/* ---- подарок дня: 7 ступеней по дням захода (без сгорания), награда растёт; на 7-й — ещё и банка живца ---- */
const STREAK=[10,10,15,15,20,25,40];
// stage1 (решение владельца для всей серии): подарки дня БЕЗ сгорания — считаются дни захода, пропуск ничего не обнуляет.
// S.streak={day:1..7 (место в недельной лесенке), last:день последнего подарка, cyc:сколько раз дошёл до 7-го}; всего взято — giftN()
function giftCnt(s){return s?(s.cyc||0)*7+((s.day||0)%7):0;}
function giftN(){return giftCnt(S.streak);}
function streakState(){const s=S.streak||{day:0,last:0,cyc:0},d=Math.max(0,Math.min(7,s.day||0));
  if(s.last===dayKey(0)&&d>0)return{claimed:true,day:d};
  return{claimed:false,day:d%7+1};}
function maybeStreak(){if(G||window.__demo||$('modal').classList.contains('on')||$('ad').classList.contains('on'))return;
  if(weekClaim())return;
  const st=streakState();if(st.claimed||(S.caught||0)<1)return;
  if(st.day===1&&!giftN())claimStreak(1,true);else showStreak();}
function showStreak(){STAT.screen('gift');const st=streakState();let cells='';
  for(let d=1;d<=7;d++){const done=st.claimed?d<=st.day:d<st.day,today=!st.claimed&&d===st.day;
    cells+=`<div class="sd ${done?'done':''} ${today?'today':''} ${d===7?'d7':''}"><small>${L('День','Day')} ${d}</small><span class="ic">${d===7?'🎁':'💰'}</span>+${STREAK[d-1]}${d===7?'<small>+ '+L('10 живцов','10 live bait')+'</small>':''}</div>`;}
  const r=st.claimed?0:STREAK[st.day-1];
  modal(`<h2>${L('Подарок дня','Daily gift')} 🎁</h2><p>${st.claimed?L('Сегодняшний подарок уже твой. Следующий — день '+(st.day%7+1)+', когда зайдёшь.','Today\'s gift is yours. Next time — day '+(st.day%7+1)+'.'):L('Каждый заход — подарок, он растёт; на 7-й ещё и банка живца. Пропустил день — ничего не сгорает.','A gift every visit, and it grows. Missed a day? Nothing is lost.')}</p>
    <div class="streak">${cells}</div>${giftN()?'<p class="about">'+L('Подарков получено','Gifts collected')+': <b>'+giftN()+'</b></p>':''}
    <div class="row">${st.claimed?'<button class="btn" id="sClose">'+L('Закрыть','Close')+'</button>':`${adOk()?`<button class="btn accent noenter" id="sX2">📺 ×2 ${L('за рекламу','for an ad')} (+${coinsTxt(r*2)})</button>`:''}<button class="btn green" id="sGet">${L('Забрать','Take')} +${coinsTxt(r)}</button>`}</div>`);
  if(st.claimed){$('sClose').onclick=hideModal;return;}
  $('sGet').onclick=()=>claimStreak(1);
  if($('sX2')){STAT.offer('gift');$('sX2').onclick=()=>{if(adHold('gift'))return;hideModal();STAT.place('gift');showRewarded(()=>claimStreak(2),()=>showStreak(),giftLate);};}}
function claimStreak(mult,quiet){const st=streakState();if(st.claimed){hideModal();return;}
  const c=STREAK[st.day-1],s=S.streak||{cyc:0};S.streak={day:st.day,last:dayKey(0),cyc:(s.cyc||0)+(st.day===7?1:0)};
  if(st.day===7){S.bait.live=(S.bait.live||0)+10;if(!S.ach.streak7){S.ach.streak7=1;S.coins+=ern('gift',50);}}
  S.coins+=ern('gift',c)+(mult>1?ern('ad',c*(mult-1)):0);save();updCoins();SND.coin();updStreakDot();
  if(quiet){toast('🎁 '+L('Подарок дня: +','Daily gift: +')+coinsTxt(c)+L('. Заходи завтра!','. Come back tomorrow!'),3500);return;}
  modal(`<h2>${st.day===7?L('Седьмой подарок! 🏆','The 7th gift! 🏆'):L('День','Day')+' '+st.day+' ✓'}</h2><p class="coins-won">+${coinsTxt(c*mult)}${mult>1?' <small>(×2)</small>':''}</p>
    ${st.day===7?'<p class="goal tipl">🐟 '+L('И банка живца (10 шт.) — щука будет рада','Plus 10 live bait')+'</p>':''}
    <p>${st.day<7?L('В следующий раз — день '+(st.day+1)+': +'+coinsTxt(STREAK[st.day]),'Next time: +'+coinsTxt(STREAK[st.day])):L('Дальше — снова с первого дня, и снова с подарками!','Next — from day 1 again, with gifts!')}</p>
    <div class="row"><button class="btn green" id="sOk">${L('Отлично!','Great!')}</button></div>`);$('sOk').onclick=hideModal;}

  S.streak={day:st.day,last:dayKey(0),cyc:(s.cyc||0)+(st.day===7?1:0)};
  if(st.day===7){S.bait.live=(S.bait.live||0)+10;if(!S.ach.streak7){S.ach.streak7=1;S.coins+=ern('gift',50);}}
  S.coins+=ern('gift',c)+(mult>1?ern('ad',c*(mult-1)):0);save();updCoins();SND.coin();updDots();toast('🎁 '+L('Подарок дня','Daily gift')+' '+st.day+': +'+coinsTxt(c*mult)+(mult>1?' (×2)':'')+(st.day===7?' · 🐟 +10':''),3000,true);return c*mult;}

/* ---- план рыбака на месяц: 10 целей, монеты за каждую, вещь месяца за 8 (октябрь — «Кленовый лист», ноябрь — «Рябина») ---- */
const MP_IT={9:'maple',10:'rowan'};
function a3Mp(){const k=a3MKey();if(S.mp.k!==k)S.mp={k,tp:topPlace(),ev:a3Ev(),c:{},g:{},it:0};return S.mp;}
function a3MpGoals(){const m=a3Mp();return a3MonthGoals(m.tp||0,!!m.ev);}
function a3MpVal(g){const m=a3Mp();return g.ty==='sea'?a3SeaN():(m.c[g.ty]||0);}
function a3MpTxt(g){const T={dd:['Рыбачить в разные дни','Fish on different days'],f:['Поймать рыб','Catch fish'],tr:['Поймать трофеев','Catch trophies'],dt:['Выполнить заданий дня','Complete daily tasks'],tn:['Сходить на турнир','Enter contests'],
  mo:['Рыбалок утром','Morning trips'],ni:['Рыбалок вечером или ночью','Evening or night trips'],bg:['Рыб тяжелее '+a3Kg(g.kg||1),'Fish over '+a3Kg(g.kg||1)],sea:['Осенний улов: видов','Autumn catch: species'],bk:['Дней со всеми целями','Days with all goals'],ml:['Прочитать писем','Read letters']}[g.ty]||['',''];return L(T[0],T[1]);}
const a3MpC=()=>a3C(a3Trip(),A3R.month[0],A3R.month[1]);
function a3MpAdd(ty,n){const m=a3Mp();m.c[ty]=(m.c[ty]||0)+n;a3MpCheck();}
function a3MpCheck(){const m=a3Mp(),gs=a3MpGoals();let c=0,got=[];gs.forEach((g,i)=>{if(!m.g[i]&&a3MpVal(g)>=g.n){m.g[i]=1;c+=a3MpC();got.push(a3MpTxt(g));}});
  if(c){a3Pay(c,L('план месяца','monthly plan'));toast('🗓 '+L('План месяца','Monthly plan')+': '+got.join(', ')+' ✓ +'+coinsTxt(c),3600,true);}
  const done=Object.keys(m.g).length;if(!m.it&&done>=A3_MP_ALL){m.it=1;const it=MP_IT[new Date(nowMs()).getMonth()];
    if(it&&!S.xo[it]){S.xo[it]=1;setTimeout(()=>toast('🗓 '+L('Вещь месяца твоя: поплавок «'+XIT[it].n+'» — на вкладке «Берег»','Item of the month: the «'+XIT[it].en+'» float — see the Shore tab'),4500,true),c?3800:0);}
    else{const x=a3C(a3Trip(),A3R.monthAll[0],A3R.monthAll[1]);a3Pay(x,L('план месяца','monthly plan'));}
    try{STAT.ev('mod',{m:'goal',a:'month',k:done});}catch(e){}}
  if(c||m.it)save();updCoins();}

/* ---- 3) «Золотая осень»: осенний улов — 8 видов за октябрь–ноябрь; 4 вида — монеты, 8 — ещё и корзина грибов ---- */
function a3Sea(){const e=a3Ev();if(!e)return null;const k=e+new Date(nowMs()).getFullYear();if(S.sea.k!==k)S.sea={k,got:{},rw:{}};return S.sea;}
function a3SeaN(){const s=a3Sea();return s?Object.keys(s.got).length:0;}
function a3SeaAdd(ids){const s=a3Sea();if(!s)return;const set=A3EV[a3Ev()].set;let nw=[];for(const id of ids)if(set.indexOf(id)>=0&&!s.got[id]){s.got[id]=1;nw.push(id);}
  if(!nw.length)return;const n=Object.keys(s.got).length;toast('🍂 '+L('Осенний улов','Autumn catch')+': '+nw.map(id=>nm(FISH[id]).toLowerCase()).join(', ')+' — '+n+'/'+set.length,3200,true);
  for(const [need,k] of A3R.sea)if(n>=need&&!s.rw[need]){s.rw[need]=1;const c=a3C(a3Trip(),k,60);a3Pay(c,L('осенний улов','autumn catch'));if(need>=set.length)S.xo.mush=1;
    setTimeout(()=>toast('🍂 '+L('Осенний улов '+n+'/'+set.length+': +','Autumn catch '+n+'/'+set.length+': +')+coinsTxt(c)+(need>=set.length?L(' и корзина грибов на берег!',' and a basket of mushrooms!'):''),3800,true),3300);}
  save();if(!G)a3MpCheck();}

/* ---- конец рыбалки: цели, план месяца, письма, осенний улов — до итогов (монеты — в G.earned); «ведро дня» — после (задание дня отмечается в итогах) ---- */
{const fin=finish;finish=function(){if(!G||G.over)return fin();const g=G;try{a3Pre(g);}catch(e){}fin();try{a3Post(g);}catch(e){}};}
function a3Pre(g){const fish=g.catch.filter(c=>c.id&&!c.lost),n=fish.length,tod=g.cond.tod,big=fish.reduce((m,c)=>Math.max(m,c.w),0),tr=fish.filter(c=>!fishOf(c.id).leg&&c.w>=trophyW(fishOf(c.id))).length;
  const gd=a3Tasks(),c0=a3TaskC();let got=0;
  for(const t of gd.t){if(t.d)continue;if(t.ty==='n')t.p=(t.p||0)+n;else if(t.ty==='tod'&&tod===t.tod&&n)t.p=1;else if(t.ty==='pl'&&g.pi===t.pi&&n)t.p=(t.p||0)+1;else if(t.ty==='big'&&big>=t.kg)t.p=1;
    if((t.p||0)>=t.n){t.d=1;got+=c0;toast('📅 '+L('Цель дня','Daily goal')+': '+a3TaskTxt(t)+' ✓ +'+coinsTxt(c0),3000,true);}}
  if(got)a3Pay(got,L('цели дня','daily goals'));
  // план месяца
  const m=a3Mp(),dn=dayNum();if(n&&m.c.ld!==dn){m.c.ld=dn;m.c.dd=(m.c.dd||0)+1;}
  m.c.f=(m.c.f||0)+n;m.c.tr=(m.c.tr||0)+tr;if(g.tourn)m.c.tn=(m.c.tn||0)+1;if(n&&!g.tourn&&tod==='morning')m.c.mo=(m.c.mo||0)+1;if(n&&!g.tourn&&(tod==='evening'||tod==='night'))m.c.ni=(m.c.ni||0)+1;
  const gs=a3MpGoals(),bg=gs.find(x=>x.ty==='bg');if(bg)m.c.bg=(m.c.bg||0)+fish.filter(c=>c.w>=bg.kg).length;
  a3SeaAdd(fish.map(c=>c.id));a3MpCheck();
  // письма: просьбы
  a3MailProgress(g,fish,{n,tod,big,tr});
  if(g.guest)S.mail.gst=1;save();}
function a3Post(g){const bc=a3Bucket(),rc=$('rCoins');if(rc&&bc&&!g.x2){const n=rc.cloneNode(false);rc.parentNode.replaceChild(n,rc);countUp(n,g.earned,'+','\u00A0💰');}
  const brk=$('mcard').querySelector('.brk');if(brk&&g.bon.length)brk.textContent=[[L('улов','catch'),g.earned-g.bon.reduce((s,b)=>s+b[1],0)]].concat(g.bon).map(b=>b[0]+' '+b[1]).join(' + ');
  // гостевой выезд: «понравилось? путёвка — …»
  if(g.guest&&!S.open[g.pi]){const row=$('mcard').querySelector('.row'),P=PLACES[g.pi];if(row){const ps=$('mcard').querySelectorAll('p.goal,button.goalb');if(ps.length>=2)ps[ps.length-1].remove();const p=document.createElement('p');p.className='goal tipl';p.innerHTML='🚗 '+L('Понравилось? Путёвка на «'+esc(nm(P))+'» — '+coinsTxt(P.p)+(S.coins<P.p?', ещё ≈ '+a3DaysTo(P.p)+' '+pl(a3DaysTo(P.p),'день','дня','дней','',''):'')+'.','Liked it? A trip to '+esc(nm(P))+' costs '+coinsTxt(P.p)+'.');row.parentNode.insertBefore(p,row);}}
  updDots();}
// сколько дней улова до суммы (≈6 рыбалок в день на самом дальнем месте)
function a3DaysTo(p){return Math.max(1,Math.ceil((p-S.coins)/(6*a3Trip())));}

function a3MailProgress(g,fish,o){const M=S.mail,sp0=g.a3sp||[];
  for(const id in M.dl){const r=M.rq[id];if(!r||M.ok[id]||a3RqDone(id))continue;let d=0;
    if(r.ty==='pl'){if(g.pi===r.pi&&o.n)d=1;}else if(r.ty==='gst'){if(g.guest)d=1;}else if(r.ty==='tourn'){if(g.tourn)d=1;}
    else if(r.ty==='sp')d=fish.filter(c=>c.id===r.f).length;else if(r.ty==='kg'){if(o.big>=r.kg)d=1;}else if(r.ty==='tod'){if(o.n&&g.cond.tod===r.tod)d=1;}
    else if(r.ty==='ses'){if(o.n)d=1;}else if(r.ty==='cat'){if(!g.tourn&&fish.some(c=>c.w<.25&&!fishOf(c.id).leg))d=1;}
    else if(r.ty==='new')d=fish.filter((c,i,a)=>FISH[c.id]&&sp0.indexOf(c.id)<0&&a.findIndex(z=>z.id===c.id)===i).length;else if(r.ty==='tr')d=o.tr;
    else if(r.ty==='n')d=o.n;else if(r.ty==='n1'){if(o.n>=r.n)d=r.n;}else if(r.ty==='leg')d=fish.filter(c=>fishOf(c.id).leg).length;
    if(d){M.pr[id]=(M.pr[id]||0)+d;if(a3RqDone(id))toast('✉ '+L('Просьба выполнена','Request done')+' ('+L(FROM[LETTERS[id].fr][1],FROM[LETTERS[id].fr][2])+') — '+L('награда в почте','reward in the mail'),3200,true);}}}
function a3RwC(x){return x.rw&&x.rw.c?a3C(a3Trip(),x.rw.c*A3R.letter,30):0;}
function a3RwTxt(x){const w=x.rw||{},a=[];if(w.c)a.push('+'+coinsTxt(a3RwC(x)));if(w.b)a.push(BAIT[w.b[0]].ic+' '+esc(nm(BAIT[w.b[0]]))+' +'+w.b[1]);if(w.line)a.push('🧵 '+L('леска покрепче','a stronger line'));if(w.hint)a.push('✨ '+L('подсказка про легенду','a legend hint'));return a.join(' · ');}
