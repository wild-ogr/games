<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Кирпичики во дворе</title>
<style>
:root{--ink:#2d3436;--muted:#57606f;--card:#fffdf7}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;background:#6fa8c9;overscroll-behavior:none;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--ink);overflow:hidden;touch-action:manipulation}
#app{position:relative;max-width:560px;height:100%;margin:0 auto;background-color:#9fd3ee;background-repeat:no-repeat;background-position:50% 100%;background-size:cover;overflow:hidden}
.screen{position:absolute;top:0;right:0;bottom:0;left:0;display:none;flex-direction:column}
.screen.on{display:flex}
button{font:inherit;color:inherit;border:0;cursor:pointer}
.btn{background:#fff;border-radius:16px;padding:12px 16px;font-weight:700;font-size:17px;box-shadow:0 4px 0 #c7c1b0,0 6px 14px rgba(0,0,0,.12);transition:transform .08s;min-height:48px}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #c7c1b0}
.btn.accent{background:linear-gradient(#e8590c,#c2410c);color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.25);box-shadow:0 4px 0 #8a2e06,0 6px 14px rgba(0,0,0,.15)}
.btn.accent:active{box-shadow:0 1px 0 #8a2e06}
.btn.green{background:linear-gradient(#2b8a3e,#237032);color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.25);box-shadow:0 4px 0 #17501f,0 6px 14px rgba(0,0,0,.15)}
.btn.blue{background:linear-gradient(#1c6fb8,#155a96);color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.25);box-shadow:0 4px 0 #0d3e69,0 6px 14px rgba(0,0,0,.15)}
.btn[disabled]{opacity:.55}
.btn small{opacity:.92;font-size:.8em}
.icon{width:48px;height:48px;border-radius:14px;background:rgba(255,255,255,.9);font-size:22px;font-weight:800;box-shadow:0 3px 0 rgba(0,0,0,.12);flex:none}
.pill{background:rgba(255,255,255,.93);border-radius:999px;padding:7px 12px;font-weight:800;font-size:16px;box-shadow:0 3px 0 rgba(0,0,0,.1);white-space:nowrap}
button.pill{cursor:pointer;position:relative;min-height:40px}
button.pill::before{content:"";position:absolute;top:-6px;bottom:-6px;left:-4px;right:-4px}
.pill.sm{padding:5px 10px;font-size:15px}
/* меню */
.mh{display:flex;align-items:center;justify-content:space-between;padding:12px 14px 6px;padding-top:max(12px,env(safe-area-inset-top))}
.logo{font-size:23px;font-weight:900;color:#7a2e10;text-shadow:0 1px 0 rgba(255,255,255,.85);white-space:nowrap;line-height:1.05}
.logo small{display:block;font-size:15px;font-weight:800;color:#c2410c;margin-left:32px}
.hdr-r{display:flex;gap:7px;align-items:center}
.menu-scroll{flex:1;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:4px 14px 18px}
.mwrap{max-width:460px;margin:0 auto}
.hero{position:relative;display:flex;align-items:flex-end;justify-content:center;margin:2px 0 8px}
#heroCv{display:block;width:210px;height:250px}
.hsay{position:absolute;left:0;top:6px;max-width:46%;background:#fff;border-radius:16px;padding:8px 11px;font-weight:700;font-size:16.5px;line-height:1.25;box-shadow:0 4px 12px rgba(0,0,0,.2)}
.hsay b{display:block;font-size:14.5px;color:#b8390a}
.hface{position:absolute;right:0;top:0;width:78px;height:78px;border-radius:50%;overflow:hidden;box-shadow:0 0 0 3px #fff,0 4px 10px rgba(0,0,0,.25);background:#f1ede2}
.hface svg,.hav svg,.card .av svg{display:block;width:100%;height:100%}
.big{display:flex;align-items:center;gap:12px;width:100%;text-align:left;margin-top:10px;padding:12px 16px;font-size:20px;font-weight:900;border-radius:18px;min-height:66px}
.big .ic{font-size:30px;flex:none;width:40px;text-align:center}
.big span{flex:1;min-width:0;line-height:1.15}
.big small{display:block;font-size:15px;font-weight:700;opacity:.92;margin-top:2px}
.big .dn{flex:none;font-size:14px;background:#fff;color:#237032;border-radius:999px;padding:3px 9px;text-shadow:none}
.nrow{display:flex;gap:8px;margin-top:10px}
.nrow .btn{flex:1;padding:8px 4px;font-size:22px;position:relative;line-height:1.1;min-height:62px}
.nrow .btn small{display:block;font-size:15px;font-weight:800;opacity:1}
.nrow.m5{gap:6px}.nrow.m5 .btn{min-width:0;padding-left:2px;padding-right:2px}.nrow.m5 .btn small{font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nrow.m5{gap:5px}.nrow.m5 .btn small{font-size:13px;letter-spacing:-.2px;text-overflow:clip}.nrow.m5 #bShop small{font-size:0}.nrow.m5 #bShop small::after{content:'Вид';font-size:13px} /* 5 кнопок (VK: + «Игры») — «Оформление» коротко */
.card .soc-o{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:10px;background:#f1ede2;color:#2d3436;border-radius:14px;padding:6px 10px;font-weight:800;font-size:15px;text-align:left}
.card .soc-o span{flex:1 1 150px;min-width:0;margin-right:8px}.card .soc-o .btn{flex:0 0 auto;padding:6px 12px;font-size:15px;min-height:40px}
.btn .dot{position:absolute;top:5px;right:7px;width:11px;height:11px;border-radius:50%;background:#ff4757;box-shadow:0 0 0 2px #fff}
@keyframes pulse{50%{transform:scale(1.025)}}
.pulse{animation:pulse 1.4s infinite}
/* boost: «Что сегодня», награды в окне итога, неделя, звания, кладовка */
.today{margin-top:12px;background:rgba(255,253,247,.95);border-radius:18px;padding:8px 10px 6px;box-shadow:0 4px 0 rgba(0,0,0,.12)}
.today h3{margin:2px 4px 4px;font-size:17px;color:#7a2e10}
.trow{display:flex;align-items:center;width:100%;min-height:50px;background:#f1ede2;border-radius:14px;margin:0 0 6px;padding:6px 10px;text-align:left;font-weight:800;font-size:16px;line-height:1.2;color:#2d3436}
.trow .ic{font-size:22px;width:32px;flex:none}.trow span+span{flex:1;min-width:0}.trow i{font-style:normal;font-size:22px;color:#237032;flex:none;margin-left:6px}
.trow.hot{background:linear-gradient(#fff1c9,#ffe08a);box-shadow:inset 0 0 0 2px #f0a500}
.awards{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin:6px 0 2px}
.aw{background:#fff3d6;border-radius:12px;padding:6px 10px;font-weight:800;font-size:15.5px;color:#5a4a2a;line-height:1.25}
.goal.tmrw{background:#eef6ff;border-radius:12px;padding:7px 10px;color:#1c4f7a!important}
.week{display:flex;justify-content:space-between;margin:8px 0 2px}.wd{flex:1;margin:0 2px;background:#f1ede2;border-radius:10px;padding:4px 0;font-weight:800;font-size:14px;color:#57606f}
.wd b{display:block;font-size:18px;min-height:22px}.wd.done{background:#c8efcf;color:#1f5e2c}.wd.today{box-shadow:inset 0 0 0 2px #f0a500}
.rks{text-align:left;margin-top:8px}.rk{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-radius:12px;margin-bottom:4px;background:#f1ede2;font-size:16px;color:#57606f}
.rk span{font-weight:700;font-size:15px;white-space:nowrap;margin-left:8px}.rk.done{color:#1f5e2c}.rk.cur{background:linear-gradient(#fff1c9,#ffe08a);color:#3a2206}
.pan{display:flex;align-items:center;text-align:left;background:#f1ede2;border-radius:14px;padding:8px 10px;margin-top:8px}.pan img{width:42px;height:42px;flex:none;margin-right:10px}.pan>div{flex:1;min-width:0}.pan b{font-size:17px}.pan small{font-weight:700;color:#1f5e2c;font-size:15px}.pan i{font-style:normal;color:#f0a500;font-size:16px;margin-left:6px;white-space:nowrap}.pan .chbar{margin:4px 0 0;height:24px}.pan .chbar span{line-height:24px;font-size:13.5px}
/* карта уровней */
.gh{display:flex;align-items:center;gap:8px;padding:8px 10px 6px;padding-top:max(8px,env(safe-area-inset-top));background:rgba(30,40,60,.55);color:#fff;z-index:3}
.gt{flex:1;min-width:0;line-height:1.15}
.gt>div:first-child{font-weight:900;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:15px;font-weight:700;opacity:.92;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gh .pill{color:var(--ink)}
.map-scroll{flex:1;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:6px 14px 24px}
.chap{max-width:480px;margin:12px auto 4px;border-radius:20px;padding:10px 12px 12px;box-shadow:0 4px 0 rgba(0,0,0,.14);position:relative}
.chap.lock{filter:saturate(.3) brightness(.97)}
.chap h3{margin:0 0 8px;font-size:19px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.55);display:flex;align-items:center;gap:8px}
.chap h3 .av{width:40px;height:40px;border-radius:50%;overflow:hidden;box-shadow:0 0 0 2px #fff;flex:none;background:#f1ede2}
.chap h3 .av svg{display:block;width:100%;height:100%}
.chap h3 span{flex:1;min-width:0}
.chap h3 small{display:block;font-size:14.5px;font-weight:700;opacity:.95}
.chap h3 i{font-style:normal;font-size:15px;background:rgba(0,0,0,.35);border-radius:999px;padding:3px 9px;white-space:nowrap}
.lvg{display:flex;flex-wrap:wrap;justify-content:space-between}
.lvb{width:18.4%;margin-bottom:8px;background:rgba(255,255,255,.95);border-radius:14px;padding:6px 0 4px;font-weight:900;font-size:19px;line-height:1.05;box-shadow:0 3px 0 rgba(0,0,0,.15);min-height:54px}
.lvb small{display:block;font-size:14px;color:#f0a500;letter-spacing:.5px;font-weight:800;min-height:14px}
.lvb small .e{color:#b8b2a4}
.lvb.cur{background:linear-gradient(#ffd36e,#ff9f43);color:#3a2206;animation:pulse 1.4s infinite}
.lvb.lock{opacity:.6;font-size:15px}
.lvb.boss{box-shadow:0 0 0 3px #e8590c,0 3px 0 rgba(0,0,0,.15)}
/* игра */
#scr-game{background:rgba(20,30,48,.18)}
.gbody{flex:1;display:flex;flex-direction:column;min-height:0}
.hud{position:relative;display:flex;align-items:center;gap:10px;padding:6px 12px 2px;min-height:64px}
.hav{width:56px;height:56px;border-radius:50%;overflow:hidden;box-shadow:0 0 0 3px #fff,0 3px 8px rgba(0,0,0,.3);flex:none;background:#f1ede2}
.hinfo{flex:1;min-width:0}
.goals{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{background:rgba(255,255,255,.94);border-radius:999px;padding:3px 10px 3px 5px;font-weight:900;font-size:17px;display:inline-flex;align-items:center;gap:4px;box-shadow:0 2px 0 rgba(0,0,0,.14);transition:transform .15s;white-space:nowrap}
.chip img{width:26px;height:26px;display:block}
.chip .e{font-size:20px;width:26px;text-align:center}
.chip.ok{background:#c8efcf;color:#1f5e2c}
.chip.bump{transform:scale(1.18)}
.scl{font-weight:900;font-size:24px;color:#fff;text-shadow:0 2px 3px rgba(0,0,0,.5);white-space:nowrap;line-height:1.1}
.scl small{font-size:15px;opacity:.95;margin-left:6px}
.movesl{font-size:15px;font-weight:800;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.6);margin-top:3px;white-space:nowrap}
.bub{position:absolute;left:74px;right:10px;top:6px;bottom:4px;display:flex;align-items:center;background:#fff;border-radius:16px;padding:6px 12px;font-weight:800;font-size:16px;line-height:1.22;box-shadow:0 4px 14px rgba(0,0,0,.25);opacity:0;transition:opacity .25s;pointer-events:none;z-index:4}
.bub::before{content:"";position:absolute;left:-8px;top:50%;margin-top:-8px;border:8px solid transparent;border-left:0;border-right-color:#fff}
.bub.on{opacity:1}
.field{flex:1;position:relative;min-height:0;touch-action:none;overflow:hidden}
#cv{position:absolute;left:0;top:0;touch-action:none}
.tip{position:absolute;left:10px;right:10px;top:6px;background:rgba(255,255,255,.97);border-radius:14px;padding:9px 12px;font-weight:800;font-size:16px;text-align:center;box-shadow:0 4px 14px rgba(0,0,0,.25);display:none;z-index:7;line-height:1.3;pointer-events:none}
.tip.on{display:block}
.gban{position:absolute;display:none;transform:translate(-50%,-50%);background:rgba(255,255,255,.97);border-radius:18px;padding:12px 18px;box-shadow:0 8px 26px rgba(0,0,0,.35);z-index:6;text-align:center;pointer-events:none;max-width:88%;animation:pop .25s ease-out}
.gban.on{display:block}.gban b{display:block;font-size:22px;margin-bottom:6px;color:#2d3436}.gban span{display:block;font-weight:900;font-size:19px;line-height:1.35;color:#2d3436;white-space:nowrap}.gban img{width:28px;height:28px;vertical-align:-7px;margin-right:6px}
.big-stars .st{display:inline-block;animation:starIn .5s ease-out both}@keyframes starIn{0%{transform:scale(0) rotate(-50deg);opacity:0}65%{transform:scale(1.35) rotate(8deg);opacity:1}100%{transform:scale(1) rotate(0)}}
.chbar{position:relative;height:26px;border-radius:13px;background:#ebe6d8;margin:8px 0 2px;overflow:hidden}.chbar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#ffd43b,#fab005);border-radius:13px;transition:width .9s ease-out}.chbar span{position:relative;font-weight:900;font-size:14px;line-height:26px;color:#5a4a2a}
.pill{transition:transform .15s}.pill.bump{transform:scale(1.15)}
.flyc{position:fixed;z-index:30;font-size:26px;pointer-events:none;transition:transform .7s cubic-bezier(.5,-.3,.7,1),opacity .7s}
body.calm .big-stars .st{animation:none}
@media (max-height:600px) and (max-width:599px){.card .av{width:64px;height:64px;margin:0 auto 4px}.big-stars{font-size:36px}.chbar{margin-top:5px}}
.boost{display:flex;gap:8px;padding:6px 10px;padding-bottom:max(8px,env(safe-area-inset-bottom));justify-content:center}
.boost.hide{display:none}
.boost button{flex:1;max-width:120px;background:rgba(255,255,255,.95);border-radius:16px;min-height:60px;font-size:24px;position:relative;box-shadow:0 3px 0 rgba(0,0,0,.18);line-height:1.05;padding:4px 2px}
.boost button small{display:block;font-size:15px;font-weight:800;margin-top:2px}
.boost button i{position:absolute;top:-7px;right:-3px;background:#e8590c;color:#fff;font-style:normal;font-weight:900;font-size:14px;border-radius:999px;padding:1px 7px;box-shadow:0 0 0 2px #fff}
.boost button i.free{background:#2b8a3e}
.boost button.on{background:#ffe28a;box-shadow:0 0 0 3px #f08c00}
.fly{position:absolute;width:30px;height:30px;left:0;top:0;z-index:9;pointer-events:none;transition:transform .55s cubic-bezier(.5,-.3,.7,1),opacity .55s}
/* альбомный экран (ПК, планшет): поле слева, счёт и помощники справа */
#app.land .gbody{display:grid;grid-template-columns:1fr 230px;grid-template-rows:auto 1fr}
#app.land .field{grid-column:1;grid-row:1 / span 2}
#app.land .hud{grid-column:2;grid-row:1;flex-direction:column;align-items:flex-start;padding:10px 12px 4px}
#app.land .bub{position:relative;left:0;right:0;top:0;bottom:0;margin-top:6px;min-height:56px}
#app.land .bub::before{left:24px;top:-8px;margin-top:0;border:8px solid transparent;border-top:0;border-bottom-color:#fff}
#app.land .boost{grid-column:2;grid-row:2;flex-wrap:wrap;align-content:flex-end;padding:10px;gap:0}
#app.land .boost button{flex:0 0 44%;max-width:none;margin:0 2.5% 10px}
#app.land .movesl{white-space:normal}
#app.land .bub{max-height:92px;overflow:hidden}
/* магазин оформления */
.shop-grid{flex:1;overflow-y:auto;overscroll-behavior:contain;display:flex;flex-wrap:wrap;justify-content:space-between;padding:8px 12px 24px;align-content:flex-start;max-width:560px;width:100%;margin:0 auto}
.it{width:48.5%;background:var(--card);border-radius:18px;padding:8px;text-align:center;box-shadow:0 4px 0 #d9d2bf;margin-bottom:10px;position:relative}
.it canvas{display:block;width:100%;height:auto;border-radius:12px}
.it b{display:block;margin-top:6px;font-size:16px}
.it small{display:block;color:#57606f;font-weight:600;font-size:14px;min-height:18px}
.it .btn{width:100%;margin-top:6px;padding:8px 6px;font-size:16px;min-height:48px}
.it.on{box-shadow:0 0 0 3px #2b8a3e,0 4px 0 #d9d2bf}
.shop-pay{width:100%}
/* окна */
.modal,.ad{position:absolute;top:0;right:0;bottom:0;left:0;display:none;align-items:center;justify-content:center;background:rgba(20,30,40,.55);z-index:10;padding:16px}
.modal{overflow-y:auto;overscroll-behavior:contain}
.modal.on,.ad.on{display:flex}
.card{background:var(--card);border-radius:24px;padding:20px 16px 16px;width:100%;max-width:380px;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.3);animation:pop .25s ease-out;margin:auto}
@keyframes pop{from{transform:scale(.88);opacity:0}}
.card h2{margin:0 0 6px;font-size:24px}
.card p{margin:6px 0;color:#57606f;font-weight:600;font-size:16px;line-height:1.35}
.card .av{width:84px;height:84px;margin:4px auto 6px;border-radius:50%;overflow:hidden;box-shadow:0 0 0 3px #fff,0 3px 8px rgba(0,0,0,.25);background:#f1ede2}
.row{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.row2{display:flex;gap:8px}.row2>*{flex:1}
.big-stars{font-size:44px;color:#ffc312;letter-spacing:4px;margin:2px 0;text-shadow:0 3px 0 #d68910}
.big-stars .e{color:#8a939c;text-shadow:none}
.coins-won{font-size:22px;font-weight:900;color:#c98f00!important}
.quote{background:#fff3d6;border-radius:14px;padding:8px 12px;font-style:italic;color:#5a4a2a!important}
.goal{font-size:15px!important;margin:8px 0 2px!important;color:#2d3436!important;font-weight:700}
.goal.tipl{background:#e6f6e9;border-radius:12px;padding:8px 10px;color:#1f5e2c!important}
.bigsc{font-size:40px;font-weight:900;color:#2d3436;margin:2px 0}
.rec{display:inline-block;background:linear-gradient(#ffd36e,#ff9f43);color:#3a2206;font-weight:900;border-radius:999px;padding:4px 12px;font-size:16px}
.helpers{display:flex;gap:8px}.helpers .btn{flex:1;font-size:16px;padding:8px 4px;line-height:1.15}.helpers .btn small{display:block;font-size:14.5px;opacity:.9}
.ad{background:#111;color:#fff;text-align:center;font-size:22px;font-weight:800}
.ad small{font-weight:500;opacity:.7;font-size:14px}
.adt{font-size:54px;margin-top:16px}
.toast{position:absolute;left:50%;bottom:110px;transform:translateX(-50%);background:rgba(0,0,0,.85);color:#fff;padding:10px 14px;border-radius:12px;font-weight:700;font-size:16px;line-height:1.3;opacity:0;transition:opacity .25s;pointer-events:none;z-index:20;text-align:center;width:max-content;max-width:90%}
.toast.on{opacity:1}
.set{display:flex;align-items:center;justify-content:space-between;background:#f1ede2;border-radius:14px;padding:10px 12px;margin-top:8px;font-weight:700;font-size:16px;text-align:left;color:#2d3436;width:100%;min-height:50px}
.set i{font-style:normal;font-weight:800;color:#fff;background:#2b8a3e;border-radius:999px;padding:3px 12px;min-width:56px;text-align:center;flex:none}.set i.off{color:#57606f;background:#dcd6c8}.set i.go,.pay .set i{background:none;color:#237032;padding:0;min-width:0}
.set small{font-weight:600;color:#57606f;font-size:14.5px}
.pay{margin-top:12px;text-align:left}.pay h3{font-size:16px;margin:0 0 2px;color:#2d3436}.pay .set span{padding-right:10px}.pay .set small{font-weight:600}
.pbuy b{white-space:nowrap;color:#1f5e2c;font-size:17px}.pcur{width:18px;height:18px;vertical-align:-3px;margin-left:3px}.pown i{color:#237032}
.about{font-size:15px!important;text-align:left;color:#57606f}
.how{text-align:left}.how p{font-size:15.5px;margin:7px 0;color:#2d3436}
.streak{display:flex;flex-wrap:wrap;justify-content:space-between;margin:12px 0 4px}
.sd{width:23.5%;margin-bottom:6px;background:#f1ede2;border-radius:12px;padding:6px 2px;font-weight:800;font-size:15px;line-height:1.2;position:relative;color:#57606f}
.sd small{display:block;font-size:14.5px;font-weight:700}
.sd.done{background:#c8efcf;color:#2b7a3f}

<script>
'use strict';
/*LOGIC*/
/* ================= ДВИЖОК: поле 8×8, фигуры, честная раздача, цели уровней, бот (без DOM — гоняет tools/check.sh) =================
   Поле — массив 64 клеток (k = ряд·8 + столбец): b[k] — цвет кирпичика (0 — пусто, 1…13 — фигура, 20 — старый кирпич),
   it[k] — предмет в кирпичике (0 нет, 1 яблоко, 2 банка варенья, 3 звезда-пятёрка, 4 гайка), old[k] — старый кирпич (цель «разобрать завал»).
   Для быстрых проверок — «битовое поле»: два 32-битных числа (lo — ряды 0–3, hi — ряды 4–7). */
const N=8,NN=64;
// генератор случайных чисел с сохраняемым состоянием (R.s) — чтобы бесконечную партию можно было продолжить после перезапуска
function mkR(s){s=s|0;const R=function(){s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};R.st=()=>s;return R;}
/* фигуры: рисунок, вес на лёгком (e) и на трудном (h) уровне, m — есть зеркальная (L/J, S/Z) */
const BASES=[
  {id:'d1',p:['#'],e:1.6,h:.5},
  {id:'i2',p:['##'],e:4.5,h:1.8},
  {id:'i3',p:['###'],e:4.5,h:2.6},
  {id:'i4',p:['####'],e:2.4,h:2.8},
  {id:'i5',p:['#####'],e:.8,h:2},
  {id:'o2',p:['##','##'],e:4,h:3},
  {id:'o3',p:['###','###','###'],e:.45,h:1.6},
  {id:'r23',p:['###','###'],e:.9,h:2},
  {id:'c3',p:['##','#.'],e:4.5,h:2.8},
  {id:'L4',p:['#.','#.','##'],e:1.8,h:3,m:1},
  {id:'T4',p:['###','.#.'],e:1.4,h:2.6},
  {id:'S4',p:['.##','##.'],e:.9,h:2.4,m:1},
  {id:'L5',p:['#..','#..','###'],e:.7,h:2.2}
];
const SMALL=['d1','i2','i3','o2','c3'].map(id=>BASES.findIndex(B=>B.id===id));
function cellsOf(p){const a=[];p.forEach((row,r)=>{for(let c=0;c<row.length;c++)if(row[c]==='#')a.push([r,c]);});return a;}
function normC(cs){let mr=99,mc=99;for(const x of cs){if(x[0]<mr)mr=x[0];if(x[1]<mc)mc=x[1];}return cs.map(x=>[x[0]-mr,x[1]-mc]).sort((a,b)=>a[0]-b[0]||a[1]-b[1]);}
const rotC=cs=>normC(cs.map(x=>[x[1],-x[0]])),mirC=cs=>normC(cs.map(x=>[x[0],-x[1]])),keyC=cs=>cs.map(x=>x.join(',')).join(';');
const bit=k=>k<32?[1<<k,0]:[0,1<<(k-32)];
// все варианты фигур (повороты и зеркала): {i, b — номер основы, cs — клетки, h, w, pos — все места на поле с масками}
const VARS=[],VBY={};
function mkVar(bi,cs){const k=keyC(cs);if(VBY[k])return VBY[k];
  const h=1+Math.max(...cs.map(x=>x[0])),w=1+Math.max(...cs.map(x=>x[1])),v={i:VARS.length,b:bi,cs,h,w,n:cs.length,pos:[]};
  for(let r=0;r+h<=N;r++)for(let c=0;c+w<=N;c++){let lo=0,hi=0;for(const x of cs){const q=bit((r+x[0])*N+c+x[1]);lo|=q[0];hi|=q[1];}v.pos.push({r,c,lo,hi});}
  VARS.push(v);VBY[k]=v;return v;}
BASES.forEach((B,bi)=>{B.v=[];const base=normC(cellsOf(B.p));
  for(let m=0;m<(B.m?2:1);m++){let x=m?mirC(base):base;for(let r=0;r<4;r++){const v=mkVar(bi,x);if(B.v.indexOf(v.i)<0)B.v.push(v.i);x=rotC(x);}}});
function rotVar(vi){return VBY[keyC(rotC(VARS[vi].cs))].i;}
// ряды и столбцы
const LINES=[];
for(let r=0;r<N;r++){let lo=0,hi=0;for(let c=0;c<N;c++){const q=bit(r*N+c);lo|=q[0];hi|=q[1];}LINES.push({lo,hi,r});}
for(let c=0;c<N;c++){let lo=0,hi=0;for(let r=0;r<N;r++){const q=bit(r*N+c);lo|=q[0];hi|=q[1];}LINES.push({lo,hi,c});}
function clrMask(lo,hi){let a=0,b=0,n=0;for(const L of LINES)if((lo&L.lo)===L.lo&&(hi&L.hi)===L.hi){a|=L.lo;b|=L.hi;n++;}return [a,b,n];}
function bitsOf(b){let lo=0,hi=0;for(let k=0;k<NN;k++)if(b[k]){if(k<32)lo|=1<<k;else hi|=1<<(k-32);}return [lo,hi];}
function fitsAny(lo,hi,vi){for(const p of VARS[vi].pos)if(!(lo&p.lo)&&!(hi&p.hi))return true;return false;}
function nFits(lo,hi,vi){let n=0;for(const p of VARS[vi].pos)if(!(lo&p.lo)&&!(hi&p.hi))n++;return n;}
// можно ли поставить ВСЕ фигуры набора в каком-нибудь порядке (с исчезновением рядов по пути)
function canAll(lo,hi,vs){if(!vs.length)return true;const seen={};
  for(let i=0;i<vs.length;i++){const vi=vs[i];if(seen[vi])continue;seen[vi]=1;const rest=vs.slice(0,i).concat(vs.slice(i+1));
    for(const p of VARS[vi].pos){if((lo&p.lo)||(hi&p.hi))continue;let a=lo|p.lo,b=hi|p.hi;const m=clrMask(a,b);if(m[2]){a&=~m[0];b&=~m[1];}if(canAll(a,b,rest))return true;}}
  return false;}
const popc=x=>{x=x-((x>>>1)&0x55555555);x=(x&0x33333333)+((x>>>2)&0x33333333);return(((x+(x>>>4))&0x0F0F0F0F)*0x01010101)>>>24;};

/* ---------------- очки ----------------
   каждая клетка фигуры +1; ряды и столбцы, собранные одним ходом: 1 → 10, 2 → 30, 3 → 60, 4 → 100 …, умножается на серию;
   серия живёт, пока ряды исчезают хотя бы раз за 3 хода; поле очищено целиком — +300 */
const LSC=[0,10,30,60,100,150,210,280,360,450,550,660,780,910,1050,1200,1360];

/* ---------------- уровни «Приключения»: 10 мест двора по 10 уровней ---------------- */
const CHAPTERS=[
  {id:'yard',n:'Двор',en:'The yard',host:'mityai',ik:[1]},
  {id:'hall',n:'Подъезд',en:'Stairwell',host:'mihalych',ik:[3]},
  {id:'shop',n:'Гастроном',en:'Grocery',host:'valya',ik:[2]},
  {id:'garage',n:'Гаражи',en:'Garages',host:'kolya',ik:[4]},
  {id:'school',n:'Школа',en:'School',host:'zina',ik:[3]},
  {id:'dacha',n:'Дача',en:'Dacha',host:'zina',ik:[1,2]},
  {id:'market',n:'Рынок',en:'Market',host:'valya',ik:[1,3]},
  {id:'build',n:'Стройка',en:'Building site',host:'mihalych',ik:[4,3]},
  {id:'park',n:'Парк',en:'Park',host:'mityai',ik:[2,4]},
  {id:'fest',n:'Праздник двора',en:'Yard party',host:'kolya',ik:[1,2,3]}
];
const NLV=CHAPTERS.length*10;
// вид цели по номеру уровня в главе (0…9); 9 — «субботник» (главный уровень главы)
const LV_T=['score','items','clear','items','score','clear','items','mix','items','boss'];
function levelCfg(i){ // i — 1…NLV
  const ch=Math.floor((i-1)/10),k=(i-1)%10,p=(i-1)/(NLV-1),C=CHAPTERS[ch],R=mkR(i*7919+13);
  let t=LV_T[k];if(i===2)t='score';if(i===3)t='items';
  /* мягкий старт (boost 03.10): в «Дворе» и «Подъезде» поле свободнее, цели короче, фигуры мельче — новичок проходит главу 1 почти всегда (модель новичка, журнал release-e/kirpichiki-boost.md) */
  const soft=i<=10?.6:i<=20?.82:1;
  const cfg={i,ch,k,t,seed:i*7919+13,d:Math.min(.75,(.08+.5*p+(t==='boss'?.06:0))*(i<=20?soft:1)),need:{},fill:0,old:false,itemsPre:0,pIt:.4,boss:t==='boss'};
  const kinds=C.ik;
  const itemsNeed=n=>{const o={};if(kinds.length===1)o[kinds[0]]=n;else{const a=Math.ceil(n/kinds.length);kinds.forEach((q,j)=>o[q]=j===0?n-a*(kinds.length-1):a);}return o;};
  if(t==='score'){cfg.need.score=Math.round((i<3?120:(220+620*p+(k===4?80:0))*(soft<1?soft+.12:1))/10)*10;cfg.fill=i<3?0:(.05+.08*p)*soft;}
  else if(t==='items'){const n=Math.round(i===3?4:(6+9*p+(k===8?2:0))*(soft<1?soft+.15:1));cfg.need.items=itemsNeed(n);cfg.fill=(.12+.14*p)*soft;cfg.itemsPre=Math.round(n*.35);}
  else if(t==='clear'){cfg.need.clear=1;cfg.old=true;cfg.fill=(.14+.16*p)*soft*soft;}
  else if(t==='mix'){const n=Math.round((4+6*p)*(soft<1?soft+.15:1));cfg.need.items=itemsNeed(n);cfg.need.clear=1;cfg.old=true;cfg.fill=(.12+.12*p)*soft;cfg.itemsPre=Math.round(n*.4);}
  else {const n=Math.round((6+8*p)*(soft<1?soft+.15:1));cfg.need.items=itemsNeed(n);cfg.need.clear=1;cfg.old=true;cfg.fill=(.15+.13*p)*soft*soft;cfg.itemsPre=Math.round(n*.4);}
  if(i===1){cfg.t='clear';cfg.tut=1;cfg.need={clear:1};cfg.old=true;cfg.fill=0;cfg.d=.05;}
  if(i>80){cfg.d=Math.min(cfg.d,.5);cfg.fill=Math.max(0,cfg.fill-.04);if(cfg.need.score)cfg.need.score=Math.round(cfg.need.score*.85/10)*10;} /* аудит release-f №8: «Парк» и «Праздник двора» не стена для 45+ */
  R();return cfg;}
// задание дня: одно на всех в этот день (зерно — дата), средняя сложность; два вида предметов и немного завала
function dailyCfg(day){const R=mkR(day*131+7),a=1+Math.floor(R()*4);let b=1+Math.floor(R()*4);if(b===a)b=a%4+1;
  const o={};o[a]=7;o[b]=6;
  return {i:0,daily:day,t:'mix',seed:day*131+7,d:.4,need:{items:o,clear:1},old:true,fill:.2,itemsPre:5,pIt:.4,ch:day%CHAPTERS.length};}
function endlessCfg(){return {i:0,endless:1,t:'endless',seed:0,d:.15,need:{},fill:0,pIt:0};}

/* ---------------- партия ---------------- */
function newGame(cfg,seed){
  const st={cfg,b:new Array(NN).fill(0),it:new Array(NN).fill(0),old:new Array(NN).fill(0),tray:[null,null,null],
    R:mkR(seed==null?Math.floor(Math.random()*2e9):seed),score:0,combo:0,since:0,moves:0,lines:0,got:{},oldLeft:0,over:false,won:false,lost:false,
    deals:0,redeals:0,life:0,d:cfg.d||.1};
  if(cfg.tut){for(let c=0;c<N;c++)if(c!==3&&c!==4){st.b[7*N+c]=20;st.old[7*N+c]=1;}for(let c=0;c<N;c++)if(c<2||c>5){st.b[6*N+c]=20;st.old[6*N+c]=1;}}
  else if(cfg.fill>0)prefill(st);
  st.oldLeft=st.old.reduce((a,x)=>a+x,0);
  if(cfg.tut)st.tray=[{v:VBY[keyC(normC(cellsOf(['##'])))].i,it:-1,ik:0},{v:VBY[keyC(normC(cellsOf(['####'])))].i,it:-1,ik:0},{v:VBY[keyC(normC(cellsOf(['##','##'])))].i,it:-1,ik:0}];
  else deal(st);

// завал в начале уровня: случайные фигуры без готовых рядов (раскладка зависит только от уровня)
function prefill(st){const cfg=st.cfg,R=mkR(cfg.seed),want=Math.round(cfg.fill*NN);let n=0,tries=0;
  while(n<want&&tries++<600){const vi=Math.floor(R()*VARS.length),v=VARS[vi],p=v.pos[Math.floor(R()*v.pos.length)];
    const [lo,hi]=bitsOf(st.b);if((lo&p.lo)||(hi&p.hi))continue;if(clrMask(lo|p.lo,hi|p.hi)[2])continue;
    if(n+v.n>want+2)continue;
    for(const x of v.cs){const k=(p.r+x[0])*N+p.c+x[1];st.b[k]=cfg.old?20:v.b+1;if(cfg.old)st.old[k]=1;}n+=v.n;}
  // предметы в части кирпичиков завала
  if(cfg.itemsPre&&cfg.need.items){const cells=[];for(let k=0;k<NN;k++)if(st.b[k])cells.push(k);
    const kinds=[];for(const q in cfg.need.items)for(let j=0;j<cfg.need.items[q];j++)kinds.push(+q);
    for(let j=0;j<cfg.itemsPre&&cells.length&&j<kinds.length;j++){const x=Math.floor(R()*cells.length),k=cells.splice(x,1)[0];st.it[k]=kinds[(j*7)%kinds.length];}}}
// вес фигур: на лёгком — мелкие, на трудном — крупные
function pickBase(st){const d=st.d;let tot=0;const w=BASES.map(B=>{const x=B.e*(1-d)+B.h*d;tot+=x;return x;});let r=st.R()*tot;
  for(let i=0;i<w.length;i++){r-=w[i];if(r<=0)return i;}return w.length-1;}
function randPiece(st,bases){const bi=bases?bases[Math.floor(st.R()*bases.length)]:pickBase(st),vs=BASES[bi].v;return {v:vs[Math.floor(st.R()*vs.length)],it:-1,ik:0};}
/* ЧЕСТНАЯ РАЗДАЧА: три случайные фигуры по весам уровня. Если все три никак не поставить (в любом порядке) — пересдаём,
   до 3 раз; не вышло — берём набор, где встаёт больше всего фигур. Подсовывать «невозможные» наборы нарочно игра не умеет. */
function deal(st){const [lo,hi]=bitsOf(st.b);let best=null,bestN=-1;
  for(let t=0;t<4;t++){const tr=[randPiece(st),randPiece(st),randPiece(st)],vs=tr.map(p=>p.v);
    if(canAll(lo,hi,vs)){best=tr;break;}
    const n=vs.filter(v=>fitsAny(lo,hi,v)).length;if(n>bestN){bestN=n;best=tr;}st.redeals++;}
  addItems(st,best);st.tray=best;st.deals++;}
// предметы в новых фигурах — пока их на поле и в лотке меньше, чем ещё нужно собрать (+2 запасом)
function itemsLeft(st){const n=st.cfg.need.items;if(!n)return {};const o={};for(const q in n){const x=n[q]-(st.got[q]||0);if(x>0)o[q]=x;}return o;}
function itemsInPlay(st,q){let n=0;for(let k=0;k<NN;k++)if(st.it[k]==q)n++;for(const p of st.tray)if(p&&p.ik==q)n++;return n;}
function addItems(st,tray){const left=itemsLeft(st);
  for(const p of tray){const ks=Object.keys(left).filter(q=>itemsInPlay(st,q)+tray.filter(x=>x.ik==q).length<left[q]+2);
    if(!ks.length||st.R()>=st.cfg.pIt)continue;p.ik=+ks[Math.floor(st.R()*ks.length)];p.it=Math.floor(st.R()*VARS[p.v].n);}}
function canPlace(st,ti,r,c){const p=st.tray[ti];if(!p)return false;const v=VARS[p.v];if(r<0||c<0||r+v.h>N||c+v.w>N)return false;
  for(const x of v.cs)if(st.b[(r+x[0])*N+c+x[1]])return false;return true;}
function trayMoves(st,ti){const p=st.tray[ti];if(!p)return 0;const [lo,hi]=bitsOf(st.b);return nFits(lo,hi,p.v);}
function noMoves(st){const [lo,hi]=bitsOf(st.b);return !st.tray.some(p=>p&&fitsAny(lo,hi,p.v));}
// какие ряды/столбцы соберутся, если поставить фигуру сюда (для подсветки при перетаскивании)
function wouldClear(st,ti,r,c){const p=st.tray[ti],v=VARS[p.v];let [lo,hi]=bitsOf(st.b);for(const x of v.cs){const q=bit((r+x[0])*N+c+x[1]);lo|=q[0];hi|=q[1];}
  const out=[];for(const L of LINES)if((lo&L.lo)===L.lo&&(hi&L.hi)===L.hi)out.push(L.r!=null?{r:L.r}:{c:L.c});return out;}
// убрать собранные ряды и столбцы: предметы — в копилку цели, старые кирпичи — минус завал
function clearLines(st){const rows=[],cols=[];
  for(let r=0;r<N;r++){let f=1;for(let c=0;c<N;c++)if(!st.b[r*N+c]){f=0;break;}if(f)rows.push(r);}
  for(let c=0;c<N;c++){let f=1;for(let r=0;r<N;r++)if(!st.b[r*N+c]){f=0;break;}if(f)cols.push(c);}
  const set={};rows.forEach(r=>{for(let c=0;c<N;c++)set[r*N+c]=1;});cols.forEach(c=>{for(let r=0;r<N;r++)set[r*N+c]=1;});
  const clr=[],items={};let olds=0;
  for(const ks in set){const k=+ks;clr.push({k,col:st.b[k],it:st.it[k],old:st.old[k]});
    if(st.it[k]){items[st.it[k]]=(items[st.it[k]]||0)+1;st.got[st.it[k]]=(st.got[st.it[k]]||0)+1;}
    if(st.old[k]){olds++;st.oldLeft--;}st.b[k]=0;st.it[k]=0;st.old[k]=0;}
  return {n:rows.length+cols.length,rows,cols,clr,items,olds};}
function place(st,ti,r,c){if(st.over||!canPlace(st,ti,r,c))return null;const p=st.tray[ti],v=VARS[p.v],cells=[];
  v.cs.forEach((x,j)=>{const k=(r+x[0])*N+c+x[1];st.b[k]=v.b+1;st.it[k]=j===p.it?p.ik:0;st.old[k]=0;cells.push(k);});
  st.tray[ti]=null;st.moves++;
  const res=clearLines(st);res.cells=cells;res.ti=ti;res.r=r;res.c=c;res.v=p.v;let pts=cells.length;
  if(res.n){st.combo=st.combo>0&&st.since<3?st.combo+1:1;st.since=0;pts+=LSC[Math.min(res.n,LSC.length-1)]*st.combo;st.lines+=res.n;
    if(st.b.every(x=>!x)){pts+=300;res.allClear=true;}}
  else{st.since++;if(st.since>=3)st.combo=0;}
  st.score+=pts;res.pts=pts;res.combo=st.combo;
  if(st.cfg.endless)st.d=Math.min(.9,.15+.75*Math.min(1,st.score/5000));
  if(st.tray.every(x=>!x)){deal(st);res.dealt=true;}
  checkEnd(st);return res;}
function goalDone(st){const n=st.cfg.need;if(st.cfg.endless)return false;
  if(n.score&&st.score<n.score)return false;
  if(n.items)for(const q in n.items)if((st.got[q]||0)<n.items[q])return false;
  if(n.clear&&st.oldLeft>0)return false;return true;}
function checkEnd(st){if(goalDone(st)){st.won=st.over=true;return;}if(noMoves(st)){st.lost=st.over=true;}}
// помощники: бомба 3×3, новые фигуры, поворот
function bomb(st,r,c){const clr=[];
  for(let a=r-1;a<=r+1;a++)for(let b=c-1;b<=c+1;b++){if(a<0||b<0||a>=N||b>=N)continue;const k=a*N+b;if(!st.b[k])continue;
    clr.push({k,col:st.b[k],it:st.it[k],old:st.old[k]});if(st.it[k])st.got[st.it[k]]=(st.got[st.it[k]]||0)+1;if(st.old[k])st.oldLeft--;st.b[k]=st.it[k]=st.old[k]=0;}
  st.score+=clr.length;st.over=st.lost=false;checkEnd(st);return {clr};}
function redeal(st){const keep=st.tray.filter(p=>p&&p.ik).map(p=>({ik:p.ik}));deal(st);
  // предметы из старых фигур не пропадают — переезжают в новые
  keep.forEach((x,j)=>{const p=st.tray[j%3];if(p&&!p.ik){p.ik=x.ik;p.it=Math.floor(st.R()*VARS[p.v].n);}});
  st.over=st.lost=false;checkEnd(st);}
function rotatePiece(st,ti){const p=st.tray[ti];if(!p)return;p.v=rotVar(p.v);if(p.it>=0){/* предмет остаётся в той же клетке фигуры */const v0=VARS[p.v];p.it=Math.min(p.it,v0.n-1);}}
// «вторая жизнь»: три мелкие фигуры, которые точно встают (по возможности — с собранным рядом)
function rescue(st){const [lo,hi]=bitsOf(st.b);let best=null,bv=-1;
  for(let t=0;t<80;t++){const tr=[randPiece(st,SMALL),randPiece(st,SMALL),randPiece(st,SMALL)];if(!canAll(lo,hi,tr.map(p=>p.v)))continue;
    let v=0;for(const p of tr)for(const q of VARS[p.v].pos){if((lo&q.lo)||(hi&q.hi))continue;if(clrMask(lo|q.lo,hi|q.hi)[2]){v++;break;}}
    v+=st.R()*.5;if(v>bv){bv=v;best=tr;}}
  if(!best){const d=VBY['0,0'].i;best=[{v:d,it:-1,ik:0},{v:d,it:-1,ik:0},{v:d,it:-1,ik:0}];}
  addItems(st,best);st.tray=best;st.life++;st.over=st.lost=false;checkEnd(st);}

/* ---------------- бот: подсказка в игре и автопрогон ----------------
   Смотрит все места для каждой фигуры, оценивает поле после хода (собранные ряды, цель, «дырки», неровность, место под крупные фигуры)
   и из лучших ходов берёт тот, после которого оставшиеся фигуры ещё встают. */
function evalBits(lo,hi){let e=0,iso=0,tr=0;const f=k=>k<32?(lo>>>k)&1:(hi>>>(k-32))&1;
  for(let r=0;r<N;r++){let prev=1;for(let c=0;c<N;c++){const x=f(r*N+c);if(x!==prev)tr++;prev=x;
      if(!x){e++;if((r===0||f(k1(r-1,c)))&&(r===N-1||f(k1(r+1,c)))&&(c===0||f(k1(r,c-1)))&&(c===N-1||f(k1(r,c+1))))iso++;}}if(!prev)tr++;}
  for(let c=0;c<N;c++){let prev=1;for(let r=0;r<N;r++){const x=f(r*N+c);if(x!==prev)tr++;prev=x;}if(!prev)tr++;}
  let big=0;if(fitsAny(lo,hi,O3))big+=6;if(fitsAny(lo,hi,I5H))big+=2.5;if(fitsAny(lo,hi,I5V))big+=2.5;
  return e*.6-iso*6-tr*.9+big;}
const k1=(r,c)=>r*N+c;
let O3=0,I5H=0,I5V=0;{O3=VBY[keyC(normC(cellsOf(['###','###','###'])))].i;I5H=VBY[keyC(normC(cellsOf(['#####'])))].i;I5V=rotVar(I5H);}
function botMoves(st){const [lo,hi]=bitsOf(st.b),out=[],n=st.cfg.need||{},wantIt=n.items?itemsLeft(st):{};
  for(let ti=0;ti<3;ti++){const p=st.tray[ti];if(!p)continue;const v=VARS[p.v];
    if(st.tray.slice(0,ti).some(q=>q&&q.v===p.v&&!q.ik&&!p.ik))continue;
    for(const q of v.pos){if((lo&q.lo)||(hi&q.hi))continue;let a=lo|q.lo,b=hi|q.hi;const m=clrMask(a,b);let g=0;
      if(m[2]){a&=~m[0];b&=~m[1];
        for(let k=0;k<NN;k++){const inM=k<32?(m[0]>>>k)&1:(m[1]>>>(k-32))&1;if(!inM)continue;
          if(st.it[k]&&wantIt[st.it[k]])g+=14;if(st.old[k])g+=5;}
        if(p.ik&&wantIt[p.ik]){const j=p.it,k=(q.r+v.cs[j][0])*N+q.c+v.cs[j][1];if(k<32?(m[0]>>>k)&1:(m[1]>>>(k-32))&1)g+=14;}}
      const val=m[2]*9+(m[2]>1?m[2]*6:0)+g+evalBits(a,b)+v.n*.3;
      out.push({ti,r:q.r,c:q.c,val,a,b});}}
  out.sort((x,y)=>y.val-x.val);return out;}
function botMove(st){const mv=botMoves(st);if(!mv.length)return null;
  for(let j=0;j<Math.min(mv.length,14);j++){const m=mv[j],rest=st.tray.filter((p,i)=>p&&i!==m.ti).map(p=>p.v);if(canAll(m.a,m.b,rest))return m;}
  return mv[0];}
// сыграть партию ботом до конца (для проверок и «нормы» звёзд уровня); life — сколько раз можно взять «вторую жизнь»
function botPlay(cfg,seed,opt){opt=opt||{};const st=newGame(cfg,seed),cap=opt.cap||1500;let lives=opt.life||0;
  while(!st.over&&st.moves<cap){const m=botMove(st);if(!m)break;place(st,m.ti,m.r,m.c);
    if(st.lost&&lives>0){lives--;rescue(st);}}
  return st;}
// норма звёзд уровня: медиана числа фигур у бота на 3 партиях; ★★★ — не больше нормы, ★★ — не больше 1,5 нормы
function levelPar(cfg){const a=[];for(let s=1;s<=5;s++){const st=botPlay(cfg,cfg.seed*3+s,{life:2});a.push(st.won?st.moves:Math.round(st.moves*1.3)+10);}
  a.sort((x,y)=>x-y);return Math.max(3,Math.ceil(a[2]*1.2)+1);}
function starsFor(moves,par){return moves<=par?3:moves<=Math.ceil(par*1.5)?2:1;}

function stubAd(cb){const ad=$('ad'),tEl=$('adT');ad.classList.add('on');adOpen();let n=3;tEl.textContent=n;const it=setInterval(()=>{n--;tEl.textContent=n;if(n<=0){clearInterval(it);ad.classList.remove('on');adClose();cb();}},600);}

const AD_FAIL=L('Реклама сейчас недоступна — загляни чуть позже','Ads are unavailable right now — try later'),VK_REAL=/[?&]vk_app_id=/.test(location.search);
// межэкранная: не раньше AD_GAP после ЛЮБОЙ рекламы и после запуска; «долг» S.adW — пройденных уровней/партий с прошлого показа
let lastAdT=Date.now(),AD_GAP=180000,AD_EVERY=3,AD_COINS=30;
let adBusy=false;
function showRewarded(cb0,onFail0){
  if(adBusy)return;adBusy=true;clearTimeout(showRewarded._t);showRewarded._t=setTimeout(()=>{adBusy=false;},90000);
  const cb=()=>{adBusy=false;lastAdT=Date.now();cb0();},onFail=()=>{adBusy=false;lastAdT=Date.now();onFail0&&onFail0();};
  if(PLAT==='vk'&&!VK){if(VK_REAL){toast(AD_FAIL);onFail();}else stubAd(cb);return;}
  if(VK){adOpen();vkSend('VKWebAppShowNativeAds',{ad_format:'reward'},60000)
      .then(r=>{adClose();if(r&&r.result)cb();else{toast(AD_FAIL);onFail();}})
      .catch(()=>{adClose();toast(AD_FAIL);onFail();})
      .finally(()=>vkSend('VKWebAppCheckNativeAds',{ad_format:'reward'}).catch(()=>{}));return;}
  if(!ysdk){stubAd(cb);return;}

    onClose:()=>{adClose();if(got)cb();else{toast(L('Досмотри видео до конца, чтобы получить награду','Watch the video to the end to get the reward'));onFail();}},
    onError:()=>{adClose();toast(AD_FAIL);onFail();}}});
}

function adOk(){return !(PLAT==='vk'&&!VK&&VK_REAL);}
// межэкранная — с 6-го законченного уровня/партии, раз в AD_EVERY, не после двух поражений подряд, не при покупке «Без рекламы»
function adDue(){return !PAY.own('no_ads')&&(S.adW||0)>=AD_EVERY&&(S.done||0)>=6&&(S.lossRow||0)===0;} /* boost: с 6-го законченного, не после поражения */
// кнопки «📺 … за рекламу» — не раньше, чем закончены 3 уровня/партии (первые минуты — без рекламы совсем)

function showInterstitial(cb0){
  const cb=shown=>{lastAdT=Date.now();if(shown!==false){S.adW=0;S.adN=(S.adN||0)+1;save();adHintOnce();}cb0();};
  if(PLAT==='vk'&&!VK){if(VK_REAL)cb0();else stubAd(cb);return;}
  if(VK){adOpen();vkSend('VKWebAppShowNativeAds',{ad_format:'interstitial'},60000).then(r=>!!(r&&r.result),()=>false).then(ok=>{adClose();cb(ok);});return;}
  if(!ysdk){stubAd(cb);return;}

// одно мягкое напоминание после 5-й межэкранной (каталог покупок, п. 3.2): строка внизу, не окно, не чаще раза в 7 дней
function adHintOnce(){if(!PAY.on||!PAY.item('no_ads')||PAY.own('no_ads')||(S.adN||0)<5)return;if(!isObj(S.ask))S.ask={};const now=Date.now();
  if(S.ask.noads&&now-S.ask.noads<7*864e5)return;S.ask.noads=now;save();setTimeout(()=>toast(L('Рекламу между уровнями можно отключить навсегда — ⚙','You can turn off ads between levels — ⚙'),4200),900);}
// удалённая настройка Яндекса (флаги консоли). Границы жёсткие: межэкранная — не чаще раза в 2 уровня и раза в 180 с
function applyFlags(f){if(!isObj(f))return;const num=(k,a,b)=>{const n=parseInt(f[k],10);return isFinite(n)&&n>=a&&n<=b?n:null;};let n;
  if((n=num('ad_coins',10,100))!==null)AD_COINS=n;if((n=num('ad_every',2,6))!==null)AD_EVERY=n;if((n=num('ad_gap',180,600))!==null)AD_GAP=n*1000;updCoins();}

   vk — цена в голосах (= hobby-pay/catalog.json, игра пока без app_id — запись «_pending_kirpichiki») */
const PAY_ROW='set';
const PAY_ITEMS={
  no_ads:{perm:1,bonus:150,vk:14,ic:'🚫',name:L('Без рекламы между уровнями','No ads between levels'),desc:L('Навсегда, и сразу +150 💰. Ролики за награду остаются — по желанию','Forever, plus 150 💰. Rewarded videos stay optional')},
  coins_s:{n:300,vk:5,ic:'💰',name:L('Горсть монет: 300 💰','Handful: 300 💰'),desc:L('На помощников и оформление','For helpers and looks'),done:L('+300 💰 — спасибо!','+300 💰 — thank you!')},
  coins_l:{n:1000,vk:14,ic:'💰',name:L('Копилка: 1000 💰','Piggy bank: 1000 💰'),desc:L('Выгоднее горсти','Better value'),done:L('+1000 💰 — спасибо!','+1000 💰 — thank you!')},
  themes:{perm:1,vk:7,ic:'🎨',name:L('Оформления «Праздник»','Holiday looks'),desc:L('Золото, хохлома и новогодний лёд — три вида кирпичиков','Gold, Khokhloma and New Year ice — three brick looks')}
};
const PAY_TEST={no_ads:99,coins_s:39,coins_l:99,themes:49}; // цены только для ?paytest=1; настоящие — в консоли
function payAdd(n){S.coins+=n;}
function payFlush(){cloudFlush();}
function payPause(on){setPause('pay',on);}
function payAfter(){updCoins();if(modalOn&&PAY.re)PAY.re();else if($('scr-shop').classList.contains('on'))openShop();else if($('scr-menu').classList.contains('on')&&!modalOn)renderMenu();}
/* ================= покупки за деньги: Яндекс Игры (ysdk.payments) и VK Игры (VKWebAppShowOrderBox) — общий модуль (одинаковый в 5 играх) =================
   Товары игры — PAY_ITEMS (выше), id совпадают с id в консоли Яндекса («Инап-покупки») и в hobby-pay/catalog.json (VK).
   Кнопок покупок НЕТ совсем, если платежи недоступны: нет SDK/моста (мак), каталог Яндекса пуст, VK не поддерживает оплату (iOS).
   Постоянные (perm) — флаг S.buy[id], разовый бонус монет — один раз на игрока (S.buyB). Выдача — только после подтверждения площадки.
   Яндекс: цена и значок валюты — только из getCatalog; расходуемые: выдать → сохранить (облако сразу) → consumePurchase;
     незавершённые при запуске довыдаём (getPurchases). Токены выданных — S.payT (и в облаке), сбой consume не даст выдать второй раз.
   VK: на кнопке число голосов (PAY_ITEMS.vk). success:true + order_id → выдать → сохранить → стереть ключ pay_<order_id>.
     Страховка: сервер vk-pay при оплате пишет в хранилище VK игрока pay_<order_id>=id (расходуемые) и own_<id>=1 (постоянные);
     при запуске читаем их и довыдаём. Выданные order_id — S.payV (последние 30); покупка без order_id оставляет метку «x:<id>»,
     которая «съест» первый чужой pay_ этого товара — второй раз не выдастся.
   Мак: ?paytest=1 — имитация Яндекса (localStorage «paytest»), ?vk=1&paytest=1 — имитация VK с сервером (localStorage «paytestvk»),
   ?paytest=fail — отказ. В настоящем VK (vk_app_id) и в Яндексе заглушек нет */
const payObj=x=>!!x&&typeof x==='object'&&!Array.isArray(x);
const PAY={on:false,p:null,v:null,list:[],busy:false,
  test:/[?&]paytest=/.test(location.search),
  // запуск: после SDK/моста и облака. Незавершённые покупки обрабатываем, даже если каталог не пришёл
  async init(){if(PAY.p||PAY.v)return;
    if(PLAT==='vk')return PAY.initVK();
    try{if(ysdk)PAY.p=ysdk.getPayments?await payT(ysdk.getPayments({signed:false})):ysdk.payments;
      else if(PAY.test&&!window.YaGames)PAY.p=payStub();}catch(e){PAY.p=null;}
    if(!PAY.p)return;
    try{await PAY.restore();}catch(e){}
    try{const c=await payT(PAY.p.getCatalog());PAY.list=(Array.isArray(c)?c:[]).filter(x=>x&&PAY_ITEMS[x.id]);}catch(e){PAY.list=[];}
    PAY.on=PAY.list.length>0;if(PAY.on)payAfter();},
  async initVK(){
    if(VK){let ok=false;try{ok=!!(VK.supportsAsync&&await payT(VK.supportsAsync('VKWebAppShowOrderBox'),8000));}catch(e){}if(ok)PAY.v=payVK();}
    else if(PAY.test&&!VK_REAL)PAY.v=payStubVK();
    if(!PAY.v)return;
    try{await PAY.restore();}catch(e){}
    PAY.list=Object.keys(PAY_ITEMS).filter(id=>PAY_ITEMS[id].vk>0).map(id=>({id}));
    PAY.on=PAY.list.length>0;if(PAY.on)payAfter();},
  own(id){return !!(payObj(S.buy)&&S.buy[id]);},
  item(id){return PAY.list.find(x=>x.id===id)||null;},
  give(id){const it=PAY_ITEMS[id];
    if(it.perm){if(!payObj(S.buy))S.buy={};S.buy[id]=1;
      if(it.bonus){if(!payObj(S.buyB))S.buyB={};if(!S.buyB[id]){S.buyB[id]=1;payAdd(it.bonus);}}}
    else payAdd(it.n||0);
    if(it.give)it.give();},
  // при запуске и «Восстановить покупки»: постоянные — выдать, если флага нет; расходуемые — довыдать и отметить
  async restore(){let got=0;
    if(PAY.v)got=await PAY.restoreVK();
    else{const ps=await payT(PAY.p.getPurchases());
      for(const x of (Array.isArray(ps)?ps:[])){const it=x&&PAY_ITEMS[x.productID];if(!it)continue;
        if(it.perm){if(!PAY.own(x.productID)){PAY.give(x.productID);got=1;}}else if(await PAY.credit(x))got=1;}}
    if(got){save();payFlush();payAfter();toast('Покупка зачислена',2600);}
    return got;},
  // VK: ключи own_<id> (постоянные, не стираем) и pay_<order_id> (расходуемые: выдать, сохранить, стереть)
  async restoreVK(){const ks=await PAY.v.keys();let got=0;const done=[];if(!Array.isArray(S.payV))S.payV=[];
    for(const k of ks){const m=/^(own|pay)_(.+)$/.exec(k.key||'');if(!m||!k.value)continue;
      if(m[1]==='own'){const it=PAY_ITEMS[m[2]];if(it&&it.perm&&!PAY.own(m[2])){PAY.give(m[2]);got=1;}continue;}
      const id=String(k.value),it=PAY_ITEMS[id];if(!it)continue;
      if(S.payV.indexOf(m[2])<0){const x=S.payV.indexOf('x:'+id); // покупка без order_id уже выдана — это её заказ
        if(x>=0)S.payV[x]=m[2];else{PAY.give(id);payMark(m[2]);got=1;}}
      done.push(k.key);}
    if(done.length){save();payFlush();for(const k of done)try{await PAY.v.clear(k);}catch(e){}}
    return got;},
  // расходуемая: выдать (если этот токен ещё не выдавали), сохранить в облако и только потом consumePurchase
  async credit(x){const t=String(x.purchaseToken||'');if(!Array.isArray(S.payT))S.payT=[];let fresh=false;
    if(!t||S.payT.indexOf(t)<0){PAY.give(x.productID);if(t)S.payT.push(t);if(S.payT.length>30)S.payT=S.payT.slice(-30);save();payFlush();fresh=true;}
    try{if(t)await payT(PAY.p.consumePurchase(t));}catch(e){}
    return fresh;},
  async buy(id){const it=PAY_ITEMS[id];if(!it||PAY.busy||!PAY.on||!PAY.item(id)||(it.perm&&PAY.own(id)))return;PAY.busy=true;payPause(true);
    try{if(PAY.v){const r=await PAY.v.order(id);if(!r||!r.success)throw new Error('cancel');
        const oid=r.order_id!=null?String(r.order_id):'';if(!Array.isArray(S.payV))S.payV=[];
        if(!oid||S.payV.indexOf(oid)<0){PAY.give(id);payMark(oid||'x:'+id);}
        save();payFlush();if(oid)PAY.v.clear('pay_'+oid).catch(()=>{});}
      else{const x=await PAY.p.purchase({id});
        if(it.perm){PAY.give(id);save();payFlush();}
        else await PAY.credit(x&&x.productID===id?x:{productID:id,purchaseToken:x&&x.purchaseToken});}
      SND.coin();toast(it.done||'Готово! Спасибо за покупку',2800);payAfter(id);}
    catch(e){toast('Покупка не состоялась',2200);}
    finally{PAY.busy=false;payPause(false);}},
  // «Восстановить покупки» (Об игре): заново читаем getPurchases / ключи VK
  async again(){if(!(PAY.p||PAY.v)||PAY.busy)return;PAY.busy=true;let got=0;try{got=await PAY.restore();}catch(e){}PAY.busy=false;if(!got)toast('Покупки проверены — всё на месте',2400);},
  // цена: VK — число голосов (требование VK); Яндекс — из каталога: число + значок валюты (getPriceCurrencyImage), иначе готовая строка price
  price(pr){if(PAY.v){const n=PAY_ITEMS[pr.id].vk,a=n%10,b=n%100;return n+' '+(a===1&&b!==11?'голос':a>=2&&a<=4&&(b<12||b>14)?'голоса':'голосов');}
    let img='';try{img=pr.getPriceCurrencyImage?pr.getPriceCurrencyImage('svg'):'';}catch(e){}
    return img&&pr.priceValue?payEsc(pr.priceValue)+'<img class="pcur" src="'+payEsc(img)+'" alt="">':payEsc(pr.price||pr.priceValue||'');},
  row(pr){const it=PAY_ITEMS[pr.id],own=it.perm&&PAY.own(pr.id),txt='<span>'+it.ic+' '+payEsc(it.name)+'<br><small>'+payEsc(it.desc)+'</small></span>';
    return own?'<div class="'+PAY_ROW+' pown">'+txt+'<i>куплено</i></div>':'<button class="'+PAY_ROW+' pbuy" data-pid="'+payEsc(pr.id)+'">'+txt+'<b>'+PAY.price(pr)+'</b></button>';},
  // список товаров (ids — только эти, по порядку каталога); owned=false — без уже купленных
  html(ids,owned){const L=PAY.list.filter(pr=>(!ids||ids.indexOf(pr.id)>=0)&&(owned!==false||!(PAY_ITEMS[pr.id].perm&&PAY.own(pr.id))));
    return L.length?'<div class="pay"><h3>Покупки</h3>'+L.map(PAY.row).join('')+'</div>':'';},
  bind(root){(root||document).querySelectorAll('.pbuy').forEach(b=>b.onclick=()=>{try{(SND.tap||SND.click)();}catch(e){}PAY.buy(b.dataset.pid);});}
};
function payMark(v){if(!Array.isArray(S.payV))S.payV=[];if(S.payV.indexOf(v)<0)S.payV.push(v);if(S.payV.length>30)S.payV=S.payV.slice(-30);}
// слияние облака (d) в сохранение T (по умолчанию S): купленное, выданные бонусы, токены и заказы — объединение (покупка не теряется ни с какой стороны)
function payMerge(d,T){T=T||S;if(!payObj(d)||!payObj(T))return;
  for(const f of ['buy','buyB'])if(payObj(d[f])){if(!payObj(T[f]))T[f]={};for(const k in d[f])if(d[f][k])T[f][k]=1;}
  for(const f of ['payT','payV'])if(Array.isArray(d[f])){if(!Array.isArray(T[f]))T[f]=[];for(const t of d[f])if(typeof t==='string'&&T[f].indexOf(t)<0)T[f].push(t);if(T[f].length>30)T[f]=T[f].slice(-30);}}
function payT(p,ms){return Promise.race([p,new Promise((_,no)=>setTimeout(()=>no(new Error('timeout')),ms||15000))]);}
function payEsc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]);}
// VK: окно оплаты (игрок может думать долго — ждём до 10 мин) и ключи хранилища, которые пишет сервер vk-pay
function payVK(){return {order:id=>vkSend('VKWebAppShowOrderBox',{type:'item',item:id},600000),
  keys:async()=>{const r=await vkSend('VKWebAppStorageGetKeys',{count:1000,offset:0},8000),ks=((r&&r.keys)||[]).filter(k=>/^(own|pay)_/.test(k));
    if(!ks.length)return [];const g=await vkSend('VKWebAppStorageGet',{keys:ks},8000);return (g&&g.keys)||[];},
  clear:k=>vkSend('VKWebAppStorageSet',{key:k,value:''},8000)};}
// имитация платежей для проверки на маке (?paytest=1): цены — PAY_TEST, покупки лежат в localStorage «paytest», consume их убирает
function payStub(){const K='paytest',rd=()=>{try{return JSON.parse(localStorage.getItem(K))||[];}catch(e){return [];}},wr=a=>{try{localStorage.setItem(K,JSON.stringify(a));}catch(e){}};
  const cur='data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20"><circle cx="10" cy="10" r="9" fill="#f5b400"/><text x="10" y="14.5" font-size="12" text-anchor="middle" font-family="Arial" font-weight="700" fill="#fff">T</text></svg>');
  const wait=v=>new Promise(ok=>setTimeout(()=>ok(v),250)),fail=()=>window.__payCancel||/[?&]paytest=fail/.test(location.search);

// обучение 1-го уровня: после каждого хода — новая подсветка и слово соседа (boost)

// новичку (первые 6 побед, уровни 2–10): нет хода 15 с — сосед сам подсвечивает хороший ход (бесплатно, не в бесконечной и не в задании дня)
setInterval(()=>{if(!G||G.mode!=='level'||G.st.over||G.busy||G.drag||G.hint||G.tool||modalOn||paused||G.cfg.i>10||(S.wins||0)>=6)return;
  if(performance.now()-(G.idleT||0)<15000)return;const m=botMove(G.st);if(!m)return;G.hint={ti:m.ti,r:m.r,c:m.c};G.idleT=performance.now();
  say(L('Подскажу: вот сюда хорошо встанет.','A tip: this spot is good.'),'happy',4000);kick();},1000);

/* ---- раскладка: поле 8×8 и лоток на 3 фигуры (в альбомной — лоток справа) ---- */
function layout(){const f=$('field'),app=$('app');const land=app.clientWidth>app.clientHeight*1.05&&app.clientWidth>=600;app.classList.toggle('land',land);
  const W=f.clientWidth,H=f.clientHeight;if(!W||!H)return;const dpr=Math.min(2,window.devicePixelRatio||1);
  cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);cv.style.width=W+'px';cv.style.height=H+'px';
  const pad=8;let B,cs,fr,bx,by,slots;
  if(!land){B=Math.min(W-2*pad-18,(H-2*pad-30)/1.37);cs=Math.floor(B/8);B=cs*8;fr=Math.max(7,Math.round(cs*.24));
    const avail=H-2*pad-2*fr-B-12,th=Math.max(cs*1.8,Math.min(avail,cs*3.4));bx=Math.round((W-B)/2);by=pad+fr+Math.max(0,Math.round((avail-th)*.42));
    const ty=by+B+fr+12,tw=Math.min(W-2*pad,B+2*fr+40),tx=(W-tw)/2;slots=[0,1,2].map(i=>({x:tx+i*tw/3,y:ty,w:tw/3,h:th}));}
  else{B=Math.min(H-2*pad-22,(W-2*pad-30)/1.36);cs=Math.floor(B/8);B=cs*8;fr=Math.max(7,Math.round(cs*.24));
    bx=pad+fr+Math.max(0,Math.round((W-2*pad-2*fr-B-Math.round(B*.4)-12)*.3));by=Math.round((H-B)/2);
    const tx=bx+B+fr+12,tw=Math.max(cs*2.2,Math.min(W-tx-pad,B*.4)),th=(B+2*fr)/3;slots=[0,1,2].map(i=>({x:tx,y:by-fr+i*th,w:tw,h:th}));}
  LY={W,H,dpr,land,cs,B,bx,by,fr,slots};}
let rzT=0;window.addEventListener('resize',()=>{clearTimeout(rzT);rzT=setTimeout(()=>{if(G&&$('scr-game').classList.contains('on')){layout();render();kick();}},80);});
function trayGeom(ti,now){const p=G.st.tray[ti];if(!p)return null;const v=VARS[p.v],sl=LY.slots[ti];
  const s=Math.min(LY.cs*.76,sl.w*.88/v.w,sl.h*.82/v.h); /* boost: фигуры в лотке крупнее (45+) */let x=sl.x+(sl.w-v.w*s)/2,y=sl.y+(sl.h-v.h*s)/2;
  const e=Math.min(1,Math.max(0,((now||performance.now())-G.dealT-ti*70)/260));if(e<1){const k=1-Math.pow(1-e,3);x+=(1-k)*(LY.land?LY.W*.3:LY.W*.6);}
  if(G.sel===ti)y-=6;return {s,x,y,v,p};}
function slotAt(pt){for(let i=0;i<3;i++){const s=LY.slots[i];if(pt.x>=s.x&&pt.x<s.x+s.w&&pt.y>=s.y-8&&pt.y<s.y+s.h+8)return i;}return -1;}
function cellAt(pt){const c=Math.floor((pt.x-LY.bx)/LY.cs),r=Math.floor((pt.y-LY.by)/LY.cs);return r>=0&&c>=0&&r<N&&c<N?{r,c}:null;}

/* ---- рисование ---- */
function kick(){if(!raf&&G)raf=requestAnimationFrame(frame);}
function stopLoop(){if(raf){cancelAnimationFrame(raf);raf=0;}}
function frame(){raf=0;if(!G||!$('scr-game').classList.contains('on'))return;const now=performance.now();render(now);if(needLoop(now))kick();}
function needLoop(now){return !!(G&&(G.drag||G.back||G.flashes.length||G.parts.length||G.pops.length||G.curtain||G.hint||G.sel>=0||G.tool||G.shake||G.flash||G.zoom||(G.kc&&G.sel>=0)||now-G.dealT<600||(G.placed&&now-G.placed.t0<200)));}
function piecePath(g,v,x,y,s,col,th,alpha,ik,it){g.globalAlpha=alpha;v.cs.forEach((q,j)=>{drawBrick(g,x+q[1]*s,y+q[0]*s,s,col,th);if(ik&&j===it)drawItem(g,ik,x+q[1]*s,y+q[0]*s,s);});g.globalAlpha=1;}
function render(now){if(!G||!LY)return;now=now||performance.now();const g=cv.getContext('2d'),T=theme(),st=G.st,{cs,B,bx,by,fr}=LY;
  g.setTransform(LY.dpr,0,0,LY.dpr,0,0);g.clearRect(0,0,LY.W,LY.H);
  if(G.shake){const e=(now-G.shake)/260;if(e>=1)G.shake=0;else g.translate(Math.sin(now*.09)*5*(1-e),Math.cos(now*.07)*3*(1-e));}
  if(G.zoom){const e=(now-G.zoom)/240;if(e>=1)G.zoom=0;else{const z=1+.04*Math.sin(e*Math.PI),cx=bx+B/2,cy=by+B/2;g.translate(cx,cy);g.scale(z,z);g.translate(-cx,-cy);}}
  // лоток: подложка
  const s0=LY.slots[0],s2=LY.slots[2],tl=Math.min(s0.x,s2.x),tt=s0.y,tw=LY.land?s0.w:s2.x+s2.w-s0.x,th=LY.land?s2.y+s2.h-s0.y:s0.h;
  g.fillStyle=T.st==='lcd'?'rgba(164,178,139,.55)':'rgba(255,255,255,.26)';rr(g,tl+2,tt+2,tw-4,th-4,16);g.fill();
  // корпус вокруг поля: дерево («Двор»), жёлтая пластмасса (ретро) и т. д.
  const gr=g.createLinearGradient(bx-fr,by-fr,bx+B+fr,by+B+fr);gr.addColorStop(0,T.fr[0]);gr.addColorStop(1,T.fr[1]);
  g.fillStyle='rgba(0,0,0,.25)';rr(g,bx-fr,by-fr+4,B+2*fr,B+2*fr,fr*1.3);g.fill();g.fillStyle=gr;rr(g,bx-fr,by-fr,B+2*fr,B+2*fr,fr*1.3);g.fill();
  if(T.st==='lcd'){g.fillStyle='#3a3f44';rr(g,bx-fr*.6,by-fr*.6,B+fr*1.2,B+fr*1.2,fr*.7);g.fill();}
  g.fillStyle=T.bg;rr(g,bx-2,by-2,B+4,B+4,T.st==='lcd'?2:fr*.5);g.fill();
  // клетки
  const pl=G.placed&&now-G.placed.t0<180?G.placed:null;
  for(let k=0;k<NN;k++){const r=k>>3,c=k&7,x=bx+c*cs,y=by+r*cs;
    if(st.b[k]){if(pl&&pl.ks.indexOf(k)>=0){const e=(now-pl.t0)/180,sc=1+.14*Math.sin(e*Math.PI);g.save();g.translate(x+cs/2,y+cs/2);g.scale(sc,sc);drawBrick(g,-cs/2,-cs/2,cs,st.b[k],T);if(st.it[k])drawItem(g,st.it[k],-cs/2,-cs/2,cs);g.restore();}
      else{drawBrick(g,x,y,cs,st.b[k],T);if(st.it[k])drawItem(g,st.it[k],x,y,cs);}}
    else drawEmpty(g,x,y,cs,T);}
  if(G.flash){const e=(now-G.flash)/300;if(e>=1)G.flash=0;else{g.fillStyle='rgba(255,255,255,'+(.5*(1-e)).toFixed(3)+')';rr(g,bx-2,by-2,B+4,B+4,fr*.5);g.fill();}}
  // клавиатура (ПК): рамка клетки-курсора и «тень» выбранной фигуры
  if(G.kc&&G.sel>=0&&st.tray[G.sel]&&!G.drag){const sp=tapSpot(G.sel,G.kc.r,G.kc.c),p=st.tray[G.sel];if(sp)piecePath(g,VARS[p.v],bx+sp.c*cs,by+sp.r*cs,cs,VARS[p.v].b+1,T,.5,p.ik,p.it);
    g.strokeStyle='#ffd43b';g.lineWidth=3;rr(g,bx+G.kc.c*cs+2,by+G.kc.r*cs+2,cs-4,cs-4,6);g.stroke();}
  // подсказка: мигающий «призрак» лучшего хода
  if(G.hint&&st.tray[G.hint.ti]&&!G.drag){const p=st.tray[G.hint.ti],a=.35+.3*Math.sin(now/180);piecePath(g,VARS[p.v],bx+G.hint.c*cs,by+G.hint.r*cs,cs,VARS[p.v].b+1,T,a,p.ik,p.it);}
  // перетаскивание: призрак на поле и подсветка рядов, которые соберутся
  const d=G.drag;
  if(d&&d.ghost){const p=st.tray[d.ti],v=VARS[p.v],col=v.b+1;
    const lines=wouldClear(st,d.ti,d.ghost.r,d.ghost.c);if(lines.length){const a=.55+.25*Math.sin(now/90);g.globalAlpha=a;
      for(const L1 of lines)for(let j=0;j<N;j++){const r=L1.r!=null?L1.r:j,c=L1.c!=null?L1.c:j;drawBrick(g,bx+c*cs,by+r*cs,cs,st.b[r*N+c]&&T.st!=='cube'?st.b[r*N+c]:col,T);}
      g.globalAlpha=1;g.fillStyle='rgba(255,255,255,'+(.18+.12*Math.sin(now/90))+')';for(const L1 of lines){if(L1.r!=null)g.fillRect(bx,by+L1.r*cs,B,cs);else g.fillRect(bx+L1.c*cs,by,cs,B);}}
    piecePath(g,v,bx+d.ghost.c*cs,by+d.ghost.r*cs,cs,col,T,.42,p.ik,p.it);}
  // исчезающие кирпичики
  for(let i=G.flashes.length-1;i>=0;i--){const f=G.flashes[i],e=(now-f.t0)/320;if(e>=1){G.flashes.splice(i,1);continue;}const x=bx+(f.k&7)*cs,y=by+(f.k>>3)*cs;
    if(e<0){drawBrick(g,x,y,cs,f.col,T);if(f.it)drawItem(g,f.it,x,y,cs);continue;}
    const sc=1-e*.7;g.save();g.globalAlpha=1-e;g.translate(x+cs/2,y+cs/2);g.rotate(e*.6*(f.k%2?1:-1));g.scale(sc,sc);drawBrick(g,-cs/2,-cs/2,cs,f.col,T);g.fillStyle='rgba(255,255,255,'+(.8*(1-e))+')';rr(g,-cs/2,-cs/2,cs,cs,cs*.15);g.fill();g.restore();}
  // занавес конца игры (как на «Брик-гейме»: ряды заполняются снизу вверх)
  if(G.curtain){const e=Math.max(0,(now-G.curtain.t0)/650),n=Math.min(N,Math.floor(e*N)+(e>0?1:0));for(let r=N-1;r>=N-n;r--)for(let c=0;c<N;c++){g.globalAlpha=.92;drawBrick(g,bx+c*cs,by+r*cs,cs,20,T);}g.globalAlpha=1;if(e>1.4)G.curtain=null;}
  // лоток
  for(let ti=0;ti<3;ti++){if(d&&d.ti===ti)continue;if(G.back&&G.back.ti===ti)continue;const q=trayGeom(ti,now);if(!q)continue;
    const can=trayMoves(st,ti)>0,sel=G.sel===ti,hint=G.hint&&G.hint.ti===ti;
    if(sel||hint||G.tool==='rot'){const sl=LY.slots[ti];g.fillStyle=sel?'rgba(255,226,138,.75)':G.tool==='rot'?'rgba(255,255,255,'+(.35+.2*Math.sin(now/200))+')':'rgba(255,255,255,'+(.3+.25*Math.sin(now/180))+')';rr(g,sl.x+6,sl.y+6,sl.w-12,sl.h-12,14);g.fill();}
    piecePath(g,q.v,q.x,q.y,q.s,q.v.b+1,T,can||st.over?1:.35,q.p.ik,q.p.it);
    if(G.tool==='rot'){g.fillStyle='rgba(0,0,0,.55)';g.beginPath();g.arc(q.x+q.v.w*q.s,q.y,11,0,7);g.fill();g.fillStyle='#fff';g.font='900 14px sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText('↻',q.x+q.v.w*q.s,q.y+1);}}
  // фигура, возвращающаяся в лоток
  if(G.back){const b=G.back,e=Math.min(1,(now-b.t0)/170),q=trayGeom(b.ti,now);if(e>=1||!q){G.back=null;if(q)piecePath(g,q.v,q.x,q.y,q.s,q.v.b+1,T,trayMoves(st,b.ti)>0||st.over?1:.35,q.p.ik,q.p.it);}else{const s=cs+(q.s-cs)*e;piecePath(g,q.v,b.x+(q.x-b.x)*e,b.y+(q.y-b.y)*e,s,q.v.b+1,T,1,q.p.ik,q.p.it);}}
  // частицы
  for(let i=G.parts.length-1;i>=0;i--){const p=G.parts[i],t=(now-p.t0)/1000;if(t<0)continue;if(t>p.life){G.parts.splice(i,1);continue;}
    g.globalAlpha=1-t/p.life;g.fillStyle=p.c;const x=p.x+p.vx*t,y=p.y+p.vy*t+(p.gr||520)*t*t;g.fillRect(x-p.s/2,y-p.s/2,p.s,p.s);}g.globalAlpha=1;
  // взятая фигура — над пальцем, в полный размер клетки
  if(d){const p=st.tray[d.ti];if(p){const v=VARS[p.v],tl2=pieceTL(d);g.save();g.shadowColor='rgba(0,0,0,.35)';g.shadowBlur=12;g.shadowOffsetY=8;piecePath(g,v,tl2.x,tl2.y,cs,v.b+1,T,1,p.ik,p.it);g.restore();}}
  // надписи: очки, «Отлично!», серия
  for(let i=G.pops.length-1;i>=0;i--){const p=G.pops[i],e=(now-p.t0)/p.dur;if(e<0)continue;if(e>=1){G.pops.splice(i,1);continue;}
    const sc=p.big?Math.min(1,.5+e*4):1;g.save();g.globalAlpha=e<.7?1:(1-e)/.3;g.translate(p.x,p.y-e*(p.big?18:44));g.scale(sc,sc);
    g.font='900 '+p.size+'px -apple-system,Segoe UI,Roboto,sans-serif';g.textAlign='center';g.textBaseline='middle';g.lineJoin='round';g.lineWidth=p.size*.2;g.strokeStyle=p.stroke||'rgba(40,30,20,.85)';g.strokeText(p.t,0,0);g.fillStyle=p.c||'#fff';g.fillText(p.t,0,0);g.restore();}}
function pop(t,x,y,o){o=o||{};G.pops.push({t,x,y,t0:performance.now()+(o.delay||0),dur:o.dur||900,size:o.size||Math.round(LY.cs*.55),c:o.c,stroke:o.stroke,big:o.big});}
function burst(cells,t0){if(calm())return;const T=theme();for(const x of cells){const col=x.col===20?'#958a7c':T.st==='lcd'?T.ink:PAL[(x.col-1)%PAL.length],cx=LY.bx+((x.k&7)+.5)*LY.cs,cy=LY.by+((x.k>>3)+.5)*LY.cs;

// улетающий в счёт предмет (картинка поверх всего)
function flyItem(k,kind,delay){const chip=$('chip-it-'+kind);if(!chip||calm())return;const app=$('app').getBoundingClientRect(),cr=cv.getBoundingClientRect(),tr=chip.getBoundingClientRect();
  const x0=cr.left-app.left+LY.bx+((k&7)+.5)*LY.cs-15,y0=cr.top-app.top+LY.by+((k>>3)+.5)*LY.cs-15,x1=tr.left-app.left+2,y1=tr.top-app.top+(tr.height-30)/2;

/* ---- ввод: перетаскивание с «призраком» (фигура над пальцем), или касание фигуры и потом поля ---- */
function ptOf(e){const r=cv.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top};}
function pieceTL(d){const p=G.st.tray[d.ti],v=VARS[p.v],cs=LY.cs;
  // палец не закрывает фигуру: на сенсорном экране она на ~1,3 клетки выше пальца, мышью — под курсором
  return d.touch?{x:d.x-v.w*cs/2,y:d.y-v.h*cs-cs*1.3}:{x:d.x-v.w*cs/2,y:d.y-v.h*cs/2};}
function snap(d){const tl=pieceTL(d),fx=(tl.x-LY.bx)/LY.cs,fy=(tl.y-LY.by)/LY.cs,r0=Math.round(fy),c0=Math.round(fx);let best=null;
  for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){const r=r0+dr,c=c0+dc,dist=Math.hypot(r-fy,c-fx);if(dist<.8&&canPlace(G.st,d.ti,r,c)&&(!best||dist<best.d))best={r,c,d:dist};}
  return best;}
function busyNow(){return !G||G.busy||modalOn||$('ad').classList.contains('on');}
cv.addEventListener('pointerdown',e=>{goalHide();if(G)G.kc=null;if(busyNow())return;const p=ptOf(e);
  if(G.tool==='bomb'){const c=cellAt(p);if(c){useBomb(c.r,c.c);return;}if(slotAt(p)<0){toast(L('Коснись поля — куда бросить бомбу','Tap the board to drop the bomb'));}return;}
  const i=slotAt(p);
  if(i>=0&&G.st.tray[i]){if(G.tool==='rot'){rotateTray(i);return;}
    G.drag={ti:i,x:p.x,y:p.y,sx:p.x,sy:p.y,touch:e.pointerType!=='mouse',moved:false,ghost:null};try{cv.setPointerCapture(e.pointerId);}catch(x){}SND.pick();kick();return;}
  const c=cellAt(p);if(c&&G.sel>=0&&!G.st.over)tapPlace(c.r,c.c);});
cv.addEventListener('pointermove',e=>{if(!G||!G.drag)return;const d=G.drag,p=ptOf(e);d.x=p.x;d.y=p.y;if(Math.hypot(d.x-d.sx,d.y-d.sy)>9){d.moved=true;if(G.sel===d.ti)G.sel=-1;}if(d.moved)d.ghost=snap(d);kick();});
function dragEnd(e,cancel){if(!G||!G.drag)return;const d=G.drag;G.drag=null;
  if(!cancel&&d.moved&&d.ghost){doPlace(d.ti,d.ghost.r,d.ghost.c);return;}
  if(!cancel&&!d.moved){G.sel=G.sel===d.ti?-1:d.ti;if(G.sel>=0)tipOnce('tap',L('Теперь коснись поля — куда поставить фигуру. Или просто перетащи её.','Now tap the board where to put it. Or just drag it.'),4500);kick();return;}
  if(d.moved){const tl=pieceTL(d);G.back={ti:d.ti,x:tl.x,y:tl.y,t0:performance.now()};SND.back();}kick();}
cv.addEventListener('pointerup',e=>dragEnd(e,false));
cv.addEventListener('pointercancel',e=>dragEnd(e,true));
cv.addEventListener('lostpointercapture',()=>{if(G&&G.drag)dragEnd(null,true);});
// касанием: фигура встаёт так, чтобы её середина была в выбранной клетке (или рядом, если так не влезает)
function tapSpot(ti,r,c){const p=G.st.tray[ti];if(!p)return null;const v=VARS[p.v],r0=r-Math.floor((v.h-1)/2),c0=c-Math.floor((v.w-1)/2);let best=null;
  for(let dr=-2;dr<=2;dr++)for(let dc=-2;dc<=2;dc++){const rr1=r0+dr,cc1=c0+dc;if(!canPlace(G.st,ti,rr1,cc1))continue;
    const covers=v.cs.some(q=>rr1+q[0]===r&&cc1+q[1]===c),dist=Math.abs(dr)+Math.abs(dc)+(covers?0:10);if(!best||dist<best.d)best={r:rr1,c:cc1,d:dist};}
  return best&&best.d<10?best:null;}
function tapPlace(r,c){const ti=G.sel;if(!G.st.tray[ti])return;const best=tapSpot(ti,r,c);
  if(best)doPlace(ti,best.r,best.c);else{SND.no();toast(L('Сюда не встаёт','It does not fit here'));}}
const PRAISE=()=>['',L('Хорошо!','Good!'),L('Отлично!','Great!'),L('Здорово!','Awesome!'),L('Великолепно!','Superb!'),L('Невероятно!','Incredible!')];
function doPlace(ti,r,c){const st=G.st,p=st.tray[ti];if(!p)return;const v=VARS[p.v],now=performance.now();
  const res=place(st,ti,r,c);if(!res){SND.no();return;}
  G.sel=-1;G.hint=null;G.idleT=now;if(G.tool==='rot')G.tool=null;updBoost();$('tip').classList.remove('on');
  G.placed={ks:res.cells.filter(k=>st.b[k]),t0:now};SND.place();buzz(12);
  const cx=LY.bx+(c+v.w/2)*LY.cs,cy=LY.by+(r+v.h/2)*LY.cs;
  if(res.n){SND.clear(res.n,res.combo);buzz(res.n>1?45:25);
    res.clr.forEach(x=>{const dl=Math.hypot((x.k>>3)-(r+v.h/2-.5),(x.k&7)-(c+v.w/2-.5))*26;x.dl=dl;G.flashes.push({k:x.k,col:x.col,it:x.it,t0:now+dl});if(x.it)flyItem(x.k,x.it,dl);});
    burst(res.clr,now);
    const pr=PRAISE(),mid=LY.bx+LY.B/2,my=LY.by+LY.B*.42;
    if(res.allClear)pop(L('Чисто!','Clean!'),mid,my,{size:Math.round(LY.cs*1.05),c:'#8ce99a',big:1,dur:1300});
    else if(res.n>=2)pop(pr[Math.min(5,res.n-1)],mid,my,{size:Math.round(LY.cs*.95),c:'#ffd43b',big:1,dur:1100});
    if(res.combo>=2)pop(L('Серия ×','Streak ×')+res.combo,mid,my+LY.cs*(res.n>=2||res.allClear?.95:0),{size:Math.round(LY.cs*.75),c:'#ff922b',big:1,dur:1100,delay:res.n>=2?120:0});
    if(res.n>=3&&!calm())G.shake=now;
    if(!calm()&&(res.n>=3||res.allClear||res.combo>=4)){G.flash=now;G.zoom=now;} /* большая комбинация: вспышка поля и короткое приближение (аудит 36) */
    /* аудит release-f №3: реплика во время игры — коротко (1,7 с) и не чаще раза в 3 фигуры, чтобы не закрывать чипы цели */
    if(!G.tut&&st.moves-(G.sayM||-9)>=3){const t=res.allClear?['clean','wow']:res.n>=3?['big','wow']:res.combo>=3&&res.combo%2===1?['combo','happy']:null;if(t){G.sayM=st.moves;say(phr(G.host,t[0]),t[1],1700);}}}
  pop('+'+res.pts,cx,cy,{size:Math.round(LY.cs*(res.pts>=50?.62:.5))});
  if(res.dealt){G.dealT=now+120;setTimeout(()=>SND.deal(),140);}
  if(G.mode==='endless'&&(S.best||0)>0&&st.score>S.best&&!G.rec){G.rec=true;SND.record();pop(L('Новый рекорд!','New best!'),LY.bx+LY.B/2,LY.by+LY.B*.25,{size:Math.round(LY.cs*.8),c:'#ffd43b',big:1,dur:1600,delay:300});say(phr(G.host,'record'),'wow');}
  const fill=st.b.filter(x=>x).length;if(fill>=42&&!st.over&&now-G.tight>25000&&Math.random()<.5){G.tight=now;say(phr(G.host,'tight'),'wow');}
  setHud();if(G.mode==='endless')saveRun();
  if(G.tut)tutStep(res);
  if(!G.hi&&G.mode!=='endless'&&!G.tut){G.hi=1;goalHide();const my=G;setTimeout(()=>{if(G===my&&!$('bub').classList.contains('on')&&!G.st.over)say(phr(G.host,'start'),'happy');},700);}
  afterMove();curSave();kick();}
function afterMove(){const st=G.st;if(st.won){G.busy=true;const my=G;setTimeout(()=>{if(G===my)levelWon();},800);}else if(st.lost)lostSeq();}
function lostSeq(){if(!G)return;G.busy=true;G.tool=null;G.hint=null;updBoost();const my=G;setTimeout(()=>{if(G!==my)return;G.curtain={t0:performance.now()};SND.lose();kick();},350);
  setTimeout(()=>{if(G===my){G.curtain=null;showLose();}},1350);}

/* ---- помощники (только «Приключение» с 4-го уровня и задание дня): подсказка, поворот, новые фигуры, бомба ---- */
const BOOST={hint:{p:15,n:'Подсказка',en:'Hint',ic:'💡'},rot:{p:20,n:'Поворот',en:'Rotate',ic:'🔄'},new:{p:30,n:'Новые фигуры',en:'New pieces',ic:'🔀'},bomb:{p:40,n:'Бомба',en:'Bomb',ic:'💣'}};
function boostOn(){return !!G&&G.mode!=='endless'&&(G.mode==='daily'||G.cfg.i>=4);}
function updBoost(){const b=$('boost');b.classList.toggle('hide',!boostOn());
  b.querySelectorAll('button').forEach(x=>{const k=x.dataset.b,f=S.free[k]||0,i=x.querySelector('i'),paid=G&&G.paid[k];i.className=f||paid?'free':'';i.textContent=paid?'✓':f?'×'+f:BOOST[k].p;x.classList.toggle('on',!!(G&&G.tool===k));});}
$('boost').querySelectorAll('button').forEach(x=>x.onclick=()=>boostClick(x.dataset.b));
function boostClick(k){if(!G||!boostOn()||G.busy&&!G.st.lost||modalOn)return;SND.tap();
  if(G.tool===k){G.tool=null;updBoost();kick();if(G.st.lost&&noMoves(G.st))showLose();return;}
  if(G.st.won)return;
  if(G.paid[k]){useBoost(k);return;}
  if((S.free[k]||0)>0){S.free[k]--;save();G.paid[k]=1;useBoost(k);return;}
  const B1=BOOST[k],enough=S.coins>=B1.p,ad=adBtnOk();

  modal(`<h2>${B1.ic} ${L(B1.n,B1.en)}</h2><p>${boostDesc(k)}</p>${enough?'':'<p>'+L('Не хватает монет: нужно ','Not enough coins: need ')+coinsTxt(B1.p)+'</p>'}
    <div class="row">${ad?`<button class="btn accent noenter" id="bAd">📺 ${L('Бесплатно за рекламу','Free for an ad')}</button>`:''}${enough?`<button class="btn green buy noenter" id="bCoin">${L('За ','For ')}${coinsTxt(B1.p)}</button>`:''}<button class="btn" id="mCancel">${L('Отмена','Cancel')}</button>
    ${!enough&&PAY.on?'<button class="btn noenter" id="bShopC" style="font-size:14px;min-height:40px;padding:6px">'+L('купить монеты','buy coins')+'</button>':''}</div>`);
  const back=()=>{hideModal();if(G.st.lost&&!G.tool)showLose();else YG.start();};
  $('mCancel').onclick=back;if($('bCoin'))$('bCoin').onclick=()=>{hideModal();payBoost(k,'coins');};
  if($('bAd'))$('bAd').onclick=()=>{hideModal();showRewarded(()=>payBoost(k,'ad'),()=>{if(G&&G.st.lost)showLose();});};
  if($('bShopC'))$('bShopC').onclick=openCoins;}
function boostDesc(k){return {hint:L('Покажет хороший ход — фигура замигает на поле.','Shows a good move.'),rot:L('Можно поворачивать фигуры в лотке — касанием, пока не поставишь следующую.','Tap pieces to rotate them until the next placement.'),
  new:L('Три новые фигуры вместо тех, что в лотке.','Three new pieces instead of the current ones.'),bomb:L('Уберёт кирпичики в квадрате 3×3 — вместе с предметами и старыми кирпичами.','Clears a 3×3 square, items and old bricks included.')}[k];}
function payBoost(k,how){if(!G)return;if(how==='coins'){if(S.coins<BOOST[k].p){SND.no();return;}setCoins(S.coins-BOOST[k].p);SND.coin();}G.paid[k]=1;YG.start();useBoost(k);}

  if(k==='hint'){delete G.paid.hint;const m=botMove(st);if(!m){toast(L('Ходов нет — попробуй другого помощника','No moves — try another helper'));G.paid.hint=1;}else{G.hint={ti:m.ti,r:m.r,c:m.c};G.sel=-1;}updBoost();kick();return;}
  if(k==='new'){delete G.paid.new;redeal(st);G.dealT=performance.now();SND.deal();G.hint=null;G.busy=false;hideModal();updBoost();curSave();kick();if(st.lost)lostSeq();else YG.start();return;}
  if(k==='rot'){G.tool='rot';G.busy=false;hideModal();tip(L('Касайся фигур внизу — они будут поворачиваться','Tap the pieces below to rotate them'),3500);updBoost();kick();return;}
  if(k==='bomb'){G.tool='bomb';G.busy=false;hideModal();tip(L('Коснись поля: бомба уберёт кирпичики 3×3','Tap the board: the bomb clears 3×3'),3500);updBoost();kick();}}

// сочная победа (аудит 36): звёзды по одной со звоном, монеты «накручиваются» и летят в счётчик, полоска главы; в спокойном режиме — сразу

  let n=0;const steps=Math.min(coins,20),t0=250+stars*300;clearInterval(winJuice._c);
  setTimeout(()=>{if(G!==my)return;winJuice._c=setInterval(()=>{n++;const v=Math.round(coins*n/steps);if(w.isConnected&&!G.x2)w.textContent='+'+coinsTxt(v);

const CKEY='kirpichiki-cur';
function curSave(){if(!G||G.mode==='endless'||window.__demo)return;const st=G.st;
  try{if(st.over){localStorage.removeItem(CKEY);return;}
    localStorage.setItem(CKEY,JSON.stringify({v:1,mode:G.mode,i:G.cfg.i||0,day:G.day||0,t:Date.now(),b:st.b,it:st.it,old:st.old,tray:st.tray.map(p=>p&&{v:p.v,it:p.it,ik:p.ik}),
      score:st.score,combo:st.combo,since:st.since,moves:st.moves,lines:st.lines,got:st.got,oldLeft:st.oldLeft,deals:st.deals,redeals:st.redeals,life:st.life,d:st.d,rs:st.R.st(),
      la:G.lifeAd?1:0,paid:G.paid,hi:G.hi?1:0}));}catch(e){}}
function curClear(){try{localStorage.removeItem(CKEY);}catch(e){}}
function curLoad(){try{const o=JSON.parse(localStorage.getItem(CKEY)||'null');
  if(!o||o.v!==1||!Array.isArray(o.b)||o.b.length!==64||!Array.isArray(o.tray)||o.tray.length!==3||Date.now()-o.t>7*864e5)return null;
  if(o.mode==='level'&&!(o.i>=1&&o.i<=S.unlocked))return null;if(o.mode==='daily'&&o.day!==dayKey(0))return null;if(o.mode!=='level'&&o.mode!=='daily')return null;
  if(o.tray.some(p=>p&&!VARS[p.v]))return null;return o;}catch(e){return null;}}
function curResume(o){try{const cfg=o.mode==='daily'?dailyCfg(o.day):levelCfg(o.i),st=newGame(cfg,1);
  const arr=(a,f)=>Array.isArray(a)&&a.length===64?a.map(x=>+x||0):f;st.b=arr(o.b,st.b);st.it=arr(o.it,st.it);st.old=arr(o.old,st.old);
  st.tray=o.tray.map(p=>p?{v:p.v,it:+p.it,ik:+p.ik||0}:null);st.got=isObj(o.got)?o.got:{};
  for(const f of ['score','combo','since','moves','lines','oldLeft','deals','redeals','life'])st[f]=+o[f]||0;st.d=+o.d||st.d;st.R=mkR(+o.rs||1);
  st.over=st.lost=st.won=false;checkEnd(st);if(st.over){curClear();return false;}
  begin(o.mode,cfg,st,o.mode==='daily'?o.day:undefined);if(!G)return false;G.lifeAd=!!o.la;G.paid=isObj(o.paid)?o.paid:{};G.hi=!!o.hi;goalHide();updBoost();
  toast(L('Продолжаем с того же места','Picking up where you left off'),2200);return true;}catch(e){curClear();return false;}}

/* ---- серия дней: заходи каждый день — награда растёт (7 дней по кругу) ---- */
const STREAK=[10,10,15,15,20,25,60];
function streakState(){const s=S.streak||{day:0,last:0,cyc:0},t=dayKey(0);
  if(s.last===t)return{claimed:true,day:s.day};
  return{claimed:false,day:s.day>0?s.day%7+1:1};} /* boost: подарки не сгорают — пропущенный день не обнуляет, продолжаем с того же места */
function maybeStreak(){if(G||window.__demo||$('modal').classList.contains('on')||$('ad').classList.contains('on'))return;
  const st=streakState();if(st.claimed||(S.wins||0)<1)return;
  if(st.day===1)claimStreak(1,true);else showStreak();}
function showStreak(){const st=streakState();let cells='';
  for(let d=1;d<=7;d++){const done=st.claimed?d<=st.day:d<st.day,today=!st.claimed&&d===st.day;
    cells+=`<div class="sd ${done?'done':''} ${today?'today':''} ${d===7?'d7':''}"><small>${L('День ','Day ')}${d}</small><span class="ic">${d===7?'🎁':'💰'}</span>+${STREAK[d-1]}${d===7?'<small>'+L('и 💣 бомба','and a 💣 bomb')+'</small>':''}</div>`;}
  const r=st.claimed?0:STREAK[st.day-1];
  modal(`<h2>${L('Подарки за вход','Daily gifts')} 🎁</h2><p>${st.claimed?L('Сегодняшний подарок уже ваш. Заходите завтра — день ','Today’s gift is yours. Come back tomorrow — day ')+(st.day%7+1)+'!':L('Каждый день, когда заходите, — подарок, на 7-й ещё и бомба. Пропустили день — подарки не сгорают, продолжим с того же места.','Each day you visit brings a gift; day 7 adds a bomb. Missed a day? Gifts do not burn — we go on from where you were.')}</p>
    <div class="streak">${cells}</div>
    <div class="row">${st.claimed?'<button class="btn" id="sClose">'+L('Закрыть','Close')+'</button>':`${adBtnOk()?`<button class="btn accent noenter" id="sX2">📺 ×2 ${L('за рекламу','for an ad')} (+${coinsTxt(r*2)})</button>`:''}<button class="btn green" id="sGet">${L('Забрать','Take')} +${coinsTxt(r)}</button>`}</div>`);
  if(st.claimed){$('sClose').onclick=hideModal;return;}
  $('sGet').onclick=()=>claimStreak(1);
  if($('sX2'))$('sX2').onclick=()=>{hideModal();showRewarded(()=>claimStreak(2),()=>showStreak());};}
function claimStreak(mult,quiet){const st=streakState();if(st.claimed){hideModal();return;}
  const c=STREAK[st.day-1],s=S.streak||{cyc:0};S.streak={day:st.day,last:dayKey(0),cyc:(s.cyc||0)+(st.day===7?1:0)};
  if(st.day===7)S.free.bomb=(S.free.bomb||0)+1;
  S.coins+=c*mult;save();updCoins();SND.coin();setTimeout(()=>SND.win(),200);updStreakDot();
  if(quiet){toast(L('🎁 Подарок за вход: +','🎁 Daily gift: +')+coinsTxt(c)+L('. Завтра — ещё!','. More tomorrow!'),3500);return;}
  modal(`<h2>${st.day===7?L('Неделя подряд!','A whole week!')+' 🏆':L('День ','Day ')+st.day+' ✓'}</h2><p class="coins-won">+${coinsTxt(c*mult)}${mult>1?' <small>(×2)</small>':''}</p>
    ${st.day===7?'<p class="goal tipl">💣 '+L('И бесплатная бомба — в помощниках','And a free bomb in helpers')+'</p>':''}
    <p>${st.day<7?L('Завтра — день ','Tomorrow — day ')+(st.day+1)+': +'+coinsTxt(STREAK[st.day]):L('Серия начнётся заново — и снова с подарками!','The streak starts again — with gifts again!')}</p>
    <div class="row"><button class="btn green" id="sOk">${L('Отлично!','Great!')}</button></div>`);$('sOk').onclick=()=>{hideModal();renderMenu();};}
function updStreakDot(){const b=$('bStreak');b.innerHTML='🎁<small>'+L('Подарок','Gift')+'</small>'+(streakState().claimed||(S.wins||0)<1?'':'<span class="dot"></span>');}
