/* ===== boost: карта — регионы с пейзажами, дорога, машинка игрока; фон для компьютера ===== */
.reg{position:relative;border-radius:22px;margin:8px -8px 12px;padding:2px 8px 8px}
.reg0{background:linear-gradient(rgba(214,240,170,.62),rgba(150,205,120,.62))}
.reg1{background:linear-gradient(rgba(196,228,222,.7),rgba(126,178,160,.66))}
.reg2{background:linear-gradient(rgba(178,222,246,.72),rgba(116,178,220,.66))}
.reg3{background:linear-gradient(rgba(255,232,176,.74),rgba(244,190,126,.68))}
.reg4{background:linear-gradient(rgba(214,202,244,.72),rgba(160,150,214,.66))}
.reg .region{margin-top:8px}
#mapReg{text-align:center;font-weight:900;font-size:14.5px;color:#2d5b77;padding:0 12px 5px;min-height:27px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#mapReg span{background:rgba(255,255,255,.9);padding:4px 14px;border-radius:999px;box-shadow:0 2px 0 rgba(0,0,0,.08)}
.node-row .sc{position:absolute;bottom:8px;width:21%;max-width:96px;height:66px;pointer-events:none;opacity:.92}
.node-row .sc svg{display:block;width:100%;height:100%}
.node-row.l .sc{left:0}.node-row.r .sc{right:0}
.node-row:not(:last-child)::after{border-left:0;width:13px;height:50px;top:60px;border-radius:7px;background-color:#77818c;background-image:repeating-linear-gradient(rgba(255,255,255,.95) 0,rgba(255,255,255,.95) 7px,rgba(255,255,255,0) 7px,rgba(255,255,255,0) 13px);background-size:3px 100%;background-position:center;background-repeat:no-repeat;box-shadow:0 2px 0 rgba(0,0,0,.18)}
.node-row.l::after{left:calc(22% + 24px)}.node-row.r::after{right:calc(22% + 24px)}
.node .mycar{position:absolute;left:50%;top:-25px;width:58px;height:34px;margin-left:-29px;pointer-events:none;filter:drop-shadow(0 2px 2px rgba(0,0,0,.3))}
.chest.pop{animation:bump .45s}

/* ===== компьютер, широкое окно (заход 2): двор во всю высоту справа, панели — колонкой слева; карта — меню слева, дорога справа; гараж — в 4 столбца.
   Низкое альбомное окно (≤640 px по высоте) — своё правило выше, оно не меняется ===== */
@media (min-width:860px) and (min-height:641px) and (min-aspect-ratio:1/1){
  #app{max-width:1100px;max-width:min(1280px,calc(88vh + 320px));box-shadow:0 0 50px rgba(0,0,0,.18)}
  #scr-game.on{display:grid;grid-template-columns:310px 1fr;grid-template-rows:auto 1fr auto}
  #scr-game .gh{grid-column:1;grid-row:1;flex-wrap:wrap;align-content:flex-start;padding:14px 8px 6px 14px}
  #scr-game .gt{flex:1 1 200px}
  #scr-game .gt>div:first-child{font-size:21px}
  #scr-game .gh-r{order:5;flex:1 1 auto;flex-direction:row;justify-content:flex-start;gap:12px;align-items:center;margin-top:6px}
  #scr-game #zIn,#scr-game #gSet{order:6;margin-top:6px}
  #scr-game .gh-r .hearts{font-size:26px}
  #scr-game .gh-r .pill.sm{font-size:17px;padding:6px 14px}
  #scr-game .gside{display:block;grid-column:1;grid-row:2;padding:6px 8px 6px 14px;overflow:hidden;align-self:start}
  #scr-game .stage{grid-column:2;grid-row:1/4}
  #scr-game .gf{grid-column:1;grid-row:3;flex-direction:column;justify-content:flex-end;padding:8px 8px 16px 14px}
  #scr-game .gf .btn,#scr-game .gf .btn.sq{flex:0 0 auto;width:100%}
  #scr-game .gf .btn.sq{flex-direction:row;justify-content:center;gap:8px;padding:12px 0}
  #scr-game .gf .btn.sq small{font-size:16px}
  #scr-game .btn.bst{padding:12px 6px;font-size:17px}
  #scr-game .btn.bst small{font-size:15px}
  .gside .shura{margin:4px 0 8px}.gside .goal,.gside .tmr{font-size:14.5px;background:rgba(255,255,255,.88);border-radius:12px;padding:8px 10px;margin:8px 0 0!important;text-align:left}
  .gside .keys{font-size:13px;color:#2d5b77;font-weight:700;margin:10px 2px 0;line-height:1.5}#scr-game.dark .gside .keys{color:#e3ebff}
  #scr-map.on{display:grid;grid-template-columns:300px 1fr;grid-template-rows:auto auto auto 1fr}
  #scr-map .mh{grid-column:1;grid-row:1;flex-wrap:wrap;padding:16px 10px 8px 16px}
  #scr-map .mh .logo{flex:1 1 100%;font-size:24px;margin-bottom:10px}#scr-map .logo .lc{display:inline}
  #scr-map .hdr-r{flex:1;justify-content:space-between}
  #scr-map #mToday{grid-column:1;grid-row:2;margin:6px 10px 6px 16px;align-self:start}
  #scr-map .mnav{grid-column:1;grid-row:3;flex-direction:column;background:none;-webkit-backdrop-filter:none;backdrop-filter:none;padding:6px 10px 10px 16px;align-self:start}
  #scr-map .mnav .btn,#scr-map .mnav .btn.sq{flex:0 0 auto;width:100%;min-height:56px;font-size:17px;padding:12px 10px}
  #scr-map .mnav .btn.sq{display:flex;flex-direction:row;align-items:center;justify-content:center;gap:8px}#scr-map .mnav .btn.sq small{font-size:17px}
  #scr-map .mnav .btn.locked small{display:inline;margin-left:6px}
  #scr-map .gside{display:block;grid-column:1;grid-row:4;padding:4px 10px 10px 16px;align-self:start}
  #scr-map #mapReg{grid-column:2;grid-row:1;align-self:end;padding-top:16px;font-size:16px}
  #scr-map .map-scroll{grid-column:2;grid-row:2/5;padding:6px 24px 24px}
  #scr-map .route,#scr-map .soon{max-width:600px;margin-left:auto;margin-right:auto}
  .gar-grid{grid-template-columns:repeat(4,1fr);padding:14px 24px 28px;gap:14px}
  .gcard canvas{height:96px}
  @supports not (inset:0){#scr-game .gf>*+*,#scr-map .mnav>*+*{margin-left:0;margin-top:10px}}
}
/* ===== boost: гараж — вкладки, наборы, «Уют двора» ===== */
.gtabs,.gsets,.gnote{grid-column:1/-1}
.gtabs{display:flex;gap:10px}.gtabs .btn{flex:1;padding:10px 6px;font-size:15.5px;position:relative;min-width:0}
.gtabs .btn.on{outline:none;background:linear-gradient(#ffe9a8,#ffd36e);box-shadow:0 4px 0 #c8741d,0 6px 14px rgba(0,0,0,.12)}
.gtabs .dot,.mnav .btn .dot{position:absolute;top:4px;right:6px;width:10px;height:10px;border-radius:50%;background:#ff4757;box-shadow:0 0 0 2px #fff}
.mnav .btn{position:relative}
.gnote{margin:0}
.gsets h3{margin:6px 0 2px;font-size:17px;color:#1f3b57;text-shadow:0 1px 0 rgba(255,255,255,.7)}
.gset{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:14px;padding:8px 12px;margin-top:8px;box-shadow:0 3px 0 #d9d2bf;text-align:left;min-height:52px}
.gset span{flex:1;min-width:0;font-weight:700}.gset small{display:block;color:#57606f;font-weight:600;font-size:13.5px}
.gset>i{font-style:normal;font-weight:800;color:#57606f;white-space:nowrap;font-size:14.5px}.gset.got{opacity:.7}.gset.got>i{color:#2b8a3e;font-size:20px}
.gset .btn{padding:8px 10px;font-size:14.5px;flex:none;max-width:56%}
.gcard.dec canvas{height:74px}.gcard .pr{display:block;margin-top:4px;font-weight:800;color:#a4410a}.gcard .pr.ok{color:#2b8a3e}
.gbar{display:block;height:8px;border-radius:4px;background:#e0d6bd;margin:5px 8px 0;overflow:hidden}.gbar u{display:block;height:100%;background:#f0a500;border-radius:4px}
#scr-garage .gh .pill{flex:none}
@supports not (inset:0){.gtabs>*+*,.gset>*+*{margin-left:10px}}
/* ===== boost (02.10): баба Шура, «Завтра», гостинцы, календарь задания дня, летящие монеты ===== */
.shura{display:flex;align-items:center;gap:10px;text-align:left;margin:8px 0}
.shura .pf{flex:none;width:52px;height:52px;border-radius:50%;box-shadow:0 2px 0 #d9c7a3;overflow:hidden;background:#ffe9c9}
.shura .pf svg{display:block;width:100%;height:100%}
.shura .sb{flex:1;min-width:0;margin:0!important;background:#fff;border:2px solid #eadfc8;border-radius:14px;padding:7px 10px;font-size:14.5px;line-height:1.3;color:#2d3436!important;font-weight:600}
.shura .nm{display:block;font-size:12.5px;color:#b0306a;font-weight:800}
.tmr{background:#eaf4fb;border-radius:12px;padding:7px 10px;font-size:14.5px;margin:8px 0 2px!important;color:#1f3b57!important;font-weight:700;line-height:1.3}
.tmr b{color:#0b5cab}
.newcar.tmrc{background:#eaf4fb}.newcar.tmrc p{color:#1f3b57;font-size:14.5px}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:10px 0 4px}
.wk div{background:#f1ede2;border-radius:10px;padding:5px 0 3px;font-size:12.5px;font-weight:800;color:#57606f;line-height:1.2}
.wk i{display:block;font-style:normal;font-size:16px;height:21px;line-height:21px}
.wk .ok{background:#c8efcf;color:#2b7a3f}.wk .now{box-shadow:inset 0 0 0 2px #ff9f43;background:#fff3d6;color:#3a2206}.wk .ok.now{background:#c8efcf;color:#2b7a3f}.wk .fut{opacity:.6}
.wkb{font-size:13.5px!important;margin:4px 0!important}.wkb span{white-space:nowrap;display:inline-block;margin:0 4px}.wkb .got{color:#2b7a3f;font-weight:800}
.tday{display:flex;align-items:center;gap:8px;margin:0 12px 8px;padding:8px 12px;min-height:46px;border-radius:14px;background:rgba(255,255,255,.93);font-weight:700;font-size:14.5px;line-height:1.25;text-align:left;box-shadow:0 3px 0 rgba(0,0,0,.12);color:#1f3b57}
.tday span{flex:1;min-width:0}.tday>i{font-style:normal;font-size:22px;font-weight:900;opacity:.5}
.tday.hot{background:linear-gradient(#fff0b8,#ffd36e);color:#3a2206;box-shadow:0 3px 0 #c8741d}
.swd{display:inline-block;width:20px;height:20px;border-radius:50%;box-shadow:0 0 0 2px #fff,0 1px 4px rgba(0,0,0,.35);vertical-align:-3px}
.fire{white-space:nowrap}
.mnav .btn.sq .fl{position:absolute;top:-9px;left:-6px;background:#ff7a45;color:#fff;border-radius:999px;font-size:12px;font-weight:900;padding:2px 6px;box-shadow:0 0 0 2px #fff;line-height:1.2}
.btn.coinb{background:#fff;color:#a4410a;border:2px solid #e0763f;box-shadow:0 4px 0 #c7c1b0}
.card.tight{padding-top:14px}.card.tight h2{font-size:21px}.card.tight .big-stars{font-size:34px;margin:2px 0}.card.tight .row{margin-top:8px;gap:8px}.card.tight p{margin:4px 0}.card.tight .goal,.card.tight .tmr{font-size:13.5px;margin:5px 0 0!important}.card.tight .coins-won{font-size:24px}.card.tight .btn{padding-top:9px;padding-bottom:9px}.card.tight .shura{margin:4px 0}
.fc{position:absolute;z-index:30;left:0;top:0;font-style:normal;font-size:22px;line-height:1;pointer-events:none}
.pill.bump{animation:bump .35s}
@keyframes bump{40%{transform:scale(1.18)}}
body.calm .pill.bump{animation:none}
@supports not (inset:0){.shura>*+*,.tday>*+*{margin-left:10px}}
/* pre: ролик за награду ещё грузится — значок ⏳ в углу кнопки (раскладку не меняет, нажать можно) */
button[data-adwait]{position:relative}
button[data-adwait]::after{content:"⏳";position:absolute;top:4px;right:7px;font-size:16px;line-height:1;pointer-events:none}
</style>

html,body{font-family:Rubik,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:linear-gradient(#bfe8f6,#e9f7ff 30%,#b9e79a);-webkit-font-smoothing:antialiased}

.ei{display:inline-block;width:1.2em;height:1.2em;vertical-align:-.24em;background-position:center;background-repeat:no-repeat;background-size:contain;overflow:hidden;text-indent:-9em;white-space:nowrap;font-style:normal;line-height:1;letter-spacing:0;text-shadow:none}
.big-stars .e .ei,.hearts .off .ei{-webkit-filter:grayscale(1);filter:grayscale(1);opacity:.35}
.hearts .off{-webkit-filter:none;filter:none;opacity:1}

// монеты — облачные + то, что изменилось на устройстве после «точки отсчёта» (если облако новее); настройки — из более нового
function mergeSave(d,ref){if(!isObj(d))return;
  const dt=typeof d.ts==='number'?d.ts:0,rt=ref==null?BOOT_TS:ref,newer=dt>rt;
  if(typeof d.unlocked==='number')S.unlocked=Math.max(S.unlocked,d.unlocked);if(typeof d.levelsDone==='number')S.levelsDone=Math.max(S.levelsDone||0,d.levelsDone);
  for(const f of ['stars','daily','chest','yard','gp','dw','dec','sets'])if(isObj(d[f])){if(!isObj(S[f]))S[f]={};for(const k in d[f])if(typeof d[f][k]==='number')S[f][k]=Math.max(S[f][k]||0,d[f][k]);}
  if(Array.isArray(d.garage))for(const i of d.garage)if(typeof i==='number'&&!S.garage.includes(i))S.garage.push(i);
  if(typeof d.coins==='number')S.coins=newer?Math.max(0,d.coins+(S.coins-BOOT_COINS)):(dt===rt&&!dt)?Math.max(S.coins,d.coins):S.coins;
  for(const k in d)if(k!=='soc'&&k!=='stc'&&(!(k in S)||newer&&!/^(ts|unlocked|levelsDone|stars|daily|chest|yard|gp|dw|dec|sets|garage|coins|streak|buy|buyB|payT|payV|soc|stc)$/.test(k)))S[k]=d[k]; // флажки (звук, подсказки)
  payMerge(d); // покупки — объединение
  if(isObj(d.stc))STAT.merge(d.stc); // статистика: день установки, число сеансов — раньше/больше
  if(isObj(d.soc))SOC.merge(d.soc); // «Друзья и игры»: сливаем в тот же объект S.soc (модуль держит на него ссылку)
  if(isObj(d.streak)){const a=S.streak,b=d.streak;
    if(!isObj(a))S.streak={day:b.day||0,last:b.last||0,cyc:b.cyc||0};
    else{const m=giftCnt(b)>giftCnt(a)?b:a;S.streak={day:m.day||0,last:Math.max(a.last||0,b.last||0),cyc:m.cyc||0};}}}

  var OKP=/[?&](vk_client=ok|vk_platform=[a-z_]*_ok|ok=1)(&|$)/.test(location.search),OKWEB=PF.indexOf('web')>=0;

  function tx(ru,en){return typeof LANG!=='undefined'&&LANG==='en'?en:ru;} // VK всегда по-русски; обёртка — по правилам игр

  // STAT v1.2 (А15): итог предложения площадки → soc {a: fav|home|inv|grp|shr|more, r: show|ok|no|err}; отказ игрока (код 4 / «denied») — no
  function sx(a,r){try{if(typeof STAT!=='undefined'&&STAT.ev)STAT.ev('soc',{a:a,r:r});}catch(e){}}
  function sr(a){return function(e){var d=e&&e.error_data||{};sx(a,d.error_code===4||/denied|cancel/i.test(String(d.error_reason||d.error_msg||''))?'no':'err');};}
  function due(k){var x=st[k]||{};return !x.d&&(x.n||0)<3&&(!x.t||Date.now()-x.t>30*DAY);}

  /* SOC.init(S, {save, toast, cls, modal, close}) — один раз при запуске, после загрузки сохранения (считает сессии).
     cls — классы кнопок (по умолчанию 'btn noenter': Enter их не жмёт); modal(html) — показать окно игры и вернуть его

  function init(S,opt){O=opt||{};if(!S.soc||typeof S.soc!=='object')S.soc={};st=S.soc;
    st.ses=(st.ses||0)+1;if(!OKP&&qp('vk_is_favorite')==='1')st.fav={d:1};saveFn();ready();}
  // после VKWebAppInit (мост готов): узнать, можно ли значок на экран (только Android)
  function ready(){if(readyOn||!ok())return;readyOn=true;
    if(!OKP&&PF.indexOf('android')>=0)vkSend('VKWebAppAddToHomeScreenInfo',{},4000).then(function(r){

  // облако: вызвать из слияния сохранений игры — SOC.merge(d.soc); сессии — максимум, «сделано» — навсегда, попытки — больше/позже
  function merge(d){if(!d||typeof d!=='object')return;

  // --- действия (кнопки в ⚙ жмёт сам игрок; ограничений частоты нет, наград нет) ---

  function home(){return send('VKWebAppAddToHomeScreen').then(function(r){if(r&&r.result){done('home');homeOk=false;}sx('home',r&&r.result?'ok':'no');return !!(r&&r.result);},function(e){sr('home')(e);tried('home');return false;});}
  // «Приведи друга» (модуль REF, если он есть в игре и включён): вместо окна приглашения — ссылка с меткой #ref=<id>,
  // иначе друг, открывший игру с телефона, не засчитается (окно приглашения передаёт автора только на сайте ВК)
  function refOn(){return typeof REF!=='undefined'&&!!REF&&typeof REF.on==='function'&&REF.on();}
  // ОК: ссылка REF ведёт на vk.com — не годится; окно приглашения, message обязателен на сайте и в мобильном браузере ОК
  function invite(){if(OKP)return send('VKWebAppShowInviteBox',{message:O.okMsg||tx('Заходи в игру — посоревнуемся!','Come and play — let us compete!')}).then(function(r){if(r&&r.success!==false)done('inv');sx('inv',r&&r.success!==false?'ok':'no');return true;},function(e){sr('inv')(e);tried('inv');return false;});

    return send('VKWebAppShowInviteBox').then(function(r){if(r&&r.success!==false)done('inv');sx('inv',r&&r.success!==false?'ok':'no');return true;},function(e){sr('inv')(e);tried('inv');return false;});}
  function share(){if(OKP&&!O.okLink)return Promise.resolve(false);

  function open(g){if(OKP&&!(g.ok&&OKWEB))return Promise.resolve(false); // ОК: OpenApp есть только на сайте и в мобильном браузере
    return send('VKWebAppOpenApp',OKP?{app_id:g.ok,app_is_local:true}:{app_id:g.id,location:'from='+APP}).then(function(){return true;},function(){
    toastFn(tx('Найдите «'+g.t+'» в разделе «Игры»','Find "'+g.t+'" in the Games section'));return false;});}

  // --- список «Ещё игры»: без себя, без 18+, без неопубликованных на этой площадке; сначала родственные, дальше — сдвиг по дню ---
  function list(n){var m=me(),mg=m?m.g:'',out=[],i,g,day=Math.floor(Date.now()/DAY);
    for(i=0;i<N;i++){g=GAMES[i];if(g.id===APP||g.a>=18)continue;

    out.sort(function(a,b){var x=(b.g===mg)-(a.g===mg);if(x)return x;return ((a.i+day)%N)-((b.i+day)%N);});

  function css(){if(document.getElementById('socCss'))return;var s=document.createElement('style');s.id='socCss';

  function offer(wins,busy){if(!ok()||asked||busy||(st.ses||0)<2||Date.now()-T0<120000)return null;

  const k=Math.max(3,Math.min(8,Math.round(n/4))),x0=a.left+a.width/2-ar.left-11,y0=a.top+a.height/2-ar.top-11,dx=b.left+b.width/2-ar.left-11-x0,dy=b.top+b.height/2-ar.top-11-y0;

/* ---- зум и перетаскивание: тап срабатывает при отпускании, если палец почти не сдвинулся ---- */
function zoomMax(){return Math.max(1.8,Math.min(3.5,76/cs));}
function camClamp(){cam.z=Math.max(1,Math.min(zoomMax(),cam.z));cam.x=Math.min(0,Math.max(W-W*cam.z,cam.x));cam.y=Math.min(0,Math.max(H-H*cam.z,cam.y));}
// «🔍 Весь двор» — когда приближено; «🔍 Приблизить» — на широких дворах (от 8 клеток), чтобы о зуме знали не только по щипку
function updZoomBtn(){if(cam.z>1.02&&!(G&&G.towMode)){const t=$('tip');if(t.style.display==='block'&&!(G&&!G.daily&&G.idx===0))t.style.display='none';}
  const zin=cam.z>1.02||!!(cam.tw&&cam.tw.z1>1.02);$('zReset').classList.toggle('on',zin);$('zIn').classList.toggle('on',!!G&&G.p.w>=8);}
function zoomAt(sx,sy,z){const wx=(sx-cam.x)/cam.z,wy=(sy-cam.y)/cam.z;cam.tw=null;cam.z=Math.max(1,Math.min(zoomMax(),z));cam.x=sx-wx*cam.z;cam.y=sy-wy*cam.z;camClamp();updZoomBtn();hiResSoon();}
function camTo(z,x,y){if(Math.abs(cam.z-z)<.001&&Math.abs(cam.x-x)<.5&&Math.abs(cam.y-y)<.5)return;cam.tw={t:0,z0:cam.z,x0:cam.x,y0:cam.y,z1:z,x1:x,y1:y};updZoomBtn();}
// после приближения перерисовываем землю детальнее (с ограничением по памяти)
function hiResSoon(){clearTimeout(hiResSoon._t);hiResSoon._t=setTimeout(()=>{if(!G||!ground)return;
  const cap=Math.sqrt(4e6/Math.max(1,cv.width*cv.height)),q=Math.max(1,Math.min(cam.z,2.5,cap)); // земля ≤ 4 млн точек
  if(Math.abs(q-groundQ)>.3)buildGround(q);},250);}
const ptrs=new Map();let gest=null;
function cvPos(e){const r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top};}
cv.addEventListener('pointerdown',e=>{if(!G)return;ac();const p=cvPos(e);ptrs.set(e.pointerId,p);try{cv.setPointerCapture(e.pointerId);}catch(_){}
  if(ptrs.size===1)gest={mode:'tap',sx:p.x,sy:p.y,lx:p.x,ly:p.y};
  else if(ptrs.size===2){const [a,b]=[...ptrs.values()],mx=(a.x+b.x)/2,my=(a.y+b.y)/2;cam.tw=null;
    gest={mode:'pinch',d0:Math.max(10,Math.hypot(a.x-b.x,a.y-b.y)),z0:cam.z,wx:(mx-cam.x)/cam.z,wy:(my-cam.y)/cam.z};}});
cv.addEventListener('pointermove',e=>{if(!ptrs.has(e.pointerId)||!gest)return;const p=cvPos(e);ptrs.set(e.pointerId,p);
  if(gest.mode==='pinch'&&ptrs.size>=2){const [a,b]=[...ptrs.values()],mx=(a.x+b.x)/2,my=(a.y+b.y)/2,d=Math.hypot(a.x-b.x,a.y-b.y);
    cam.z=Math.max(1,Math.min(zoomMax(),gest.z0*d/gest.d0));cam.x=mx-gest.wx*cam.z;cam.y=my-gest.wy*cam.z;camClamp();updZoomBtn();return;}
  if(gest.mode==='tap'&&Math.hypot(p.x-gest.sx,p.y-gest.sy)>(e.pointerType==='mouse'?6:10))gest.mode='pan';
  if(gest.mode==='pan'){cam.tw=null;cam.x+=p.x-gest.lx;cam.y+=p.y-gest.ly;camClamp();}
  gest.lx=p.x;gest.ly=p.y;});
function ptrEnd(e){if(!ptrs.has(e.pointerId))return;const p=cvPos(e);ptrs.delete(e.pointerId);
  if(gest&&gest.mode==='tap'&&e.type==='pointerup'&&ptrs.size===0)tapAt((p.x-cam.x)/cam.z,(p.y-cam.y)/cam.z);
  if(gest&&gest.mode==='pinch'){hiResSoon();if(ptrs.size===1){const q=[...ptrs.values()][0];gest={mode:'pan',lx:q.x,ly:q.y};return;}}
  if(!ptrs.size){if(gest&&gest.mode!=='tap')hiResSoon();gest=null;}}
cv.addEventListener('pointerup',ptrEnd);cv.addEventListener('pointercancel',ptrEnd);
cv.addEventListener('wheel',e=>{if(!G)return;e.preventDefault();const p=cvPos(e),dy=e.deltaMode===1?e.deltaY*16:e.deltaY;zoomAt(p.x,p.y,cam.z*Math.exp(-dy*(e.ctrlKey?.01:.0018)));},{passive:false});
$('zReset').onclick=()=>camTo(1,0,0);
$('zIn').onclick=()=>{if(!G)return;if(cam.z>1.02||(cam.tw&&cam.tw.z1>1.02)){camTo(1,0,0);return;}const z=Math.min(zoomMax(),2);camTo(z,W/2-W/2*z,H/2-H/2*z);};
/* ---- гостинцы бабы Шуры (решение владельца 03.10): считаются ДНИ ЗАХОДА, ничего не сгорает. Пропустил день — следующий заход даёт следующий по счёту гостинец.
   S.streak={day:1..7 (место в недельной лесенке), last:день последнего гостинца, cyc:сколько недель пройдено}; всего взято — giftN() ---- */
const STREAK=[10,10,15,15,20,25,40];
function dayKey(off){const d=new Date(nowMs());d.setDate(d.getDate()+(off||0));return d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate();}
const giftCnt=s=>s?(s.cyc||0)*7+((s.day||0)%7):0; // сколько гостинцев взято (7-й день уже учтён в cyc)
const giftN=()=>giftCnt(S.streak);
function streakState(){const s=S.streak||{day:0,last:0,cyc:0},d=Math.max(0,Math.min(7,s.day||0));
  if(s.last===dayKey(0)&&d>0)return{claimed:true,day:d};
  return{claimed:false,day:d%7+1};}
// мягкий старт: до первого пройденного двора окно не показываем; самый первый гостинец — тихо тостом
function maybeStreak(){if(G||window.__demo||$('modal').classList.contains('on')||$('ad').classList.contains('on'))return;
  const st=streakState();if(st.claimed||(S.levelsDone||0)<1)return;
  if(st.day===1&&!giftN())claimStreak(1,true);else showStreak();}
function streakCar(){return MODELS.findIndex((m,i)=>m.streak&&!S.garage.includes(i));}
// что дают в день day: монеты всегда; на 2-й день — краска «морская волна» (один раз); на 7-й — машина, потом подарочные краски, потом двойные монеты
function streakReward(day){const car=day===7?streakCar():-1;let paint=0;
  if(day===2&&!S.gp[GIFT_D2])paint=GIFT_D2;else if(day===7&&car<0)paint=GIFT_D7.find(k=>!S.gp[k])||0;
  return{coins:day===7&&car<0&&!paint?STREAK[6]*2:STREAK[day-1],car,paint};}
function giftTxt(r){let s='+'+r.coins+' 💰';
  if(r.paint)s+=L(' и краска «'+PAINT[r.paint][1]+'»',' and the “'+PAINT[r.paint][1]+'” paint');

function claimStreak(mult,quiet){const st=streakState();if(st.claimed){hideModal();return 0;}
