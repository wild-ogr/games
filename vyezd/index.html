<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Выезд со двора</title>
<style>
:root{--ink:#2d3436;--accent:#ff7a45;--accent2:#ffb347;--muted:#95a5a6;--card:#fffdf7}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;background:linear-gradient(#9ed8f0,#cdeec0 32%,#8cc071);overscroll-behavior:none;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--ink);overflow:hidden;touch-action:manipulation}
#app{position:relative;max-width:520px;height:100%;margin:0 auto;background:linear-gradient(#9ed8f0,#cdeec0 32%,#8cc071);overflow:hidden}
.screen{position:absolute;top:0;right:0;bottom:0;left:0;display:none;flex-direction:column}
.screen.on{display:flex}
button{font:inherit;color:inherit;border:0;cursor:pointer}
.btn{background:#fff;border-radius:16px;padding:12px 16px;font-weight:700;box-shadow:0 4px 0 #c7c1b0,0 6px 14px rgba(0,0,0,.12);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #c7c1b0}
.btn.accent{background:linear-gradient(#d9480f,#b8390a);color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.25);box-shadow:0 4px 0 #8a2a06,0 6px 14px rgba(0,0,0,.15)}
.btn.accent:active{box-shadow:0 1px 0 #8a2a06}
.btn.green{background:linear-gradient(#2b8a3e,#237032);color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.25);box-shadow:0 4px 0 #17501f,0 6px 14px rgba(0,0,0,.15)}
.btn small{opacity:.85;font-size:.8em}
.icon{width:44px;height:44px;border-radius:14px;background:rgba(255,255,255,.85);font-size:22px;font-weight:800;box-shadow:0 3px 0 rgba(0,0,0,.12)}
/* map */
.mh{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 6px;padding-top:max(14px,env(safe-area-inset-top))}
.logo{font-size:24px;font-weight:900;letter-spacing:.3px;color:#1f3b57;text-shadow:0 1px 0 rgba(255,255,255,.8),0 2px 8px rgba(255,255,255,.5)}
.pill{background:rgba(255,255,255,.9);border-radius:999px;padding:6px 12px;font-weight:800;box-shadow:0 3px 0 rgba(0,0,0,.1)}
.map-scroll{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:10px 16px 20px;position:relative}
.route{position:relative}
.node-row{display:flex;align-items:center;gap:12px;height:86px;position:relative}
.node-row.r{flex-direction:row-reverse;text-align:right}
.node-row:not(:last-child)::after{content:"";position:absolute;top:62px;height:48px;border-left:5px dotted rgba(255,255,255,.9);z-index:0}
.node-row.l::after{left:calc(22% + 30px);transform:rotate(-38deg);transform-origin:top}
.node-row.r::after{right:calc(22% + 30px);transform:rotate(38deg);transform-origin:top}
.node-row.l{padding-left:22%}.node-row.r{padding-right:22%}
.node{position:relative;z-index:1;width:62px;height:62px;border-radius:50%;background:linear-gradient(#ffd36e,#ff9f43);color:#3a2206;font-size:24px;font-weight:900;box-shadow:0 5px 0 #c8741d,0 8px 16px rgba(0,0,0,.2);flex:none}
.node.done{background:linear-gradient(#8be28f,#3fae5a);color:#0f3d1f;box-shadow:0 5px 0 #2b7a3f,0 8px 16px rgba(0,0,0,.2)}
.node.locked{background:linear-gradient(#d5dbdf,#aab4ba);box-shadow:0 5px 0 #7f8c8d;cursor:default;font-size:20px}
.node.cur{animation:pulse 1.2s infinite}
.node.boss{background:linear-gradient(#e53935,#c62828);color:#fff;box-shadow:0 5px 0 #a82b25,0 8px 16px rgba(0,0,0,.2)}
.node.boss.done{background:linear-gradient(#8be28f,#3fae5a);color:#0f3d1f;box-shadow:0 5px 0 #2b7a3f,0 8px 16px rgba(0,0,0,.2)}
.node::after{content:"";position:absolute;left:16%;top:8%;width:68%;height:36%;border-radius:50%;background:linear-gradient(rgba(255,255,255,.55),rgba(255,255,255,0));pointer-events:none}
.node .fire{position:absolute;top:-10px;right:-8px;font-size:20px}
.region{margin:14px 0 4px;text-align:center;font-weight:900;font-size:15px;color:#2d5b77;letter-spacing:.5px}
.region span{background:rgba(255,255,255,.85);padding:6px 14px;border-radius:999px;box-shadow:0 3px 0 rgba(0,0,0,.08)}
.hdr-r{display:flex;gap:8px;align-items:center}
.icon.snd{width:44px;height:44px;font-size:20px;border-radius:14px}
@keyframes pulse{50%{transform:scale(1.08)}}
/* подписи на траве — на тёмной плашке (контраст ≥ 4.5) */
.nlabel{background:rgba(22,44,32,.58);border-radius:12px;padding:3px 10px 4px;min-width:0}
.nlabel b{display:block;font-size:17px;color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.35)}
.st{color:#ffd23f;font-size:16px;letter-spacing:1px;text-shadow:0 1px 0 rgba(0,0,0,.3)}
.soon{text-align:center;padding:10px 0 4px}.soon span{display:inline-block;color:#fff;font-weight:700;background:rgba(22,44,32,.58);border-radius:12px;padding:6px 12px}
.mnav{display:flex;gap:10px;padding:10px 16px;padding-bottom:max(14px,env(safe-area-inset-bottom));background:rgba(255,255,255,.35);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.mnav .btn{flex:1}
/* game */
.gh{display:flex;align-items:center;gap:10px;padding:10px 12px 4px;padding-top:max(10px,env(safe-area-inset-top))}
.gt{flex:1;line-height:1.15}
.gt>div:first-child{font-weight:900;font-size:18px;color:#1f3b57;text-shadow:0 1px 0 rgba(255,255,255,.7)}
.sub{font-size:14px;font-weight:700;color:#2d5b77}
.hearts{font-size:22px;letter-spacing:2px;min-width:80px;text-align:right}
.hearts .off{filter:grayscale(1);opacity:.35}
.stage{flex:1;position:relative;min-height:0}
canvas{display:block;touch-action:none}
.tip{position:absolute;left:12px;right:12px;top:6px;background:rgba(255,255,255,.93);border-radius:14px;padding:10px 12px;font-weight:700;font-size:14px;text-align:center;box-shadow:0 4px 14px rgba(0,0,0,.15);display:none}
.gf{display:flex;gap:10px;padding:8px 12px;padding-bottom:max(12px,env(safe-area-inset-bottom))}
.gf .btn{flex:1}
/* garage */
.gar-grid{flex:1;overflow-y:auto;overscroll-behavior:contain;display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px 16px 24px;align-content:start}
.gcard{background:var(--card);border-radius:18px;padding:10px;text-align:center;box-shadow:0 4px 0 #d9d2bf}
.gcard canvas{width:100%;height:84px;display:block}
.gcard b{display:block;margin-top:4px}
.gcard small{color:#57606f;font-weight:600;font-size:14px}
.gcard.lock{background:#efeadb;box-shadow:0 4px 0 #d3ccb8}.gcard.lock b{color:#57606f}.gcard.next{background:#fff3d6;box-shadow:0 4px 0 #e6c98a}
.gcard.own{cursor:pointer}
.sws{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin:10px 0 4px}
.sw{width:44px;height:44px;border-radius:50%;box-shadow:0 0 0 2px #fff,0 2px 6px rgba(0,0,0,.3);font-weight:900;font-size:20px;color:#fff;text-shadow:0 1px 3px #000}
.sw.on{box-shadow:0 0 0 3px #fff,0 0 0 6px #2d3436}
.gcard.lock canvas{filter:grayscale(1) brightness(1.08) opacity(.42)}.gcard.next canvas{filter:grayscale(.7) opacity(.75)}
/* modal & ad */
.modal,.ad{position:absolute;top:0;right:0;bottom:0;left:0;display:none;align-items:center;justify-content:center;background:rgba(20,30,40,.5);z-index:10;padding:20px}
.modal{overflow-y:auto;overscroll-behavior:contain}
/* окно выше экрана (покупки при высоте окна VK 560–800): margin:auto вместо центрирования — верх не срезается, окно прокручивается */
.modal{align-items:flex-start}.modal>.card{margin:auto}
.modal.on,.ad.on{display:flex}
.card{background:var(--card);border-radius:24px;padding:22px 18px 18px;width:100%;max-width:360px;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.3);animation:pop .25s ease-out}
@keyframes pop{from{transform:scale(.85);opacity:0}}
.card h2{margin:0 0 6px;font-size:24px}
.card p{margin:6px 0;color:#57606f;font-weight:600}
.big-stars{font-size:44px;color:#ffc312;letter-spacing:4px;margin:6px 0;text-shadow:0 3px 0 #d68910}
.big-stars .e{color:#8a939c;text-shadow:none}
.newcar{background:#fff3d6;border-radius:16px;padding:8px;margin:10px 0}
.newcar canvas{width:100%;height:70px}
.newcar.sm{padding:4px 8px;margin:6px 0}.newcar.sm p{margin:2px 0}.newcar.sm canvas{height:46px}
.row{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.ad{background:#111;color:#fff;text-align:center;font-size:22px;font-weight:800}
.ad small{font-weight:500;opacity:.7;font-size:14px}
.adt{font-size:54px;margin-top:16px}
.toast{position:absolute;left:50%;bottom:90px;transform:translateX(-50%);background:rgba(0,0,0,.82);color:#fff;padding:9px 14px;border-radius:12px;font-weight:700;font-size:15px;line-height:1.3;opacity:0;transition:opacity .25s;pointer-events:none;z-index:20;white-space:normal;text-align:center;width:max-content;max-width:90%}
.toast.on{opacity:1}
.logo{font-size:21px}
.gt{min-width:0}.sub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub.long{font-size:12.5px;line-height:1.15;white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.gh-r{display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.gh-r .hearts{font-size:17px;min-width:0;letter-spacing:1px}
.pill.sm{padding:3px 10px;font-size:14px;box-shadow:0 2px 0 rgba(0,0,0,.1)}
button.pill{cursor:pointer;position:relative}
/* невидимое расширение области нажатия до ~44 px */
button.pill::before{content:"";position:absolute;top:-10px;bottom:-10px;left:-6px;right:-6px}
.gf .btn.sq{flex:0 0 60px;padding:6px 0;font-size:20px;display:flex;flex-direction:column;align-items:center;line-height:1.1}
.btn.sq small{display:block;font-size:12px;font-weight:700;opacity:1}
.btn.bst{display:flex;flex-direction:column;align-items:center;line-height:1.15;padding:7px 6px}
.btn.bst small{font-size:13.5px;opacity:1;line-height:1.15}
.btn.on{outline:3px solid #ffd23f;outline-offset:2px}
.lb{max-height:46vh;overflow:auto;overscroll-behavior:contain;margin-top:8px;text-align:left}.lbr{display:flex;gap:10px;align-items:center;padding:6px 8px;border-radius:10px}.lbr:nth-child(odd){background:rgba(0,0,0,.05)}.lbr.me{background:#ffe7a3}.lbr b{width:28px;text-align:right}.lbr span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.lbr i{font-style:normal;font-weight:800}
.goal{font-size:15px;margin:8px 0 2px!important;color:#2d3436!important;font-weight:700}
.goal .bar{display:inline-block;white-space:nowrap;margin:0 4px;vertical-align:1px}.goal .bar b{display:inline-block;width:11px;height:11px;border-radius:3px;background:#ddd6c6;margin:0 1px}.goal .bar b.on{background:#f0a500}
.goal.tipl{background:#e6f6e9;border-radius:12px;padding:8px 10px;color:#1f5e2c!important}
.goal.gift{background:#fff3d6;border-radius:12px;padding:8px 10px}
.trip{margin:10px 0;background:#eaf4fb;border-radius:14px;padding:8px 12px 6px;font-weight:800;font-size:14px;color:#2d5b77}
.trip>div:first-child{display:flex;justify-content:space-between;gap:8px}
.trip .road{position:relative;height:34px;margin-top:4px;border-bottom:4px dashed #9fb7c6}
.trip i{font-style:normal;font-size:26px;position:absolute;left:0;bottom:0;transform:scaleX(-1);animation:trip 2.4s ease-in-out .3s both}
@keyframes trip{from{left:0}to{left:calc(100% - 32px)}}
body.calm .trip i{animation:none;left:calc(100% - 32px)}
@media (prefers-reduced-motion:reduce){.trip i{animation:none;left:calc(100% - 32px)}}
.coins-won{font-size:28px;font-weight:900;color:#e1a100!important}
/* окно победы: «Удвоить» — узкая плашка над главной кнопкой, вторая кнопка — ссылкой */
.btn.x2p{background:#fff4d6;color:#a4520a;border:2px solid #f0a020;box-shadow:none;padding:7px 12px;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;align-self:center;max-width:100%}
.btn.link{background:none;box-shadow:none;color:#2d5b77;text-decoration:underline;text-underline-offset:3px;padding:8px 12px;min-height:44px}
.btn.link:active{transform:none;box-shadow:none}
.clean{font-weight:800;color:#1e8a5a!important}
.nw{white-space:nowrap}
.socof{margin-top:12px;padding-top:10px;border-top:1px dashed #d8d0bd}.socof p{font-size:15px;margin:0 0 8px!important}.socof .btn{width:100%}
/* узкие/низкие экраны, ПК */
.logo{white-space:nowrap}
.lsub{display:block;font-size:11px;font-weight:800;letter-spacing:1.6px;text-transform:uppercase;color:#2d5b77;line-height:1;margin-top:1px}
.logo .lsub{text-shadow:none}
.lg{display:inline-flex;border-radius:999px;overflow:hidden;background:#dcd6c8}.lg u{text-decoration:none;font-weight:800;padding:3px 10px;color:#57606f}.lg u.on{background:#2b8a3e;color:#fff}
.hdr-r .pill{white-space:nowrap}
@media (max-width:340px){.btn.x2p{font-size:13.5px;padding:7px 6px}.logo{font-size:15px!important}.hdr-r .pill{padding:5px 6px!important;font-size:13px!important}.hdr-r{gap:4px!important}.hdr-r .icon{width:40px;height:40px}} /* 320 px: 💰 не вылезает за край */
@media (max-width:400px){.mh{padding-left:12px;padding-right:12px}.logo{font-size:17px}.logo .lc{display:none}.hdr-r{gap:5px}.hdr-r .pill{padding:5px 8px;font-size:14px}}
@media (max-height:520px){.tip{font-size:14px;padding:6px 10px;top:4px}.gh{padding-top:4px;padding-bottom:0}.gh .icon{width:44px;height:44px;font-size:18px}.gt>div:first-child{font-size:15px}.gf{padding-top:4px;padding-bottom:6px}.gf .btn{padding-top:4px;padding-bottom:4px}.btn.bst{flex-direction:row;gap:6px;justify-content:center}}
@media (min-width:900px) and (min-height:600px){#app{max-width:640px;box-shadow:0 0 50px rgba(0,0,0,.18)}}
/* ПК/планшет, альбомное низкое окно (960×540, iframe на ноутбуке): панели двора — колонкой слева, двор — во всю высоту (клетка ~24 → ~32 px) */
@media (min-aspect-ratio:4/3) and (max-height:640px) and (min-width:760px){
  #app{max-width:760px;box-shadow:0 0 50px rgba(0,0,0,.18)}
  #scr-game.on{display:grid;grid-template-columns:220px 1fr;grid-template-rows:auto 1fr}
  #scr-game .gh{grid-column:1;grid-row:1;flex-wrap:wrap;align-content:flex-start;padding:10px 8px 4px 12px}
  #scr-game .gt{flex:1 1 90px}
  #scr-game .gt{flex:1 1 120px}
  #scr-game .gh-r{order:3;flex:1 1 auto;flex-direction:row;justify-content:space-between;align-items:center}
  #scr-game #gSet,#scr-game #zIn{order:4}
  #scr-game .stage{grid-column:2;grid-row:1/3}
  #scr-game .gf{grid-column:1;grid-row:2;flex-direction:column;justify-content:flex-end;padding:8px 8px 12px 12px}
  #scr-game .gf .btn,#scr-game .gf .btn.sq{flex:0 0 auto;width:100%}
  #scr-game .gf .btn.sq{flex-direction:row;justify-content:center;gap:8px;padding:10px 0}
  #scr-game .gf .btn.sq small{font-size:15px}
  #scr-game .btn.bst{padding:10px 6px}
  @supports not (inset:0){#scr-game .gf>*+*{margin-left:0;margin-top:10px}}
}
.btn.locked{opacity:.75;filter:saturate(.4)}
.btn.locked small{display:block;font-size:13px;opacity:1}
/* время суток */
#scr-game.dark .sub{color:#e3ebff}
#scr-game.dark .gt>div:first-child{color:#fff;text-shadow:0 2px 0 #1b2a4a}
/* зум */
.zbtn{position:absolute;right:10px;top:8px;display:none;background:rgba(255,255,255,.92);border-radius:999px;padding:12px 16px;min-height:44px;font-weight:800;font-size:14px;box-shadow:0 3px 0 rgba(0,0,0,.15),0 4px 12px rgba(0,0,0,.15);z-index:2}
.zbtn.on{display:block}
#tip[style*="block"]~.zbtn{top:auto;bottom:10px}
/* серия дней */
.mnav .btn.sq{flex:0 0 64px;padding:6px 0;font-size:20px;position:relative;line-height:1.1}
.mnav .btn{min-width:0}
@media (max-width:380px){.mnav.m4{gap:6px;padding-left:8px;padding-right:8px}.mnav.m4 .btn{font-size:14.5px;padding-left:4px;padding-right:4px}.mnav.m4 .btn.sq{flex:0 0 52px}.mnav.m4 .btn small{font-size:11.5px}}
.mnav .btn.sq .dot{position:absolute;top:4px;right:6px;width:10px;height:10px;border-radius:50%;background:#ff4757;box-shadow:0 0 0 2px #fff}
.streak{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:12px 0 4px}
.sd{background:#f1ede2;border-radius:12px;padding:6px 2px;font-weight:800;font-size:15px;line-height:1.2;position:relative;color:#57606f}
.sd small{display:block;font-size:13px;font-weight:700}
.sd.done{background:#c8efcf;color:#2b7a3f}
.sd.done::after{content:"✓";position:absolute;top:1px;right:3px;font-size:12px}
.sd.today{background:linear-gradient(#ffd36e,#ff9f43);color:#3a2206;box-shadow:0 3px 0 #c8741d;animation:pulse 1.2s infinite}
.sd.d7{grid-column:span 2;background:#ffe9b8}
.sd.d7.today{background:linear-gradient(#ffd36e,#ff7a45)}
.sd .ic{font-size:20px;display:block}
/* настройки, сундуки */
.set{display:flex;align-items:center;justify-content:space-between;background:#f1ede2;border-radius:14px;padding:10px 12px;margin-top:8px;font-weight:700;text-align:left;color:#2d3436;width:100%;min-height:48px}
.set i{font-style:normal;font-weight:800;color:#fff;background:#2b8a3e;border-radius:999px;padding:3px 12px;min-width:56px;text-align:center}.set i.off{color:#57606f;background:#dcd6c8}.set i.go,.pay .set i{background:none;color:#237032;padding:0;min-width:0}
.pay{margin-top:12px;text-align:left}.pay h3{font-size:16px;margin:0 0 2px;color:#2d3436}.pay .set span{padding-right:10px}.pay .set small{font-weight:600}
.pbuy b{white-space:nowrap;color:#1f5e2c;font-size:17px}.pcur{width:18px;height:18px;vertical-align:-3px;margin-left:3px}.pown i{color:#237032}
.about{font-size:14px;text-align:left;color:#57606f}
.how{text-align:left}.how p{font-size:14.5px;margin:7px 0;color:#2d3436}
.chest{display:flex;align-items:center;justify-content:center;gap:10px;margin:6px 0 2px;flex-wrap:wrap}
.chest>span{background:rgba(22,44,32,.58);color:#fff;font-weight:800;border-radius:12px;padding:6px 12px;font-size:15px}
.chest .btn{padding:8px 12px;font-size:15px}
.hearts.warn{animation:pulse .5s 4}
body.calm .hearts.warn{animation:none}
/* меньше движения: системная настройка или «спокойный режим» в игре */
@media (prefers-reduced-motion:reduce){.node.cur,.sd.today{animation:none}.card{animation:none}}
body.calm .node.cur,body.calm .sd.today,body.calm .card{animation:none}
/* запасные отступы для старых браузеров без gap во flex (≈ те же, где нет inset) */
/* вырез экрана слева/справа (iPhone в альбомной ориентации) */
.mh,.mnav{padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.gh,.gf{padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
@supports not (inset:0){.mnav>*+*,.gf>*+*,.gh>*+*,.hdr-r>*+*,.chest>*+*{margin-left:10px}.sws>*{margin:5px}.row>*+*{margin-top:10px}.node-row>*+*{margin-left:12px}.node-row.r>*+*{margin-left:0;margin-right:12px}.gh-r>*+*{margin-top:3px}.lbr>*+*{margin-left:10px}}
/* ===== boost: карта — регионы с пейзажами, дорога, машинка игрока; фон для компьютера ===== */
.reg{position:relative;border-radius:22px;margin:8px -8px 12px;padding:2px 8px 8px}
.reg0{background:linear-gradient(rgba(214,240,170,.62),rgba(150,205,120,.62))}
.reg1{background:linear-gradient(rgba(196,228,222,.7),rgba(126,178,160,.66))}
.reg2{background:linear-gradient(rgba(178,222,246,.72),rgba(116,178,220,.66))}
.reg3{background:linear-gradient(rgba(255,232,176,.74),rgba(244,190,126,.68))}
.reg4{background:linear-gradient(rgba(214,202,244,.72),rgba(160,150,214,.66))}
.reg .region{margin-top:8px}
#mapReg{text-align:center;font-weight:900;font-size:14.5px;color:#2d5b77;padding:0 12px 5px;min-height:27px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#mapReg span{background:rgba(255,255,255,.9);padding:4px 14px;border-radius:999px;box-shadow:0 2px 0 rgba(0,0,0,.08)}
.node-row .sc{position:absolute;bottom:8px;width:21%;max-width:96px;height:66px;pointer-events:none;opacity:.92}
.node-row .sc svg{display:block;width:100%;height:100%}
.node-row.l .sc{left:0}.node-row.r .sc{right:0}

.node-row.l::after{left:calc(22% + 24px)}.node-row.r::after{right:calc(22% + 24px)}
.node .mycar{position:absolute;left:50%;top:-25px;width:58px;height:34px;margin-left:-29px;pointer-events:none;filter:drop-shadow(0 2px 2px rgba(0,0,0,.3))}

@media (min-width:760px){#bg{display:block}#app{z-index:1}}
@media (min-width:900px) and (min-height:900px){#app{max-width:720px}}
.gside{display:none}
@media (max-width:400px){.gh{gap:6px}.gh .icon{width:40px;height:40px;font-size:19px}.gt>div:first-child{font-size:16px;white-space:nowrap}}
@media (max-width:340px){.gh{padding-left:8px;padding-right:8px}.gt>div:first-child{font-size:15px}}
#zIn.icon{display:none}#zIn.icon.on{display:block}
.how p.hw{display:flex;align-items:center;gap:10px}.how p.hw canvas{flex:none;width:46px;height:46px;background:#5a636e;border-radius:10px}.how p.hw span{flex:1}
@supports not (inset:0){.how p.hw>*+*{margin-left:10px}}
/* ===== компьютер, широкое окно (заход 2): двор во всю высоту справа, панели — колонкой слева; карта — меню слева, дорога справа; гараж — в 4 столбца.
   Низкое альбомное окно (≤640 px по высоте) — своё правило выше, оно не меняется ===== */
@media (min-width:860px) and (min-height:641px) and (min-aspect-ratio:1/1){
  #app{max-width:1100px;max-width:min(1280px,calc(88vh + 320px));box-shadow:0 0 50px rgba(0,0,0,.18)}
  #scr-game.on{display:grid;grid-template-columns:310px 1fr;grid-template-rows:auto 1fr auto}
  #scr-game .gh{grid-column:1;grid-row:1;flex-wrap:wrap;align-content:flex-start;padding:14px 8px 6px 14px}
  #scr-game .gt{flex:1 1 200px}
  #scr-game .gt>div:first-child{font-size:21px}
  #scr-game .gh-r{order:5;flex:1 1 auto;flex-direction:row;justify-content:flex-start;gap:12px;align-items:center;margin-top:6px}
  #scr-game #zIn,#scr-game #gSet{order:6;margin-top:6px}

<script>
'use strict';

/* ================= язык: русский / английский =================
   ПРАВИЛО: любой новый текст игроку — сразу на обоих языках: L('русский','English'), pl(n,…) для чисел,
   в данных — поле en (MODELS, REGIONS, PAY_ITEMS), реплики — PH и PH_EN с теми же ключами, вёрстка — атрибут data-en / data-en-aria.
   Язык: VK — всегда русский. Яндекс — выбор игрока в ⚙ (localStorage vyezd-lang) > ysdk.environment.i18n.lang > ?lang= > navigator.language;
   ru/be/kk/uk/uz → русский, остальное → английский. На маке (localhost) ?lang=en|ru главнее всего. */
const RU_LANGS=['ru','be','kk','uk','uz'],LANG_KEY='vyezd-lang';
const normLang=l=>RU_LANGS.indexOf(String(l||'').slice(0,2).toLowerCase())>=0?'ru':'en';
const IS_VK=/[?&](vk_app_id|vk)=/.test(location.search),QLANG=new URLSearchParams(location.search).get('lang'),
  LOCAL=/^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname);
let LANG_MAN=null;try{const v=localStorage.getItem(LANG_KEY);if(v==='ru'||v==='en')LANG_MAN=v;}catch(e){}
let LANG=IS_VK?'ru':QLANG&&LOCAL?normLang(QLANG):LANG_MAN||normLang(QLANG||navigator.language||'ru');
document.documentElement.lang=LANG;
const L=(ru,en)=>LANG==='en'?en:ru;
// число + слово: pl(5,'двор','двора','дворов','yard','yards')
function pl(n,a,b,c,e1,e2){return LANG==='en'?(n===1?e1:e2):plural(n,a,b,c);}
const DIRS=[[0,-1],[1,0],[0,1],[-1,0]];
const CITIES=['Калининград','Псков','Великий Новгород','Тверь','Москва','Владимир','Нижний Новгород','Казань','Самара','Екатеринбург',
  'Челябинск','Тюмень','Омск','Новосибирск','Томск','Кемерово','Барнаул','Красноярск','Иркутск','Улан-Удэ',
  'Чита','Благовещенск','Биробиджан','Хабаровск','Комсомольск-на-Амуре','Южно-Сахалинск','Магадан','Петропавловск-Камчатский','Находка','Владивосток'];
const WORLD=['Минск','Алматы','Ташкент','Бишкек','Тбилиси','Ереван','Баку','Стамбул','Дубай','Дели','Пекин','Сеул','Токио','Бангкок','Каир','Рим','Париж','Берлин','Лондон','Нью-Йорк'];
const CITIES_EN=['Kaliningrad','Pskov','Veliky Novgorod','Tver','Moscow','Vladimir','Nizhny Novgorod','Kazan','Samara','Yekaterinburg',
  'Chelyabinsk','Tyumen','Omsk','Novosibirsk','Tomsk','Kemerovo','Barnaul','Krasnoyarsk','Irkutsk','Ulan-Ude',
  'Chita','Blagoveshchensk','Birobidzhan','Khabarovsk','Komsomolsk-on-Amur','Yuzhno-Sakhalinsk','Magadan','Petropavlovsk-Kamchatsky','Nakhodka','Vladivostok'];
const WORLD_EN=['Minsk','Almaty','Tashkent','Bishkek','Tbilisi','Yerevan','Baku','Istanbul','Dubai','Delhi','Beijing','Seoul','Tokyo','Bangkok','Cairo','Rome','Paris','Berlin','London','New York'];
const REGIONS=[{from:0,name:'Центр и Поволжье',en:{name:'Central Russia & the Volga'}},{from:10,name:'Урал и Сибирь',en:{name:'The Urals & Siberia'}},{from:20,name:'Дальний Восток',en:{name:'The Far East'}},
  {from:30,name:'Вокруг света',en:{name:'Around the World'}},{from:50,name:'Бесконечные дворы',en:{name:'Endless Yards'}}];
const levelName=i=>i<30?L(CITIES[i],CITIES_EN[i]):i<50?L(WORLD[i-30],WORLD_EN[i-30]):L('Двор №','Yard #')+(i+1);
const isBoss=i=>i%10===9;
// сложность растёт плавно: размер двора, плотность, длина машин, препятствия, доля «свободных с начала»
function levelParams(i){
  // после 30-го двор больше не растёт — сложность идёт «пилой» по десяткам: 1–2-й двор после босса — передышка, 9-й — подъём, 10-й (босс) — пик
  const t=Math.min(1,i/29),boss=isBoss(i),late=i>=30,rest=late&&i%10<2,pre=late&&i%10===8;
  // двор растёт с каждым уровнем: 5×6 → 10×14, дальше (бесконечные уровни) — 9×13 / 10×14
  const w=i<30?5+Math.floor(i*5/29):rest?9:9+i%2,h=i<30?6+Math.floor(i*8/29):rest?13:13+i%2;

const SEED_FIX={7:1202,13:2397,15:6495,18:5579,19:2583,27:2954,30:7104,33:3842,34:5975,38:7399,40:5252,42:8010,45:7187,48:2375,49:2920};
const levelSeed=idx=>SEED_FIX[idx+1]||idx*31+7;
// условная трудность раскладки — для выбора зерна задания дня
function lvIndex(lv,p){const occ=baseOcc(lv),n=lv.vehicles.length;let mc=0;for(let k=0;k<n;k++)mc=Math.max(mc,closureOf(lv.vehicles,occ,lv.w,lv.h,k).size);

const DAILY=levelParams(20);
// задание дня по ступеням (аудит 14): новичку — двор его уровня, а не стена на 24 машины. Внутри ступени у всех игроков одно и то же
// задание (то же зерно дня, тот же выбор «лучшее из 3 зёрен» по трудности target); рейтинг считает дни, а не очки — честность не страдает.

// JSON с упорядоченными ключами — чтобы сравнивать сохранения без учёта порядка и ts
function canon(o){return JSON.stringify(o,(k,v)=>v&&typeof v==='object'&&!Array.isArray(v)?Object.keys(v).sort().reduce((r,x)=>(r[x]=v[x],r),{}):v);}
const noTs=o=>Object.assign({},o,{ts:0});

async function cloudLoad(force){if(cloudBusy||cloudReady||!(YP||VK)||(!force&&Date.now()-cloudTry<10000))return;cloudBusy=true;cloudTry=Date.now();

    const ch=canon(noTs(S))!==before;

function mergeSave(d,ref){if(!isObj(d))return;

  for(const f of ['stars','daily','chest','yard','gp','dw','dec','sets'])if(isObj(d[f])){if(!isObj(S[f]))S[f]={};for(const k in d[f])if(typeof d[f][k]==='number')S[f][k]=Math.max(S[f][k]||0,d[f][k]);}

  if(typeof d.coins==='number')S.coins=newer?Math.max(0,d.coins+(S.coins-BOOT_COINS)):(dt===rt&&!dt)?Math.max(S.coins,d.coins):S.coins;
  for(const k in d)if(k!=='soc'&&(!(k in S)||newer&&!/^(ts|unlocked|levelsDone|stars|daily|chest|yard|gp|dw|dec|sets|garage|coins|streak|buy|buyB|payT|payV|soc)$/.test(k)))S[k]=d[k]; // флажки (звук, подсказки)

  if(isObj(d.streak)){const a=S.streak,b=d.streak;
    if(!isObj(a))S.streak={day:b.day||0,last:b.last||0,cyc:b.cyc||0};
    else{const m=giftCnt(b)>giftCnt(a)?b:a;S.streak={day:m.day||0,last:Math.max(a.last||0,b.last||0),cyc:m.cyc||0};}}}

function rng(seed){let a=seed>>>0;return()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

    if(obst.some(o=>Math.abs(o[0]-x)+Math.abs(o[1]-y)<3))continue;occ[y*w+x]=-2;obst.push([x,y,Math.floor(R()*3)]);k++;}

    if(occ[hy*w+hx]!==-1)return null;

      cells.push([c.tx,c.ty]);used.add(c.ty*w+c.tx);cx=c.tx;cy=c.ty;pdx=c.ex;pdy=c.ey;

    const hit=new Set();let any=0;for(const [x,y] of cells){const o=rayOwn[y*w+x];any+=o.length;for(const id of o)if(freeSet.has(id))hit.add(id);}

function updCoins(){const a=$('gCoins'),b=$('coinCnt'),c=$('garCoins');if(a)a.textContent='💰 '+S.coins;if(b)b.textContent=S.coins;if(c)c.textContent='💰 '+S.coins;

/* ================= покупки за деньги: Яндекс Игры (ysdk.payments) и VK Игры (VKWebAppShowOrderBox) — общий модуль (одинаковый в 5 играх) =================
   Товары игры — PAY_ITEMS (выше), id совпадают с id в консоли Яндекса («Инап-покупки») и в hobby-pay/catalog.json (VK).
   Кнопок покупок НЕТ совсем, если платежи недоступны: нет SDK/моста (мак), каталог Яндекса пуст, VK не поддерживает оплату (iOS).
   Постоянные (perm) — флаг S.buy[id], разовый бонус монет — один раз на игрока (S.buyB). Выдача — только после подтверждения площадки.
   Яндекс: цена и значок валюты — только из getCatalog; расходуемые: выдать → сохранить (облако сразу) → consumePurchase;
     незавершённые при запуске довыдаём (getPurchases). Токены выданных — S.payT (и в облаке), сбой consume не даст выдать второй раз.
   VK: на кнопке число голосов (PAY_ITEMS.vk). success:true + order_id → выдать → сохранить → стереть ключ pay_<order_id>.
     Страховка: сервер vk-pay при оплате пишет в хранилище VK игрока pay_<order_id>=id (расходуемые) и own_<id>=1 (постоянные);
     при запуске читаем их и довыдаём. Выданные order_id — S.payV (последние 30); покупка без order_id оставляет метку «x:<id>»,
     которая «съест» первый чужой pay_ этого товара — второй раз не выдастся.
   Мак: ?paytest=1 — имитация Яндекса (localStorage «paytest»), ?vk=1&paytest=1 — имитация VK с сервером (localStorage «paytestvk»),
   ?paytest=fail — отказ. В настоящем VK (vk_app_id) и в Яндексе заглушек нет */
const payObj=x=>!!x&&typeof x==='object'&&!Array.isArray(x);
const PAY={on:false,p:null,v:null,list:[],busy:false,
  test:/[?&]paytest=/.test(location.search),
  // запуск: после SDK/моста и облака. Незавершённые покупки обрабатываем, даже если каталог не пришёл
  async init(){if(PAY.p||PAY.v)return;
    if(PLAT==='vk')return PAY.initVK();
    try{if(ysdk)PAY.p=ysdk.getPayments?await payT(ysdk.getPayments({signed:false})):ysdk.payments;
      else if(PAY.test&&!window.YaGames)PAY.p=payStub();}catch(e){PAY.p=null;}
    if(!PAY.p)return;
    try{await PAY.restore();}catch(e){}
    try{const c=await payT(PAY.p.getCatalog());PAY.list=(Array.isArray(c)?c:[]).filter(x=>x&&PAY_ITEMS[x.id]);}catch(e){PAY.list=[];}
    PAY.on=PAY.list.length>0;if(PAY.on)payAfter();},
  async initVK(){
    if(VK){let ok=false;try{ok=!!(VK.supportsAsync&&await payT(VK.supportsAsync('VKWebAppShowOrderBox'),8000));}catch(e){}if(ok)PAY.v=payVK();}
    else if(PAY.test&&!VK_REAL)PAY.v=payStubVK();
    if(!PAY.v)return;
    try{await PAY.restore();}catch(e){}
    PAY.list=Object.keys(PAY_ITEMS).filter(id=>PAY_ITEMS[id].vk>0).map(id=>({id}));
    PAY.on=PAY.list.length>0;if(PAY.on)payAfter();},
  own(id){return !!(payObj(S.buy)&&S.buy[id]);},
  item(id){return PAY.list.find(x=>x.id===id)||null;},
  give(id){const it=PAY_ITEMS[id];
    if(it.perm){if(!payObj(S.buy))S.buy={};S.buy[id]=1;
      if(it.bonus){if(!payObj(S.buyB))S.buyB={};if(!S.buyB[id]){S.buyB[id]=1;payAdd(it.bonus);}}}
    else payAdd(it.n||0);
    if(it.give)it.give();},
  // при запуске и «Восстановить покупки»: постоянные — выдать, если флага нет; расходуемые — довыдать и отметить
  async restore(){let got=0;
    if(PAY.v)got=await PAY.restoreVK();
    else{const ps=await payT(PAY.p.getPurchases());
      for(const x of (Array.isArray(ps)?ps:[])){const it=x&&PAY_ITEMS[x.productID];if(!it)continue;
        if(it.perm){if(!PAY.own(x.productID)){PAY.give(x.productID);got=1;}}else if(await PAY.credit(x))got=1;}}
    if(got){save();payFlush();payAfter();toast('Покупка зачислена',2600);}
    return got;},
  // VK: ключи own_<id> (постоянные, не стираем) и pay_<order_id> (расходуемые: выдать, сохранить, стереть)
  async restoreVK(){const ks=await PAY.v.keys();let got=0;const done=[];if(!Array.isArray(S.payV))S.payV=[];
    for(const k of ks){const m=/^(own|pay)_(.+)$/.exec(k.key||'');if(!m||!k.value)continue;
      if(m[1]==='own'){const it=PAY_ITEMS[m[2]];if(it&&it.perm&&!PAY.own(m[2])){PAY.give(m[2]);got=1;}continue;}
      const id=String(k.value),it=PAY_ITEMS[id];if(!it)continue;
      if(S.payV.indexOf(m[2])<0){const x=S.payV.indexOf('x:'+id); // покупка без order_id уже выдана — это её заказ
        if(x>=0)S.payV[x]=m[2];else{PAY.give(id);payMark(m[2]);got=1;}}
      done.push(k.key);}
    if(done.length){save();payFlush();for(const k of done)try{await PAY.v.clear(k);}catch(e){}}
    return got;},
  // расходуемая: выдать (если этот токен ещё не выдавали), сохранить в облако и только потом consumePurchase
  async credit(x){const t=String(x.purchaseToken||'');if(!Array.isArray(S.payT))S.payT=[];let fresh=false;
    if(!t||S.payT.indexOf(t)<0){PAY.give(x.productID);if(t)S.payT.push(t);if(S.payT.length>30)S.payT=S.payT.slice(-30);save();payFlush();fresh=true;}
    try{if(t)await payT(PAY.p.consumePurchase(t));}catch(e){}
    return fresh;},
  async buy(id){const it=PAY_ITEMS[id];if(!it||PAY.busy||!PAY.on||!PAY.item(id)||(it.perm&&PAY.own(id)))return;PAY.busy=true;payPause(true);
    try{if(PAY.v){const r=await PAY.v.order(id);if(!r||!r.success)throw new Error('cancel');
        const oid=r.order_id!=null?String(r.order_id):'';if(!Array.isArray(S.payV))S.payV=[];
        if(!oid||S.payV.indexOf(oid)<0){PAY.give(id);payMark(oid||'x:'+id);}
        save();payFlush();if(oid)PAY.v.clear('pay_'+oid).catch(()=>{});}
      else{const x=await PAY.p.purchase({id});
        if(it.perm){PAY.give(id);save();payFlush();}
        else await PAY.credit(x&&x.productID===id?x:{productID:id,purchaseToken:x&&x.purchaseToken});}
      SND.coin();toast(it.done||'Готово! Спасибо за покупку',2800);payAfter(id);}
    catch(e){toast('Покупка не состоялась',2200);}
    finally{PAY.busy=false;payPause(false);}},
  // «Восстановить покупки» (Об игре): заново читаем getPurchases / ключи VK
  async again(){if(!(PAY.p||PAY.v)||PAY.busy)return;PAY.busy=true;let got=0;try{got=await PAY.restore();}catch(e){}PAY.busy=false;if(!got)toast('Покупки проверены — всё на месте',2400);},
  // цена: VK — число голосов (требование VK); Яндекс — из каталога: число + значок валюты (getPriceCurrencyImage), иначе готовая строка price
  price(pr){if(PAY.v){const n=PAY_ITEMS[pr.id].vk,a=n%10,b=n%100;return n+' '+(a===1&&b!==11?'голос':a>=2&&a<=4&&(b<12||b>14)?'голоса':'голосов');}
    let img='';try{img=pr.getPriceCurrencyImage?pr.getPriceCurrencyImage('svg'):'';}catch(e){}
    return img&&pr.priceValue?payEsc(pr.priceValue)+'<img class="pcur" src="'+payEsc(img)+'" alt="">':payEsc(pr.price||pr.priceValue||'');},
  row(pr){const it=PAY_ITEMS[pr.id],own=it.perm&&PAY.own(pr.id),txt='<span>'+it.ic+' '+payEsc(it.name)+'<br><small>'+payEsc(it.desc)+'</small></span>';
    return own?'<div class="'+PAY_ROW+' pown">'+txt+'<i>куплено</i></div>':'<button class="'+PAY_ROW+' pbuy" data-pid="'+payEsc(pr.id)+'">'+txt+'<b>'+PAY.price(pr)+'</b></button>';},
  // список товаров (ids — только эти, по порядку каталога); owned=false — без уже купленных
  html(ids,owned){const L=PAY.list.filter(pr=>(!ids||ids.indexOf(pr.id)>=0)&&(owned!==false||!(PAY_ITEMS[pr.id].perm&&PAY.own(pr.id))));
    return L.length?'<div class="pay"><h3>Покупки</h3>'+L.map(PAY.row).join('')+'</div>':'';},
  bind(root){(root||document).querySelectorAll('.pbuy').forEach(b=>b.onclick=()=>{try{(SND.tap||SND.click)();}catch(e){}PAY.buy(b.dataset.pid);});}
};
function payMark(v){if(!Array.isArray(S.payV))S.payV=[];if(S.payV.indexOf(v)<0)S.payV.push(v);if(S.payV.length>30)S.payV=S.payV.slice(-30);}
// слияние облака (d) в сохранение T (по умолчанию S): купленное, выданные бонусы, токены и заказы — объединение (покупка не теряется ни с какой стороны)
function payMerge(d,T){T=T||S;if(!payObj(d)||!payObj(T))return;
  for(const f of ['buy','buyB'])if(payObj(d[f])){if(!payObj(T[f]))T[f]={};for(const k in d[f])if(d[f][k])T[f][k]=1;}
  for(const f of ['payT','payV'])if(Array.isArray(d[f])){if(!Array.isArray(T[f]))T[f]=[];for(const t of d[f])if(typeof t==='string'&&T[f].indexOf(t)<0)T[f].push(t);if(T[f].length>30)T[f]=T[f].slice(-30);}}
function payT(p,ms){return Promise.race([p,new Promise((_,no)=>setTimeout(()=>no(new Error('timeout')),ms||15000))]);}
function payEsc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]);}
// VK: окно оплаты (игрок может думать долго — ждём до 10 мин) и ключи хранилища, которые пишет сервер vk-pay
function payVK(){return {order:id=>vkSend('VKWebAppShowOrderBox',{type:'item',item:id},600000),
  keys:async()=>{const r=await vkSend('VKWebAppStorageGetKeys',{count:1000,offset:0},8000),ks=((r&&r.keys)||[]).filter(k=>/^(own|pay)_/.test(k));
    if(!ks.length)return [];const g=await vkSend('VKWebAppStorageGet',{keys:ks},8000);return (g&&g.keys)||[];},
  clear:k=>vkSend('VKWebAppStorageSet',{key:k,value:''},8000)};}

/* ---- монеты «летят» из окна в счётчик (UX 18 п.2); в спокойном режиме и в старых браузерах без element.animate — просто цифра ---- */
function coinFx(n,src){if(!n||!src||calm()||!src.animate||window.__demo)return;
  const app=$('app'),inG=!$('scr-map').classList.contains('on'),dst=$('scr-game').classList.contains('on')?$('gCoins'):inG?$('garCoins'):$('mCoins');if(!dst)return;
  const ar=app.getBoundingClientRect(),a=src.getBoundingClientRect(),b=dst.getBoundingClientRect();if(!a.width||!b.width)return;
  const k=Math.max(3,Math.min(8,Math.round(n/4))),x0=a.left+a.width/2-ar.left-11,y0=a.top+a.height/2-ar.top-11,dx=b.left+b.width/2-ar.left-11-x0,dy=b.top+b.height/2-ar.top-11-y0;
  let shown=Math.max(0,S.coins-n);const put=v=>{if(inG)dst.textContent='💰 '+v;else $('coinCnt').textContent=v;};put(shown);

    const an=e.animate([{transform:'translate(0,0) scale(.5)',opacity:0},{transform:'translate('+dx*.2+'px,'+(dy*.2-34)+'px) scale(1.25)',opacity:1,offset:.3},{transform:'translate('+dx+'px,'+dy+'px) scale(.7)',opacity:1}],{duration:620,delay:300+i*80,easing:'ease-in',fill:'both'});
    an.onfinish=()=>{if(e.parentNode)e.parentNode.removeChild(e);shown=Math.min(S.coins,shown+Math.ceil(n/k));put(i===k-1?S.coins:shown);

/* ---- окно победы: «сколько до следующей награды» и одно напоминание о том, что ждёт на карте (аудит 14) ---- */
function bar(done,all){const n=Math.min(10,all),k=Math.max(0,Math.min(n,Math.round(done/all*n)));return '<span class="bar" aria-hidden="true">'+'<b class="on"></b>'.repeat(k)+'<b></b>'.repeat(n-k)+'</span>';}
function winGoal(idx){const done=S.unlocked-1; // пройдено дворов подряд

    return `<p class="goal" data-fit="4">🚗 ${MODELS[k].name}: ${bar(done-prev,CAR_AT[k]-prev)} <span class="nw">${L('ещё','in')} ${left} ${pl(left,'двор','двора','дворов','yard','yards')}</span></p>`;}
  const t=Math.floor(idx/10),nx=CHEST[S.chest[t]||0]; // машины кончились — сундук этого десятка
  if(nx){const n=chestStars(t);if(n<nx[0])return `<p class="goal" data-fit="4">🎁 ${L('До сундука:','Chest:')} ${bar(n,nx[0])} ${n}/${nx[0]} ⭐</p>`;}
  return '';}
