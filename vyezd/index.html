<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Выезд со двора</title>
<style>
:root{--ink:#2d3436;--accent:#ff7a45;--accent2:#ffb347;--muted:#95a5a6;--card:#fffdf7}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;background:linear-gradient(#9ed8f0,#cdeec0 32%,#8cc071);overscroll-behavior:none;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--ink);overflow:hidden;touch-action:manipulation}
#app{position:relative;max-width:520px;height:100%;margin:0 auto;background:linear-gradient(#9ed8f0,#cdeec0 32%,#8cc071);overflow:hidden}
.screen{position:absolute;top:0;right:0;bottom:0;left:0;display:none;flex-direction:column}
.screen.on{display:flex}
button{font:inherit;color:inherit;border:0;cursor:pointer}
.btn{background:#fff;border-radius:16px;padding:12px 16px;font-weight:700;box-shadow:0 4px 0 #c7c1b0,0 6px 14px rgba(0,0,0,.12);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #c7c1b0}
.btn.accent{background:linear-gradient(#d9480f,#b8390a);color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.25);box-shadow:0 4px 0 #8a2a06,0 6px 14px rgba(0,0,0,.15)}
.btn.accent:active{box-shadow:0 1px 0 #8a2a06}
.btn.green{background:linear-gradient(#2b8a3e,#237032);color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.25);box-shadow:0 4px 0 #17501f,0 6px 14px rgba(0,0,0,.15)}
.btn small{opacity:.85;font-size:.8em}
.icon{width:44px;height:44px;border-radius:14px;background:rgba(255,255,255,.85);font-size:22px;font-weight:800;box-shadow:0 3px 0 rgba(0,0,0,.12)}
/* map */
.mh{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 6px;padding-top:max(14px,env(safe-area-inset-top))}
.logo{font-size:24px;font-weight:900;letter-spacing:.3px;color:#1f3b57;text-shadow:0 1px 0 rgba(255,255,255,.8),0 2px 8px rgba(255,255,255,.5)}
.pill{background:rgba(255,255,255,.9);border-radius:999px;padding:6px 12px;font-weight:800;box-shadow:0 3px 0 rgba(0,0,0,.1)}
.map-scroll{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:10px 16px 20px;position:relative}
.route{position:relative}
.node-row{display:flex;align-items:center;gap:12px;height:86px;position:relative}
.node-row.r{flex-direction:row-reverse;text-align:right}
.node-row:not(:last-child)::after{content:"";position:absolute;top:62px;height:48px;border-left:5px dotted rgba(255,255,255,.9);z-index:0}
.node-row.l::after{left:calc(22% + 30px);transform:rotate(-38deg);transform-origin:top}
.node-row.r::after{right:calc(22% + 30px);transform:rotate(38deg);transform-origin:top}
.node-row.l{padding-left:22%}.node-row.r{padding-right:22%}
.node{position:relative;z-index:1;width:62px;height:62px;border-radius:50%;background:linear-gradient(#ffd36e,#ff9f43);color:#3a2206;font-size:24px;font-weight:900;box-shadow:0 5px 0 #c8741d,0 8px 16px rgba(0,0,0,.2);flex:none}
.node.done{background:linear-gradient(#8be28f,#3fae5a);color:#0f3d1f;box-shadow:0 5px 0 #2b7a3f,0 8px 16px rgba(0,0,0,.2)}
.node.locked{background:linear-gradient(#d5dbdf,#aab4ba);box-shadow:0 5px 0 #7f8c8d;cursor:default;font-size:20px}
.node.cur{animation:pulse 1.2s infinite}
.node.boss{background:linear-gradient(#e53935,#c62828);color:#fff;box-shadow:0 5px 0 #a82b25,0 8px 16px rgba(0,0,0,.2)}
.node.boss.done{background:linear-gradient(#8be28f,#3fae5a);color:#0f3d1f;box-shadow:0 5px 0 #2b7a3f,0 8px 16px rgba(0,0,0,.2)}
.node::after{content:"";position:absolute;left:16%;top:8%;width:68%;height:36%;border-radius:50%;background:linear-gradient(rgba(255,255,255,.55),rgba(255,255,255,0));pointer-events:none}
.node .fire{position:absolute;top:-10px;right:-8px;font-size:20px}
.region{margin:14px 0 4px;text-align:center;font-weight:900;font-size:15px;color:#2d5b77;letter-spacing:.5px}
.region span{background:rgba(255,255,255,.85);padding:6px 14px;border-radius:999px;box-shadow:0 3px 0 rgba(0,0,0,.08)}
.hdr-r{display:flex;gap:8px;align-items:center}
.icon.snd{width:44px;height:44px;font-size:20px;border-radius:14px}
@keyframes pulse{50%{transform:scale(1.08)}}
/* подписи на траве — на тёмной плашке (контраст ≥ 4.5) */
.nlabel{background:rgba(22,44,32,.58);border-radius:12px;padding:3px 10px 4px;min-width:0}
.nlabel b{display:block;font-size:17px;color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.35)}
.st{color:#ffd23f;font-size:16px;letter-spacing:1px;text-shadow:0 1px 0 rgba(0,0,0,.3)}
.soon{text-align:center;padding:10px 0 4px}.soon span{display:inline-block;color:#fff;font-weight:700;background:rgba(22,44,32,.58);border-radius:12px;padding:6px 12px}
.mnav{display:flex;gap:10px;padding:10px 16px;padding-bottom:max(14px,env(safe-area-inset-bottom));background:rgba(255,255,255,.35);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.mnav .btn{flex:1}
/* game */
.gh{display:flex;align-items:center;gap:10px;padding:10px 12px 4px;padding-top:max(10px,env(safe-area-inset-top))}
.gt{flex:1;line-height:1.15}
.gt>div:first-child{font-weight:900;font-size:18px;color:#1f3b57;text-shadow:0 1px 0 rgba(255,255,255,.7)}
.sub{font-size:14px;font-weight:700;color:#2d5b77}
.hearts{font-size:22px;letter-spacing:2px;min-width:80px;text-align:right}
.hearts .off{filter:grayscale(1);opacity:.35}
.stage{flex:1;position:relative;min-height:0}
canvas{display:block;touch-action:none}
.tip{position:absolute;left:12px;right:12px;top:6px;background:rgba(255,255,255,.93);border-radius:14px;padding:10px 12px;font-weight:700;font-size:14px;text-align:center;box-shadow:0 4px 14px rgba(0,0,0,.15);display:none}
.gf{display:flex;gap:10px;padding:8px 12px;padding-bottom:max(12px,env(safe-area-inset-bottom))}
.gf .btn{flex:1}
/* garage */
.gar-grid{flex:1;overflow-y:auto;overscroll-behavior:contain;display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px 16px 24px;align-content:start}
.gcard{background:var(--card);border-radius:18px;padding:10px;text-align:center;box-shadow:0 4px 0 #d9d2bf}
.gcard canvas{width:100%;height:84px;display:block}
.gcard b{display:block;margin-top:4px}
.gcard small{color:#57606f;font-weight:600;font-size:14px}
.gcard.lock{opacity:.55}
.gcard.own{cursor:pointer}
.sws{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin:10px 0 4px}
.sw{width:44px;height:44px;border-radius:50%;box-shadow:0 0 0 2px #fff,0 2px 6px rgba(0,0,0,.3);font-weight:900;font-size:20px;color:#fff;text-shadow:0 1px 3px #000}
.sw.on{box-shadow:0 0 0 3px #fff,0 0 0 6px #2d3436}
.gcard.lock canvas{filter:brightness(0) opacity(.25)}
/* modal & ad */
.modal,.ad{position:absolute;top:0;right:0;bottom:0;left:0;display:none;align-items:center;justify-content:center;background:rgba(20,30,40,.5);z-index:10;padding:20px}
.modal{overflow-y:auto;overscroll-behavior:contain}
.modal.on,.ad.on{display:flex}
.card{background:var(--card);border-radius:24px;padding:22px 18px 18px;width:100%;max-width:360px;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.3);animation:pop .25s ease-out}
@keyframes pop{from{transform:scale(.85);opacity:0}}
.card h2{margin:0 0 6px;font-size:24px}
.card p{margin:6px 0;color:#57606f;font-weight:600}
.big-stars{font-size:44px;color:#ffc312;letter-spacing:4px;margin:6px 0;text-shadow:0 3px 0 #d68910}
.big-stars .e{color:#8a939c;text-shadow:none}
.newcar{background:#fff3d6;border-radius:16px;padding:8px;margin:10px 0}
.newcar canvas{width:100%;height:70px}
.row{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.ad{background:#111;color:#fff;text-align:center;font-size:22px;font-weight:800}
.ad small{font-weight:500;opacity:.7;font-size:14px}
.adt{font-size:54px;margin-top:16px}
.toast{position:absolute;left:50%;bottom:90px;transform:translateX(-50%);background:rgba(0,0,0,.82);color:#fff;padding:9px 14px;border-radius:12px;font-weight:700;font-size:15px;line-height:1.3;opacity:0;transition:opacity .25s;pointer-events:none;z-index:20;white-space:normal;text-align:center;width:max-content;max-width:90%}
.toast.on{opacity:1}
.logo{font-size:21px}
.gt{min-width:0}.sub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gh-r{display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.gh-r .hearts{font-size:17px;min-width:0;letter-spacing:1px}
.pill.sm{padding:3px 10px;font-size:14px;box-shadow:0 2px 0 rgba(0,0,0,.1)}
button.pill{cursor:pointer;position:relative}
/* невидимое расширение области нажатия до ~44 px */
button.pill::before{content:"";position:absolute;top:-10px;bottom:-10px;left:-6px;right:-6px}
.gf .btn.sq{flex:0 0 60px;padding:6px 0;font-size:20px;display:flex;flex-direction:column;align-items:center;line-height:1.1}
.btn.sq small{display:block;font-size:12px;font-weight:700;opacity:1}
.btn.bst{display:flex;flex-direction:column;align-items:center;line-height:1.15;padding:7px 6px}
.btn.bst small{font-size:13.5px;opacity:1;line-height:1.15}
.btn.on{outline:3px solid #ffd23f;outline-offset:2px}
.lb{max-height:46vh;overflow:auto;overscroll-behavior:contain;margin-top:8px;text-align:left}.lbr{display:flex;gap:10px;align-items:center;padding:6px 8px;border-radius:10px}.lbr:nth-child(odd){background:rgba(0,0,0,.05)}.lbr.me{background:#ffe7a3}.lbr b{width:28px;text-align:right}.lbr span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.lbr i{font-style:normal;font-weight:800}
.coins-won{font-size:22px;font-weight:900;color:#e1a100!important}
.clean{font-weight:800;color:#1e8a5a!important}
.nw{white-space:nowrap}
/* узкие/низкие экраны, ПК */
.logo{white-space:nowrap}
.hdr-r .pill{white-space:nowrap}
@media (max-width:400px){.mh{padding-left:12px;padding-right:12px}.logo{font-size:17px}.logo .lc{display:none}.hdr-r{gap:5px}.hdr-r .pill{padding:5px 8px;font-size:14px}}
@media (max-height:520px){.tip{font-size:14px;padding:6px 10px;top:4px}.gh{padding-top:4px;padding-bottom:0}.gh .icon{width:44px;height:44px;font-size:18px}.gt>div:first-child{font-size:15px}.gf{padding-top:4px;padding-bottom:6px}.gf .btn{padding-top:4px;padding-bottom:4px}.btn.bst{flex-direction:row;gap:6px;justify-content:center}}
@media (min-width:900px) and (min-height:600px){#app{max-width:640px;box-shadow:0 0 50px rgba(0,0,0,.18)}}
.btn.locked{opacity:.75;filter:saturate(.4)}
.btn.locked small{display:block;font-size:13px;opacity:1}
/* время суток */
#scr-game.dark .sub{color:#e3ebff}
#scr-game.dark .gt>div:first-child{color:#fff;text-shadow:0 2px 0 #1b2a4a}
/* зум */
.zbtn{position:absolute;right:10px;top:8px;display:none;background:rgba(255,255,255,.92);border-radius:999px;padding:12px 16px;min-height:44px;font-weight:800;font-size:14px;box-shadow:0 3px 0 rgba(0,0,0,.15),0 4px 12px rgba(0,0,0,.15);z-index:2}
.zbtn.on{display:block}
#tip[style*="block"]~.zbtn{top:auto;bottom:10px}
/* серия дней */
.mnav .btn.sq{flex:0 0 64px;padding:6px 0;font-size:20px;position:relative;line-height:1.1}
.mnav .btn.sq .dot{position:absolute;top:4px;right:6px;width:10px;height:10px;border-radius:50%;background:#ff4757;box-shadow:0 0 0 2px #fff}
.streak{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:12px 0 4px}
.sd{background:#f1ede2;border-radius:12px;padding:6px 2px;font-weight:800;font-size:15px;line-height:1.2;position:relative;color:#57606f}
.sd small{display:block;font-size:13px;font-weight:700}
.sd.done{background:#c8efcf;color:#2b7a3f}
.sd.done::after{content:"✓";position:absolute;top:2px;right:6px;font-size:13px}
.sd.today{background:linear-gradient(#ffd36e,#ff9f43);color:#3a2206;box-shadow:0 3px 0 #c8741d;animation:pulse 1.2s infinite}
.sd.d7{grid-column:span 2;background:#ffe9b8}
.sd.d7.today{background:linear-gradient(#ffd36e,#ff7a45)}
.sd .ic{font-size:20px;display:block}
/* настройки, сундуки */
.set{display:flex;align-items:center;justify-content:space-between;background:#f1ede2;border-radius:14px;padding:10px 12px;margin-top:8px;font-weight:700;text-align:left;color:#2d3436;width:100%;min-height:48px}
.set i{font-style:normal;font-weight:800;color:#b8390a}.set i.off{color:#57606f}
.about{font-size:14px;text-align:left;color:#57606f}
.chest{display:flex;align-items:center;justify-content:center;gap:10px;margin:6px 0 2px;flex-wrap:wrap}
.chest>span{background:rgba(22,44,32,.58);color:#fff;font-weight:800;border-radius:12px;padding:6px 12px;font-size:15px}
.chest .btn{padding:8px 12px;font-size:15px}
.hearts.warn{animation:pulse .5s 4}
body.calm .hearts.warn{animation:none}
/* меньше движения: системная настройка или «спокойный режим» в игре */
@media (prefers-reduced-motion:reduce){.node.cur,.sd.today{animation:none}.card{animation:none}}
body.calm .node.cur,body.calm .sd.today,body.calm .card{animation:none}
/* запасные отступы для старых браузеров без gap во flex (≈ те же, где нет inset) */
/* вырез экрана слева/справа (iPhone в альбомной ориентации) */
.mh,.mnav{padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.gh,.gf{padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
@supports not (inset:0){.mnav>*+*,.gf>*+*,.gh>*+*,.hdr-r>*+*,.chest>*+*{margin-left:10px}.sws>*{margin:5px}.row>*+*{margin-top:10px}.node-row>*+*{margin-left:12px}.node-row.r>*+*{margin-left:0;margin-right:12px}.gh-r>*+*{margin-top:3px}.lbr>*+*{margin-left:10px}}
</style>
<script>/* iPhone: звук в бесшумном режиме. Просим сеанс «воспроизведение» (Safari 17+) и держим тихий <audio> — иначе переключатель «без звука» глушит Web Audio целиком. */
(function(){var a=null;function on(){try{if(navigator.audioSession)navigator.audioSession.type='playback';}catch(e){}
if(!a){try{a=new Audio('data:audio/wav;base64,UklGRmQGAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YUAGAACAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICA');a.loop=true;a.volume=0.01;a.setAttribute('playsinline','');}catch(e){a=null;}}

['touchend','click','keydown'].forEach(function(e){document.addEventListener(e,on,{capture:true,passive:true});});

</head>
<body>
<div id="app">
  <section id="scr-map" class="screen on">
    <header class="mh"><div class="logo"><span class="lc">🚗 </span>Выезд со двора</div><div class="hdr-r"><button class="icon snd" id="btnSet" aria-label="Настройки">⚙️</button><div class="pill">⭐ <span id="totStars">0</span></div><button class="pill" id="mCoins">💰 <span id="coinCnt">0</span></button></div></header>
    <div class="map-scroll"><div class="route" id="mapList"></div><div class="soon"><span>Проходи дальше — дворы не кончаются!</span></div></div>
    <nav class="mnav"><button id="btnDaily" class="btn accent">📅 Задание дня</button><button id="btnGarage" class="btn">🅿️ Гараж <span id="garCnt"></span></button><button id="btnStreak" class="btn sq" aria-label="Серия дней">🎁<small>Подарок</small></button></nav>
  </section>

  <section id="scr-game" class="screen">
    <header class="gh"><button class="icon" id="gBack" aria-label="На карту">←</button><div class="gt"><div id="gLevel">Уровень 1</div><div id="gCity" class="sub">Калининград</div></div><div class="gh-r"><div id="gHearts" class="hearts"></div><button class="pill sm" id="gCoins">💰 0</button></div><button class="icon snd" id="gSet" aria-label="Настройки">⚙️</button></header>
    <div class="stage" id="stage"><canvas id="cv"></canvas><div id="tip" class="tip"></div><button id="zReset" class="zbtn">🔍 Весь двор</button><button id="zIn" class="zbtn">🔍 Приблизить</button></div>
    <footer class="gf"><button class="btn sq" id="gRestart" aria-label="Заново">↻<small>Заново</small></button><button class="btn accent bst" id="gHint"><b>💡 Подсказка</b><small id="hintPr">40 💰</small></button><button class="btn accent bst" id="gTow"><b>🚚 Эвакуатор</b><small id="towPr">100 💰</small></button></footer>
  </section>

  <section id="scr-garage" class="screen">
    <header class="gh"><button class="icon" id="garBack" aria-label="Назад">←</button><div class="gt"><div>Гараж</div><div class="sub">Нажми на машину: цвет и двор</div></div></header>
    <div class="gar-grid" id="garGrid"></div>
  </section>

  <div id="modal" class="modal"><div class="card" id="mcard"></div></div>
  <div id="ad" class="ad"><div>📺 Реклама<br><small>скоро продолжим</small><div id="adT" class="adt">3</div></div></div>
  <div id="toast" class="toast"></div>
</div>

<script>
'use strict';
/* ================= данные ================= */
const DIRS=[[0,-1],[1,0],[0,1],[-1,0]];
const CITIES=['Калининград','Псков','Великий Новгород','Тверь','Москва','Владимир','Нижний Новгород','Казань','Самара','Екатеринбург',
  'Челябинск','Тюмень','Омск','Новосибирск','Томск','Кемерово','Барнаул','Красноярск','Иркутск','Улан-Удэ',
  'Чита','Благовещенск','Биробиджан','Хабаровск','Комсомольск-на-Амуре','Южно-Сахалинск','Магадан','Петропавловск-Камчатский','Находка','Владивосток'];
const WORLD=['Минск','Алматы','Ташкент','Бишкек','Тбилиси','Ереван','Баку','Стамбул','Дубай','Дели','Пекин','Сеул','Токио','Бангкок','Каир','Рим','Париж','Берлин','Лондон','Нью-Йорк'];
const REGIONS=[{from:0,name:'Центр и Поволжье'},{from:10,name:'Урал и Сибирь'},{from:20,name:'Дальний Восток'},{from:30,name:'Вокруг света'},{from:50,name:'Бесконечные дворы'}];
const levelName=i=>i<30?CITIES[i]:i<50?WORLD[i-30]:'Двор №'+(i+1);
const isBoss=i=>i%10===9;
// сложность растёт плавно: размер двора, плотность, длина машин, препятствия, доля «свободных с начала»
function levelParams(i){

// заглушка — только на маке (без SDK / ?vk=1); в настоящем VK без ответа моста награды нет
function stubAd(cb){const ad=$('ad'),tEl=$('adT');ad.classList.add('on');adOpen();let n=3;tEl.textContent=n;const it=setInterval(()=>{n--;tEl.textContent=n;if(n<=0){clearInterval(it);ad.classList.remove('on');adClose();cb();}},600);}
function adOpen(){setPause('ad',true);YG.stop();}
// игра снова «идёт» для GameplayAPI, только если двор на экране и поверх нет окна
function adClose(){setPause('ad',false);if(G&&!G.over&&!modalOn&&$('scr-game').classList.contains('on'))YG.start();}
const AD_FAIL='Реклама сейчас недоступна — загляни чуть позже',VK_REAL=/[?&]vk_app_id=/.test(location.search);
// межэкранная: не раньше чем через AD_GAP после ЛЮБОЙ рекламы (и за награду тоже) и после запуска; первая — не раньше 11-го двора (AD_FROM)
let lastAdT=Date.now(),AD_GAP=180000;const AD_FROM=11;
// за награду — по желанию игрока; пока ролик идёт, повторные нажатия не запускают второй (и не дают двойную награду)
let adBusy=false;
function showRewarded(cb0,onFail0){
  if(adBusy)return;adBusy=true;clearTimeout(showRewarded._t);showRewarded._t=setTimeout(()=>{adBusy=false;},90000);
  const cb=()=>{adBusy=false;lastAdT=Date.now();cb0();},onFail=()=>{adBusy=false;lastAdT=Date.now();onFail0&&onFail0();};
  if(PLAT==='vk'&&!VK){if(VK_REAL){toast(AD_FAIL);onFail();}else stubAd(cb);return;} // мост VK не ответил — награду даром не даём; ?vk=1 на маке — заглушка
  if(VK){adOpen();vkSend('VKWebAppShowNativeAds',{ad_format:'reward'},60000)
      .then(r=>{adClose();if(r&&r.result)cb();else{toast(AD_FAIL);onFail();}})
      .catch(()=>{adClose();toast(AD_FAIL);onFail();})
      .finally(()=>vkSend('VKWebAppCheckNativeAds',{ad_format:'reward'}).catch(()=>{}));return;}
  if(!ysdk){stubAd(cb);return;}
  let got=false;
  ysdk.adv.showRewardedVideo({callbacks:{onOpen:adOpen,onRewarded:()=>{got=true;},
    onClose:()=>{adClose();if(got)cb();else{toast('Досмотри видео до конца, чтобы получить награду');onFail();}},
    onError:()=>{adClose();toast(AD_FAIL);onFail();}}});
}
function adReady(){return Date.now()-lastAdT>=AD_GAP&&!(PLAT==='vk'&&!VK&&VK_REAL);}
// кнопки «📺 … за рекламу» есть везде, кроме настоящего VK без моста (там ролик не показать)
function adOk(){return !(PLAT==='vk'&&!VK&&VK_REAL);}
// «долг» межэкранной: S.adW — побед с прошлого показа; показ положен при S.adW ≥ AD_EVERY. Если сейчас нельзя (босс, новая машина,
// пауза после рекламы, выход «На карту») — показ не сгорает, а ждёт следующей победы. Обнуляется только после настоящего показа
function adDue(){return (S.adW||0)>=AD_EVERY&&(S.unlocked||1)>AD_FROM;}
function showInterstitial(cb0){
  const cb=shown=>{lastAdT=Date.now();if(shown!==false){S.adW=0;save();}cb0();};
  if(PLAT==='vk'&&!VK){if(VK_REAL)cb0();else stubAd(cb);return;}
  if(VK){adOpen();vkSend('VKWebAppShowNativeAds',{ad_format:'interstitial'},60000).then(r=>!!(r&&r.result),()=>false).then(ok=>{adClose();cb(ok);});return;}
  if(!ysdk){stubAd(cb);return;}
  ysdk.adv.showFullscreenAdv({callbacks:{onOpen:adOpen,onClose:w=>{adClose();cb(w!==false);},onError:()=>{adClose();cb(false);}}});
}
function hint(){
  if(!G||G.over)return;
  const {w,h}=G.p,cand=G.vs.filter(v=>v.state==='idle'&&canExit(v,G.occ,w,h,v.id).free);
  if(!cand.length)return;
  // сначала — скорая и те, кто её запирает; потом полиция; иначе любая, кто может уехать
  let best=null;if(G.amb&&!G.amb.done){const need=closureOf(G.vs,G.occ,w,h,G.amb.id);best=cand.find(v=>v.id===G.amb.id)||cand.find(v=>need.has(v.id));}
  best=best||cand.find(v=>v.id===G.police)||cand[Math.floor(Math.random()*cand.length)];
  const g=G,use=()=>{if(G!==g||g.over)return;g.hint=best.id;g.hintT=4;g.helps++;};
  // монеты есть — можно и за монеты, и за рекламу (кто-то бережёт монеты); нет — как раньше: окно «Не хватает монет»
  if(S.coins<PRICE.hint||!adOk()){spend('hint',use);return;}
  modal(`<h2>💡 Подсказка</h2><p>Подсвечу машину, которой можно ехать.</p><div class="row"><button class="btn accent" id="mHintC">💡 За ${coinsTxt(PRICE.hint)}</button><button class="btn accent" id="mHintAd">📺 Бесплатно за рекламу</button><button class="btn" id="mCancel">Отмена</button></div>`);
  $('mHintC').onclick=()=>{hideModal();spend('hint',use);};$('mHintAd').onclick=()=>{hideModal();showRewarded(use);};$('mCancel').onclick=hideModal;
}
/* ================= монеты ================= */
// экономика (27.09): двор 6–10 💰, реклама за монеты +30 ≈ 3 двора; подсказка ≈ 4–5 дворов, жизнь ≈ 7–8, эвакуатор ≈ 10 — роскошь; модель — tools/econ-sim.py
// цель для монет (аудит 12): покраска машины из гаража и «своя машина во дворе» — не бустеры, выиграть ими нельзя
const PRICE={hint:40,tow:100,life:70,paint:150,yard:250},DAILY_REWARD=20;let AD_COINS=30,AD_EVERY=3,X2_ON=true;
// удалённая настройка Яндекса (флаги в консоли, по умолчанию их нет — действуют значения выше). Границы жёсткие:
// межэкранная — не чаще раза в 2 двора (по умолчанию 3) и не чаще раза в 180 с (ad_gap — только больше); ×2 за рекламу можно выключить флагом x2=0
function applyFlags(f){if(!isObj(f))return;const num=(k,a,b)=>{const n=parseInt(f[k],10);return isFinite(n)&&n>=a&&n<=b?n:null;};let n;
  if((n=num('price_hint',20,120))!==null)PRICE.hint=n;if((n=num('price_life',30,200))!==null)PRICE.life=n;if((n=num('price_tow',40,300))!==null)PRICE.tow=n;
  if((n=num('ad_coins',10,100))!==null)AD_COINS=n;if((n=num('ad_every',2,6))!==null)AD_EVERY=n;if((n=num('ad_gap',180,600))!==null)AD_GAP=n*1000;
  if((n=num('price_paint',50,600))!==null)PRICE.paint=n;if((n=num('price_yard',50,800))!==null)PRICE.yard=n;if(f.x2==='0'||f.x2==='off')X2_ON=false;updCoins();}
function updCoins(){const a=$('gCoins'),b=$('coinCnt');if(a)a.textContent='💰 '+S.coins;if(b)b.textContent=S.coins;
  // монет не хватает — на кнопке сразу видно, что можно за рекламу
  for(const [id,k] of [['hintPr','hint'],['towPr','tow']]){const e=$(id);if(e)e.textContent=S.coins>=PRICE[k]?PRICE[k]+' 💰':'📺 бесплатно за рекламу';}}
function setCoins(n){S.coins=Math.max(0,n);save();updCoins();}
function spend(kind,then){const pr=PRICE[kind];
  if(S.coins>=pr){setCoins(S.coins-pr);SND.coin();then();return;}
  modal(`<h2>Не хватает монет</h2><p>Нужно ${coinsTxt(pr)}, а у тебя ${coinsTxt(S.coins)}.</p><div class="row"><button class="btn accent" id="mAdFree">📺 Бесплатно за рекламу</button><button class="btn" id="mShop">💰 Получить монеты</button><button class="btn" id="mCancel">Отмена</button></div>`);
  $('mAdFree').onclick=()=>{hideModal();showRewarded(then);};$('mShop').onclick=()=>{hideModal();openShop();};$('mCancel').onclick=hideModal;}
function openShop(){
  modal(`<h2>Монеты 💰</h2><p>У тебя ${coinsTxt(S.coins)}. Монеты дают за каждый двор, больше — за три звезды, сложные дворы и сундуки за звёзды на карте.</p><div class="row"><button class="btn accent" id="mAdCoins">📺 +${coinsTxt(AD_COINS)} за рекламу</button><button class="btn" id="mCancel">Закрыть</button></div>`);
  $('mAdCoins').onclick=()=>{hideModal();showRewarded(()=>{setCoins(S.coins+AD_COINS);SND.coin();toast('+'+AD_COINS+' 💰');});};$('mCancel').onclick=hideModal;}

/* ================= рейтинг заданий дня =================
   Очки — сколько дней выполнено задание дня (растёт каждый день, у всех игроков одинаковое задание).
   Яндекс: лидерборд с техническим именем daily (создать в консоли). VK: таблица друзей VKWebAppShowLeaderBoardBox.
   Нет SDK/моста — кнопки нет (никаких заглушек). */
const LB={
  days(){return Object.keys(S.daily||{}).length;},
  ok(){return PLAT==='vk'?!!VK:!!(ysdk&&(ysdk.leaderboards||ysdk.getLeaderboards));},
  async submit(){const n=LB.days();if(!n)return;
    if(PLAT==='vk')return; // VK сам запоминает результат из ShowLeaderBoardBox
    try{if(!ysdk)return;if(ysdk.leaderboards&&ysdk.leaderboards.setScore)await ysdk.leaderboards.setScore('daily',n);
      else{const lb=await ysdk.getLeaderboards();await lb.setLeaderboardScore('daily',n);}}catch(e){}},
  async entries(){const o={includeUser:true,quantityAround:2,quantityTop:10};
    try{if(ysdk.leaderboards&&ysdk.leaderboards.getEntries)return await ysdk.leaderboards.getEntries('daily',o);
      const lb=await ysdk.getLeaderboards();return await lb.getLeaderboardEntries('daily',o);}catch(e){return null;}},
  async show(){
    if(PLAT==='vk'){if(!VK)return;vkSend('VKWebAppShowLeaderBoardBox',{user_result:LB.days()},60000).catch(()=>toast('Таблица друзей сейчас недоступна'));return;}
    const back=()=>{hideModal();if(G&&G.over&&G.daily)openMap();};
    modal(`<h2>🏆 Рейтинг</h2><p>Загружаем…</p>`);
    const r=await LB.entries();const list=(r&&r.entries)||[];
    const me=r&&typeof r.userRank==='number'?r.userRank:0,authed=!!(YP&&YP.getMode&&YP.getMode()!=='lite');
    const esc=t=>String(t||'').replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));
    const rows=list.map(e=>`<div class="lbr${e.rank===me?' me':''}"><b>${e.rank}</b><span>${esc(e.player&&e.player.publicName)||'Игрок'}</span><i>${e.score} 📅</i></div>`).join('');
    modal(`<h2>🏆 Рейтинг</h2><p>Сколько дней выполнено задание дня. У тебя: <b>${LB.days()}</b></p>
      <div class="lb">${rows||'<p>Пока пусто — будь первым!</p>'}</div>
      ${authed?'':'<p><small>Чтобы попасть в рейтинг, войди в аккаунт Яндекса.</small></p>'}
      <div class="row">${authed||!(ysdk&&ysdk.auth)?'':'<button class="btn accent" id="lbAuth">Войти</button>'}<button class="btn" id="lbClose">Закрыть</button></div>`);
    $('lbClose').onclick=back;
    // после входа — другой аккаунт и другое облако: перечитываем и сливаем, а не пишем туда сохранение этого устройства
    const a=$('lbAuth');if(a)a.onclick=async()=>{try{await ysdk.auth.openAuthDialog();YP=await ysdk.getPlayer({scopes:false});
      clearTimeout(cloudT);cloudT=0;cloudReady=false;cloudTry=0;await cloudLoad(true);updCoins();await LB.submit();}catch(e){}LB.show();};}
};

// пустая звезда — контуром ☆ (отличается не только цветом)
function starsHtml(n){let s='';for(let i=0;i<3;i++)s+=i<n?'★':'<span class="e">☆</span>';return s;}
function win(){
  G.over=true;YG.stop();SND.win();const st=Math.max(1,G.hearts);let newModel=null;
  if(G.daily){S.daily[todayKey()]=Math.max(S.daily[todayKey()]||0,st);}
  else{const i=G.idx;const first=!S.stars[i];S.stars[i]=Math.max(S.stars[i]||0,st);S.unlocked=Math.max(S.unlocked,i+2);
    const mi=CAR_AT.indexOf(i+1);if(first&&mi>=0&&MODELS[mi]&&!S.garage.includes(mi)){S.garage.push(mi);newModel=MODELS[mi];}S.levelsDone++;S.adW=(S.adW||0)+1;}
  const reward=(G.daily?DAILY_REWARD:(4+2*st)*(isBoss(G.idx)?2:1))+G.bonus;S.coins+=reward;
  save();updCoins();setTimeout(()=>SND.coin(),500);
  const hasNext=!G.daily;
  const regionDone=!G.daily&&isBoss(G.idx);
  const adNext=hasNext&&adDue()&&!regionDone&&!newModel&&adReady();
  // ×2 за рекламу: не во дворах обучения (1–3), не когда следом межэкранная (два ролика подряд), в VK — только с мостом
  const x2=X2_ON&&(G.daily||G.idx>=3)&&!adNext&&!(PLAT==='vk'&&!VK&&VK_REAL);
  const clean=!G.crashes&&!G.helps;
  modal(`<h2>${regionDone?'Регион пройден! 🏆':'Двор свободен! 🎉'}</h2><div class="big-stars">${starsHtml(st)}</div>
    <p>${G.daily?'Задание дня выполнено! Завтра будет новое.':levelName(G.idx)+': двор пройден за '+G.moves+' '+plural(G.moves,'ход','хода','ходов')}</p>
    ${!G.daily&&G.idx===2?'<p><b>Дальше за каждую аварию — минус ❤️.</b></p>':''}
    ${clean?'<p class="clean">✨ Чисто! Без аварий и подсказок</p>':''}
    <p class="coins-won" id="mWon">+${reward} 💰${G.bonus?' <small>(скорая успела!)</small>':''}</p>
    ${newModel?`<div class="newcar"><p>Новая машина в гараже: <b>${newModel.name}</b></p><canvas id="ncv"></canvas></div>`:''}
    <div class="row">${hasNext?'<button class="btn green" id="mNext">Дальше →</button>':''}${x2?`<button class="btn accent x2" id="mX2">📺 ×2 монеты за рекламу <span class="nw">(+${reward}&nbsp;💰)</span></button>`:''}${G.daily&&LB.ok()?'<button class="btn accent" id="mLb">🏆 Рейтинг</button>':''}<button class="btn" id="mMap">На карту</button></div>`);
  if(G.daily){LB.submit();const b=$('mLb');if(b)b.onclick=LB.show;}
  // награда — только после досмотренного ролика; второй раз за двор не даём
  const g=G,bx=$('mX2');if(bx)bx.onclick=()=>{if(g.x2)return;bx.disabled=true;
    showRewarded(()=>{if(g.x2)return;g.x2=true;setCoins(S.coins+reward);SND.coin();toast('+'+reward+' 💰 — удвоено!');
      const w=$('mWon');if(w&&G===g)w.innerHTML='+'+reward*2+' 💰 <small>(×2)</small>';if(bx.parentNode)bx.parentNode.removeChild(bx);},
      ()=>{bx.disabled=false;});};
  if(newModel)requestAnimationFrame(()=>drawModel($('ncv'),newModel));
  if(!G.daily)setTimeout(streakAfterWin,1500);setTimeout(offerReturn,2200);
  // реклама раз в AD_EVERY побед (долг не сгорает), не после босса/новой машины, не раньше 180 с после любой рекламы; перед показом — предупреждение
  const n=$('mNext');if(n)n.onclick=()=>{n.disabled=true;const go=()=>startLevel(G.idx+1);
    if(adNext&&adReady()){toast('Реклама через секунду…',1200);setTimeout(()=>showInterstitial(go),1000);}else go();};

function plural(n,a,b,c){const m=n%10,h=n%100;return m===1&&h!==11?a:m>=2&&m<=4&&(h<12||h>14)?b:c;}
const coinsTxt=n=>n+' '+plural(n,'монета','монеты','монет');

/* ---- сундуки за звёзды: у каждого десятка дворов 25★ → +40, все 30★ → ещё +60 (цель и после гаража, повод перепройти на 3★) ---- */
const CHEST=[[25,40],[30,60]];
function chestStars(k){let n=0;for(let i=k*10;i<k*10+10;i++)n+=S.stars[i]||0;return n;}
function chestRow(k){const n=chestStars(k),got=S.chest[k]||0,d=document.createElement('div');d.className='chest';
  const next=CHEST[got];let html=`<span>🎁 Дворы ${k*10+1}–${k*10+10}: ⭐ ${n}/30</span>`;
  if(next&&n>=next[0])html+=`<button class="btn green" data-m="1">Забрать ${next[1]} 💰</button>`+(X2_ON&&adOk()?`<button class="btn accent" data-m="2">📺 ×2 за рекламу (+${next[1]*2} 💰)</button>`:'');
  else if(next)html+=`<span>${next[0]}⭐ → +${next[1]} 💰</span>`;else html+='<span>✓ собран</span>';
  d.innerHTML=html;const g0=got;
  // ×2 — только за досмотренный ролик и только если сундук ещё не открыт (второй раз не даём)
  const open=m=>{const g=S.chest[k]||0,nx=CHEST[g];if(g!==g0||!nx||chestStars(k)<nx[0])return;S.chest[k]=g+1;S.coins+=nx[1]*m;save();updCoins();SND.coin();setTimeout(()=>SND.win(),200);
    toast('🎁 Сундук открыт: +'+coinsTxt(nx[1]*m)+(m>1?' (×2)':''));if(d.parentNode)d.replaceWith(chestRow(k));};
  d.querySelectorAll('button').forEach(b=>b.onclick=()=>{if(b.dataset.m==='2'){d.querySelectorAll('button').forEach(x=>x.disabled=true);
    showRewarded(()=>open(2),()=>d.querySelectorAll('button').forEach(x=>x.disabled=false));}else open(1);});
  return d;}

const PAINT=[null,['#1e272e','чёрный'],['#0652dd','синий'],['#009432','зелёный'],['#ffc312','жёлтый'],['#833471','вишнёвый'],['#b2bec3','серебристый']];

function buyCoins(pr,then,back){if(S.coins>=pr){setCoins(S.coins-pr);SND.coin();setTimeout(()=>SND.win(),200);then();return;}

function openCar(i,sel){const m=MODELS[i];if(!m||!S.garage.includes(i))return;const cur=S.paint[i]||0;if(sel==null)sel=cur;

/* ---- зум и перетаскивание: тап срабатывает при отпускании, если палец почти не сдвинулся ---- */
function zoomMax(){return Math.max(1.8,Math.min(3.5,76/cs));}
function camClamp(){cam.z=Math.max(1,Math.min(zoomMax(),cam.z));cam.x=Math.min(0,Math.max(W-W*cam.z,cam.x));cam.y=Math.min(0,Math.max(H-H*cam.z,cam.y));}
// «🔍 Весь двор» — когда приближено; «🔍 Приблизить» — на широких дворах (от 8 клеток), чтобы о зуме знали не только по щипку
function updZoomBtn(){if(cam.z>1.02&&!(G&&G.towMode)){const t=$('tip');if(t.style.display==='block'&&!(G&&!G.daily&&G.idx===0))t.style.display='none';}
  const zin=cam.z>1.02||!!(cam.tw&&cam.tw.z1>1.02);$('zReset').classList.toggle('on',zin);$('zIn').classList.toggle('on',!zin&&!!G&&G.p.w>=8);}
function zoomAt(sx,sy,z){const wx=(sx-cam.x)/cam.z,wy=(sy-cam.y)/cam.z;cam.tw=null;cam.z=Math.max(1,Math.min(zoomMax(),z));cam.x=sx-wx*cam.z;cam.y=sy-wy*cam.z;camClamp();updZoomBtn();hiResSoon();}
function camTo(z,x,y){if(Math.abs(cam.z-z)<.001&&Math.abs(cam.x-x)<.5&&Math.abs(cam.y-y)<.5)return;cam.tw={t:0,z0:cam.z,x0:cam.x,y0:cam.y,z1:z,x1:x,y1:y};updZoomBtn();}
// после приближения перерисовываем землю детальнее (с ограничением по памяти)
function hiResSoon(){clearTimeout(hiResSoon._t);hiResSoon._t=setTimeout(()=>{if(!G||!ground)return;
  const cap=Math.sqrt(4e6/Math.max(1,cv.width*cv.height)),q=Math.max(1,Math.min(cam.z,2.5,cap)); // земля ≤ 4 млн точек
  if(Math.abs(q-groundQ)>.3)buildGround(q);},250);}
const ptrs=new Map();let gest=null;
function cvPos(e){const r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top};}
cv.addEventListener('pointerdown',e=>{if(!G)return;ac();const p=cvPos(e);ptrs.set(e.pointerId,p);try{cv.setPointerCapture(e.pointerId);}catch(_){}
  if(ptrs.size===1)gest={mode:'tap',sx:p.x,sy:p.y,lx:p.x,ly:p.y};
  else if(ptrs.size===2){const [a,b]=[...ptrs.values()],mx=(a.x+b.x)/2,my=(a.y+b.y)/2;cam.tw=null;
    gest={mode:'pinch',d0:Math.max(10,Math.hypot(a.x-b.x,a.y-b.y)),z0:cam.z,wx:(mx-cam.x)/cam.z,wy:(my-cam.y)/cam.z};}});
cv.addEventListener('pointermove',e=>{if(!ptrs.has(e.pointerId)||!gest)return;const p=cvPos(e);ptrs.set(e.pointerId,p);
  if(gest.mode==='pinch'&&ptrs.size>=2){const [a,b]=[...ptrs.values()],mx=(a.x+b.x)/2,my=(a.y+b.y)/2,d=Math.hypot(a.x-b.x,a.y-b.y);
    cam.z=Math.max(1,Math.min(zoomMax(),gest.z0*d/gest.d0));cam.x=mx-gest.wx*cam.z;cam.y=my-gest.wy*cam.z;camClamp();updZoomBtn();return;}
  if(gest.mode==='tap'&&Math.hypot(p.x-gest.sx,p.y-gest.sy)>(e.pointerType==='mouse'?6:10))gest.mode='pan';
  if(gest.mode==='pan'){cam.tw=null;cam.x+=p.x-gest.lx;cam.y+=p.y-gest.ly;camClamp();}
  gest.lx=p.x;gest.ly=p.y;});
function ptrEnd(e){if(!ptrs.has(e.pointerId))return;const p=cvPos(e);ptrs.delete(e.pointerId);
  if(gest&&gest.mode==='tap'&&e.type==='pointerup'&&ptrs.size===0)tapAt((p.x-cam.x)/cam.z,(p.y-cam.y)/cam.z);
  if(gest&&gest.mode==='pinch'){hiResSoon();if(ptrs.size===1){const q=[...ptrs.values()][0];gest={mode:'pan',lx:q.x,ly:q.y};return;}}
  if(!ptrs.size){if(gest&&gest.mode!=='tap')hiResSoon();gest=null;}}
cv.addEventListener('pointerup',ptrEnd);cv.addEventListener('pointercancel',ptrEnd);
cv.addEventListener('wheel',e=>{if(!G)return;e.preventDefault();const p=cvPos(e),dy=e.deltaMode===1?e.deltaY*16:e.deltaY;zoomAt(p.x,p.y,cam.z*Math.exp(-dy*(e.ctrlKey?.01:.0018)));},{passive:false});
