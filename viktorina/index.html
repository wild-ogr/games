<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Дворовая викторина</title>
<style>
:root{--ink:#2d3436;--muted:#57606f;--card:#fffdf7;--qf:23px;--af:19px}
body.big{--qf:27px;--af:22px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;background:#2f5d3a;overscroll-behavior:none;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--ink);overflow:hidden;touch-action:manipulation}
#app{position:relative;max-width:560px;height:100%;margin:0 auto;background:linear-gradient(#9ed8f0,#d6efc9 36%,#9fcd82);overflow:hidden}
.screen{position:absolute;top:0;right:0;bottom:0;left:0;display:none;flex-direction:column}
.screen.on{display:flex}
button{font:inherit;color:inherit;border:0;cursor:pointer}
.btn{background:#fff;border-radius:16px;padding:12px 16px;font-weight:700;font-size:18px;box-shadow:0 4px 0 #c7c1b0,0 6px 14px rgba(0,0,0,.12);transition:transform .08s;min-height:52px;line-height:1.2}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #c7c1b0}
.btn.accent{background:linear-gradient(#e8590c,#c44d08);color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.25);box-shadow:0 4px 0 #8a3406,0 6px 14px rgba(0,0,0,.15)}
.btn.accent:active{box-shadow:0 1px 0 #8a3406}
.btn.green{background:linear-gradient(#2b8a3e,#237032);color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.25);box-shadow:0 4px 0 #17501f,0 6px 14px rgba(0,0,0,.15)}
.btn.blue{background:linear-gradient(#1c6fb8,#155a96);color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.25);box-shadow:0 4px 0 #0d3e69,0 6px 14px rgba(0,0,0,.15)}
.btn.violet{background:linear-gradient(#7b4fb8,#653e9a);color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.25);box-shadow:0 4px 0 #43276a,0 6px 14px rgba(0,0,0,.15)}
.btn[disabled]{opacity:.55}
.btn small{display:block;opacity:.92;font-size:14.5px;font-weight:600;margin-top:2px}
.icon{width:48px;height:48px;border-radius:14px;background:rgba(255,255,255,.9);font-size:22px;font-weight:800;box-shadow:0 3px 0 rgba(0,0,0,.12);flex:none}
.pill{background:rgba(255,255,255,.92);border-radius:999px;padding:7px 12px;font-weight:800;font-size:17px;box-shadow:0 3px 0 rgba(0,0,0,.1);white-space:nowrap;min-height:42px}
.pill.sm{padding:6px 10px;font-size:16px}
/* меню */
.mh{display:flex;align-items:center;justify-content:space-between;padding:12px 14px 6px;padding-top:max(12px,env(safe-area-inset-top))}
.logo{font-size:21px;font-weight:900;color:#1f3b57;text-shadow:0 1px 0 rgba(255,255,255,.8);white-space:nowrap;line-height:1.1}
.logo small{display:block;font-size:13px;font-weight:700;color:#3d5a73}
.hdr-r{display:flex;gap:8px;align-items:center}
.mscroll{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:6px 16px calc(18px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px}
.host{display:flex;align-items:flex-end;gap:10px;margin-top:4px}
.av{width:92px;height:92px;border-radius:50%;overflow:hidden;flex:none;background:#fff;box-shadow:0 3px 0 rgba(0,0,0,.12),0 0 0 3px #fff}
.av svg{display:block;width:100%;height:100%}
.bub{position:relative;flex:1;background:#fff;border-radius:18px;padding:12px 14px;font-size:17px;font-weight:600;line-height:1.35;box-shadow:0 3px 0 rgba(0,0,0,.08);margin-bottom:18px}
.bub::before{content:"";position:absolute;left:-9px;bottom:14px;border:9px solid transparent;border-right-color:#fff;border-left:0}
.bub b{color:#c44d08}
.rankb{background:rgba(255,255,255,.75);border-radius:14px;padding:9px 12px;font-weight:800;font-size:16px;text-align:center;color:#2d3436}
.rankb small{display:block;font-weight:600;color:#57606f;font-size:14px}
.wide{width:100%;text-align:left;padding:12px 16px}
.big{font-size:21px;min-height:62px}
.mfoot{margin-top:auto;text-align:center;font-size:14.5px;font-weight:700;color:#2f5d3a;background:rgba(255,255,255,.55);border-radius:12px;padding:8px 10px}
.nrow{display:flex;gap:10px}.nrow>*{flex:1}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#e03131;margin-left:6px;vertical-align:2px}
/* темы */
.gh{display:flex;align-items:center;gap:8px;padding:10px 12px 6px;padding-top:max(10px,env(safe-area-inset-top))}
.gt{flex:1;min-width:0;font-weight:900;font-size:18px;line-height:1.15;color:#1f3b57}
.gt .sub{font-size:14px;font-weight:700;color:#3d5a73;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tscroll{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:4px 14px calc(18px + env(safe-area-inset-bottom))}
.tgrid{display:flex;flex-wrap:wrap;justify-content:space-between}
.tp{width:49%;margin-bottom:10px;background:#fff;border-radius:16px;padding:10px 10px 12px;text-align:left;box-shadow:0 4px 0 #cfc8b8;position:relative;min-height:96px;display:flex;flex-direction:column}
.tp .ti{font-size:28px;line-height:1}
.tp b{display:block;font-size:16.5px;line-height:1.15;margin:5px 0 3px}
.tp small{font-size:13.5px;font-weight:600;color:#57606f}
.tp .md{position:absolute;top:8px;right:9px;font-size:22px}
.bar{display:block;height:6px;border-radius:3px;background:#ece6d8;margin-top:auto;overflow:hidden}
.bar i{display:block;height:100%;background:#2b8a3e;border-radius:3px}
.tp.all{width:100%;background:linear-gradient(#ffe7a3,#ffd36e);box-shadow:0 4px 0 #c8a041;min-height:0;flex-direction:row;align-items:center;gap:12px}
.tp.all b{font-size:19px;margin:0}
.thint{font-size:15px;font-weight:700;color:#2d3436;background:rgba(255,255,255,.75);border-radius:12px;padding:8px 12px;margin:2px 0 10px;text-align:center}
/* игра */
.gbody{flex:1;display:flex;flex-direction:column;padding:0 12px calc(10px + env(safe-area-inset-bottom));min-height:0;overflow-y:auto;overscroll-behavior:contain}
.gcol1,.gcol2{display:flex;flex-direction:column;gap:9px}
.gcol2{margin-top:9px}
.ladder{display:flex;gap:4px}
.ladder span{flex:1;height:30px;border-radius:9px;background:rgba(255,255,255,.6);font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center;color:#57606f;position:relative}
.ladder span.safe{box-shadow:inset 0 0 0 2px #e0a800}
.ladder span.done{background:#2b8a3e;color:#fff}
.ladder span.bad{background:#e03131;color:#fff}
.ladder span.cur{background:#ff9f1a;color:#fff;transform:scale(1.12);box-shadow:0 2px 6px rgba(0,0,0,.2)}
.ladinfo{display:flex;justify-content:space-between;font-weight:700;font-size:15px;color:#1f3b57;padding:0 2px}
.say{display:flex;align-items:center;gap:9px;min-height:62px}
.say .av{width:58px;height:58px;box-shadow:0 0 0 3px #fff}
.say .sb{flex:1;background:#fff;border-radius:16px;padding:9px 12px;font-size:16px;font-weight:600;line-height:1.3;position:relative;box-shadow:0 2px 0 rgba(0,0,0,.08)}
.say .sb::before{content:"";position:absolute;left:-8px;top:50%;margin-top:-8px;border:8px solid transparent;border-right-color:#fff;border-left:0}
.say .sb b{color:#c44d08}
.say.help .sb{background:#fff4d6}.say.help .sb::before{border-right-color:#fff4d6}
.qcard{background:var(--card);border-radius:20px;padding:14px 16px 16px;box-shadow:0 4px 0 #d9d2bf,0 8px 20px rgba(0,0,0,.1)}
.qmeta{font-size:14px;font-weight:700;color:#8a6d3b;margin-bottom:6px}
.qtext{font-size:var(--qf);font-weight:800;line-height:1.28;color:#1e272e;user-select:text;-webkit-user-select:text}
.qx{display:none;margin-top:10px;padding-top:10px;border-top:2px dashed #e6dfcf;font-size:16.5px;font-weight:600;line-height:1.35;color:#3d4a55}
.qx.on{display:block}
.answers{display:flex;flex-direction:column;gap:9px}
.ans{display:flex;align-items:center;gap:12px;background:#fff;border-radius:16px;padding:10px 14px;min-height:60px;text-align:left;font-size:var(--af);font-weight:700;line-height:1.2;box-shadow:0 4px 0 #cfc8b8;transition:background .2s,opacity .2s,transform .08s}
.ans:active{transform:translateY(2px)}
.ans i{font-style:normal;flex:none;width:34px;height:34px;border-radius:50%;background:#f1ede2;color:#8a6d3b;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:17px}
.ans.sel{background:#ffd36e;box-shadow:0 4px 0 #c8a041}
.ans.ok{background:#2b8a3e;color:#fff;box-shadow:0 4px 0 #17501f}.ans.ok i{background:rgba(255,255,255,.25);color:#fff}
.ans.no{background:#e03131;color:#fff;box-shadow:0 4px 0 #9b1c1c}.ans.no i{background:rgba(255,255,255,.25);color:#fff}
.ans.gone{opacity:.28;box-shadow:none}
.ans.tip{box-shadow:0 0 0 3px #1c6fb8,0 4px 0 #cfc8b8}
.ans[disabled]{cursor:default}
.next{display:none;flex-direction:column;gap:6px}.next.on{display:flex}
.lnk{background:none;color:#1f3b57;font-weight:700;font-size:14.5px;padding:8px;text-decoration:underline;align-self:center;min-height:40px}
.lifes{display:flex;gap:7px}
.life{flex:1;background:rgba(255,255,255,.92);border-radius:14px;padding:6px 2px;font-size:22px;font-weight:900;line-height:1.05;box-shadow:0 3px 0 rgba(0,0,0,.14);min-height:60px;position:relative}
.life small{display:block;font-size:12.5px;font-weight:700;margin-top:3px;color:#2d3436}
.life.used{opacity:.55}
.life.used::after{content:"✓";position:absolute;top:2px;right:6px;font-size:13px;color:#2b8a3e}
.life.paid::after{content:"💰";position:absolute;top:1px;right:3px;font-size:11px}
.life[disabled]{opacity:.35}
.lifes.off{visibility:hidden}
/* окна */
.modal,.ad{position:absolute;top:0;right:0;bottom:0;left:0;display:none;align-items:center;justify-content:center;background:rgba(20,30,40,.55);z-index:10;padding:16px}
.modal{overflow-y:auto;overscroll-behavior:contain}
.modal.on,.ad.on{display:flex}
.card{background:var(--card);border-radius:24px;padding:20px 16px 16px;width:100%;max-width:400px;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.3);animation:pop .25s ease-out;margin:auto}
@keyframes pop{from{transform:scale(.88);opacity:0}}
.card h2{margin:0 0 6px;font-size:24px}
.card p{margin:6px 0;color:#57606f;font-weight:600;font-size:17px;line-height:1.35}
.card .av{width:84px;height:84px;margin:4px auto 6px}
.row{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.row2{display:flex;gap:8px}.row2>*{flex:1}
.coins-won{font-size:24px;font-weight:900;color:#c98f00!important}
.score{font-size:40px;font-weight:900;color:#1f3b57!important;margin:2px 0!important}
.quote{background:#fff3d6;border-radius:14px;padding:8px 12px;font-style:italic;color:#5a4a2a!important}
.goal{font-size:15.5px!important;margin:8px 0 2px!important;color:#2d3436!important;font-weight:700}
.goal.tipl{background:#e6f6e9;border-radius:12px;padding:8px 10px;color:#1f5e2c!important}
.dots{font-size:22px;letter-spacing:2px;margin:4px 0}
.ad{background:#111;color:#fff;text-align:center;font-size:22px;font-weight:800}
.ad small{font-weight:500;opacity:.7;font-size:14px}
.adt{font-size:54px;margin-top:16px}
.toast{position:absolute;left:50%;bottom:110px;transform:translateX(-50%);background:rgba(0,0,0,.85);color:#fff;padding:10px 14px;border-radius:12px;font-weight:700;font-size:16px;line-height:1.3;opacity:0;transition:opacity .25s;pointer-events:none;z-index:20;text-align:center;width:max-content;max-width:90%}
.toast.on{opacity:1}
.set{display:flex;align-items:center;justify-content:space-between;background:#f1ede2;border-radius:14px;padding:10px 12px;margin-top:8px;font-weight:700;font-size:16.5px;text-align:left;color:#2d3436;width:100%;min-height:52px}
.set i{font-style:normal;font-weight:800;color:#fff;background:#2b8a3e;border-radius:999px;padding:3px 12px;min-width:56px;text-align:center;flex:none}.set i.off{color:#57606f;background:#dcd6c8}.set i.go,.pay .set i{background:none;color:#237032;padding:0;min-width:0}
.set small{font-weight:600;color:#57606f}
.pay{margin-top:12px;text-align:left}.pay h3{font-size:16px;margin:0 0 2px;color:#2d3436}.pay .set span{padding-right:10px}.pay .set small{font-weight:600}
.pbuy b{white-space:nowrap;color:#1f5e2c;font-size:17px}.pcur{width:18px;height:18px;vertical-align:-3px;margin-left:3px}.pown i{color:#237032}
.about{font-size:15.5px!important;text-align:left;color:#57606f}
.how{text-align:left}.how p{font-size:16px;margin:7px 0;color:#2d3436}
.pick{display:flex;flex-wrap:wrap;justify-content:center;margin-top:6px}
.pick button{width:47%;margin:4px 1.5%;background:#f1ede2;border-radius:14px;padding:8px 4px;font-weight:800;font-size:15px;line-height:1.15;min-height:44px}
.pick button .av{width:60px;height:60px;margin:0 auto 4px;box-shadow:none}
.pick button small{display:block;font-weight:600;font-size:12.5px;color:#57606f;margin-top:2px}
.pick button.strong{background:#dff3e3;box-shadow:0 0 0 2px #2b8a3e}
.streak{display:flex;flex-wrap:wrap;justify-content:space-between;margin:12px 0 4px}
.sd{width:23.5%;margin-bottom:6px;background:#f1ede2;border-radius:12px;padding:6px 2px;font-weight:800;font-size:15px;line-height:1.2;position:relative;color:#57606f}
.sd small{display:block;font-size:13px;font-weight:700}
.sd.done{background:#c8efcf;color:#2b7a3f}
.sd.done::after{content:"✓";position:absolute;top:2px;right:6px;font-size:13px}
.sd.today{background:linear-gradient(#ffd36e,#ff9f43);color:#3a2206;box-shadow:0 3px 0 #c8741d}
.sd.d7{width:49%;background:#ffe9b8}
.lb{max-height:46vh;overflow:auto;overscroll-behavior:contain;margin-top:8px;text-align:left}.lbr{display:flex;gap:10px;align-items:center;padding:6px 8px;border-radius:10px}.lbr:nth-child(odd){background:rgba(0,0,0,.05)}.lbr.me{background:#ffe7a3}.lbr b{width:28px;text-align:right}.lbr span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.lbr i{font-style:normal;font-weight:800}
.medals{text-align:left;margin-top:8px}
.mdr{display:flex;align-items:center;gap:10px;background:#f1ede2;border-radius:12px;padding:7px 10px;margin-top:6px;font-weight:700;font-size:15px}
.mdr span{flex:1}.mdr i{font-style:normal;font-size:20px;letter-spacing:1px}
.link{width:100%;font:inherit;font-size:14px;padding:8px;border-radius:10px;border:1px solid #cfc8b8;background:#fff;color:#2d3436;user-select:text;-webkit-user-select:text}
.conf{position:absolute;top:0;left:0;width:10px;height:14px;z-index:9;pointer-events:none;border-radius:2px}
.nw{white-space:nowrap}
body.calm .card{animation:none}
body.calm .ans,body.calm .ladder span{transition:none}
@media (prefers-reduced-motion:reduce){.card{animation:none}}
/* узкие экраны */
@media (max-width:420px){.logo .lc{display:none}.logo{font-size:20px}}
@media (max-width:370px){:root{--qf:20px;--af:17.5px}body.big{--qf:23px;--af:19.5px}.logo{font-size:19px}.logo .lc{display:none}.btn{font-size:16.5px}.ans{min-height:54px;padding:8px 12px}.say .av{width:50px;height:50px}.say .sb{font-size:15px}.life small{font-size:11.5px}.tp b{font-size:15px}}
@media (max-height:680px){.ladder span{height:26px}.say{min-height:52px}.say .av{width:48px;height:48px}.qcard{padding:10px 14px 12px}.ans{min-height:52px}.gcol1,.gcol2,.answers{gap:7px}.life{min-height:54px}}
/* ПК и планшет в альбомной: шире, игра в две колонки */
@media (min-aspect-ratio:1/1) and (min-width:700px){#app{max-width:1100px;box-shadow:0 0 50px rgba(0,0,0,.25)}
  .mscroll{max-width:560px;width:100%;margin:0 auto}.tscroll .tgrid{max-width:900px;margin:0 auto}.tp{width:32.3%}.tp.all{width:100%}
  .gbody{flex-direction:row;gap:18px;padding:4px 20px 16px;overflow:hidden}.gcol1{flex:1.1;min-width:0;justify-content:center}.gcol2{flex:1;margin-top:0;justify-content:center;min-width:0}}
@media (min-aspect-ratio:1/1) and (min-width:700px) and (max-height:600px){.say .av{width:46px;height:46px}.say{min-height:48px}:root{--qf:21px;--af:18px}.ans{min-height:50px}}
.mh,.gh{padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
@supports not (inset:0){.hdr-r>*+*,.nrow>*+*,.row2>*+*,.ladder>*+*,.lifes>*+*,.host>*+*,.say>*+*,.ans>*+*,.mdr>*+*,.lbr>*+*,.tp.all>*+*{margin-left:8px}.row>*+*,.answers>*+*,.gcol1>*+*,.gcol2>*+*,.mscroll>*+*,.next>*+*{margin-top:9px}}
</style>

</head>
<body>
<div id="app">
  <section id="scr-menu" class="screen on">
    <header class="mh"><div class="logo"><span class="lc">❓ </span>Дворовая викторина<small data-l="menuSub">вопросы на лавочке</small></div><div class="hdr-r"><button class="icon" id="btnSet" aria-label="Настройки">⚙️</button><button class="pill" id="mCoins" aria-label="Монеты">💰 <span id="coinCnt">0</span></button></div></header>
    <div class="mscroll">
      <div class="host"><div class="av" id="hostAv"></div><div class="bub" id="hostSay"></div></div>
      <div class="rankb" id="rankB"></div>
      <button class="btn accent big" id="btnPlay">▶ Играть</button>
      <button class="btn blue wide" id="btnDaily">📅 Викторина дня<small id="dailySub"></small></button>
      <button class="btn violet wide" id="btnDuel">⚔️ Дуэль с другом<small id="duelSub"></small></button>
      <div class="nrow"><button class="btn" id="btnMedals">🏅 Медали</button><button class="btn" id="btnStreak">🔥 Серия</button></div>
      <div class="mfoot" id="mFoot"></div>
    </div>

/* ---- товары викторины (каталог — hobby-analytics/13-purchases-catalog.md; VK — hobby-pay/catalog.json). Ответы, подсказки в викторине дня и дуэли, очки рейтинга не продаём ---- */
const PAY_ROW='set';
const PAY_ITEMS={
  no_ads:{perm:1,bonus:150,vk:14,ic:'🚫',name:'Без рекламы между уровнями',desc:'Навсегда, и сразу +150 💰. Ролики за награду остаются — по желанию'},
  coins_s:{n:300,vk:5,ic:'💰',name:'Кошелёк: 300 💰',desc:'Хватит на десяток подсказок соседа',done:'+300 💰 — спасибо!'},
  coins_l:{n:1000,vk:14,ic:'💰',name:'Копилка: 1000 💰',desc:'Выгоднее кошелька',done:'+1000 💰 — спасибо!'}
};
const PAY_TEST={no_ads:99,coins_s:39,coins_l:99}; // цены только для ?paytest=1; настоящие — в консоли
function payAdd(n){S.coins+=n;}
function payFlush(){cloudFlush();}
function payPause(on){setPause('pay',on);}
function payAfter(){updCoins();if(modalOn&&PAY.re)PAY.re();}
/* ================= покупки за деньги: Яндекс Игры (ysdk.payments) и VK Игры (VKWebAppShowOrderBox) — общий модуль (одинаковый в 5 играх) =================
   Товары игры — PAY_ITEMS (выше), id совпадают с id в консоли Яндекса («Инап-покупки») и в hobby-pay/catalog.json (VK).
   Кнопок покупок НЕТ совсем, если платежи недоступны: нет SDK/моста (мак), каталог Яндекса пуст, VK не поддерживает оплату (iOS).
   Постоянные (perm) — флаг S.buy[id], разовый бонус монет — один раз на игрока (S.buyB). Выдача — только после подтверждения площадки.
   Яндекс: цена и значок валюты — только из getCatalog; расходуемые: выдать → сохранить (облако сразу) → consumePurchase;
     незавершённые при запуске довыдаём (getPurchases). Токены выданных — S.payT (и в облаке), сбой consume не даст выдать второй раз.
   VK: на кнопке число голосов (PAY_ITEMS.vk). success:true + order_id → выдать → сохранить → стереть ключ pay_<order_id>.
     Страховка: сервер vk-pay при оплате пишет в хранилище VK игрока pay_<order_id>=id (расходуемые) и own_<id>=1 (постоянные);
     при запуске читаем их и довыдаём. Выданные order_id — S.payV (последние 30); покупка без order_id оставляет метку «x:<id>»,
     которая «съест» первый чужой pay_ этого товара — второй раз не выдастся.
   Мак: ?paytest=1 — имитация Яндекса (localStorage «paytest»), ?vk=1&paytest=1 — имитация VK с сервером (localStorage «paytestvk»),
   ?paytest=fail — отказ. В настоящем VK (vk_app_id) и в Яндексе заглушек нет */
const payObj=x=>!!x&&typeof x==='object'&&!Array.isArray(x);
const PAY={on:false,p:null,v:null,list:[],busy:false,
  test:/[?&]paytest=/.test(location.search),
  // запуск: после SDK/моста и облака. Незавершённые покупки обрабатываем, даже если каталог не пришёл
  async init(){if(PAY.p||PAY.v)return;
    if(PLAT==='vk')return PAY.initVK();
    try{if(ysdk)PAY.p=ysdk.getPayments?await payT(ysdk.getPayments({signed:false})):ysdk.payments;
      else if(PAY.test&&!window.YaGames)PAY.p=payStub();}catch(e){PAY.p=null;}
    if(!PAY.p)return;
    try{await PAY.restore();}catch(e){}
    try{const c=await payT(PAY.p.getCatalog());PAY.list=(Array.isArray(c)?c:[]).filter(x=>x&&PAY_ITEMS[x.id]);}catch(e){PAY.list=[];}
    PAY.on=PAY.list.length>0;if(PAY.on)payAfter();},
  async initVK(){
    if(VK){let ok=false;try{ok=!!(VK.supportsAsync&&await payT(VK.supportsAsync('VKWebAppShowOrderBox'),8000));}catch(e){}if(ok)PAY.v=payVK();}
    else if(PAY.test&&!VK_REAL)PAY.v=payStubVK();
    if(!PAY.v)return;
    try{await PAY.restore();}catch(e){}
    PAY.list=Object.keys(PAY_ITEMS).filter(id=>PAY_ITEMS[id].vk>0).map(id=>({id}));
    PAY.on=PAY.list.length>0;if(PAY.on)payAfter();},
  own(id){return !!(payObj(S.buy)&&S.buy[id]);},
  item(id){return PAY.list.find(x=>x.id===id)||null;},
  give(id){const it=PAY_ITEMS[id];
    if(it.perm){if(!payObj(S.buy))S.buy={};S.buy[id]=1;
      if(it.bonus){if(!payObj(S.buyB))S.buyB={};if(!S.buyB[id]){S.buyB[id]=1;payAdd(it.bonus);}}}
    else payAdd(it.n||0);
    if(it.give)it.give();},
  // при запуске и «Восстановить покупки»: постоянные — выдать, если флага нет; расходуемые — довыдать и отметить
  async restore(){let got=0;
    if(PAY.v)got=await PAY.restoreVK();
    else{const ps=await payT(PAY.p.getPurchases());
      for(const x of (Array.isArray(ps)?ps:[])){const it=x&&PAY_ITEMS[x.productID];if(!it)continue;
        if(it.perm){if(!PAY.own(x.productID)){PAY.give(x.productID);got=1;}}else if(await PAY.credit(x))got=1;}}
    if(got){save();payFlush();payAfter();toast('Покупка зачислена',2600);}
    return got;},
  // VK: ключи own_<id> (постоянные, не стираем) и pay_<order_id> (расходуемые: выдать, сохранить, стереть)
  async restoreVK(){const ks=await PAY.v.keys();let got=0;const done=[];if(!Array.isArray(S.payV))S.payV=[];
    for(const k of ks){const m=/^(own|pay)_(.+)$/.exec(k.key||'');if(!m||!k.value)continue;
      if(m[1]==='own'){const it=PAY_ITEMS[m[2]];if(it&&it.perm&&!PAY.own(m[2])){PAY.give(m[2]);got=1;}continue;}
      const id=String(k.value),it=PAY_ITEMS[id];if(!it)continue;
      if(S.payV.indexOf(m[2])<0){const x=S.payV.indexOf('x:'+id); // покупка без order_id уже выдана — это её заказ
        if(x>=0)S.payV[x]=m[2];else{PAY.give(id);payMark(m[2]);got=1;}}
      done.push(k.key);}
    if(done.length){save();payFlush();for(const k of done)try{await PAY.v.clear(k);}catch(e){}}
    return got;},
  // расходуемая: выдать (если этот токен ещё не выдавали), сохранить в облако и только потом consumePurchase
  async credit(x){const t=String(x.purchaseToken||'');if(!Array.isArray(S.payT))S.payT=[];let fresh=false;
    if(!t||S.payT.indexOf(t)<0){PAY.give(x.productID);if(t)S.payT.push(t);if(S.payT.length>30)S.payT=S.payT.slice(-30);save();payFlush();fresh=true;}
    try{if(t)await payT(PAY.p.consumePurchase(t));}catch(e){}
    return fresh;},
  async buy(id){const it=PAY_ITEMS[id];if(!it||PAY.busy||!PAY.on||!PAY.item(id)||(it.perm&&PAY.own(id)))return;PAY.busy=true;payPause(true);
    try{if(PAY.v){const r=await PAY.v.order(id);if(!r||!r.success)throw new Error('cancel');
        const oid=r.order_id!=null?String(r.order_id):'';if(!Array.isArray(S.payV))S.payV=[];
        if(!oid||S.payV.indexOf(oid)<0){PAY.give(id);payMark(oid||'x:'+id);}
        save();payFlush();if(oid)PAY.v.clear('pay_'+oid).catch(()=>{});}
      else{const x=await PAY.p.purchase({id});
        if(it.perm){PAY.give(id);save();payFlush();}
        else await PAY.credit(x&&x.productID===id?x:{productID:id,purchaseToken:x&&x.purchaseToken});}
      SND.coin();toast(it.done||'Готово! Спасибо за покупку',2800);payAfter(id);}
    catch(e){toast('Покупка не состоялась',2200);}
    finally{PAY.busy=false;payPause(false);}},
  // «Восстановить покупки» (Об игре): заново читаем getPurchases / ключи VK
  async again(){if(!(PAY.p||PAY.v)||PAY.busy)return;PAY.busy=true;let got=0;try{got=await PAY.restore();}catch(e){}PAY.busy=false;if(!got)toast('Покупки проверены — всё на месте',2400);},
  // цена: VK — число голосов (требование VK); Яндекс — из каталога: число + значок валюты (getPriceCurrencyImage), иначе готовая строка price
  price(pr){if(PAY.v){const n=PAY_ITEMS[pr.id].vk,a=n%10,b=n%100;return n+' '+(a===1&&b!==11?'голос':a>=2&&a<=4&&(b<12||b>14)?'голоса':'голосов');}
    let img='';try{img=pr.getPriceCurrencyImage?pr.getPriceCurrencyImage('svg'):'';}catch(e){}
    return img&&pr.priceValue?payEsc(pr.priceValue)+'<img class="pcur" src="'+payEsc(img)+'" alt="">':payEsc(pr.price||pr.priceValue||'');},
  row(pr){const it=PAY_ITEMS[pr.id],own=it.perm&&PAY.own(pr.id),txt='<span>'+it.ic+' '+payEsc(it.name)+'<br><small>'+payEsc(it.desc)+'</small></span>';
    return own?'<div class="'+PAY_ROW+' pown">'+txt+'<i>куплено</i></div>':'<button class="'+PAY_ROW+' pbuy" data-pid="'+payEsc(pr.id)+'">'+txt+'<b>'+PAY.price(pr)+'</b></button>';},
  // список товаров (ids — только эти, по порядку каталога); owned=false — без уже купленных
  html(ids,owned){const L=PAY.list.filter(pr=>(!ids||ids.indexOf(pr.id)>=0)&&(owned!==false||!(PAY_ITEMS[pr.id].perm&&PAY.own(pr.id))));
    return L.length?'<div class="pay"><h3>Покупки</h3>'+L.map(PAY.row).join('')+'</div>':'';},
  bind(root){(root||document).querySelectorAll('.pbuy').forEach(b=>b.onclick=()=>{try{(SND.tap||SND.click)();}catch(e){}PAY.buy(b.dataset.pid);});}
};
function payMark(v){if(!Array.isArray(S.payV))S.payV=[];if(S.payV.indexOf(v)<0)S.payV.push(v);if(S.payV.length>30)S.payV=S.payV.slice(-30);}
// слияние облака (d) в сохранение T (по умолчанию S): купленное, выданные бонусы, токены и заказы — объединение (покупка не теряется ни с какой стороны)
function payMerge(d,T){T=T||S;if(!payObj(d)||!payObj(T))return;
  for(const f of ['buy','buyB'])if(payObj(d[f])){if(!payObj(T[f]))T[f]={};for(const k in d[f])if(d[f][k])T[f][k]=1;}
  for(const f of ['payT','payV'])if(Array.isArray(d[f])){if(!Array.isArray(T[f]))T[f]=[];for(const t of d[f])if(typeof t==='string'&&T[f].indexOf(t)<0)T[f].push(t);if(T[f].length>30)T[f]=T[f].slice(-30);}}
function payT(p,ms){return Promise.race([p,new Promise((_,no)=>setTimeout(()=>no(new Error('timeout')),ms||15000))]);}
function payEsc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]);}
// VK: окно оплаты (игрок может думать долго — ждём до 10 мин) и ключи хранилища, которые пишет сервер vk-pay
function payVK(){return {order:id=>vkSend('VKWebAppShowOrderBox',{type:'item',item:id},600000),
  keys:async()=>{const r=await vkSend('VKWebAppStorageGetKeys',{count:1000,offset:0},8000),ks=((r&&r.keys)||[]).filter(k=>/^(own|pay)_/.test(k));
    if(!ks.length)return [];const g=await vkSend('VKWebAppStorageGet',{keys:ks},8000);return (g&&g.keys)||[];},
  clear:k=>vkSend('VKWebAppStorageSet',{key:k,value:''},8000)};}
// имитация платежей для проверки на маке (?paytest=1): цены — PAY_TEST, покупки лежат в localStorage «paytest», consume их убирает
function payStub(){const K='paytest',rd=()=>{try{return JSON.parse(localStorage.getItem(K))||[];}catch(e){return [];}},wr=a=>{try{localStorage.setItem(K,JSON.stringify(a));}catch(e){}};
  const cur='data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20"><circle cx="10" cy="10" r="9" fill="#f5b400"/><text x="10" y="14.5" font-size="12" text-anchor="middle" font-family="Arial" font-weight="700" fill="#fff">T</text></svg>');
  const wait=v=>new Promise(ok=>setTimeout(()=>ok(v),250)),fail=()=>window.__payCancel||/[?&]paytest=fail/.test(location.search);
  return {getCatalog:()=>wait(Object.keys(PAY_TEST).map(id=>({id,title:id,description:'',imageURI:'',price:PAY_TEST[id]+' тест',priceValue:String(PAY_TEST[id]),priceCurrencyCode:'TST',getPriceCurrencyImage:()=>cur}))),
    getPurchases:()=>wait(rd()),
    purchase:({id})=>fail()?Promise.reject(new Error('cancel')):wait(null).then(()=>{const x={productID:id,purchaseToken:'t'+Date.now()+Math.random().toString(36).slice(2,6),developerPayload:''};const a=rd();a.push(x);wr(a);return x;}),
    consumePurchase:t=>{if(window.__payNoConsume)return Promise.reject(new Error('fail'));wr(rd().filter(x=>x.purchaseToken!==t));return wait();}};}
// имитация VK (?vk=1&paytest=1): «сервер» пишет pay_/own_ в localStorage «paytestvk», как vk-pay в хранилище VK.
// __payNoOid — ответ без order_id, __payNoClear — стирание ключа не прошло, ?paytest=fail / __payCancel — отказ
function payStubVK(){const K='paytestvk',rd=()=>{try{return JSON.parse(localStorage.getItem(K))||{};}catch(e){return {};}},wr=o=>{try{localStorage.setItem(K,JSON.stringify(o));}catch(e){}};
  const wait=v=>new Promise(ok=>setTimeout(()=>ok(v),250)),fail=()=>window.__payCancel||/[?&]paytest=fail/.test(location.search);
  return {order:id=>fail()?Promise.reject({error_type:'client_error'}):wait().then(()=>{const oid=String(Date.now()),o=rd();
      if(PAY_ITEMS[id].perm)o['own_'+id]='1';else o['pay_'+oid]=id;wr(o);return window.__payNoOid?{success:true}:{success:true,order_id:+oid};}),
    keys:()=>wait(Object.entries(rd()).filter(([k,v])=>v).map(([key,value])=>({key,value}))),
    clear:k=>{if(window.__payNoClear)return Promise.reject(new Error('fail'));const o=rd();delete o[k];wr(o);return wait();}};}

/* ================= рейтинг викторины дня =================
   Очки — сумма верных ответов во всех викторинах дня (одни вопросы на всех в этот день). Яндекс: лидерборд daily (создать в консоли).
   VK: таблица друзей VKWebAppShowLeaderBoardBox. Нет SDK/моста — кнопки нет. */
function dsum(){let n=S.dold||0;for(const k in S.daily)n+=+S.daily[k]||0;return n;}
const LB={
  ok(){return PLAT==='vk'?!!VK:!!(ysdk&&(ysdk.leaderboards||ysdk.getLeaderboards));},
  async submit(){const n=dsum();if(!n||PLAT==='vk')return;
    try{if(!ysdk)return;if(ysdk.leaderboards&&ysdk.leaderboards.setScore)await ysdk.leaderboards.setScore('daily',n);
      else{const lb=await ysdk.getLeaderboards();await lb.setLeaderboardScore('daily',n);}}catch(e){}},
  async entries(){const o={includeUser:true,quantityAround:2,quantityTop:10};
    try{if(ysdk.leaderboards&&ysdk.leaderboards.getEntries)return await ysdk.leaderboards.getEntries('daily',o);
      const lb=await ysdk.getLeaderboards();return await lb.getLeaderboardEntries('daily',o);}catch(e){return null;}},
  async show(back){back=back||hideModal;
    if(PLAT==='vk'){if(!VK)return;vkSend('VKWebAppShowLeaderBoardBox',{user_result:dsum()},60000).catch(()=>toast(L('Таблица друзей сейчас недоступна','Friends table is unavailable')));return;}
    modal(`<h2>🏆 ${L('Рейтинг','Leaderboard')}</h2><p>${L('Загружаем…','Loading…')}</p>`);
    const r=await LB.entries();const list=(r&&r.entries)||[];
    const me=r&&typeof r.userRank==='number'?r.userRank:0,authed=!!(YP&&YP.getMode&&YP.getMode()!=='lite');
    const rows=list.map(e=>`<div class="lbr${e.rank===me?' me':''}"><b>${e.rank}</b><span>${esc(e.player&&e.player.publicName)||L('Игрок','Player')}</span><i>${e.score} ✓</i></div>`).join('');
    modal(`<h2>🏆 ${L('Рейтинг','Leaderboard')}</h2><p>${L('Верные ответы во всех викторинах дня. У тебя:','Correct answers in all daily quizzes. Yours:')} <b>${dsum()}</b></p>
      <div class="lb">${rows||'<p>'+L('Пока пусто — будь первым!','Empty so far — be the first!')+'</p>'}</div>
      ${authed?'':'<p><small>'+L('Чтобы попасть в рейтинг, войди в аккаунт Яндекса.','Sign in to Yandex to join the leaderboard.')+'</small></p>'}
      <div class="row">${authed||!(ysdk&&ysdk.auth)?'':'<button class="btn accent noenter" id="lbAuth">'+L('Войти','Sign in')+'</button>'}<button class="btn" id="lbClose">${L('Закрыть','Close')}</button></div>`);
    $('lbClose').onclick=back;
    const a=$('lbAuth');if(a)a.onclick=async()=>{try{await ysdk.auth.openAuthDialog();YP=await ysdk.getPlayer({scopes:false});
      clearTimeout(cloudT);cloudT=0;cloudReady=false;cloudTry=0;await cloudLoad(true);updCoins();await LB.submit();}catch(e){}LB.show(back);};}
};

/* ================= общее: экраны, окна, тосты ================= */
const RM=!!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);
const calm=()=>S.calm===true||RM;
let G=null,modalOn=false;
const onScr=id=>$(id).classList.contains('on');
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id===id));}
function toast(t,ms){const e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(toast._t);
  const d=ms&&ms<2000?ms:Math.max(ms||0,2500,1000+60*t.length);toast._t=setTimeout(()=>e.classList.remove('on'),d);}
function hideModal(){$('modal').classList.remove('on');modalOn=false;}
function modal(html){PAY.re=null;$('mcard').innerHTML=html;$('modal').classList.add('on');modalOn=true;$('mcard').scrollTop=0;$('modal').scrollTop=0;}
function nowMs(){try{if(ysdk&&ysdk.serverTime){const t=ysdk.serverTime();if(typeof t==='number'&&t>1.6e12)return t;}}catch(e){}return Date.now();}
function dayKey(off){const d=new Date(nowMs());d.setDate(d.getDate()+(off||0));return d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate();}
const speed=()=>S.speed==='test'?0:calm()?.5:1; // test — только для автопрогона
function confetti(){if(calm())return;const app=$('app'),W=app.clientWidth,cols=['#e8590c','#2b8a3e','#1c6fb8','#ffd23f','#e03131','#7b4fb8'];
  for(let i=0;i<40;i++){const c=document.createElement('div');c.className='conf';c.style.background=pick(cols);const x=Math.random()*W,dx=(Math.random()-.5)*120,rot=Math.random()*720;
    c.style.transform=`translate(${x}px,-20px)`;app.appendChild(c);const dur=1400+Math.random()*900;
    c.animate?c.animate([{transform:`translate(${x}px,-20px) rotate(0deg)`},{transform:`translate(${x+dx}px,${app.clientHeight+20}px) rotate(${rot}deg)`}],{duration:dur,easing:'ease-in'}):0;setTimeout(()=>c.remove(),dur);}}

function openMenu(){G=null;show('scr-menu');updCoins();YG.stop();
  $('hostAv').innerHTML=portrait('mihalych','happy');

/* ================= выбор вопросов =================
   Лестница: вопросы темы, которых игрок ещё не видел (S.seen), нужной сложности (нет — ближайшей). Кончились все вопросы темы —
   тема начинается по новому кругу (S.cyc). «Всё подряд» — сначала тема, которой на этой лестнице было меньше всего. Повторов нет, пока не кончится пул темы */
function pickQ(ts,d,used,tu){const order=d===1?[1,2,3]:d===2?[2,1,3]:[3,2,1];
  for(let pass=0;pass<2;pass++){
    for(const dd of order){const by={};let any=false;
      for(const t of ts)for(const q of BYT[t])if(q.d===dd&&!used.has(q.i)&&!seen(q)&&!isBad(q)){(by[t]=by[t]||[]).push(q);any=true;}
      if(!any)continue;
      const tl=Object.keys(by),mn=Math.min(...tl.map(t=>tu[t]||0));
      return pick(by[pick(tl.filter(t=>(tu[t]||0)===mn))]);}
    // пул исчерпан: начинаем по новому кругу те темы, где не осталось ни одного непоказанного
    for(const t of ts)if(BYT[t].every(q=>used.has(q.i)||seen(q)||isBad(q))){S.seen[t]='';S.cyc[t]=(S.cyc[t]||0)+1;}
  }
  return null;}
// задание дня и дуэль: одинаковые у всех по зерну (не зависят от «уже видел»); темы не повторяются больше двух раз
function seededSet(seed){const R=rng(seed),used=new Set(),tu={},qs=[];
  for(const d of DAYRAMP){let q=null;
    for(let k=0;k<60&&!q;k++){const t=TK[Math.floor(R()*TK.length)];if((tu[t]||0)>=(k<30?1:2))continue;
      const c=BYT[t].filter(x=>x.d===d&&!used.has(x.i));if(c.length)q=c[Math.floor(R()*c.length)];}
    if(!q){const c=QS.filter(x=>!used.has(x.i));if(!c.length)break;q=c[Math.floor(R()*c.length)];}
    used.add(q.i);tu[q.t]=(tu[q.t]||0)+1;qs.push(q.i);}
  return{qs,perms:qs.map(()=>shuffle([0,1,2,3],R))};}

/* ================= лестница ================= */
function newG(mode,qs,o){return Object.assign({mode,qs,i:0,res:[],life:{},paid:{},second:0,over:false,st:'ask',perm:null,pi:-1,gone:new Set(),wrongs:new Set(),hint:null,say:null},o||{});}

  const ts=topic==='all'?TK:[topic],rp=ramp(S.lvl||0),used=new Set(),tu={},qs=[];
  for(const d of rp){const q=pickQ(ts,d,used,tu);if(!q)break;used.add(q.i);tu[q.t]=(tu[q.t]||0)+1;qs.push(q.i);}
  if(qs.length<10){toast(L('В этой теме пока мало вопросов','Not enough questions in this topic'));return;}
  G=newG('lad',qs,{topic});S.games++;save();
  G.say={who:'mihalych',t:pick(HOST.start)};
  show('scr-game');hideModal();renderQ();YG.start();}
function openDaily(){const k=dayKey(0);

    $('sNew').onclick=()=>{hideModal();startDaily();};return;}
  startDaily();}
function startDaily(){const k=dayKey(0),set=seededSet(k*7919+13);

  const dp=S.dprog;if(isObj(dp)&&dp.k===k&&Array.isArray(dp.res)&&dp.res.length<10){G.res=dp.res.map(x=>x?1:0);G.i=G.res.length;

const cur=()=>QI[G.qs[G.i]];
const LET=['А','Б','В','Г'];

    if(G.i>0||!G.say)G.say={who:'mihalych',t:G.mode==='lad'?(G.i===9?HOST.last[0]:fill(pick(HOST.q),{n:G.i+1,p:coinsTxt(PR[G.i])})):L('Вопрос ','Question ')+(G.i+1)+L(' из 10',' of 10')};}

  $('gSub').textContent=G.mode==='lad'?(G.topic==='all'?L('Всё подряд','Mixed'):TN[G.topic].n):G.mode==='day'?L('одни вопросы на весь двор','same for everyone'):G.foe!=null?L('друг ответил на ','friend scored ')+G.foe+L(' из 10',' of 10'):L('те же вопросы получит друг','your friend gets the same questions');
  // лестница: ступени; в викторине дня и дуэли — ✓/✗ по вопросам

    lh+=`<span class="${c}${G.mode==='lad'&&SAFE.indexOf(k)>=0?' safe':''}">${r===1?'✓':r===0?'✗':k+1}</span>`;}

  const sy=G.say||{who:'mihalych',t:''};$('say').classList.toggle('help',sy.who!=='mihalych');$('sayAv').innerHTML=portrait(sy.who,sy.m||'norm');$('sayT').innerHTML=sy.h||esc(sy.t);
  $('qMeta').textContent=tn.ic+' '+tn.n+' · '+DNAME[q.d];
  $('qText').textContent=q.q;
  const x=$('qX');x.classList.toggle('on',G.st==='done'&&!!q.x);x.textContent=G.st==='done'&&q.x?'💡 '+q.x:'';
  const right=G.perm.indexOf(0);
  let ah='';for(let k=0;k<4;k++){let c='';
    if(G.gone.has(k))c='gone';else if(G.wrongs.has(k))c='no';
    if(G.st==='done'&&k===right)c='ok';else if(G.st==='wait'&&k===G.sel)c='sel';
    if(G.hint===k&&G.st==='ask')c+=' tip';
    ah+=`<button class="ans ${c}" data-k="${k}" ${G.st!=='ask'||G.gone.has(k)||G.wrongs.has(k)?'disabled':''}><i>${LET[k]}</i><span>${esc(q.a[G.perm[k]])}</span></button>`;}
  $('answers').innerHTML=ah;
  $('answers').querySelectorAll('.ans').forEach(b=>b.onclick=()=>answer(+b.dataset.k));
  const done=G.st==='done';$('nextRow').classList.toggle('on',done);$('lifes').classList.toggle('off',done);
  $('btnNext').textContent=G.mode==='lad'&&G.res[G.i]===0?L('Итоги','Results'):G.i===9?L('Итоги','Results'):L('Дальше →','Next →');
  const lf=(id,k)=>{const b=$(id),used=!!G.life[k];b.classList.toggle('used',used);b.classList.toggle('paid',used&&G.mode==='lad');b.disabled=G.st!=='ask'||used&&G.mode!=='lad';};
  lf('lf50','ff');lf('lfNb','nb');lf('lfZi','zi');
  $('lfTake').style.display=G.mode==='lad'?'':'none';$('lfTake').disabled=G.st!=='ask'||G.i===0;
  updCoins();}
function safeWon(){let w=0;for(const s of SAFE)if(G.res.filter(x=>x===1).length>s)w=PR[s];return w;}
function answer(k){if(!G||G.st!=='ask'||G.gone.has(k)||G.wrongs.has(k)||G.over)return;
  G.st='wait';G.sel=k;SND.pick();renderQ();
  const t=Math.round(750*speed());if(t)setTimeout(()=>SND.wait(),60);
  setTimeout(()=>reveal(k),t);}
function reveal(k){if(!G||G.st!=='wait')return;const q=cur(),ok=G.perm[k]===0;
  if(ok){G.st='done';G.res[G.i]=1;S.correct++;SND.right();buzz(25);
    const sf=G.mode==='lad'&&SAFE.indexOf(G.i)===0;
    if(sf)setTimeout(()=>SND.safe(),350);
    G.say={who:'mihalych',m:'happy',t:G.mode==='lad'&&G.i===9?pick(HOST.win):sf?HOST.safe[0]:pick(HOST.right)};
    dayProg();save();renderQ();return;}
  G.wrongs.add(k);SND.wrong();buzz([60,40,60]);
  // лестница: можно взять вторую попытку (одна на лестницу) — за монеты или ролик по кнопке
  if(G.mode==='lad'&&!G.second&&G.wrongs.size<3){G.st='ask';G.say={who:'mihalych',m:'sad',t:pick(HOST.wrong)};renderQ();secondOffer();return;}
  endQ();}
function dayProg(){if(G&&G.mode==='day'){S.dprog={k:G.day,res:G.res.slice()};save();}}
function endQ(){G.st='done';G.res[G.i]=0;dayProg();G.say={who:'mihalych',m:'sad',t:pick(HOST.wrong)+' '+L('Верный ответ — ','The answer is ')+'«'+cur().a[0]+'».'};save();renderQ();}
function secondOffer(){const can=S.coins>=COST.second;

/* ---- подсказки: первая каждого вида на лестнице — бесплатно; повтор (только лестница) — монеты или ролик по кнопке.

function useLife(k,fn){if(!G||G.st!=='ask'||G.over)return;

function fifty(){const right=G.perm.indexOf(0),w=shuffle([0,1,2,3].filter(k=>k!==right&&!G.gone.has(k)&&!G.wrongs.has(k)));
  const n=Math.max(0,w.length-1);for(let j=0;j<n&&j<2;j++)G.gone.add(w[j]);

// честная подсказка: верный вариант с вероятностью p, иначе — один из оставшихся неверных
function askHelper(id){const h=id==='zina'?ZINA:HELP[id],q=cur();let p=h.base[q.d-1];if(h.top.indexOf(q.t)>=0)p=Math.min(.96,p+h.bonus);

/* ---- итоги лестницы ----
   Уровень пройден, если игрок дошёл до первой несгораемой ступени (5 верных ответов). Вся лестница (10/10) — главный приз,
   счётчик S.wins и медаль темы (S.tp: 🥉1, 🥈3, 🥇6 полных лестниц). Модель — tools/econ.py */
function finishLadder(kind){if(!G||G.over)return;G.over=true;YG.stop();
  const good=G.res.filter(x=>x===1).length,prize=kind==='win'?PR[9]:kind==='take'?PR[G.i-1]:safeWon(),pass=good>=5;
  S.coins+=prize;S.best=Math.max(S.best||0,good);S.adW=(S.adW||0)+1;
  if(pass)S.lvl=(S.lvl||0)+1;
  if(kind==='win'){S.wins=(S.wins||0)+1;S.tp[G.topic]=(S.tp[G.topic]||0)+1;}
  S.lossRow=pass?0:(S.lossRow||0)+1;
  save();updCoins();
  const topic=G.topic,m=MEDAL(S.tp[topic]||0),newMedal=kind==='win'&&[1,3,6].indexOf(S.tp[topic])>=0;
  const r0=rankOf(S.lvl-(pass?1:0)),r1=rankOf(S.lvl),newRank=r1!==r0;
  if(kind==='win'){SND.win();confetti();buzz([30,50,30]);}else if(pass)SND.safe();else setTimeout(()=>SND.lose(),200);
  const head=kind==='win'?L('Вся лестница!','The whole ladder!'):pass?L('Уровень пройден!','Level passed!'):kind==='take'?L('Монеты забраны','Coins taken'):L('Лестница оборвалась','The ladder broke');
  const line=kind==='win'?pick(HOST.win):kind==='take'?L('Разумно! Синица в руках лучше журавля в небе.','Wise! A bird in the hand…'):pass?L('Несгораемые монеты — твои. В следующий раз дойдёшь до верха!','Safe coins are yours. Next time — to the top!'):L('Ничего, во дворе не все с первого раза академики. Дойди до 5-й ступени — и уровень пройден!','No worries — reach step 5 to pass the level!');
  const tn=topic==='all'?L('Всё подряд','Mixed'):TN[topic].n,left=[1,3,6].find(x=>x>(S.tp[topic]||0));
  modal(`<div class="av">${portrait('mihalych',pass?'happy':'sad')}</div><h2>${head}</h2>
    <p class="score">${good}/10</p><p class="coins-won">+${coinsTxt(prize)}</p>
    <p class="quote">${esc(line)}</p>
    ${newMedal?'<p class="goal tipl">'+m+' '+L('Медаль темы «','Medal: «')+esc(tn)+'»!</p>':''}
    ${newRank?'<p class="goal tipl">🏅 '+L('Новое звание: ','New rank: ')+esc(r1[1])+'!</p>':''}
    ${pass?'<p class="goal">'+L('Теперь уровень ','Now level ')+(S.lvl+1)+(S.lvl===3||S.lvl===10?L(' — вопросы станут труднее',' — harder questions'):'')+'</p>':''}
    ${kind!=='win'&&left?'<p class="goal">'+L('Вся лестница до верха — медаль темы «','Full ladder — medal for «')+esc(tn)+'» ('+(S.tp[topic]||0)+'/'+left+')</p>':''}
    <div class="row" id="mWon">${pass?`<button class="btn accent" id="rNext">▶ ${L('Дальше: уровень ','Next: level ')}${S.lvl+1}</button>`:`<button class="btn accent" id="rAgain">↻ ${L('Ещё раз','Again')}</button>`}
    <div class="row2"><button class="btn" id="rTopic">${L('Другая тема','Other topic')}</button><button class="btn" id="rMenu">🏠 ${L('Меню','Menu')}</button></div></div>`);
  const go=f=>()=>{hideModal();between(f);};
  if($('rNext'))$('rNext').onclick=go(openTopics);
  if($('rAgain'))$('rAgain').onclick=go(()=>startLadder(topic));
  $('rTopic').onclick=go(openTopics);$('rMenu').onclick=go(openMenu);
  if(pass)offerReturn();}

/* ================= викторина дня: одни вопросы у всех; серия дней; рейтинг ================= */
const STREAK=[5,5,10,10,15,20,30];
function streakState(){const s=S.streak||{day:0,last:0,cyc:0},t=dayKey(0);
  if(s.last===t)return{claimed:true,day:s.day};
  const cont=s.last===dayKey(-1)&&s.day>0;return{claimed:false,day:cont?s.day%7+1:1,broken:!cont&&s.day>0};}
function finishDay(){if(!G||G.over)return;G.over=true;YG.stop();
  const good=G.res.filter(x=>x===1).length,k=G.day||dayKey(0);
  if(S.daily[k]!=null){openMenu();return;}
  const st=streakState(),bonus=STREAK[st.day-1],coins=good*3+bonus,s=S.streak||{cyc:0};
  S.daily[k]=good;delete S.dprog;S.streak={day:st.day,last:dayKey(0),cyc:(s.cyc||0)+(st.day===7?1:0)};S.coins+=coins;S.adW=(S.adW||0)+1;save();updCoins();LB.submit();
  if(good>=7){SND.win();confetti();}else SND.coin();
  modal(`<div class="av">${portrait('mihalych',good>=5?'happy':'norm')}</div><h2>${L('Викторина дня','Daily quiz')}</h2>
    <p class="score">${good}/10</p><p class="dots">${G.res.map(x=>x?'🟢':'🔴').join('')}</p>
    <p class="coins-won">+${coinsTxt(coins)} <small>(${good}×3 + ${L('серия','streak')} ${bonus})</small></p>
    <p>🔥 ${L('Серия: ','Streak: ')}${pl(st.day,'день','дня','дней','day','days')}. ${L('Завтра — новые вопросы!','New questions tomorrow!')}</p>
    <div class="row" id="mWon">${adOk()?`<button class="btn accent noenter" id="dX2">📺 ${L('Ещё +','Another +')}${coinsTxt(coins)} ${L('за рекламу','for an ad')}</button>`:''}
    ${LB.ok()?`<button class="btn noenter" id="dLb">🏆 ${L('Рейтинг','Leaderboard')}</button>`:''}
    <button class="btn green" id="dOk">${L('В меню','Menu')}</button></div>`);
  if($('dX2'))$('dX2').onclick=()=>{hideModal();showRewarded(()=>{setCoins(S.coins+coins);SND.coin();toast('+'+coinsTxt(coins));openMenu();},()=>openMenu());};
  if($('dLb'))$('dLb').onclick=()=>LB.show(()=>{hideModal();openMenu();});
  $('dOk').onclick=()=>{hideModal();between(openMenu);};}
function dayDone(){const k=dayKey(0),st=streakState();
  modal(`<h2>📅 ${L('Викторина дня','Daily quiz')}</h2><p>${L('Сегодня уже сыграно: ','Played today: ')}<b>${S.daily[k]}/10</b>. ${L('Новые вопросы — завтра.','New questions tomorrow.')}</p>
    <p>🔥 ${L('Серия: ','Streak: ')}${pl(st.day||0,'день','дня','дней','day','days')} · ${L('всего верных: ','total correct: ')}${dsum()}</p>
    <div class="row">${LB.ok()?`<button class="btn noenter" id="dLb">🏆 ${L('Рейтинг','Leaderboard')}</button>`:''}<button class="btn green" id="mCancel">${L('Хорошо','OK')}</button></div>`);
  if($('dLb'))$('dLb').onclick=()=>LB.show();$('mCancel').onclick=hideModal;}
function showStreak(){const st=streakState();let cells='';
  for(let d=1;d<=7;d++){const done=st.claimed?d<=st.day:d<st.day,today=!st.claimed&&d===st.day;
    cells+=`<div class="sd ${done?'done':''} ${today?'today':''} ${d===7?'d7':''}"><small>${L('День ','Day ')}${d}</small>${d===7?'🎁 ':''}+${STREAK[d-1]}</div>`;}
  modal(`<h2>🔥 ${L('Серия дней','Daily streak')}</h2><p>${L('Проходите викторину дня каждый день: к монетам за ответы прибавляется награда серии, на 7-й день — самая большая.','Play the daily quiz every day: the streak bonus grows, day 7 is the biggest.')}</p>
    <div class="streak">${cells}</div><p>${st.claimed?L('Сегодня уже сыграно — до завтра!','Done today — see you tomorrow!'):st.broken?L('Серия прервалась — начнётся заново.','The streak was broken — starting over.'):''}</p>
    <div class="row">${st.claimed?'':`<button class="btn blue" id="sGo">📅 ${L('Викторина дня','Daily quiz')}</button>`}<button class="btn" id="mCancel">${L('Закрыть','Close')}</button></div>`);
  if($('sGo'))$('sGo').onclick=()=>{hideModal();openDaily();};$('mCancel').onclick=hideModal;}
// при запуске: одно напоминание о викторине дня, если серия идёт
function maybeStreak(){if(G||window.__demo||modalOn||$('ad').classList.contains('on'))return;const st=streakState();
  if(st.claimed||st.broken||st.day<2||S.tips.remind===dayKey(0))return;S.tips.remind=dayKey(0);save();
  toast('🔥 '+L('Серия ','Streak ')+(st.day-1)+L(' — сыграйте викторину дня, чтобы не прервать!',' — play the daily quiz to keep it!'),3500);}

/* ================= дуэль с другом (VK): зерно в ссылке, без сервера =================
   Игрок проходит 10 вопросов по случайному зерну и отправляет ссылку vk.com/app<ID>#duel=<зерно>-<счёт>. Друг открывает игру —
   ему достаются те же вопросы в том же порядке, в конце сравнение счёта. Ответный вызов — та же ссылка со своим счётом */
function duelLink(seed,score){const h='duel='+seed.toString(36)+'-'+score;const m=/[?&]vk_app_id=(\d+)/.exec(location.search);
  if(m)return 'https://vk.com/app'+m[1]+'#'+h;return location.origin+location.pathname+'?vk=1#'+h;}
function parseDuel(){const m=/duel=([0-9a-z]{1,8})-(\d{1,2})/.exec(location.hash+'&'+location.search);if(!m)return null;
  const seed=parseInt(m[1],36),foe=+m[2];return seed>0&&foe>=0&&foe<=10?{seed,foe}:null;}
let duelIn=PLAT==='vk'?parseDuel():null;
function duelIncoming(){if(!duelIn||window.__demo)return false;const d=duelIn;duelIn=null;
  const mine=S.duel[d.seed.toString(36)];
  modal(`<div class="av">${portrait('valerka','wow')}</div><h2>⚔️ ${L('Вас вызвали на дуэль!','You are challenged!')}</h2>
    <p>${L('Друг ответил верно на ','Your friend got ')}<b>${d.foe} ${L('из 10','of 10')}</b>. ${L('Те же 10 вопросов — сможете лучше?','Same 10 questions — can you beat it?')}</p>
    ${mine!=null?'<p class="goal">'+L('Вы уже играли эту дуэль: ','You already played: ')+mine+'/10</p>':''}
    <div class="row">${mine==null?`<button class="btn violet" id="dAcc">⚔️ ${L('Принять вызов','Accept')}</button>`:''}<button class="btn" id="mCancel">${mine==null?L('Потом','Later'):L('Хорошо','OK')}</button></div>`);
  if($('dAcc'))$('dAcc').onclick=()=>{hideModal();startDuel(d.seed,d.foe);};$('mCancel').onclick=hideModal;return true;}
function openDuel(){modal(`<div class="av">${portrait('valerka','happy')}</div><h2>⚔️ ${L('Дуэль с другом','Duel with a friend')}</h2>
  <p>${L('Ответьте на 10 вопросов, потом отправьте другу ссылку: у него будут те же вопросы в том же порядке. Кто больше — тот и знаток двора!','Answer 10 questions, then send the link: your friend gets the same questions.')}</p>
  <p class="about">${L('Подсказки — по одной каждого вида, без повторов: условия у обоих одинаковые.','One hint of each kind, no extras: fair for both.')}</p>
  <div class="row"><button class="btn violet" id="dGo">⚔️ ${L('Начать','Start')}</button><button class="btn" id="mCancel">${L('Отмена','Cancel')}</button></div>`);
  $('dGo').onclick=()=>{hideModal();startDuel(1+Math.floor(Math.random()*2e9),null);};$('mCancel').onclick=hideModal;}
function startDuel(seed,foe){const set=seededSet(seed^0x5bd1e995);
  G=newG('duel',set.qs,{perms:set.perms,seed,foe});G.say={who:'mihalych',t:HOST.duel[0]};
  show('scr-game');hideModal();renderQ();YG.start();}
function finishDuel(){if(!G||G.over)return;G.over=true;YG.stop();
  const good=G.res.filter(x=>x===1).length,key=G.seed.toString(36),first=S.duel[key]==null,coins=first?good*2:0;
  if(first){S.duel[key]=good;S.coins+=coins;}S.adW=(S.adW||0)+1;save();updCoins();
  const foe=G.foe,res=foe==null?'':good>foe?L('Победа! Вы ответили лучше друга.','You won!'):good<foe?L('Друг оказался сильнее. Реванш?','Your friend won. Rematch?'):L('Ничья! Достойные соперники.','A draw!');
  if(foe==null||good>=foe){SND.win();confetti();}else SND.lose();
  const link=duelLink(G.seed,good);
  modal(`<div class="av">${portrait('valerka',foe!=null&&good<foe?'sad':'happy')}</div><h2>⚔️ ${L('Дуэль','Duel')}</h2>
    <p class="score">${good}/10</p>${foe!=null?'<p><b>'+L('Друг: ','Friend: ')+foe+'/10</b> — '+esc(res)+'</p>':''}
    ${coins?'<p class="coins-won">+'+coinsTxt(coins)+'</p>':''}
    <p>${foe==null?L('Отправьте другу вызов — ему достанутся те же вопросы.','Send the challenge — your friend gets the same questions.'):L('Отправьте ответ — пусть друг увидит ваш счёт.','Send your answer back.')}</p>
    <input class="link" id="dLink" readonly value="${esc(link)}">
    <div class="row" id="mWon"><button class="btn violet noenter" id="dShare">📨 ${foe==null?L('Отправить вызов','Send challenge'):L('Отправить ответ','Send answer')}</button><button class="btn green" id="dOk">${L('В меню','Menu')}</button></div>`);
  $('dShare').onclick=()=>shareLink(link);$('dOk').onclick=()=>{hideModal();between(openMenu);};}
function shareLink(link){
  if(VK){vkSend('VKWebAppShare',{link},60000).catch(()=>{});return;}
  const i=$('dLink');try{i.select();}catch(e){}
  const done=()=>toast(L('Ссылка скопирована — отправьте её другу','Link copied — send it to a friend'));
  try{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(link).then(done,()=>{try{document.execCommand('copy');done();}catch(e){}});return;}}catch(e){}
  try{document.execCommand('copy');done();}catch(e){}}
