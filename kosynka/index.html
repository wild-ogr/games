<script>
'use strict';
/* ================= какая игра: флаг сборки =================
   tools/build.py подставляет сюда игру (klondike | spider | freecell) и собирает отдельный index.html на каждую — это ОТДЕЛЬНЫЕ игры
   со своими названием, сохранением, покупками и рейтингом. В исходнике (разработка на маке) игру выбирает ?game=… (по умолчанию Косынка) */
const BUILD_GAME='klondike';
const GID=BUILD_GAME||((/[?&]game=(klondike|spider|freecell)/.exec(location.search)||[])[1])||'klondike';
/*LOGIC-BEGIN*/
/* ================= правила пасьянсов (чистая логика: без экрана; её же гоняют tools/test.sh и tools/seeds.js в jsc) =================
   Карта — число: масть SU = (id%52)/13 (0 ♠, 1 ♥, 2 ♦, 3 ♣), достоинство RK = id%13 (0 — туз … 12 — король).
   В «Пауке» 104 карты: id до 415 (8 «колод по 13» нужных мастей), у каждой карты свой id — анимации не путают одинаковые карты.
   Состояние: p — стопки (последний элемент — верхняя карта), d — сколько карт снизу стопки лежит рубашкой вверх. */
function rng(seed){let a=seed>>>0;return function(){a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296;};}
function shuffled(ids,seed){const a=ids.slice(),r=rng(seed);for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1)),t=a[i];a[i]=a[j];a[j]=t;}return a;}
const SU=c=>((c%52)/13)|0,RK=c=>c%13,RED=c=>{const s=((c%52)/13)|0;return s===1||s===2;};
function range(n){const a=[];for(let i=0;i<n;i++)a.push(i);return a;}
function stClone(s){return {g:s.g,p:s.p.map(a=>a.slice()),d:s.d.slice(),draw:s.draw,suits:s.suits,done:s.done};}
const topc=a=>a[a.length-1];
// ход: {f:откуда, j:с какой карты, t:куда} или {s:1} — колода (взять / перевернуть / раздать ряд)

/* ---- Косынка (Klondike): 0 колода, 1 сброс, 2–5 дом (стопка 2+масть), 6–12 столбцы. Колоду можно перебирать без ограничений ---- */
const KL={id:'klondike',TAB:6,NT:7,FND:2,
  kind(i){return i===0?'stock':i===1?'waste':i<6?'found':'tab';},
  deal(seed,draw){const c=shuffled(range(52),seed),p=[],d=[];for(let i=0;i<13;i++){p.push([]);d.push(0);}let k=0;
    for(let col=0;col<7;col++){for(let j=0;j<=col;j++)p[6+col].push(c[k++]);d[6+col]=col;}
    while(k<52)p[0].push(c[k++]);d[0]=p[0].length;return {g:'klondike',p,d,draw:draw===3?3:1,done:0};},
  isRun(a,j){for(let k=j+1;k<a.length;k++){const x=a[k-1],y=a[k];if(RK(x)!==RK(y)+1||RED(x)===RED(y))return false;}return true;},
  canPick(s,i,j){const a=s.p[i],k=KL.kind(i);if(j<0||j>=a.length)return false;
    if(k==='tab')return j>=s.d[i]&&KL.isRun(a,j);return (k==='waste'||k==='found')&&j===a.length-1;},
  canDrop(s,f,j,t){if(f===t)return false;const a=s.p[f],c=a[j],n=a.length-j,k=KL.kind(t);
    if(k==='found')return n===1&&t===2+SU(c)&&s.p[t].length===RK(c);
    if(k!=='tab')return false;const b=s.p[t];if(!b.length)return RK(c)===12;const x=topc(b);return RK(x)===RK(c)+1&&RED(x)!==RED(c);},
  flip(s,i){if(i>=6&&s.d[i]>0&&s.d[i]>=s.p[i].length)s.d[i]=s.p[i].length-1;},
  move(s,f,j,t){const cs=s.p[f].splice(j);for(const c of cs)s.p[t].push(c);KL.flip(s,f);if(f===0)s.d[0]=s.p[0].length;},
  canStock(s){return s.p[0].length>0||s.p[1].length>0;},
  stock(s){const st=s.p[0],w=s.p[1];if(st.length){const n=Math.min(s.draw,st.length);for(let k=0;k<n;k++)w.push(st.pop());}
    else if(w.length){s.p[0]=w.reverse();s.p[1]=[];}else return false;s.d[0]=s.p[0].length;return true;},
  won(s){return s.p[2].length+s.p[3].length+s.p[4].length+s.p[5].length===52;},
  fcount(s){return s.p[2].length+s.p[3].length+s.p[4].length+s.p[5].length;},
  // в дом без риска: туз и двойка всегда; дальше — если обе масти другого цвета уже выше на одну (и своя пара — не ниже на две)
  safe(s,c){const r=RK(c),su=SU(c),L=q=>s.p[2+q].length;if(L(su)!==r)return false;if(r<=1)return true;
    const o=su===1||su===2?[0,3]:[1,2],same=su===0?3:su===3?0:su===1?2:1;return L(o[0])>=r&&L(o[1])>=r&&L(same)>=r-1;},
  autoMove(s){for(const i of [1,6,7,8,9,10,11,12]){const a=s.p[i];if(!a.length||(i>=6&&s.d[i]>=a.length))continue;const c=topc(a);if(KL.safe(s,c))return {f:i,j:a.length-1,t:2+SU(c)};}return null;},
  // ходы для решателя и подсказки — по порядку полезности; бессмысленные (король с пустого на пустой, дом → столбец) не предлагаем
  moves(s){const out=[],p=s.p,d=s.d;const am=KL.autoMove(s);if(am)return [am];
    let firstEmpty=-1;for(let i=6;i<13;i++)if(!p[i].length){firstEmpty=i;break;}
    const toFound=[],reveal=[],other=[],part=[];
    for(let i=6;i<13;i++){const a=p[i];if(!a.length)continue;const c=topc(a);if(p[2+SU(c)].length===RK(c))toFound.push({f:i,j:a.length-1,t:2+SU(c)});}
    const w=p[1];if(w.length){const c=topc(w);if(p[2+SU(c)].length===RK(c))toFound.push({f:1,j:w.length-1,t:2+SU(c)});}
    for(let i=6;i<13;i++){const a=p[i];if(!a.length)continue;const j0=d[i];
      // весь открытый хвост (самая нижняя открытая карта)
      let j=a.length-1;while(j>j0&&RK(a[j-1])===RK(a[j])+1&&RED(a[j-1])!==RED(a[j]))j--;
      for(let t=6;t<13;t++){if(t===i)continue;if(!p[t].length&&t!==firstEmpty)continue;
        if(KL.canDrop(s,i,j,t)){if(j===0&&!p[t].length)continue;(j>0?reveal:other).push({f:i,j,t,w:j===j0?d[i]:0});}}
      // часть хвоста — только если открывшаяся карта сразу идёт в дом
      for(let k=j+1;k<a.length;k++){const u=a[k-1];if(p[2+SU(u)].length!==RK(u))continue;
        for(let t=6;t<13;t++){if(t===i||!p[t].length)continue;if(KL.canDrop(s,i,k,t))part.push({f:i,j:k,t});}}}
    reveal.sort((x,y)=>y.w-x.w);
    const wst=[];if(w.length)for(let t=6;t<13;t++){if(!p[t].length&&t!==firstEmpty)continue;if(KL.canDrop(s,1,w.length-1,t))wst.push({f:1,j:w.length-1,t});}
    for(const m of toFound)out.push(m);for(const m of reveal)out.push(m);for(const m of wst)out.push(m);for(const m of part)out.push(m);for(const m of other)out.push(m);
    if(KL.canStock(s))out.push({s:1});
    return out;},
  key(s){const cols=[];for(let i=6;i<13;i++)cols.push(s.d[i]+':'+s.p[i].join(','));cols.sort();
    return s.p[0].join(',')+'|'+s.p[1].join(',')+'|'+s.p[2].length+','+s.p[3].length+','+s.p[4].length+','+s.p[5].length+'|'+cols.join(';');},
  // оценка для поиска «лучший сначала»: дом, открытые карты
  score(s){let v=KL.fcount(s)*6;for(let i=6;i<13;i++)v-=s.d[i]*4;return v;}
};

/* ---- Паук: 0 колода, 1–8 собранные масти, 9–18 столбцы. Раздать ряд — только когда нет пустых столбцов ---- */
const SP={id:'spider',TAB:9,NT:10,FND:1,
  kind(i){return i===0?'stock':i<9?'found':'tab';},
  deal(seed,suits){suits=suits===4?4:suits===2?2:1;const ids=[];const S=suits===1?[0]:suits===2?[0,1]:[0,1,2,3],copies=8/S.length;
    for(let k=0;k<copies;k++)for(const su of S)for(let r=0;r<13;r++)ids.push(k*52+su*13+r);
    const c=shuffled(ids,seed),p=[],d=[];for(let i=0;i<19;i++){p.push([]);d.push(0);}let k=0;
    for(let col=0;col<10;col++){const n=col<4?6:5;for(let j=0;j<n;j++)p[9+col].push(c[k++]);d[9+col]=n-1;}
    while(k<104)p[0].push(c[k++]);d[0]=p[0].length;return {g:'spider',p,d,draw:1,suits,done:0};},
  isRun(a,j){for(let k=j+1;k<a.length;k++){const x=a[k-1],y=a[k];if(RK(x)!==RK(y)+1||SU(x)!==SU(y))return false;}return true;},
  canPick(s,i,j){const a=s.p[i];if(i<9||j<0||j>=a.length)return false;return j>=s.d[i]&&SP.isRun(a,j);},
  canDrop(s,f,j,t){if(f===t||t<9)return false;const c=s.p[f][j],b=s.p[t];if(!b.length)return true;return RK(topc(b))===RK(c)+1;},
  flip(s,i){if(i>=9&&s.d[i]>0&&s.d[i]>=s.p[i].length)s.d[i]=s.p[i].length-1;},
  // собранная масть (король … туз одной масти, открытые) уходит в дом
  collect(s,i){const a=s.p[i];if(a.length<13)return false;const j=a.length-13;if(j<s.d[i]||RK(a[j])!==12||!SP.isRun(a,j))return false;
    const cs=a.splice(j);s.p[1+s.done]=cs;s.done++;SP.flip(s,i);return true;},
  move(s,f,j,t){const cs=s.p[f].splice(j);for(const c of cs)s.p[t].push(c);SP.flip(s,f);SP.collect(s,t);},
  canStock(s){if(!s.p[0].length)return false;for(let i=9;i<19;i++)if(!s.p[i].length)return false;return true;},
  stock(s){if(!SP.canStock(s))return false;for(let i=9;i<19;i++)s.p[i].push(s.p[0].pop());s.d[0]=s.p[0].length;for(let i=9;i<19;i++)SP.collect(s,i);return true;},
  won(s){return s.done===8;},
  fcount(s){return s.done*13;},
  autoMove(){return null;},
  // нижняя карта открытой масти-последовательности
  runStart(s,i){const a=s.p[i];let j=a.length-1;while(j>s.d[i]&&RK(a[j-1])===RK(a[j])+1&&SU(a[j-1])===SU(a[j]))j--;return j;},
  moves(s){const p=s.p,d=s.d,A=[],B=[],C=[],D=[],E=[];let firstEmpty=-1;for(let i=9;i<19;i++)if(!p[i].length){firstEmpty=i;break;}
    for(let i=9;i<19;i++){const a=p[i];if(!a.length)continue;const j0=SP.runStart(s,i);
      for(let j=j0;j<a.length;j++){const c=a[j],under=j>0?a[j-1]:-1,onParent=j>d[i]&&j>0&&RK(under)===RK(c)+1,sameUnder=onParent&&SU(under)===SU(c);
        if(sameUnder)continue; // уже лежит на своей масти — не разрываем
        const reveals=j===d[i]&&j>0,empties=j===0;
        for(let t=9;t<19;t++){if(t===i)continue;const b=p[t];
          if(!b.length){if(t!==firstEmpty||empties)continue;if(!(reveals||(!onParent&&j>d[i])))continue;E.push({f:i,j,t,w:(reveals?20:0)+a.length-j});continue;}
          const x=topc(b);if(RK(x)!==RK(c)+1)continue;
          const same=SU(x)===SU(c);
          if(same){A.push({f:i,j,t,w:(reveals?100:0)+(empties?50:0)+a.length-j+(x===topc(b)?0:0)});}
          else if(reveals||empties){B.push({f:i,j,t,w:(reveals?d[i]*3+10:0)+(empties?20:0)});}
          else if(!onParent){C.push({f:i,j,t,w:a.length-j});}}}}
    A.sort((x,y)=>y.w-x.w);B.sort((x,y)=>y.w-x.w);C.sort((x,y)=>y.w-x.w);E.sort((x,y)=>y.w-x.w);
    const out=A.concat(B,C,E);if(SP.canStock(s))out.push({s:1});return out;},
  key(s){const cols=[];for(let i=9;i<19;i++){const a=s.p[i];let t=s.d[i]+':';for(let k=0;k<a.length;k++)t+=(a[k]%52)+',';cols.push(t);}cols.sort();return s.p[0].length+'|'+s.done+'|'+cols.join(';');},
  // оценка: собранные масти, закрытые карты, пустые столбцы, связки «по масти» (ценнее) и «не по масти»; раздавать ряд — попозже
  score(s){let v=s.done*500;for(let i=9;i<19;i++){const a=s.p[i];v-=s.d[i]*25;if(!a.length){v+=40;continue;}
      for(let k=Math.max(s.d[i],1);k<a.length;k++){const x=a[k-1],y=a[k];if(RK(x)===RK(y)+1)v+=SU(x)===SU(y)?10:2;}}
    return v-s.p[0].length;}
};

/* ---- Свободная ячейка (FreeCell): 0–3 ячейки, 4–7 дом (стопка 4+масть), 8–15 столбцы. Все карты открыты ---- */
const FC={id:'freecell',TAB:8,NT:8,FND:4,
  kind(i){return i<4?'cell':i<8?'found':'tab';},
  deal(seed){const c=shuffled(range(52),seed),p=[],d=[];for(let i=0;i<16;i++){p.push([]);d.push(0);}for(let k=0;k<52;k++)p[8+k%8].push(c[k]);return {g:'freecell',p,d,draw:1,done:0};},
  isRun:KL.isRun,
  // сколько карт можно перенести разом (через свободные ячейки и пустые столбцы)
  cap(s,toEmpty,f){let fc=0,ec=0;for(let i=0;i<4;i++)if(!s.p[i].length)fc++;for(let i=8;i<16;i++)if(!s.p[i].length&&i!==f)ec++;if(toEmpty)ec--;return (fc+1)*Math.pow(2,Math.max(0,ec));},
  canPick(s,i,j){const a=s.p[i],k=FC.kind(i);if(j<0||j>=a.length)return false;if(k==='cell')return j===a.length-1;if(k==='found')return false;return FC.isRun(a,j);},
  canDrop(s,f,j,t){if(f===t)return false;const a=s.p[f],c=a[j],n=a.length-j,k=FC.kind(t),b=s.p[t];
    if(k==='cell')return n===1&&!b.length;
    if(k==='found')return n===1&&t===4+SU(c)&&b.length===RK(c);
    if(!b.length)return n<=FC.cap(s,true,f);const x=topc(b);return RK(x)===RK(c)+1&&RED(x)!==RED(c)&&n<=FC.cap(s,false,f);},
  flip(){},
  move(s,f,j,t){const cs=s.p[f].splice(j);for(const c of cs)s.p[t].push(c);},
  canStock(){return false;},stock(){return false;},
  won(s){return s.p[4].length+s.p[5].length+s.p[6].length+s.p[7].length===52;},
  fcount(s){return s.p[4].length+s.p[5].length+s.p[6].length+s.p[7].length;},
  safe(s,c){const r=RK(c),su=SU(c),L=q=>s.p[4+q].length;if(L(su)!==r)return false;if(r<=1)return true;
    const o=su===1||su===2?[0,3]:[1,2],same=su===0?3:su===3?0:su===1?2:1;return L(o[0])>=r&&L(o[1])>=r&&L(same)>=r-1;},

/* ---- решатель: поиск «лучший сначала» с запоминанием позиций; lim — сколько позиций смотреть.

function solve(R,s0,lim){const seen=new Set(),heap=[];let nodes=0,uid=0;
  const push=n=>{heap.push(n);let i=heap.length-1;while(i>0){const q=(i-1)>>1;if(cmp(heap[q],heap[i])<=0)break;const t=heap[q];heap[q]=heap[i];heap[i]=t;i=q;}};
  const pop=()=>{const r=heap[0],l=heap.pop();if(heap.length){heap[0]=l;let i=0;for(;;){const a=2*i+1,b=a+1;let m=i;if(a<heap.length&&cmp(heap[a],heap[m])<0)m=a;if(b<heap.length&&cmp(heap[b],heap[m])<0)m=b;if(m===i)break;const t=heap[m];heap[m]=heap[i];heap[i]=t;i=m;}}return r;};
  function cmp(a,b){return b.v-a.v||a.u-b.u;}
  const path=n=>{const out=[];while(n.par){out.push(n.m);n=n.par;}return out.reverse();};
  const root={s:stClone(s0),par:null,m:null,v:R.score(s0),u:uid++,g:0};seen.add(R.key(root.s));push(root);
  while(heap.length){const n=pop();if(R.won(n.s))return {ok:true,path:path(n),nodes};if(++nodes>lim)return {ok:false,nodes};

      push({s,par:n,m,v:R.score(s)-k*0.5-(n.g+1)*0.02,u:uid++,g:n.g+1});}}
  return {ok:false,full:true,nodes};}

  for(const f of ['games','wins'])if(typeof d[f]==='number')S[f]=Math.max(S[f]||0,d[f]);

  if(typeof d.coins==='number')S.coins=newer?Math.max(0,d.coins+(S.coins-BOOT_COINS)):(dt===rt&&!dt)?Math.max(S.coins,d.coins):S.coins;
  for(const k in d)if(k!=='soc'&&(!(k in S)||newer&&!/^(ts|games|wins|daily|ach|seq|st|own|coins|streak|buy|buyB|payT|payV|soc|rk|dwk|ez|abn|col)$/.test(k)))S[k]=d[k]; // настройки, выбранный стол и т. п.
  payMerge(d); // покупки — объединение
  S.rk=Math.max(S.rk||0,typeof d.rk==='number'?d.rk:rankOf(d.wins||0)); // звание: награда выдана — у кого больше
  if(isObj(d.dwk)&&(!isObj(S.dwk)||d.dwk.k>S.dwk.k||d.dwk.k===S.dwk.k&&(d.dwk.g||0)>(S.dwk.g||0)))S.dwk={k:d.dwk.k,g:d.dwk.g||0}; // премии недели

  SOC.merge(d.soc); // соц-предложения VK: сливаем в тот же объект S.soc (модуль держит ссылку)
  if(isObj(d.streak)){const a=S.streak,b=d.streak; // подарки за вход: лесенка того, у кого больше получено; «день последнего» — более поздний (не взять дважды за день)
    if(!a)S.streak=b;else{const m=giftCnt(b)>giftCnt(a)?b:a;S.streak={day:m.day||0,cyc:m.cyc||0,last:Math.max(a.last||0,b.last||0)};}}}

  function init(S,opt){O=opt||{};if(!S.soc||typeof S.soc!=='object')S.soc={};st=S.soc;

function computeLayout(){const NT=R.NT,pad=W<520?4:12,gk=GID==='spider'?.07:.1,land=W>H*1.1,hk=land?(GID==='klondike'?5:GID==='spider'?5.5:4.8):(GID==='klondike'?3.3:GID==='spider'?3.5:3.4);

// (Паук — каждый столбец сам по себе, Косынка и Ячейка — один шаг на все столбцы, чтобы ряды шли ровно)
function colStep(pi){const a=G.st.p[pi],n=a.length,d=Math.min(G.st.d[pi],Math.max(0,n-1));let fd=LY.fd,fu=LY.fu;if(n<2)return [fd,fu];

      s.z=z++;s.pi=pi;s.j=j;
      if(instant||calm()&&!delay){s.fx=s.tx=p.x;s.fy=s.ty=p.y;s.t0=0;s.dur=0;s.up=s.want=up;s.ft=0;continue;}
      const dl=delay?delay(id,pi,j)||0:0;

      if(s.want!==up){s.want=up;s.ft=Math.max(t,s.t0+s.dur*.6);}}}

// выложить колоду в начало раздачи (карты летят из колоды)
function dealFrom(){const s=GID==='freecell'?{x:W/2-LY.cw/2,y:-LY.ch*1.2}:LY.sl[0];SPR={};
  const st=G.st;let k=0;const order={};
  if(GID==='klondike'){for(let r=0;r<7;r++)for(let c=r;c<7;c++)order[st.p[6+c][r]]=k++;}
  else if(GID==='spider'){for(let r=0;r<6;r++)for(let c=0;c<10;c++){const a=st.p[9+c];if(r<a.length)order[a[r]]=k++;}}
  else{for(let r=0;r<7;r++)for(let c=0;c<8;c++){const a=st.p[8+c];if(r<a.length)order[a[r]]=k++;}}
  for(let pi=0;pi<st.p.length;pi++)for(const id of st.p[pi])SPR[id]={x:s.x,y:s.y,fx:s.x,fy:s.y,tx:s.x,ty:s.y,t0:0,dur:0,up:false,want:false,ft:0};
  const step=calm()?6:(GID==='spider'?22:30);
  setTargets(id=>order[id]!=null?80+order[id]*step:0);}

/* ---- кэш картинок карт (перерисовка — только при смене размера, колоды или рубашки) ---- */

/* ---- рисование кадра ---- */
function slotBox(x,y,label,s){const g=ctx,lt=tableLight();rrect(g,x+1,y+1,LY.cw-2,LY.ch-2,LY.cw*.09);g.fillStyle=lt?'rgba(0,0,0,.06)':'rgba(0,0,0,.14)';g.fill();
  g.lineWidth=1.5;g.strokeStyle=lt?'rgba(0,0,0,.28)':'rgba(255,255,255,.4)';g.stroke();const col=lt?'rgba(0,0,0,.3)':'rgba(255,255,255,.45)';

function drawCard(id,x,y,s,t){let up=s.up,sx=1;
  if(s.ft&&s.want!==s.up){if(t>=s.ft){const k=(t-s.ft)/FLIP;if(k>=1){s.up=s.want;s.ft=0;up=s.up;}else{sx=Math.abs(Math.cos(Math.PI*k));up=k<.5?s.up:s.want;}}}

  else ctx.drawImage(img,x,y,LY.cw,LY.ch);}
function glow(x,y,w,h,a){ctx.save();ctx.globalAlpha=a;rrect(ctx,x-2,y-2,w+4,h+4,LY.cw*.12);ctx.fillStyle='rgba(255,210,63,.28)';ctx.fill();ctx.lineWidth=Math.max(4,LY.cw*.1);ctx.strokeStyle='#ffc400';ctx.stroke();ctx.restore();}
function render(){if(!LY)return;const t=now();ctx.setTransform(dpr,0,0,dpr,0,0);ctx.drawImage(tableImg(),0,0,W,H);if(!G)return;const st=G.st;
  // места под стопки
  for(let pi=0;pi<st.p.length;pi++){const k=R.kind(pi),s=LY.sl[pi];if(!s)continue;
    if(k==='stock'){if(!st.p[pi].length)slotBox(s.x,s.y,GID==='klondike'&&st.p[1].length?'↻':'');}
    else if(k==='found'){if(GID==='spider'){if(pi===1)slotBox(s.x,s.y,'');}else slotBox(s.x,s.y,'',pi-R.FND);}
    else if(k==='cell'||k==='tab')slotBox(s.x,s.y,k==='tab'&&GID==='klondike'?rankL(12):'');
    else if(k==='waste'&&!st.p[1].length&&GID==='klondike'){}}
  if(G.fx){drawFx(t);return;}
  const drag=G.drag&&G.drag.on?G.drag:null,dragSet=drag?drag.ids:null,moving=[];
  for(let pi=0;pi<st.p.length;pi++){const a=st.p[pi];for(let j=0;j<a.length;j++){const id=a[j],s=SPR[id];if(!s)continue;if(dragSet&&dragSet.indexOf(id)>=0)continue;
      if(t<s.t0+s.dur){moving.push([id,s]);continue;}drawCard(id,s.tx,s.ty,s,t);}}
  moving.sort((a,b)=>a[1].t0-b[1].t0);for(const [id,s] of moving){const p=sprPos(s,t);drawCard(id,p.x,p.y,s,t);}
  // подсказка: мягко мигающая рамка вокруг карты и места, куда её положить
  if(G.hl){const e=t-G.hl.t0,D=2600;if(e>D)G.hl=null;else{const a=calm()?1:.75+.25*Math.cos(e/260*Math.PI);const h=G.hl;
      if(h.stock){const s=LY.sl[0],p=st.p[0].length?cardXY(0,st.p[0].length-1):s;glow(p.x,p.y,LY.cw,LY.ch,a);}
      else{const a0=st.p[h.f];if(h.j<a0.length){const p0=cardXY(h.f,h.j),pl=cardXY(h.f,a0.length-1);glow(p0.x,p0.y,LY.cw,pl.y-p0.y+LY.ch,a);}
        const b=st.p[h.t],pt=b.length?cardXY(h.t,b.length-1):LY.sl[h.t];glow(pt.x,pt.y,LY.cw,LY.ch,a*.8);}}}
  if(drag){for(const q of drag.ok||[]){if(q===drag.over)continue;const b=st.p[q],pt=b.length?cardXY(q,b.length-1):LY.sl[q];glow(pt.x,pt.y,LY.cw,LY.ch,.3);}
    if(drag.over>=0){const b=st.p[drag.over],pt=b.length?cardXY(drag.over,b.length-1):LY.sl[drag.over];glow(pt.x,pt.y,LY.cw,LY.ch,.9);}
    const step=R.kind(drag.pi)==='tab'?colStep(drag.pi):null,base=cardXY(drag.pi,drag.j,step);
    for(let k=0;k<drag.ids.length;k++){const p=cardXY(drag.pi,drag.j+k,step),s=SPR[drag.ids[k]];const x=drag.x-drag.ox+(p.x-base.x),y=drag.y-drag.oy+(p.y-base.y),cx=x+LY.cw/2,cy=y+LY.ch/2;
      ctx.save();ctx.shadowColor='rgba(0,0,0,.4)';ctx.shadowBlur=14;ctx.shadowOffsetY=7;ctx.translate(cx,cy);ctx.scale(1.04,1.04);ctx.translate(-cx,-cy);

function animating(t){if(G&&(G.hl||G.fx||G.shake))return true;for(const id in SPR){const s=SPR[id];if(t<s.t0+s.dur||s.ft&&s.want!==s.up)return true;}return false;}
// цикл кадров спит, когда ничего не движется (и на паузе); любое изменение — kick()
let loopOn=false;
function kick(){if(loopOn)return;loopOn=true;requestAnimationFrame(loop);}
function loop(){if(paused&&!G){loopOn=false;return;}render();if(G&&animating(now()))requestAnimationFrame(loop);else loopOn=false;}

/* ---- победный «разлёт» карт из дома (в спокойном режиме — без него) ---- */
function celebrate(done){if(calm()||window.__demo){setTimeout(done,350);return;}
  const st=G.st,cards=[];for(let pi=0;pi<st.p.length;pi++)if(R.kind(pi)==='found')st.p[pi].forEach((id,j)=>cards.push({id,pi,j}));
  cards.sort((a,b)=>b.j-a.j||a.pi-b.pi);const t0=now(),r=rng(Date.now()&0xffff);
  let tr=null;try{tr=document.createElement('canvas');tr.width=cv.width;tr.height=cv.height;const x=tr.getContext('2d');x.setTransform(dpr,0,0,dpr,0,0);tr.g=x;}catch(e){tr=null;}
  G.fx={t0,done,last:t0,tr,parts:cards.map((c,k)=>{const p=cardXY(c.pi,c.j);return {id:c.id,x:p.x,y:p.y,vx:(r()<.5?-1:1)*(60+r()*200),vy:-(100+r()*260),st:t0+k*55,on:false};})};
  G.fxEnd=setTimeout(endFx,Math.min(5200,cards.length*55+2600));kick();}
// «водопад» как в старом пасьянсе: карты прыгают и оставляют след (следы копятся на своём холсте f.tr)
function drawFx(t){const f=G.fx,dt=Math.min(.05,(t-f.last)/1000);f.last=t;const gy=900,floor=H-LY.ch,tg=f.tr&&f.tr.g;
  for(const p of f.parts){if(t<p.st)continue;p.vy+=gy*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.y>floor){p.y=floor;p.vy*=-.62;}
    if(tg&&p.x>-LY.cw&&p.x<W)tg.drawImage(faceImg(p.id),p.x,p.y,LY.cw,LY.ch);}
  if(tg)ctx.drawImage(f.tr,0,0,W,H);
  for(const p of f.parts)if(t<p.st||!tg)drawCard(p.id,p.x,p.y,{up:true,want:true},t);}
function endFx(){if(!G||!G.fx)return;clearTimeout(G.fxEnd);const d=G.fx.done;G.fx=null;render();d&&d();}

/* ---- касания: нажал — карта сама едет на лучшее место; потащил — кладёшь, куда хочешь ---- */
function cvPos(e){const r=cv.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top};}
function inR(x,y,rx,ry,rw,rh){return x>=rx&&x<=rx+rw&&y>=ry&&y<=ry+rh;}
function hitTest(x,y){const st=G.st;
  for(let pi=st.p.length-1;pi>=0;pi--){const a=st.p[pi],k=R.kind(pi),s=LY.sl[pi];
    if(k==='stock'){const n=a.length;const bx=GID==='spider'&&n?cardXY(0,0).x:s.x;if(inR(x,y,bx-4,s.y-4,s.x+LY.cw-bx+8,LY.ch+8))return {pi,stock:true};continue;}
    if(!a.length)continue;
    if(k==='tab'){const step=colStep(pi);for(let j=a.length-1;j>=0;j--){const p=cardXY(pi,j,step),hh=j===a.length-1?LY.ch:cardXY(pi,j+1,step).y-p.y;if(inR(x,y,p.x,p.y,LY.cw,hh))return {pi,j,pick:R.canPick(st,pi,j),up:faceUp(pi,j)};}continue;}
    const j=a.length-1,p=cardXY(pi,j);if(inR(x,y,p.x,p.y,LY.cw,LY.ch))return {pi,j,pick:R.canPick(st,pi,j),up:true};}
  return null;}
// куда можно бросить перетаскиваемые карты: стопка с наибольшим перекрытием, где ход разрешён
function dropTarget(d){const st=G.st,x=d.x-d.ox,y=d.y-d.oy;let best=-1,ba=0;
  for(let t=0;t<st.p.length;t++){const k=R.kind(t);if(k==='stock'||k==='waste'||t===d.pi)continue;const s=LY.sl[t];if(!s)continue;
    let rx=s.x,ry=s.y,rw=LY.cw,rh=LY.ch;if(k==='tab'&&st.p[t].length){const pl=cardXY(t,st.p[t].length-1);rh=pl.y-s.y+LY.ch;}
    const ox=Math.max(0,Math.min(x+LY.cw,rx+rw)-Math.max(x,rx)),oy=Math.max(0,Math.min(y+LY.ch,ry+rh)-Math.max(y,ry)),ar=ox*oy;if(ar<=0)continue;
    let tt=t;if(k==='found'){if(d.ids.length!==1)continue;tt=foundFor(st.p[d.pi][d.j]);if(tt<0)continue;}
    if(ar>ba&&R.canDrop(st,d.pi,d.j,tt)){ba=ar;best=tt;}}
  return best;}
// все места, куда можно положить карты (для лёгкой подсветки при перетаскивании)
function dropOk(pi,j){const st=G.st,r=[];if(!R.canPick(st,pi,j))return r;const n=st.p[pi].length-j;
  for(let t=0;t<st.p.length;t++){const k=R.kind(t);if(k==='stock'||k==='waste'||t===pi||!LY.sl[t])continue;
    if(k==='found'){if(n!==1||r.indexOf(t)>=0)continue;const f=foundFor(st.p[pi][j]);if(f===t&&R.canDrop(st,pi,j,f))r.push(f);continue;}
    if(R.canDrop(st,pi,j,t))r.push(t);}
  return r;}
let ptr=null;
cv.addEventListener('pointerdown',e=>{if(G&&G.fx&&!modalOn){endFx();return;} // тап по столу — пропустить «водопад»
  if(!G||G.won||G.busy||modalOn)return;if(ptr)return;const p=cvPos(e),h=hitTest(p.x,p.y);
  ptr={id:e.pointerId,x0:p.x,y0:p.y,h,t:now()};if(h&&h.pick){try{cv.setPointerCapture(e.pointerId);}catch(er){}}});
cv.addEventListener('pointermove',e=>{if(!ptr||ptr.id!==e.pointerId||!G)return;const p=cvPos(e),h=ptr.h;
  if(!G.drag&&h&&h.pick&&Math.hypot(p.x-ptr.x0,p.y-ptr.y0)>8){const c=cardXY(h.pi,h.j);G.drag={on:true,pi:h.pi,j:h.j,ids:G.st.p[h.pi].slice(h.j),ox:ptr.x0-c.x,oy:ptr.y0-c.y,x:p.x,y:p.y,over:-1,ok:dropOk(h.pi,h.j)};G.hl=null;}
  if(G.drag){G.drag.x=p.x;G.drag.y=p.y;G.drag.over=dropTarget(G.drag);render();}});
function ptrEnd(e){if(!ptr||ptr.id!==e.pointerId)return;const h=ptr.h;ptr=null;if(!G)return;
  if(G.drag){const d=G.drag;G.drag=null;const t=e.type==='pointercancel'?-1:dropTarget(d);
    if(t>=0)doMove(d.pi,d.j,t);else{fcWhy(d.pi,d.j);// вернуть на место из точки, где отпустили
      const step=R.kind(d.pi)==='tab'?colStep(d.pi):null,base=cardXY(d.pi,d.j,step),tt=now();
      d.ids.forEach((id,k)=>{const s=SPR[id],p=cardXY(d.pi,d.j+k,step);s.fx=d.x-d.ox+(p.x-base.x);s.fy=d.y-d.oy+(p.y-base.y);s.t0=tt;s.dur=200;});kick();}
    return;}
  if(e.type==='pointercancel'||!h)return;
  if(h.stock){stockTap();return;}
  if(h.pick&&R.kind(h.pi)==='found')return; // карта из дома обратно — только перетаскиванием (случайный тап её не трогает)
  if(h.pick)tapMove(h.pi,h.j);else if(h.up)nudge();}
cv.addEventListener('pointerup',ptrEnd);cv.addEventListener('pointercancel',ptrEnd);
function nudge(){SND.no();buzz(15);}
// нажатие: лучшее место для карты — дом, потом столбец (у Паука — сначала своей масти), пустой столбец, у Ячейки — свободная ячейка
function bestTarget(pi,j){const st=G.st,a=st.p[pi],c=a[j],n=a.length-j;
  if(n===1&&!(GID==='klondike'&&R.kind(pi)==='found')){const f=foundFor(c);if(f>=0&&R.canDrop(st,pi,j,f))return f;}
  let best=-1,bs=-1e9;const ci=pi>=R.TAB?pi-R.TAB:-1;
  for(const t of tabs()){if(t===pi||!R.canDrop(st,pi,j,t))continue;const b=st.p[t];let sc;
    if(b.length){sc=100;if(GID==='spider'&&SU(b[b.length-1])===SU(c))sc+=50;}else{if(R.kind(pi)==='tab'&&j===0)continue;sc=10;}
    sc-=ci>=0?Math.abs(t-R.TAB-ci)*.5:(t-R.TAB)*.5;if(sc>bs){bs=sc;best=t;}}
  if(best<0&&GID==='freecell'&&n===1&&R.kind(pi)==='tab')for(let t=0;t<4;t++)if(!st.p[t].length){best=t;break;}
  return best;}
function tapMove(pi,j){const h=G.hl;if(h&&!h.stock&&h.f===pi&&h.j===j&&R.canDrop(G.st,pi,j,h.t)){doMove(pi,j,h.t);return;}
  const t=bestTarget(pi,j);if(t<0){nudge();shake(pi,j);fcWhy(pi,j);return;}doMove(pi,j,t);}
function shake(pi,j){if(calm())return;const a=G.st.p[pi],tt=now();for(let k=j;k<a.length;k++){const s=SPR[a[k]];if(!s)continue;s.fx=s.tx+(k%2?-1:1)*LY.cw*.08;s.fy=s.ty;s.t0=tt;s.dur=180;}kick();}

/* ---- ходы, отмена, автоматический дом ---- */
const UNDO_FREE=10,UNDO_AD=10,HINT_FREE=3,HINT_AD=3;
// без ограничений: «Без рекламы» (кроме расклада дня: там у всех поровну) или когда ролик не показать
const noLimit=()=>!G.daily&&(PAY.own('no_ads')||novice());
// первые партии (boost): пока сыграно не больше NOVICE_DEALS раздач и побед меньше трёх — отмены и подсказки без ограничений
// (кроме расклада дня) и НИ ОДНОЙ кнопки «за рекламу» (adBtn); межэкранная — по своим правилам (с AD_FROM-й победы)
const NOVICE_DEALS=3;
function played(){let n=0;for(const k in S.st)n+=S.st[k].p||0;return n;}
function novice(){return played()<=NOVICE_DEALS&&(S.wins||0)<3;}
function adBtn(){return adOk()&&!novice();}
const undoLeft=()=>noLimit()?99:G.undoCap-G.undoUsed,hintLeft=()=>noLimit()?99:G.hintCap-G.hintUsed;
function pushHist(){G.hist.push({st:stClone(G.st),moves:G.moves});if(G.hist.length>300)G.hist.shift();}
function doMove(f,j,t){if(!G||G.won)return;const st=G.st;if(!R.canPick(st,f,j)||!R.canDrop(st,f,j,t)){nudge();return;}
  const doneBefore=st.done,fb=R.fcount(st);pushHist();R.move(st,f,j,t);G.moves++;G.lastFree=true;afterMove(R.kind(t)==='found',st.done>doneBefore,fb);}
function stockTap(){if(!G||G.won)return;const st=G.st;
  if(!R.canStock(st)){if(GID==='spider'&&st.p[0].length){toast('Раздавать можно, когда нет пустых столбцов — положи в них карты');nudge();}return;}
  const doneBefore=st.done,fb=R.fcount(st);pushHist();R.stock(st);G.moves++;G.lastFree=true;if(GID==='spider')SND.deal();else SND.draw();afterMove(false,st.done>doneBefore,fb,true);}
function afterMove(home,suitDone,fb,stock){const st=G.st,autos=[];
  // сам уносит в дом карты, которым больше нечего делать в столбцах (правило «безопасного» хода)
  if(S.auto!==false){let m,g=0;while((m=R.autoMove(st))&&g++<60){R.move(st,m.f,m.j,m.t);autos.push(st.p[m.t][st.p[m.t].length-1]);}}
  const ad={};autos.forEach((id,k)=>ad[id]=140+k*110);
  setTargets((id,pi)=>ad[id]!=null?ad[id]:GID==='spider'&&R.kind(pi)==='found'?120+RK(id)*45:GID==='spider'&&stock&&R.kind(pi)==='tab'?(pi-R.TAB)*40:0);
  if(!G.counted){G.counted=true;const m=stat();m.p=(m.p||0)+1;save();}
  if(GID==='freecell'){let c=0;for(let i=0;i<4;i++)if(st.p[i].length)c++;G.maxCells=Math.max(G.maxCells||0,c);}
  const fa=R.fcount(st);
  if(suitDone){setTimeout(()=>SND.suit(),200);buzz(20);if(Math.random()<.5)say('suit');}
  else if(fa>fb){SND.home(fa%13);for(let k=1;k<=autos.length;k++)setTimeout(()=>SND.home((fb+1+k)%13),140+k*110);}
  else if(!stock)SND.place();
  G.hl=null;idleReset();if(G.tut&&!R.won(st))setTimeout(tutStep,350);updButtons();saveCur();
  if(R.won(st))winLater(Math.max(450,autos.length*110+450,GID==='spider'?800:0));}
function undo(){if(!G||G.won||G.busy)return;if(!G.hist.length){toast('Отменять пока нечего');return;}
  // сверх лимита — последний ход можно вернуть бесплатно (один раз после каждого хода; не в раскладе дня, там у всех поровну)
  let free=false;if(undoLeft()<=0){if(G.daily||!G.lastFree){outOf('undo');return;}free=true;G.lastFree=false;if(!S.tipFree){S.tipFree=1;toast('Последний ход вернули бесплатно. Дальше — ещё отмены за рекламу',3200);}}
  const h=G.hist.pop();G.st=h.st;G.moves=h.moves;if(!free)G.undoUsed++;G.hl=null;setTargets();SND.undo();updButtons();saveCur();}
// кончились отмены или подсказки: в раскладе дня — поровну у всех; иначе — ещё порция за рекламу
function outOf(kind){const u=kind==='undo',n=u?UNDO_AD:HINT_AD,word=u?'отмен':'подсказки';
  if(G.daily){toast(u?'В раскладе дня отмен больше нет — у всех поровну':'В раскладе дня подсказок больше нет — у всех поровну',3200);return;}
  const give=()=>{if(!G)return;if(u)G.undoCap+=n;else G.hintCap+=n;updButtons();saveCur();toast(u?'+'+n+' отмен':'+'+n+' подсказки');if(!u)hint();};
  if(!adBtn()){give();return;}
  modal(`<h2>${u?'↶ Отмены кончились':'💡 Подсказки кончились'}</h2><p>На эту раздачу было ${u?UNDO_FREE+' отмен':HINT_FREE+' подсказки'}. Посмотри рекламу — и будет ещё ${n} ${word}.</p>
    ${PAY.on&&PAY.item('no_ads')&&!PAY.own('no_ads')?'<p><small>Или купи «Без рекламы» в настройках: отмены и подсказки станут без ограничений.</small></p>':''}
    <div class="row"><button class="btn accent noenter" id="mAd">📺 +${n} ${word} за рекламу</button><button class="btn" id="mCancel">Не надо</button></div>`);
  $('mAd').onclick=()=>{hideModal();showRewarded(give,()=>{});};$('mCancel').onclick=closeToGame;}
/* ---- подсказка: решатель ищет путь к победе от текущей позиции; не успел — первый полезный ход по правилам ----
   Решатель работает в отдельном потоке (Web Worker из того же кода правил), чтобы слабый телефон не «замирал»; нет потока — прямо здесь, с меньшим бюджетом.
   «План»: найденное решение запоминаем (позиция → следующая позиция) — пока игрок идёт по нему, подсказка мгновенная и ведёт к победе */
let SW=null,swN=0;const swWait={};
function solverWorker(){if(SW!==null)return SW;SW=false;
  try{const B='/*LOGIC-'+'BEGIN*/',E='/*LOGIC-'+'END*/',src=[].map.call(document.scripts,x=>x.textContent).find(t=>t.indexOf(B)>=0);if(!src||!window.Worker||!window.Blob||!window.URL)return SW;
    const code=src.slice(src.indexOf(B),src.indexOf(E))+'\nonmessage=function(e){var d=e.data;postMessage({id:d.id,r:solve(RULES[d.g],d.st,d.lim)});};';
    const w=new Worker(URL.createObjectURL(new Blob([code],{type:'text/javascript'})));
    w.onmessage=e=>{const f=swWait[e.data.id];if(f){delete swWait[e.data.id];f(e.data.r);}};
    w.onerror=()=>{SW=false;for(const k in swWait){swWait[k]({ok:false});delete swWait[k];}};SW=w;}catch(e){SW=false;}
  return SW;}
function solveAsync(st,lim){return new Promise(ok=>{const w=solverWorker();if(!w){ok(solve(R,st,Math.min(lim,GID==='spider'?6000:15000)));return;}
  const id=++swN,to=setTimeout(()=>{if(swWait[id]){delete swWait[id];ok({ok:false});}},12000);swWait[id]=r=>{clearTimeout(to);ok(r);};
  try{w.postMessage({id,g:GID,st:stClone(st),lim});}catch(e){delete swWait[id];clearTimeout(to);ok(solve(R,st,6000));}});}
function planSet(g,path,st0){const s=stClone(st0);if(!g.plan)g.plan=new Map();for(const m of path){const k=R.key(s);applyMove(R,s,m);g.plan.set(k,R.key(s));}}
function planNext(st){if(!G||!G.plan)return null;const nk=G.plan.get(R.key(st));if(!nk)return null;
  for(const m of R.moves(st)){const s=stClone(st);applyMove(R,s,m);if(R.key(s)===nk)return m;}return null;}
function hintFrom(st,res){if(res&&res.ok&&res.path.length){planSet(G,res.path,st);return res.path[0];}
  const seen=new Set(G.hist.map(h=>R.key(h.st)));seen.add(R.key(st));
  for(const m of R.moves(st)){const s=stClone(st);applyMove(R,s,m);if(!seen.has(R.key(s)))return m;}
  return res&&res.full?null:(R.moves(st)[0]||null);}
function findHint(){const st=G.st;return planNext(st)||hintFrom(st,solve(R,st,GID==='spider'?6000:15000));}
// после раздачи — сразу ищем решение в фоне: первая подсказка будет мгновенной
function planAhead(){const g=G,st0=stClone(G.st);if(!solverWorker())return;solveAsync(st0,GID==='spider'?150000:80000).then(r=>{if(G===g&&r&&r.ok)planSet(g,r.path,st0);});}
async function hint(){if(!G||G.won||G.busy||G.thinking)return;if(hintLeft()<=0){outOf('hint');return;}
  const g=G,st=G.st,k=R.key(st);let m=planNext(st);
  if(!m){g.thinking=true;const tt=setTimeout(()=>toast('Думаю…',1200),350);const res=await solveAsync(st,60000);clearTimeout(tt);g.thinking=false;
    if(G!==g||G.won||R.key(G.st)!==k)return; // пока думали, сделали ход — подсказка устарела
    m=hintFrom(st,res);}
  if(!m){if(!G.daily&&G.hist.length){stuckWin();return;}say('stuck',true);toast('Похоже, эта раздача уже не сойдётся. Отмени несколько ходов или начни новую',4000);return;}
  if(m.s&&GID==='spider'&&!R.canStock(G.st)){toast('Положи карты в пустые столбцы — потом раздавай из колоды');return;}
  G.hintUsed++;idleReset();G.hl=m.s?{stock:true,t0:now()}:{f:m.f,j:m.j,t:m.t,t0:now()};
  SND.tap();updButtons();saveCur();kick();}
/* ---- «Собрать»: всё открыто — карты сами уходят в дом ---- */
function collectPath(){if(!G||G.won)return null;if(GID==='spider')return spCollect();const s=stClone(G.st);if(GID==='klondike')for(let i=6;i<13;i++)if(s.d[i]>0)return null;
  const path=[];let idle=0;const lim=GID==='klondike'?3*(s.p[0].length+s.p[1].length)+4:0;
  for(let g=0;g<600;g++){if(R.won(s))return path;let m=null;
    for(let i=0;i<s.p.length&&!m;i++){const k=R.kind(i);if(k==='found'||k==='stock')continue;const a=s.p[i];if(!a.length)continue;const c=a[a.length-1],f=foundFor(c);if(f>=0&&s.p[f].length===RK(c))m={f:i,j:a.length-1,t:f};}
    if(m){R.move(s,m.f,m.j,m.t);path.push(m);idle=0;continue;}
    if(GID==='klondike'&&R.canStock(s)&&idle<lim){R.stock(s);path.push({s:1});idle++;continue;}
    return null;}
  return null;}
// Паук: колода пуста и все карты открыты — решатель доводит до конца (результат запоминаем по позиции: зовётся при каждом ходе)
function spCollect(){const st=G.st;if(st.p[0].length)return null;for(let i=R.TAB;i<R.TAB+R.NT;i++)if(st.d[i]>0)return null;
  const k=R.key(st);if(G.spk===k)return G.spp;const r=solve(R,stClone(st),20000);G.spk=k;G.spp=r&&r.ok&&r.path.length?r.path:null;return G.spp;}
function collect(){const path=collectPath();if(GID==='spider'&&path&&path.length){G.busy=true;pushHist();const st=G.st,d0=st.done;for(const m of path){applyMove(R,st,m);G.moves++;}
  const f0={};let n=0;for(let i=0;i<st.p.length;i++)if(R.kind(i)==='found'&&st.p[i].length)f0[i]=n++;const nn=Math.max(1,st.done-d0);
  setTargets((id,pi)=>R.kind(pi)==='found'?f0[pi]*260+(12-RK(id))*25:0);for(let q=0;q<nn;q++)setTimeout(()=>SND.suit(),q*260+300);
  winLater(n*260+700);return;}
  if(!path)return;if(!path||!path.length)return;G.busy=true;pushHist();const st=G.st,order={};let k=0;
  for(const m of path){applyMove(R,st,m);G.moves++;if(!m.s)order[st.p[m.t][st.p[m.t].length-1]]=k++;}
  setTargets(id=>order[id]!=null?order[id]*70:0);for(let q=0;q<k;q+=2)setTimeout(()=>SND.home(q%13),q*70);
  winLater(k*70+500);}
function updButtons(){if(!G)return;const u=undoLeft(),h=hintLeft(),lim=!noLimit();
  $('undoL').innerHTML='Отмена'+(lim?(u>0?' <i class="cnt">'+u+'</i>':(G.daily||!adBtn()?'':' <i class="cnt ad">📺</i>')):'');
  $('hintL').innerHTML='Подсказка'+(lim?(h>0?' <i class="cnt">'+h+'</i>':(G.daily||!adBtn()?'':' <i class="cnt ad">📺</i>')):'');
  const c=!G.won&&!G.busy&&!!collectPath();$('bCollect').classList.toggle('hide',!c);$('bNew').classList.toggle('hide',c);updInfo();}
function fmtT(ms){const s=Math.floor(ms/1000);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');}
function updInfo(){if(!G)return;const md=GC.modes.length>1?modeOf(G.mode).full:'',ms=GC.modes.length>1?modeOf(G.mode).name.toLowerCase():'';$('gInfo').textContent=S.timer?'⏱ '+fmtT(G.time)+' · '+G.moves+' '+plw(G.moves,'ход','хода','ходов')+(ms?' · '+ms:''):G.daily?GC.name+(md?', '+md:''):md;}
// время раздачи идёт, только пока она на экране и ничего не мешает
setInterval(()=>{if(inPlay()&&!paused&&!document.hidden){G.time+=1000;idleTick();if(S.timer)updInfo();if(G.time%15000===0)saveCur();}},1000);

/* ---- обучение в первой раздаче (boost 03.10): хозяйка объясняет правила по шагу после каждого хода, первый ход подсвечен ----
   Только в самой первой раздаче этой игры на устройстве/в облаке (S.tut). Подсветка — как у подсказки, но подсказку не тратит */
const TUT={
  klondike:['Клади карту на карту на одну старше и другого цвета: красную семёрку — на чёрную восьмёрку. Я подсветила ход — нажми на карту.',
    'Тузы уходят наверх, в дом. Там собираем каждую масть от туза до короля.',
    'Нет ходов — нажми на колоду в левом верхнем углу: откроется новая карта.',
    'Застрял — жми «Подсказка», ошибся — «Отмена». В первых раздачах их сколько угодно.'],
  
  };
function tutSay(t){drawHost($('sayCv'),GC.host);$('sayT').textContent=t;const e=$('say');e.classList.add('on','tut');clearTimeout(say._t);say._t=setTimeout(()=>e.classList.remove('on','tut'),9000);}
// первый шаг обучения называет ИМЕННО подсвеченный ход: «красную тройку — на чёрную четвёрку»
const RK_ACC=['туза','двойку','тройку','четвёрку','пятёрку','шестёрку','семёрку','восьмёрку','девятку','десятку','валета','даму','короля'];
function cardAcc(c){const r=RK(c),nm=RK_ACC[r];if(GID==='spider')return nm;const masc=r===0||r===10||r===12;return (RED(c)?(masc?'красного ':'красную '):(masc?'чёрного ':'чёрную '))+nm;}
function tutFirst(m){const st=G.st,fc=GID==='freecell';if(!m)return TUT[GID][0];
  if(m.s)return 'Ходов на столе пока нет — нажми на колоду, я её подсветила. '+(GID==='spider'?'В каждый столбец ляжет по карте.':'Откроется новая карта.');
  const a=cardAcc(st.p[m.f][m.j]),k=R.kind(m.t),pre=fc?'Я Галя, медсестра. Все карты открыты — можно думать заранее. ':'';
  if(k==='found')return pre+'Я подсветила '+a+': '+(fc?'нажмите':'нажми')+' на карту — она уедет наверх, в дом. Там собираем каждую масть от туза до короля.';
  if(k==='cell')return pre+'Я подсветила '+a+': нажмите на карту — она ляжет в свободную ячейку наверху слева.';
  if(!st.p[m.t].length)return pre+'Я подсветила '+a+': '+(fc?'нажмите':'нажми')+' на карту — она переедет в пустой столбец.';
  const b=cardAcc(st.p[m.t][st.p[m.t].length-1]);
  return GID==='klondike'?'Клади карту на карту на одну старше и другого цвета. Вот: '+a+' — на '+b+'. Я подсветила этот ход — нажми на карту.':
    GID==='spider'?'Карту кладём на карту на одну старше. Вот: '+a+' — на '+b+'. Я подсветила этот ход — нажми на карту.':
    'Я Галя, медсестра. Все карты открыты — можно думать заранее. Кладите карту на карту на одну старше и другого цвета. Вот: '+a+' — на '+b+'. Я подсветила этот ход — нажмите на карту.';}
function tutStep(){const g=G;if(!g||!g.tut||g.won||modalOn)return;if(Date.now()-(g.tutT||0)<6000)return;g.tutT=Date.now();const L=TUT[GID],k=g.tut-1;if(k>=L.length){g.tut=0;return;}
  g.tut++;if(g.tut>L.length){g.tut=0;}if(k===L.length-1){S.tut=Object.assign(isObj(S.tut)?S.tut:{},{[GID]:1});save();}
  if(k===0){let m=planNext(g.st)||findHint();const onCard=x=>x&&!x.s&&R.kind(x.t)==='tab'&&g.st.p[x.t].length;
    if(!onCard(m))m=R.moves(g.st).find(onCard)||m; // первым показываем ход карта-на-карту, не колоду
    tutSay(tutFirst(m));if(m&&G===g&&!g.hl)g.hl=m.s?{stock:true,t0:now()}:{f:m.f,j:m.j,t:m.t,t0:now()};kick();}
  else tutSay(L[k]);}
function tutDue(){return !window.__demo&&!(isObj(S.tut)&&S.tut[GID])&&played()===0;}

/* ---- подсказка-пульс: нет хода 25 с — кнопка «Подсказка» мягко мигает (первые 10 побед; не в спокойном режиме) ---- */
function idleTick(){if(!G||G.won)return;G.idle=(G.idle||0)+1;$('bHint').classList.toggle('pulse',G.idle>=25&&(S.wins||0)<10&&!calm()&&hintLeft()>0);}

/* ---- Ячейка: длинная цепочка не едет — объясняем, сколько можно ---- */
function fcWhy(pi,j){if(GID!=='freecell'||!G)return false;const st=G.st,a=st.p[pi],n=a.length-j,c=a[j];if(n<2||R.kind(pi)!=='tab')return false;
  for(const t of tabs()){const b=st.p[t];if(t===pi||!b.length)continue;const x=b[b.length-1];
    if(RK(x)===RK(c)+1&&RED(x)!==RED(c)&&n>R.cap(st,false,pi)){const m=R.cap(st,false,pi);
      toast('Не хватает ячеек: сейчас можно перенести '+m+' '+plw(m,'карту','карты','карт')+' разом, а здесь '+n+'. Освободи ячейку или столбец',4200);return true;}}
  return false;}

/* ---- «не сходится»: вернуться к развилке — к последней позиции на найденном пути к победе (бесплатно, не в раскладе дня) ---- */
function forkBack(){if(!G||!G.hist.length)return -1;if(G.plan)for(let i=G.hist.length-1;i>=0;i--)if(G.plan.has(R.key(G.hist[i].st)))return i;return Math.max(0,G.hist.length-8);}
function stuckWin(){const i=forkBack(),n=i>=0?G.hist.length-i:0;
  modal(`<h2>Раздача не сойдётся</h2>${hostBub('Отсюда уже не разложить. Не беда — вернёмся туда, где всё ещё сходилось.')}
    <div class="row">${n?`<button class="btn green" id="mFork">↶ Вернуться к развилке (${n} ${plw(n,'ход','хода','ходов')} назад)</button>`:''}<button class="btn noenter" id="mNew2">🆕 Новая раздача</button><button class="btn" id="mCancel">Продолжить</button></div>`);
  if($('mFork'))$('mFork').onclick=()=>{hideModal();const h=G.hist[i];G.hist.length=i;G.st=h.st;G.moves=h.moves;G.hl=null;setTargets();SND.undo();updButtons();saveCur();YG.start();toast('Вернулись. Теперь подсказка снова ведёт к победе',3000);};
  $('mNew2').onclick=()=>{hideModal();newDeal(G?G.mode:S.mode);};$('mCancel').onclick=closeToGame;}

/* ---- трудный режим: один раз предупредить (две/четыре масти, по три карты) ---- */
const HARD={3:'По три карты — заметно труднее: из колоды открывается сразу три, а взять можно только верхнюю. Сходится реже.',
  };
function pickMode(m){const t=HARD[m],w=(S.st[String(m)]||{}).w||0;if(!t||w>0||isObj(S.wm)&&S.wm[m]){S.mode=m;save();SND.tap();openMenu();return;}
  modal(`<h2>${modeOf(m).name}?</h2>${hostBub(t)}<div class="row"><button class="btn accent" id="mYes">Да, попробую</button><button class="btn noenter" id="mCancel">Остаться: ${modeOf(GC.modes[0].id).name.toLowerCase()}</button></div>`);
  $('mYes').onclick=()=>{if(!isObj(S.wm))S.wm={};S.wm[m]=1;S.mode=m;save();hideModal();openMenu();};$('mCancel').onclick=()=>{hideModal();openMenu();};}

/* ================= раздача ================= */
const CKEY=SKEY+'-cur'; // текущая раздача — только на этом устройстве (в облако не пишем: большая и своя у каждого экрана)
function saveCur(){if(window.__demo)return;try{if(!G||G.won){localStorage.removeItem(CKEY);return;}

function newG(st,seed,mode,daily){return {st,seed,mode,daily,moves:0,time:0,hist:[],undoUsed:0,undoCap:UNDO_FREE,hintUsed:0,hintCap:HINT_FREE,won:false,counted:false,busy:false,hl:null,drag:null,fx:null};}

// «лёгкая» раздача (EASY): первые партии режима, пока в нём меньше EASY_WINS побед (не больше EASY_MAX раздач), и после двух брошенных подряд
const EASY_WINS=3,EASY_MAX=8;
function easyDue(mode){const E=EASY[mode];if(!E||!E.length||S.solv===false)return false;if((S.abn||0)>=2)return true;
  const st=S.st[String(mode)]||{};return (st.w||0)<EASY_WINS&&((S.ez||{})[mode]||0)<EASY_MAX;}
function nextSeed(mode){const L=SEEDS[mode];
  if(easyDue(mode)){if(!isObj(S.ez))S.ez={};const n=S.ez[mode]||0;S.ez[mode]=n+1;S.abn=0;return EASY[mode][n%EASY[mode].length];}
  if(S.solv!==false&&L&&L.length){if(typeof S.off!=='number')S.off=Math.floor(Math.random()*L.length);const n=S.seq[mode]||0;S.seq[mode]=n+1;return L[(S.off+n*7)%L.length];}
  return 1+Math.floor(Math.random()*2147483000);}

// победа (аудит QA 18 №1–2): засчитываем СРАЗУ (монеты, статистика, день), окно — после разлёта карт и только если на экране та же раздача
// (новая раздача, «←», N/Esc за эти секунды не превращают пустую раздачу в «разложенную» и не теряют победу)
function winLater(wait){const g=G;g.won=true;g.busy=true;YG.stop();winRecord(g);updButtons();setTimeout(()=>winShow(g),wait);}
function onWin(){if(!G)return;const g=G;winRecord(g);winShow(g);}
function winShow(g){if(G!==g)return;g.busy=false;SND.win();buzz(30);celebrate(()=>{if(G===g)showWin(g.got,g.firstDaily);});}
function winRecord(G){if(G.rec)return;G.rec=true;G.won=true;try{localStorage.removeItem(CKEY);}catch(e){}
  const m=stat(G),sec=Math.max(1,Math.round(G.time/1000));const old=(m.w||0)>=2;G.recT=old&&m.bt>0&&sec<m.bt;G.recM=old&&m.bm>0&&G.moves<m.bm;G.recTs=sec;m.w=(m.w||0)+1;m.cs=(m.cs||0)+1;m.bs=Math.max(m.bs||0,m.cs);m.bt=m.bt>0?Math.min(m.bt,sec):sec;m.bm=m.bm>0?Math.min(m.bm,G.moves):G.moves;
  S.wins=(S.wins||0)+1;S.games=(S.games||0)+1;if(!G.daily)S.adW=(S.adW||0)+1;
  let coins=modeOf(G.mode).coins,firstDaily=false;
  if(G.daily&&!S.daily[G.daily]){S.daily[G.daily]=1;coins+=DAILY_BONUS;firstDaily=true;}
  const got=[],a={w:S.wins,undo:G.undoUsed,hint:G.hintUsed,time:G.time,cs:m.cs,days:LB.days(),mode:G.mode,cells:G.maxCells||0};
  for(const x of ACH)if(!S.ach[x.id]&&x.t(a)){S.ach[x.id]=1;coins+=x.c;got.push(x);}
  if(firstDaily)for(const b of weekBonus()){coins+=b.c;got.push({ic:'🗓',name:'Неделя: '+b.t+' '+plw(b.t,'день','дня','дней'),c:b.c});}
  const ri=rankOf(S.wins);if(ri>(S.rk||0)){for(let i=(S.rk||0)+1;i<=ri;i++){coins+=RANKS[i][2];got.push({ic:'🎖',name:'Звание «'+RANKS[i][1]+'»',c:RANKS[i][2]});}S.rk=ri;}
  G.coins=coins;G.got=got;G.firstDaily=firstDaily;S.coins+=coins;save();cloudFlush();if(firstDaily)LB.submit();} // счётчик монет обновит окно победы (coinsRoll) или следующий экран
// склонение по числу: 1 ход, 2 хода, 5 ходов

// строка под монетами: рекорд (быстрее / меньше ходов, чем раньше в этом режиме) или ближайшее украшение

  const gl=nextGoal();if(!gl)return '';const pc=Math.min(100,Math.round(S.coins/gl.it.price*100));

// монеты «накручиваются» и летят в счётчик (в спокойном режиме — сразу, без движения)
function coinsRoll(g){const el=$('wCoins'),pill=$('gCoins');if(!el||calm()||window.__demo){updCoins();return;}

    if(!g.x2)el.textContent='+'+v+' 💰';if(v-last>=Math.max(3,n/6)){last=v;SND.coin();}

  const fly=()=>{const a=el.getBoundingClientRect(),b=pill&&pill.getBoundingClientRect();if(!b||!b.width){updCoins();return;}
    for(let i=0;i<5;i++){const c=document.createElement('div');c.className='cfly';c.textContent='💰';c.style.left=(a.left+a.width/2-11+(i-2)*8)+'px';c.style.top=(a.top+4)+'px';document.body.appendChild(c);
      setTimeout(()=>{c.style.transform='translate('+(b.left+b.width/2-a.left-a.width/2-(i-2)*8)+'px,'+(b.top+b.height/2-a.top-16)+'px) scale(.6)';c.style.opacity='.3';},30+i*70);
      setTimeout(()=>c.remove(),800+i*70);}
    setTimeout(()=>{updCoins();if(pill){pill.classList.remove('bump');void pill.offsetWidth;pill.classList.add('bump');setTimeout(()=>pill.classList.remove('bump'),400);}SND.coin();},680+4*70);};

// за награду — по желанию игрока; пока ролик идёт, повторные нажатия не запускают второй (и не дают двойную награду)
let adBusy=false;
function showRewarded(cb0,onFail0){
  if(adBusy)return;adBusy=true;clearTimeout(showRewarded._t);showRewarded._t=setTimeout(()=>{adBusy=false;},90000);
  const cb=()=>{adBusy=false;lastAdT=Date.now();cb0();},onFail=()=>{adBusy=false;lastAdT=Date.now();onFail0&&onFail0();};
  if(PLAT==='vk'&&!VK){if(VK_REAL){toast(AD_FAIL);onFail();}else stubAd(cb);return;} // мост VK не ответил — награду даром не даём; ?vk=1 на маке — заглушка
  if(VK){adOpen();vkSend('VKWebAppShowNativeAds',{ad_format:'reward'},60000)
      .then(r=>{adClose();if(r&&r.result)cb();else{toast(AD_FAIL);onFail();}})
      .catch(()=>{adClose();toast(AD_FAIL);onFail();})
      .then(()=>vkSend('VKWebAppCheckNativeAds',{ad_format:'reward'}).catch(()=>{}));return;}
  if(!ysdk){if(AD_LOCAL)stubAd(cb);else{toast(AD_FAIL);onFail();}return;}
  let got=false;
  ysdk.adv.showRewardedVideo({callbacks:{onOpen:adOpen,onRewarded:()=>{got=true;},
    onClose:()=>{adClose();if(got)cb();else{toast('Досмотри видео до конца, чтобы получить награду');onFail();}},
    onError:()=>{adClose();toast(AD_FAIL);onFail();}}});
}
function adReady(){return Date.now()-lastAdT>=AD_GAP&&!(PLAT==='vk'&&!VK&&VK_REAL);}
// кнопки «📺 … за рекламу» есть везде, кроме настоящего VK без моста (там ролик не показать)
function adOk(){return !(PLAT==='vk'&&!VK&&VK_REAL);}
// «долг» межэкранной: S.adW — раздач с прошлого показа (разложенных и брошенных после 5+ ходов); показ положен при S.adW ≥ AD_EVERY.
// Если сейчас нельзя (пауза после рекламы) — показ не сгорает, а ждёт следующей раздачи. Обнуляется только после настоящего показа
function adDue(){return !PAY.own('no_ads')&&(S.adW||0)>=AD_EVERY&&(S.games||0)>=AD_FROM;}
function showInterstitial(cb0){
  const cb=shown=>{lastAdT=Date.now();if(shown!==false){S.adW=0;save();}cb0();};
  if(PLAT==='vk'&&!VK){if(VK_REAL)cb0();else stubAd(cb);return;}
  if(VK){adOpen();vkSend('VKWebAppShowNativeAds',{ad_format:'interstitial'},60000).then(r=>!!(r&&r.result),()=>false).then(ok=>{adClose();cb(ok);});return;}
  if(!ysdk){if(AD_LOCAL)stubAd(cb);else cb0();return;}
  ysdk.adv.showFullscreenAdv({callbacks:{onOpen:adOpen,onClose:w=>{adClose();cb(w!==false);},onError:()=>{adClose();cb(false);}}});
}

const PAY_ROW='set';
const PAY_ITEMS={

/* ================= покупки за деньги: Яндекс Игры (ysdk.payments) и VK Игры (VKWebAppShowOrderBox) — общий модуль (одинаковый в 5 играх) =================
   Товары игры — PAY_ITEMS (выше), id совпадают с id в консоли Яндекса («Инап-покупки») и в hobby-pay/catalog.json (VK).
   Кнопок покупок НЕТ совсем, если платежи недоступны: нет SDK/моста (мак), каталог Яндекса пуст, VK не поддерживает оплату (iOS).
   Постоянные (perm) — флаг S.buy[id], разовый бонус монет — один раз на игрока (S.buyB). Выдача — только после подтверждения площадки.
   Яндекс: цена и значок валюты — только из getCatalog; расходуемые: выдать → сохранить (облако сразу) → consumePurchase;
     незавершённые при запуске довыдаём (getPurchases). Токены выданных — S.payT (и в облаке), сбой consume не даст выдать второй раз.
   VK: на кнопке число голосов (PAY_ITEMS.vk). success:true + order_id → выдать → сохранить → стереть ключ pay_<order_id>.
     Страховка: сервер vk-pay при оплате пишет в хранилище VK игрока pay_<order_id>=id (расходуемые) и own_<id>=1 (постоянные);
     при запуске читаем их и довыдаём. Выданные order_id — S.payV (последние 30); покупка без order_id оставляет метку «x:<id>»,
     которая «съест» первый чужой pay_ этого товара — второй раз не выдастся.
   Мак: ?paytest=1 — имитация Яндекса (localStorage «paytest»), ?vk=1&paytest=1 — имитация VK с сервером (localStorage «paytestvk»),
   ?paytest=fail — отказ. В настоящем VK (vk_app_id) и в Яндексе заглушек нет */
const payObj=x=>!!x&&typeof x==='object'&&!Array.isArray(x);
const PAY={on:false,p:null,v:null,list:[],busy:false,
  test:/[?&]paytest=/.test(location.search),
  // запуск: после SDK/моста и облака. Незавершённые покупки обрабатываем, даже если каталог не пришёл
  async init(){if(PAY.p||PAY.v)return;
    if(PLAT==='vk')return PAY.initVK();
    try{if(ysdk)PAY.p=ysdk.getPayments?await payT(ysdk.getPayments({signed:false})):ysdk.payments;
      else if(PAY.test&&!window.YaGames)PAY.p=payStub();}catch(e){PAY.p=null;}
    if(!PAY.p)return;
    try{await PAY.restore();}catch(e){}
    try{const c=await payT(PAY.p.getCatalog());PAY.list=(Array.isArray(c)?c:[]).filter(x=>x&&PAY_ITEMS[x.id]);}catch(e){PAY.list=[];}
    PAY.on=PAY.list.length>0;if(PAY.on)payAfter();},
  async initVK(){
    if(VK){let ok=false;try{ok=!!(VK.supportsAsync&&await payT(VK.supportsAsync('VKWebAppShowOrderBox'),8000));}catch(e){}if(ok)PAY.v=payVK();}
    else if(PAY.test&&!VK_REAL)PAY.v=payStubVK();
    if(!PAY.v)return;
    try{await PAY.restore();}catch(e){}
    PAY.list=Object.keys(PAY_ITEMS).filter(id=>PAY_ITEMS[id].vk>0).map(id=>({id}));
    PAY.on=PAY.list.length>0;if(PAY.on)payAfter();},
  own(id){return !!(payObj(S.buy)&&S.buy[id]);},
  item(id){return PAY.list.find(x=>x.id===id)||null;},
  give(id){const it=PAY_ITEMS[id];
    if(it.perm){if(!payObj(S.buy))S.buy={};S.buy[id]=1;
      if(it.bonus){if(!payObj(S.buyB))S.buyB={};if(!S.buyB[id]){S.buyB[id]=1;payAdd(it.bonus);}}}
    else payAdd(it.n||0);
    if(it.give)it.give();},
  // при запуске и «Восстановить покупки»: постоянные — выдать, если флага нет; расходуемые — довыдать и отметить
  async restore(){let got=0;
    if(PAY.v)got=await PAY.restoreVK();
    else{const ps=await payT(PAY.p.getPurchases());
      for(const x of (Array.isArray(ps)?ps:[])){const it=x&&PAY_ITEMS[x.productID];if(!it)continue;
        if(it.perm){if(!PAY.own(x.productID)){PAY.give(x.productID);got=1;}}else if(await PAY.credit(x))got=1;}}
    if(got){save();payFlush();payAfter();toast('Покупка зачислена',2600);}
    return got;},
  // VK: ключи own_<id> (постоянные, не стираем) и pay_<order_id> (расходуемые: выдать, сохранить, стереть)
  async restoreVK(){const ks=await PAY.v.keys();let got=0;const done=[];if(!Array.isArray(S.payV))S.payV=[];
    for(const k of ks){const m=/^(own|pay)_(.+)$/.exec(k.key||'');if(!m||!k.value)continue;
      if(m[1]==='own'){const it=PAY_ITEMS[m[2]];if(it&&it.perm&&!PAY.own(m[2])){PAY.give(m[2]);got=1;}continue;}
      const id=String(k.value),it=PAY_ITEMS[id];if(!it)continue;
      if(S.payV.indexOf(m[2])<0){const x=S.payV.indexOf('x:'+id); // покупка без order_id уже выдана — это её заказ
        if(x>=0)S.payV[x]=m[2];else{PAY.give(id);payMark(m[2]);got=1;}}
      done.push(k.key);}
    if(done.length){save();payFlush();for(const k of done)try{await PAY.v.clear(k);}catch(e){}}
    return got;},
  // расходуемая: выдать (если этот токен ещё не выдавали), сохранить в облако и только потом consumePurchase
  async credit(x){const t=String(x.purchaseToken||'');if(!Array.isArray(S.payT))S.payT=[];let fresh=false;
    if(!t||S.payT.indexOf(t)<0){PAY.give(x.productID);if(t)S.payT.push(t);if(S.payT.length>30)S.payT=S.payT.slice(-30);save();payFlush();fresh=true;}
    try{if(t)await payT(PAY.p.consumePurchase(t));}catch(e){}
    return fresh;},
  async buy(id){const it=PAY_ITEMS[id];if(!it||PAY.busy||!PAY.on||!PAY.item(id)||(it.perm&&PAY.own(id)))return;PAY.busy=true;payPause(true);
    try{if(PAY.v){const r=await PAY.v.order(id);if(!r||!r.success)throw new Error('cancel');
        const oid=r.order_id!=null?String(r.order_id):'';if(!Array.isArray(S.payV))S.payV=[];
        if(!oid||S.payV.indexOf(oid)<0){PAY.give(id);payMark(oid||'x:'+id);}
        save();payFlush();if(oid)PAY.v.clear('pay_'+oid).catch(()=>{});}
      else{const x=await PAY.p.purchase({id});
        if(it.perm){PAY.give(id);save();payFlush();}
        else await PAY.credit(x&&x.productID===id?x:{productID:id,purchaseToken:x&&x.purchaseToken});}
      SND.coin();toast(it.done||'Готово! Спасибо за покупку',2800);payAfter(id);}
    catch(e){toast('Покупка не состоялась',2200);}
    finally{PAY.busy=false;payPause(false);}},
  // «Восстановить покупки» (Об игре): заново читаем getPurchases / ключи VK
  async again(){if(!(PAY.p||PAY.v)||PAY.busy)return;PAY.busy=true;let got=0;try{got=await PAY.restore();}catch(e){}PAY.busy=false;if(!got)toast('Покупки проверены — всё на месте',2400);},
  // цена: VK — число голосов (требование VK); Яндекс — из каталога: число + значок валюты (getPriceCurrencyImage), иначе готовая строка price
  price(pr){if(PAY.v){const n=PAY_ITEMS[pr.id].vk,a=n%10,b=n%100;return n+' '+(a===1&&b!==11?'голос':a>=2&&a<=4&&(b<12||b>14)?'голоса':'голосов');}
    let img='';try{img=pr.getPriceCurrencyImage?pr.getPriceCurrencyImage('svg'):'';}catch(e){}
    return img&&pr.priceValue?payEsc(pr.priceValue)+'<img class="pcur" src="'+payEsc(img)+'" alt="">':payEsc(pr.price||pr.priceValue||'');},
  row(pr){const it=PAY_ITEMS[pr.id],own=it.perm&&PAY.own(pr.id),txt='<span>'+it.ic+' '+payEsc(it.name)+'<br><small>'+payEsc(it.desc)+'</small></span>';
    return own?'<div class="'+PAY_ROW+' pown">'+txt+'<i>куплено</i></div>':'<button class="'+PAY_ROW+' pbuy" data-pid="'+payEsc(pr.id)+'">'+txt+'<b>'+PAY.price(pr)+'</b></button>';},
  // список товаров (ids — только эти, по порядку каталога); owned=false — без уже купленных
  html(ids,owned){const L=PAY.list.filter(pr=>(!ids||ids.indexOf(pr.id)>=0)&&(owned!==false||!(PAY_ITEMS[pr.id].perm&&PAY.own(pr.id))));
    return L.length?'<div class="pay"><h3>Покупки</h3>'+L.map(PAY.row).join('')+'</div>':'';},
  bind(root){(root||document).querySelectorAll('.pbuy').forEach(b=>b.onclick=()=>{try{(SND.tap||SND.click)();}catch(e){}PAY.buy(b.dataset.pid);});}
};
function payMark(v){if(!Array.isArray(S.payV))S.payV=[];if(S.payV.indexOf(v)<0)S.payV.push(v);if(S.payV.length>30)S.payV=S.payV.slice(-30);}
// слияние облака (d) в сохранение T (по умолчанию S): купленное, выданные бонусы, токены и заказы — объединение (покупка не теряется ни с какой стороны)
function payMerge(d,T){T=T||S;if(!payObj(d)||!payObj(T))return;
  for(const f of ['buy','buyB'])if(payObj(d[f])){if(!payObj(T[f]))T[f]={};for(const k in d[f])if(d[f][k])T[f][k]=1;}
  for(const f of ['payT','payV'])if(Array.isArray(d[f])){if(!Array.isArray(T[f]))T[f]=[];for(const t of d[f])if(typeof t==='string'&&T[f].indexOf(t)<0)T[f].push(t);if(T[f].length>30)T[f]=T[f].slice(-30);}}
function payT(p,ms){return Promise.race([p,new Promise((_,no)=>setTimeout(()=>no(new Error('timeout')),ms||15000))]);}
function payEsc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]);}
// VK: окно оплаты (игрок может думать долго — ждём до 10 мин) и ключи хранилища, которые пишет сервер vk-pay
function payVK(){return {order:id=>vkSend('VKWebAppShowOrderBox',{type:'item',item:id},600000),
  keys:async()=>{const r=await vkSend('VKWebAppStorageGetKeys',{count:1000,offset:0},8000),ks=((r&&r.keys)||[]).filter(k=>/^(own|pay)_/.test(k));
    if(!ks.length)return [];const g=await vkSend('VKWebAppStorageGet',{keys:ks},8000);return (g&&g.keys)||[];},
  clear:k=>vkSend('VKWebAppStorageSet',{key:k,value:''},8000)};}
// имитация платежей для проверки на маке (?paytest=1): цены — PAY_TEST, покупки лежат в localStorage «paytest», consume их убирает
function payStub(){const K='paytest',rd=()=>{try{return JSON.parse(localStorage.getItem(K))||[];}catch(e){return [];}},wr=a=>{try{localStorage.setItem(K,JSON.stringify(a));}catch(e){}};
  const cur='data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20"><circle cx="10" cy="10" r="9" fill="#f5b400"/><text x="10" y="14.5" font-size="12" text-anchor="middle" font-family="Arial" font-weight="700" fill="#fff">T</text></svg>');
  const wait=v=>new Promise(ok=>setTimeout(()=>ok(v),250)),fail=()=>window.__payCancel||/[?&]paytest=fail/.test(location.search);
  return {getCatalog:()=>wait(Object.keys(PAY_TEST).map(id=>({id,title:id,description:'',imageURI:'',price:PAY_TEST[id]+' тест',priceValue:String(PAY_TEST[id]),priceCurrencyCode:'TST',getPriceCurrencyImage:()=>cur}))),
    getPurchases:()=>wait(rd()),
    purchase:({id})=>fail()?Promise.reject(new Error('cancel')):wait(null).then(()=>{const x={productID:id,purchaseToken:'t'+Date.now()+Math.random().toString(36).slice(2,6),developerPayload:''};const a=rd();a.push(x);wr(a);return x;}),
    consumePurchase:t=>{if(window.__payNoConsume)return Promise.reject(new Error('fail'));wr(rd().filter(x=>x.purchaseToken!==t));return wait();}};}
// имитация VK (?vk=1&paytest=1): «сервер» пишет pay_/own_ в localStorage «paytestvk», как vk-pay в хранилище VK.
// __payNoOid — ответ без order_id, __payNoClear — стирание ключа не прошло, ?paytest=fail / __payCancel — отказ
function payStubVK(){const K='paytestvk',rd=()=>{try{return JSON.parse(localStorage.getItem(K))||{};}catch(e){return {};}},wr=o=>{try{localStorage.setItem(K,JSON.stringify(o));}catch(e){}};
  const wait=v=>new Promise(ok=>setTimeout(()=>ok(v),250)),fail=()=>window.__payCancel||/[?&]paytest=fail/.test(location.search);
  return {order:id=>fail()?Promise.reject({error_type:'client_error'}):wait().then(()=>{const oid=String(Date.now()),o=rd();
      if(PAY_ITEMS[id].perm)o['own_'+id]='1';else o['pay_'+oid]=id;wr(o);return window.__payNoOid?{success:true}:{success:true,order_id:+oid};}),
    keys:()=>wait(Object.entries(rd()).filter(([k,v])=>v).map(([key,value])=>({key,value}))),
    clear:k=>{if(window.__payNoClear)return Promise.reject(new Error('fail'));const o=rd();delete o[k];wr(o);return wait();}};}


/* ================= рейтинг раскладов дня =================
   Очки — сколько дней разложен расклад дня (у всех игроков одна раздача, отмен и подсказок поровну).
   Яндекс: лидерборд с техническим именем daily (создать в консоли). VK: таблица друзей VKWebAppShowLeaderBoardBox.
   Нет SDK/моста — кнопки нет (никаких заглушек). */
const LB={
  days(){return Object.keys(S.daily||{}).length;},
  ok(){return PLAT==='vk'?!!VK:!!(ysdk&&(ysdk.leaderboards||ysdk.getLeaderboards));},
  sent:0,
  async submit(){const n=LB.days();if(!n)return;
    if(PLAT==='vk')return; // VK сам запоминает результат из ShowLeaderBoardBox
    try{if(!ysdk)return;if(ysdk.leaderboards&&ysdk.leaderboards.setScore)await ysdk.leaderboards.setScore('daily',n);
      else{const lb=await ysdk.getLeaderboards();await lb.setLeaderboardScore('daily',n);}LB.sent=n;}catch(e){}},
  async entries(){const o={includeUser:true,quantityAround:2,quantityTop:10};
    try{if(ysdk.leaderboards&&ysdk.leaderboards.getEntries)return await ysdk.leaderboards.getEntries('daily',o);
      const lb=await ysdk.getLeaderboards();return await lb.getLeaderboardEntries('daily',o);}catch(e){return null;}},
  async show(){
    if(PLAT==='vk'){if(!VK)return;vkSend('VKWebAppShowLeaderBoardBox',{user_result:LB.days()},60000).catch(()=>toast('Таблица друзей сейчас недоступна'));return;}
    modal(`<h2>🏆 Рейтинг</h2><p>Загружаем…</p>`);
    const r=await LB.entries();const list=(r&&r.entries)||[];
    const me=r&&typeof r.userRank==='number'?r.userRank:0,authed=!!(YP&&YP.getMode&&YP.getMode()!=='lite');
    const esc=t=>String(t||'').replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));
    const rows=list.map(e=>`<div class="lbr${e.rank===me?' me':''}"><b>${e.rank}</b><span>${esc(e.player&&e.player.publicName)||'Игрок'}</span><i>${e.score} 📅</i></div>`).join('');
    modal(`<h2>🏆 Рейтинг</h2><p>Сколько дней разложен расклад дня. У тебя: <b>${LB.days()}</b></p>
      <div class="lb">${rows||'<p>Пока пусто — будь первым!</p>'}</div>
      ${authed?'':'<p><small>Чтобы попасть в рейтинг, войди в аккаунт Яндекса.</small></p>'}
      <div class="row">${authed||!(ysdk&&ysdk.auth)?'':'<button class="btn accent noenter" id="lbAuth">Войти</button>'}<button class="btn" id="lbClose">Закрыть</button></div>`);
    $('lbClose').onclick=()=>{hideModal();if(G&&G.won)openMenu();else if(inPlay())YG.start();};
    // после входа — другой аккаунт и другое облако: перечитываем и сливаем, а не пишем туда сохранение этого устройства
    const a=$('lbAuth');if(a)a.onclick=async()=>{try{await ysdk.auth.openAuthDialog();YP=await ysdk.getPlayer({scopes:false});
      clearTimeout(cloudT);cloudT=0;cloudReady=false;cloudTry=0;await cloudLoad(true);updCoins();await LB.submit();}catch(e){}LB.show();};}
};
const LB0=LB.days(); // дней на этом устройстве до облака

/* ---- подарки за вход (boost 03.10, как у Зины и «Выезда»): считаются ДНИ ЗАХОДА — пропуск ничего не сжигает, следующий заход даёт
   следующий по счёту подарок. 7-й день — рубашка-подарок (две по очереди, не продаются), дальше — 60 💰. Без рекламы (×2 и «вернуть серию» убраны) ---- */
const STREAK=[10,15,20,25,30,40,60];
// «сегодня» для расклада дня и подарков: на Яндексе — по часам сервера (перевод часов телефона не даёт лишних дней), иначе — по часам устройства
function nowMs(){try{if(ysdk&&ysdk.serverTime){const t=ysdk.serverTime();if(typeof t==='number'&&t>1.6e12)return t;}}catch(e){}return Date.now();}
function dayKey(off){const d=new Date(nowMs());d.setDate(d.getDate()+(off||0));return d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate();}
const giftCnt=s=>s?(s.cyc||0)*7+(s.day||0):0;
function streakState(){const s=S.streak||{day:0,last:0,cyc:0},t=dayKey(0);
  if(s.last===t)return{claimed:true,day:s.day||1,cyc:s.cyc||0,cnt:giftCnt(s)};
  const day=(s.day||0)>=7?1:(s.day||0)+1,cyc=(s.cyc||0)+((s.day||0)>=7?1:0);return{claimed:false,day,cyc,cnt:giftCnt(s)};}
// что лежит в подарке дня day цикла cyc: монеты или рубашка-подарок (если уже есть — монеты)
function giftOf(day,cyc){if(day===7){const id=cyc===0?'gift1':cyc===1?'gift2':'';const it=id&&BACKS.find(x=>x.id===id);if(it&&S.own.backs.indexOf(id)<0)return{back:it,c:0};}return{c:STREAK[day-1]};}
const giftTxt=g=>g.back?'рубашка «'+g.back.name+'»':'+'+g.c+' 💰';
// мягкий старт: до первой разложенной раздачи окно не показываем; первый подарок — тостом
function maybeStreak(){if(G&&!G.won||window.__demo||modalOn||$('ad').classList.contains('on'))return;
  const st=streakState();if(st.claimed||(S.wins||0)<1)return;if(st.cnt===0)claimStreak(true);else showStreak();}
function showStreak(){const st=streakState();let cells='';
  for(let d=1;d<=7;d++){const done=st.claimed?d<=st.day:d<st.day,today=!st.claimed&&d===st.day,gf=giftOf(d,st.cyc);
    cells+=`<div class="sd ${done?'done':''} ${today?'today':''}"><small>День ${d}</small><span class="ic">${gf.back?'🎁':'💰'}</span>${gf.back?'рубашка':'+'+gf.c}</div>`;}
  const gf=giftOf(st.day,st.cyc),first=(S.wins||0)<1,nx=st.claimed?giftOf(st.day%7+1,st.cyc+(st.day===7?1:0)):null;
  modal(`<h2>Подарки за вход 🎁</h2>${hostBub(first?'Разложи первую раздачу — и начнём копить подарки!':st.claimed?'Сегодняшний подарок уже твой. Завтра — '+giftTxt(nx)+'.':'Заходи, когда удобно: пропустишь денёк — не беда, подарок не сгорит.')}
    <div class="streak">${cells}</div><p><small>Подарков получено: ${st.cnt}. На 7-й день — рубашка, какой нет в украшениях.</small></p>
    <div class="row">${st.claimed||first?`<button class="btn" id="sClose">Закрыть</button>`:`<button class="btn green" id="sGet">Забрать: ${giftTxt(gf)}</button>`}</div>`);
  modalRe=showStreak;if(st.claimed||first){$('sClose').onclick=closeToGame;return;}
  $('sGet').onclick=()=>claimStreak();}
function claimStreak(quiet,silent){const st=streakState();if(st.claimed){hideModal();return;}
  const gf=giftOf(st.day,st.cyc);S.streak={day:st.day,last:dayKey(0),cyc:st.cyc};
  if(gf.back){S.own.backs.push(gf.back.id);}else S.coins+=gf.c;save();updCoins();SND.coin();
  if(silent)return gf;
  if(quiet){toast('🎁 Подарок за вход: +'+gf.c+' 💰. Заходи завтра — будет ещё!',3500);if($('scr-menu').classList.contains('on'))openMenu();return;}
  const nx=giftOf(st.day%7+1,st.cyc+(st.day===7?1:0));
  modal(`<h2>${gf.back?'Подарок 7-го дня! 🏆':'День '+st.day+' ✓'}</h2>${gf.back?`<canvas id="gfPv" style="width:100%;height:110px;border-radius:12px"></canvas><p class="coins-won">Рубашка «${gf.back.name}»</p><p>Уже в украшениях — выбери её, когда захочешь.</p>`:`<p class="coins-won">+${gf.c} 💰</p>`}
    <p>Завтра: ${giftTxt(nx)}</p>
    <div class="row">${gf.back?'<button class="btn green" id="sUse">Надеть рубашку</button>':''}<button class="btn ${gf.back?'':'green'}" id="sOk">Отлично!</button></div>`);
  if(gf.back){requestAnimationFrame(()=>previewDecor('backs',gf.back.id,$('gfPv')));$('sUse').onclick=()=>{S.back=gf.back.id;save();applyLook();hideModal();if($('scr-menu').classList.contains('on'))openMenu();};}
  $('sOk').onclick=()=>{hideModal();if($('scr-menu').classList.contains('on'))openMenu();};}
// после первой победы: первый подарок — сразу тостом; остальные ждут в меню
function streakAfterWin(){if(window.__demo||(S.wins||0)<1)return null;const st=streakState();if(st.claimed)return null;if(st.cnt===0)return claimStreak(true,true);return null;}

/* ---- неделя раскладов дня и звания (boost 03.10) ----
   Неделя (пн–вс): разложил расклад дня 3 / 5 / 7 дней — премия +20 / +30 / +50 💰 (один раз за неделю каждая, начисляется в победе).
   Звание — по числу всех разложенных раздач, за новое — монеты один раз (S.rk — до какого звания награда выдана). */
const WEEK_B=[[3,20],[5,30],[7,50]];
function weekKeys(){const d=new Date(nowMs()),mo=-((d.getDay()+6)%7),r=[];for(let i=0;i<7;i++)r.push(dayKey(mo+i));return r;}
function weekState(){const wk=weekKeys(),n=wk.filter(x=>S.daily[x]).length,g=isObj(S.dwk)&&S.dwk.k===wk[0]?S.dwk.g||0:0;return{wk,n,g};}
// после разложенного расклада дня: премии недели, которые положены и ещё не выданы → [{t,c}]
function weekBonus(){const w=weekState(),got=[];S.dwk={k:w.wk[0],g:w.g};for(const [t,c] of WEEK_B)if(w.n>=t&&S.dwk.g<t){S.dwk.g=t;got.push({t,c});}return got;}
const WDN=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
function weekHtml(){const w=weekState(),t=dayKey(0);
  const cells=w.wk.map((k,i)=>`<div class="wd ${S.daily[k]?'done':''} ${k===t?'today':''} ${k>t?'fut':''}"><small>${WDN[i]}</small><b>${S.daily[k]?'✓':k===t?'?':'·'}</b></div>`).join('');
  const bon=WEEK_B.map(([d,c])=>`<span class="${w.g>=d?'ok':''}">${w.g>=d?'✓ ':''}${d} ${plw(d,'день','дня','дней')}: +${c} 💰</span>`).join('');
  return `<div class="week">${cells}</div><div class="wbon">${bon}</div>`;}
const RANKS=[[0,'Новичок',0],[3,'Любитель',20],[10,'Бывалый',30],[25,'Знаток',50],[50,'Мастер',70],[100,'Профессор пасьянса',100],
  [200,'Легенда '+(GID==='spider'?'дачи':GID==='freecell'?'санатория':'двора'),150]];
function rankOf(w){const T=[0,3,10,25,50,100,200];let i=0;while(i+1<T.length&&w>=T[i+1])i++;return i;} // пороги = RANKS (здесь числами: fixSave зовёт до объявления RANKS)
// строка звания: «🎖 Любитель · ещё 4 до «Бывалый»» (одна строка на 360 px)
function rankTxt(){const i=rankOf(S.wins||0),nx=RANKS[i+1];return '🎖 '+RANKS[i][1]+(nx?' · ещё '+(nx[0]-(S.wins||0))+' до «'+nx[1]+'»':'');}

/* ---- клавиатура на ПК ---- */
document.addEventListener('keydown',e=>{const k=e.key;if(e.repeat||e.ctrlKey&&k!=='z'||e.metaKey&&k!=='z'||e.altKey||$('ad').classList.contains('on'))return;
  if(modalOn){
    if(k==='Escape'){const b=['socClose','socBack','mCancel','lbClose','sClose','stClose','abBack','hBack','mBack','sOk','mMenu'].map($).find(Boolean);if(b){e.preventDefault();b.click();}}
    else if((k==='Enter'||k===' ')&&!(document.activeElement&&document.activeElement.tagName==='BUTTON'&&$('mcard').contains(document.activeElement))){
      const b=$('mcard').querySelector('.btn:not([disabled]):not(.x2):not(.buy):not(.noenter)');if(b){e.preventDefault();b.click();}}
    return;}
  if($('scr-menu').classList.contains('on')){if(k==='Enter'){e.preventDefault();$('btnPlay').click();}return;}
  if(!G||!$('scr-game').classList.contains('on'))return;const c=k.toLowerCase();
  if(k==='Escape')openMenu();
  else if(c==='z'||c==='я'||k==='Backspace'){e.preventDefault();undo();}
  else if(c==='h'||c==='р')hint();
  else if(k===' '||c==='d'||c==='в'){e.preventDefault();if(R.canStock(G.st)||GID==='spider')stockTap();}
  else if(c==='n'||c==='т')newDeal(G.mode);});
/* ---- ярлык, оценка, избранное: одно предложение за сессию, после 2-й победы и не раньше 2 минут; отказ запоминаем ---- */
const BOOT_T=Date.now();let askedNow=false,sessWins=0;
// окно площадки — только пока на экране окно победы (не поверх следующей раздачи или межэкранной) и ничего не на паузе
async function offerReturn(){if(askedNow||window.__demo)return;sessWins++;if(sessWins<2||Date.now()-BOOT_T<120000||adBusy||$('ad').classList.contains('on'))return;
  if(pauseWhy.size||!(G&&G.won&&modalOn&&$('mWon')))return;
  if(!isObj(S.ask))S.ask={};const now=Date.now(),due=(k,d)=>!S.ask[k]||now-S.ask[k]>d*864e5,mark=k=>{askedNow=true;S.ask[k]=now;save();};
  try{
    if(PLAT==='yandex'&&ysdk){
      if(due('review',30)&&ysdk.feedback){const c=await ysdk.feedback.canReview();if(c&&c.value){mark('review');await ysdk.feedback.requestReview();return;}}
      if(due('shortcut',14)&&ysdk.shortcut){const c=await ysdk.shortcut.canShowPrompt();if(c&&c.canShow){mark('shortcut');await ysdk.shortcut.showPrompt();return;}}}
    // VK: одно предложение за сессию через SOC (п. 2.6.3: не в первую сессию, отказ — не раньше 30 дней, ≤3 раз; без наград) —
    // строкой и кнопкой ПОД кнопками окна победы; сам диалог VK — только по нажатию игрока
    else if(PLAT==='vk'){const row=document.querySelector('#mcard .row');if(!row)return;
      const o=SOC.offer(S.wins||0,Date.now()-lastAdT<60000||pauseWhy.size>0||(adDue()&&adReady()));if(!o)return;askedNow=true;
      const d=document.createElement('div');d.className='soc-o';d.innerHTML='<span>'+o.t+'</span><button class="btn noenter" id="mSoc">'+o.b+'</button>';
      row.parentNode.insertBefore(d,row.nextSibling);/* под кнопками: главные не сдвигаются */const b=$('mSoc');b.onclick=()=>{b.disabled=true;o.run();};}
  }catch(e){}}
window.addEventListener('resize',()=>{if($('scr-game').classList.contains('on')){const r=stage.getBoundingClientRect();if(Math.abs(r.width-W)>1||Math.abs(r.height-H)>1||Math.min(2,window.devicePixelRatio||1)!==dpr)layout();}
  else if($('scr-menu').classList.contains('on'))drawMenuBg();});
// iOS WebView при повороте иногда шлёт resize до смены размеров — повторяем чуть позже
window.addEventListener('orientationchange',()=>setTimeout(()=>window.dispatchEvent(new Event('resize')),300));
// щипок на iOS увеличивает всю страницу (user-scalable=no там не работает)
document.addEventListener('gesturestart',e=>e.preventDefault());
// без контекстного меню и «долгого тапа» (требование площадок)
document.addEventListener('contextmenu',e=>e.preventDefault());
// звук и игра на паузу, когда вкладка скрыта (требование Яндекс Игр)
document.addEventListener('visibilitychange',()=>{if(document.hidden){setPause('hide',true);cloudFlush();saveCur();}else setPause('hide',false);});
if(document.hidden)setPause('hide',true); // запуск в фоновой вкладке: visibilitychange не придёт, пока её не откроют
applyLook();
/* ---- запуск: меню; режим для скриншотов карточки — ?demo=play|win|menu|decor|daily|stats (&m=режим &n=сколько ходов решения сделать) ---- */
(()=>{const q=new URLSearchParams(location.search),d=q.get('demo');if(!d){openMenu();return;}window.__demo=true;save=()=>{};
  if(q.get('m'))S.mode=+q.get('m');if(q.get('table'))S.table=q.get('table');if(q.get('back'))S.back=q.get('back');lookChanged();
  const L=SEEDS[S.mode]||SEEDS[GC.daily],seed=L[(+q.get('seed')||3)%L.length];
  const play=n=>{G=newG(R.deal(seed,S.mode),seed,S.mode,0);openGame();const r=solve(R,G.st,200000);if(r.ok){const k=Math.min(n,r.path.length);for(let i=0;i<k;i++){applyMove(R,G.st,r.path[i]);G.moves++;}}
    G.time=(+q.get('t')||0)*1000;setTargets(null,true);updButtons();render();};
  if(d==='play'){play(+q.get('n')||0);if(q.get('hint'))setTimeout(()=>hint(),600);}
  else if(d==='win'){play(9999);S.wins=Math.max(3,S.wins);G.time=204000;G.won=true;G.coins=modeOf(S.mode).coins;showWin([ACH[4]],false);}
  else if(d==='daily'){openMenu();openDaily();}
  else if(d==='decor'){openMenu();openDecor(q.get('k')||'backs');}
  else if(d==='stats'){openMenu();openStats();}
  else openMenu();})();
// VK: мост из js/vk-bridge.min.js (только в VK-сборке). Яндекс: SDK по относительному пути; локально 404 → заглушки рекламы
SOC.init(S,{save:()=>save(),toast:t=>toast(t),cls:'btn noenter',modal:h=>{modal(h);return $('mcard');},close:()=>hideModal()});updMore();
if(PLAT==='vk')initVK();
else (()=>{const s=document.createElement('script');s.src='/sdk.js';s.async=true;s.onload=s.onerror=()=>initSDK();document.head.appendChild(s);})();
window.__test={get G(){return G;},set G(v){G=v;},get S(){return S;},R,RULES,SEEDS,solve,applyMove,legal,stClone,doMove,stockTap,undo,hint,findHint,collect,collectPath,solveAsync,planNext,tapMove,bestTarget,startDeal,newDeal,layout,render,setTargets,hitTest,cardXY,
  mergeSave,showRewarded,showInterstitial,openMenu,openDecor,openSettings,openStats,openShop,openDaily,onWin,endFx,get LY(){return LY;},get SPR(){return SPR;},vkSaveCloud,vkLoadCloud,cloudFlush,set VK(v){VK=v;},get VK(){return VK;},PAY,dayKey};
